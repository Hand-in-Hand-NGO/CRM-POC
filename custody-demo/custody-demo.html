/* =====================================================================
   HandinHand CMS theme — font, palette and recurring components.
   Paste into the page <style> after bootstrap + bootstrap-rtl.
   Font link: https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap
   ===================================================================== */
:root {
    --live-font: 'Droid Arabic Kufi', 'Noto Kufi Arabic', Tahoma, Arial, sans-serif;

    --hih-header-gradient: linear-gradient(90deg, #d3f1f8 0%, #ebf6ed 17%, #fff9e4 34%, #f9e7de 47%, #f8f2e4 57%, #d9eaf4 64%, #e9efec 74%, #baeae6 100%);
    --hih-header-text: #535252;
    --hih-sidebar: #222d32;
    --hih-sidebar-active: #1e282c;
    --hih-sidebar-text: #b8c7ce;

    --hih-primary: #0093e9;
    --hih-success: #31c860;
    --hih-success-hover: #2db457;
    --hih-danger: #f96a74;
    --hih-warning: #ff6a00;
    --hih-focus: #67b9ec;

    --hih-default-bg: #f4f4f4;
    --hih-default-border: #ddd;
    --hih-default-text: #444;
    --hih-input-border: #d2d6de;

    --hih-toggle-all: #b7b7b7;
    --hih-toggle-on: #5bb75b;
    --hih-toggle-off: #da4f49;

    --hih-box-bg: #f6f6f6;
    --hih-box-border: #d7dbe0;

    --hih-chip-bg: #e6f1fb;
    --hih-picker-head: #d9e8f7;
    --hih-picker-odd: #c3e0f9;
    --hih-picker-even: #ffbec2;

    --hih-row-new: #d9edf7;
    --hih-row-new-hover: #becfd8;
    --hih-row-new-key: #e8f1ff;
    --hih-row-maint: #f2dede;
    --hih-row-maint-hover: #dbc6c6;
    --hih-row-maint-key: #fbe8e8;
    --hih-row-hover: #f96a741f;

    --hih-stats-head: #e9eef3;
    --hih-stats-border: #e3e6ea;
    --hih-stats-alt: #f7f9fb;
    --hih-stats-target: #fdf6df;
    --hih-stats-percent: #dff0d8;
    --hih-stats-percent-alt: #d3eacb;

    /* dashboard (cards / charts) */
    --vs-bg: #f5f6f8;
    --vs-bg-raised: #fff;
    --vs-surface: #fff;
    --vs-surface-2: #eef0f3;
    --vs-border: #e2e5ea;
    --vs-border-soft: #ececf0;
    --vs-text: #1a1d23;
    --vs-text-dim: #62697a;
    --vs-text-faint: #97a0ad;
    --vs-accent: #2f6fed;
    --vs-accent-hover: #2559c9;
    --vs-green: #15803d;
    --vs-radius-sm: 6px;
    --vs-radius: 10px;
    --vs-font-ui: var(--live-font);
    --vs-font-mono: var(--live-font);
    --vs-chart-axis: #6b7280;
    --vs-chart-grid: #d6d9df;
}

/* ---------- font ---------- */
body, h1, h2, h3, h4, h5, h6, .h1, .h2, .h3, .h4, .h5, .h6,
.tooltip, .popover, .daterangepicker, .select2-container, .select2-dropdown,
input, select, textarea, button { font-family: var(--live-font); }
body { direction: rtl; text-align: right; }

/* ---------- header / panels ---------- */
.main-header, .main-header .navbar, .main-header .logo,
.panel-primary > .panel-heading, .modal-header {
    background: var(--hih-header-gradient) !important;
    color: var(--hih-header-text) !important;
    border-color: var(--hih-box-border);
}
.main-header a, .main-header .navbar .nav > li > a, .modal-title { color: var(--hih-header-text) !important; }
.main-sidebar { background: var(--hih-sidebar); }
.main-sidebar .sidebar-menu > li > a { color: var(--hih-sidebar-text); }
.main-sidebar .sidebar-menu > li:hover > a, .main-sidebar .sidebar-menu > li.active > a { background: var(--hih-sidebar-active); color: #fff; }

.box-content { background: var(--hih-box-bg); border: 1px solid var(--hih-box-border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }

/* ---------- form controls ---------- */
.form-control { border-color: var(--hih-input-border); border-radius: 0; box-shadow: none; }
.form-control:focus { border-color: var(--hih-focus); box-shadow: none; }
label { font-weight: bold; }
.select2-container--default .select2-results__option--highlighted[aria-selected] { background: var(--hih-focus); }

/* ---------- buttons ---------- */
.btn-action, .filter-inline .btn { border-radius: 10px !important; }
.btn-primary { background: var(--hih-primary); border-color: var(--hih-primary); }
.btn-success { background: var(--hih-success); border-color: var(--hih-success-hover); }
.btn-success:hover, .btn-success:focus { background: var(--hih-success-hover); border-color: var(--hih-success-hover); }
.btn-danger { background: var(--hih-danger); border-color: var(--hih-danger); }
.btn-warning { background: var(--hih-warning); border-color: var(--hih-warning); }
.btn-default { background: var(--hih-default-bg); border-color: var(--hih-default-border); color: var(--hih-default-text); }

/* filter with its buttons directly beside it */
.filter-inline { display: flex; align-items: center; gap: 4px; }
.filter-inline > .form-control, .filter-inline > .select2-container { flex: 1 1 auto; min-width: 0; }

/* ---------- toggle groups (الكل / نعم / لا) ---------- */
.btn-group-justified .btn.active.toggle-all { background: var(--hih-toggle-all); color: #fff; }
.btn-group-justified .btn.active.toggle-on  { background: var(--hih-toggle-on);  color: #fff; }
.btn-group-justified .btn.active.toggle-off { background: var(--hih-toggle-off); color: #fff; }

/* ---------- chips + picker table ---------- */
.chip { display: inline-block; background: var(--hih-chip-bg); color: var(--hih-primary); border: 1px solid var(--hih-primary); border-radius: 15px; padding: 0 8px; margin: 1px 2px; font-size: 12px; }
.picker-table { width: 100%; border-collapse: collapse; }
.picker-table th { background: var(--hih-picker-head); text-align: center; }
.picker-table td, .picker-table th { border: 1px solid #ccc; padding: 4px 6px; cursor: pointer; }
.picker-table td.selected:nth-child(odd)  { background: var(--hih-picker-odd); }
.picker-table td.selected:nth-child(even) { background: var(--hih-picker-even); }

/* ---------- data table ---------- */
.table > thead > tr > th { text-align: center; white-space: nowrap; vertical-align: middle; }
.table > tbody > tr > td { text-align: center; vertical-align: middle; }
.table tbody tr:hover { background: var(--hih-row-hover); }
.table tbody tr.row-new   > td { background: var(--hih-row-new); }
.table tbody tr.row-new:hover > td { background: var(--hih-row-new-hover); }
.table tbody tr.row-new   > td.key { background: var(--hih-row-new-key); }
.table tbody tr.row-maint > td { background: var(--hih-row-maint); }
.table tbody tr.row-maint:hover > td { background: var(--hih-row-maint-hover); }
.table tbody tr.row-maint > td.key { background: var(--hih-row-maint-key); }
.info-label { color: gray; }
.table-scroll { overflow-x: auto; }   /* only the table scrolls; toolbar + pager stay fixed */

/* ---------- value + 🔍 + نسخ ---------- */

.case-value .case-text {
    margin-left: 3px;
}

.case-value .btn-xs {
    padding: 0 5px;
    font-size: 11px;
    line-height: 18px;
    border-radius: 3px !important;
}

.case-value .case-search {
    background: #fff;
    border-color: #ccc;
    color: #333;
}

.case-value .case-copy.copied {
    background-color: #31c860;
    border-color: #2db457;
}

/* ---------- side stats table ---------- */
.stats-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0;
}

.stats-table th,
.stats-table td {
    border: 1px solid #e3e6ea;
    padding: 4px 6px;
    text-align: center;
    vertical-align: middle;
}

.stats-table thead th {
    background: #e9eef3;
    color: #333;
    font-size: 11px;
    padding: 4px 3px;
    white-space: nowrap;
}

.stats-table td.stats-label {
    text-align: right;
    font-weight: bold;
    color: #333;
    white-space: normal;
    line-height: 1.3;
}

.stats-table td.stats-label small {
    display: block;
    font-weight: normal;
    color: #999;
    font-size: 10px;
    text-align: left;
}

.stats-table td.stats-num {
    font-weight: bold;
    color: #222;
    width: 56px;
    padding: 4px 3px;
}

.stats-table tr.row-period:nth-child(even) td {
    background: #f7f9fb;
}

.stats-table tr.row-target td {
    background: #fdf6df;
}

.stats-table tr.row-percent td {
    background: #dff0d8;
}

.stats-table tr.row-percent:nth-child(even) td {
    background: #d3eacb;
}


/* ---------- dashboard building blocks ---------- */
/* ---- chart-drawer building blocks ---- */
.vs-dash-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 16px; flex-wrap: wrap; gap: 10px; }
.vs-period-tabs { display: inline-flex; background: var(--vs-bg); border: 1px solid var(--vs-border); border-radius: var(--vs-radius-sm); padding: 3px; gap: 2px; flex-wrap: wrap; }
.vs-period-tabs button {
    border: none; background: none; color: var(--vs-text-dim); padding: 7px 14px; border-radius: 5px;
    font-size: 12.5px; cursor: pointer; font-family: inherit; font-weight: 600; transition: background .15s, color .15s;
}
.vs-period-tabs button:hover { color: var(--vs-text); }
.vs-period-tabs button.active { background: var(--vs-accent); color: #fff; }
.vs-period-range { font-size: 11.5px; color: var(--vs-text-faint); font-family: var(--vs-font-mono); }

.vs-kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
.vs-kpi { background: var(--vs-bg); border: 1px solid var(--vs-border); border-radius: var(--vs-radius); padding: 12px 10px; display: flex; flex-direction: column; gap: 5px; }
.vs-kpi .num { font-family: var(--vs-font-mono); font-size: 20px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.vs-kpi .lbl { font-size: 11px; color: var(--vs-text-dim); }
.vs-kpi.zero .num { color: var(--vs-text-faint); }

.vs-group-label { font-size: 11px; font-weight: 700; color: var(--vs-text-faint); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 10px; }
.vs-chart-group { margin-bottom: 22px; }
.vs-chart-group:last-child { margin-bottom: 0; }
.vs-chart-row-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.vs-chart-card { background: var(--vs-surface); border: 1px solid var(--vs-border); border-radius: var(--vs-radius); padding: 16px; }
.vs-chart-card-head { margin-bottom: 10px; }
.vs-chart-card-head h4 { margin: 0; font-size: 13.5px; font-weight: 700; }
.vs-chart-card-head p.sub { margin: 3px 0 0; font-size: 11.5px; color: var(--vs-text-dim); }

.vs-target-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.vs-target-card { background: var(--vs-bg); border: 1px solid var(--vs-border); border-radius: var(--vs-radius); padding: 12px; }
.vs-target-card .name { font-size: 12px; font-weight: 700; color: var(--vs-text); margin-bottom: 8px; }
.vs-target-card .row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px; font-size: 11.5px; color: var(--vs-text-dim); }
.vs-target-card .row b { font-family: var(--vs-font-mono); color: var(--vs-text); font-size: 12.5px; font-weight: 700; }
.vs-bar-track { height: 7px; border-radius: 999px; background: var(--vs-surface-2); overflow: hidden; margin: 7px 0 5px; }
.vs-bar-fill { height: 100%; border-radius: 999px; background: var(--vs-accent); transition: width .4s ease; }
.vs-bar-fill.ok { background: var(--vs-green); }
.vs-pct-badge { font-family: var(--vs-font-mono); font-size: 12.5px; font-weight: 700; }
.vs-pct-badge.ok { color: var(--vs-green); }
.vs-pct-badge.warn { color: var(--vs-accent); }
.vs-no-target { color: var(--vs-text-faint); font-size: 12px; text-align: center; padding: 30px 10px; }
.vs-chart-empty { display: flex; align-items: center; justify-content: center; height: 180px; color: var(--vs-text-faint); font-size: 12.5px; }

.vs-tooltip { background: var(--vs-bg-raised); border: 1px solid var(--vs-border); border-radius: var(--vs-radius-sm); padding: 8px 10px; box-shadow: 0 4px 14px rgba(0,0,0,.1); font-size: 12px; direction: rtl; font-family: var(--vs-font-ui); }
.vs-tooltip .t-label { font-weight: 700; margin-bottom: 4px; }
.vs-tooltip .t-row { display: flex; align-items: center; gap: 6px; }
.vs-tooltip .t-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.stats-panel .recharts-wrapper { direction: ltr; }

@media (min-width: 560px) {
    .vs-chart-row-2 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 700px) {
    .vs-kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .vs-target-grid { grid-template-columns: 1fr; }
}

.stats-refresh.spinning i { animation: fa-spin .8s linear infinite; }
.recharts-wrapper { direction: ltr; }   /* charts draw LTR; tooltips stay RTL */

/* العهد الإلكترونية — تخطيط الصفحات (الألوان والخط من theme.css) */
html, body { background: #ecf0f5; color: #333; font-size: 13px; }
a { color: var(--hih-primary); }
.empty { text-align: center !important; color: var(--vs-text-faint); padding: 25px !important; }
.nowrap { white-space: nowrap; }
.d { direction: ltr; unicode-bidi: isolate; display: inline-block; }
[dir=ltr] { text-align: left; }
.btn-action { border-radius: 10px !important; }
.btn-action + .btn-action { margin-right: 4px; }
.label { font-weight: 600; font-size: 11px; padding: .3em .7em; }
.label-primary { background: var(--hih-primary); }
.label-success { background: var(--hih-success); }
.label-danger { background: var(--hih-danger); }
.label-warning { background: var(--hih-warning); }

/* ---------- login ---------- */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--hih-header-gradient); padding: 16px; }
.login-box { background: #fff; width: 100%; max-width: 360px; padding: 24px; border: 1px solid var(--hih-box-border); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
.login-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; color: var(--hih-header-text); font-size: 16px; }
.login-head .info-label { font-size: 12px; }

/* ---------- shell ---------- */
.main-header { position: fixed; top: 0; right: 0; left: 0; height: 50px; z-index: 1030; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--hih-box-border); }
.main-header .logo { font-weight: 700; font-size: 15px; }
.main-header .sidebar-toggle { color: var(--hih-header-text); font-size: 18px; display: none; }
.header-user { margin-right: auto; display: flex; align-items: center; gap: 4px; color: var(--hih-header-text); }
.header-user .btn-link { color: var(--hih-header-text); font-size: 15px; }

.main-sidebar { position: fixed; top: 50px; bottom: 0; right: 0; width: 50px; z-index: 1020; overflow: hidden; transition: width .2s; }
.main-sidebar:hover { width: 220px; box-shadow: -4px 0 14px rgba(0,0,0,.2); }
.sidebar-menu { list-style: none; margin: 0; padding: 0; }
.sidebar-menu > li > a { display: block; white-space: nowrap; padding: 13px 16px; border-right: 3px solid transparent; text-decoration: none; }
.sidebar-menu > li.active > a { border-right-color: var(--hih-primary); }
.sidebar-menu > li > a .fa { width: 18px; text-align: center; margin-left: 12px; font-size: 15px; }
.content-wrapper { margin: 50px 50px 0 0; padding: 15px; min-height: calc(100vh - 50px); }

.page-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.page-head h3 { margin: 0; font-size: 18px; font-weight: 700; color: #444; }
.page-head h3 .fa { color: var(--hih-primary); }

.filters-panel { border-color: var(--hih-box-border); border-radius: 10px; overflow: hidden; }
.filters-panel .panel-heading { font-weight: 700; padding: 7px 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .form-control { width: auto; }
.filters select.form-control { min-width: 150px; }
select.form-control { padding-top: 2px; padding-bottom: 2px; }
.inline-label { margin: 0 4px 0 0; }

.box-table { background: #fff; border: 1px solid var(--hih-box-border); border-radius: 10px; padding: 10px; }
.table-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.records { color: var(--vs-text-dim); font-weight: 600; }
.data-table { margin-bottom: 0; }
.data-table > thead > tr > th { background: var(--hih-picker-head); }
.table tbody tr.row-returned > td { color: #999; background: #fafafa; }
.pager-wrap .pagination { margin: 10px 0 0; }

/* ---------- dashboard ---------- */
.vs-kpi-grid.kpi-6 { grid-template-columns: repeat(4, 1fr); }
a.vs-kpi { color: var(--vs-text); text-decoration: none; transition: border-color .15s; }
a.vs-kpi:hover { border-color: var(--vs-accent); }
.vs-kpi .lbl .fa { color: var(--vs-text-faint); }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.vs-chart-card .table { margin-bottom: 0; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 150px; gap: 10px; align-items: center; margin-bottom: 6px; font-size: 12px; }
.bar-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-note { color: var(--vs-text-dim); font-variant-numeric: tabular-nums; }
.bar-row .vs-bar-track { position: relative; margin: 0; height: 10px; }
.bar-row .vs-bar-fill { position: absolute; top: 0; right: 0; }
.bar-row .bar-total { background: #c3e0f9; }

/* ---------- dialogs ---------- */
.modal-header .close { float: left; }
.modal-lg { width: 1000px; max-width: calc(100% - 20px); }
.modal-footer { text-align: left; }
.handover-head, .emp-info { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 12px; }
.sign-link-box { background: var(--hih-box-bg); border: 1px solid var(--hih-box-border); border-radius: 10px; padding: 10px 12px; }
.sign-link-box .filter-inline { margin-bottom: 4px; flex-wrap: wrap; }
.sign-link-box .filter-inline .form-control { min-width: 240px; }
.case-copy.copied, .btn.copied { background: var(--hih-success) !important; border-color: var(--hih-success-hover) !important; }
.select2-container--default .select2-selection--single { border-radius: 0; border-color: var(--hih-input-border); height: 34px; }
.select2-container--default .select2-selection--single .select2-selection__rendered { line-height: 32px; }
.select2-container--default .select2-selection--single .select2-selection__arrow { height: 32px; }

#toast { position: fixed; bottom: 16px; left: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 6px; max-width: calc(100% - 32px); }
.toast-item { margin: 0; box-shadow: 0 4px 14px rgba(0,0,0,.15); min-width: 220px; }

/* ---------- sign page ---------- */
.sign-page { background: #ecf0f5; }
.sign-wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
.sign-head { display: flex; align-items: center; gap: 12px; background: var(--hih-header-gradient); color: var(--hih-header-text); border: 1px solid var(--hih-box-border); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
.sign-head .fa { font-size: 26px; }
.sign-org { font-size: 12px; }
.sign-title { font-weight: 700; font-size: 16px; }
.sign-info { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 12px; }
.sign-terms, .sheet-terms { background: var(--hih-stats-target); border: 1px solid #f0e2b6; border-radius: 6px; padding: 10px 12px; line-height: 1.9; margin-bottom: 12px; }
.sig-box { border: 2px dashed var(--hih-input-border); border-radius: 6px; background: #fff; margin-bottom: 6px; touch-action: none; }
.sig-box canvas { display: block; width: 100%; height: 200px; cursor: crosshair; }
.sig-img { max-width: 260px; max-height: 110px; }

/* ---------- print ---------- */
.print-page { background: #e5e5e5; }
.print-actions { text-align: center; padding: 10px; }
.sheet { background: #fff; width: 210mm; min-height: 297mm; margin: 0 auto 20px; padding: 14mm; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #444; padding-bottom: 10px; margin-bottom: 14px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
.sheet-org { font-weight: 700; font-size: 16px; }
.sheet-meta { text-align: left; font-size: 12px; }
.sheet-info td { text-align: right !important; }
.sheet-items th { background: #eee !important; }
.sheet-signs { display: flex; justify-content: space-between; gap: 20px; margin-top: 30px; text-align: center; }
.sheet-signs > div { flex: 1; }
.sig-line { border-bottom: 1px dotted #555; height: 50px; margin: 0 10px 6px; }

@media print {
    .no-print { display: none !important; }
    .print-page { background: #fff; }
    .sheet { box-shadow: none; margin: 0; width: auto; min-height: 0; padding: 0; }
    @page { size: A4; margin: 12mm; }
    a[href]:after { content: none !important; }
    .sheet-items th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet-terms { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- small screens ---------- */
@media (max-width: 900px) {
    .vs-kpi-grid.kpi-6 { grid-template-columns: repeat(2, 1fr); }
    .dash-grid { grid-template-columns: 1fr; }
    .bar-row { grid-template-columns: 90px 1fr 110px; }
}
@media (max-width: 767px) {
    .main-header .sidebar-toggle { display: inline-block; }
    .main-header .logo { font-size: 13px; }
    #userName { display: none; }
    .main-sidebar { width: 0; }
    .main-sidebar:hover { width: 0; box-shadow: none; }
    .sidebar-open .main-sidebar { width: 220px; box-shadow: -4px 0 14px rgba(0,0,0,.2); }
    .content-wrapper { margin-right: 0; padding: 10px; }
    .filters .form-control { width: 100% !important; }
}

/* ---------- أنواع الأصناف: لاب توب / موبايل / شريحة ---------- */
:root { --type-laptop: var(--hih-primary); --type-mobile: var(--hih-success); --type-sim: var(--hih-warning); }
.type-badge { display: inline-block; white-space: nowrap; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 700; color: #fff; background: #888; }
.type-badge.type-laptop { background: var(--type-laptop); }
.type-badge.type-mobile { background: var(--type-mobile); }
.type-badge.type-sim { background: var(--type-sim); }

.type-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.type-tabs .btn { border-radius: 10px !important; font-weight: 600; }
.type-tabs .btn .badge { background: #fff; color: #555; margin-right: 4px; }
.type-tabs .btn.active { color: #fff; box-shadow: none; }
.type-tabs .btn.tab-all { background: var(--hih-toggle-all); border-color: var(--hih-toggle-all); }
.type-tabs .btn.tab-laptop { background: var(--type-laptop); border-color: var(--type-laptop); }
.type-tabs .btn.tab-mobile { background: var(--type-mobile); border-color: var(--type-mobile); }
.type-tabs .btn.tab-sim { background: var(--type-sim); border-color: var(--type-sim); }

.details-cell { text-align: right !important; font-size: 12px; min-width: 160px; }
.spec-checks .checkbox-inline { margin: 0 0 4px 14px; padding-right: 20px; }
.spec-checks .checkbox-inline input { margin-right: -20px; }
#itType .btn.active, #asType .btn.active { background: var(--hih-primary); border-color: var(--hih-primary); color: #fff; }
.as-type { flex-wrap: wrap; }
.as-type .select2-container { flex: 1 1 260px; }
.spec-info { background: var(--hih-box-bg); border: 1px solid var(--hih-box-border); border-radius: 10px; padding: 8px 12px; }

.type-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
.type-kpi { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--vs-border); border-right: 4px solid #888; border-radius: 10px; padding: 12px 14px; color: var(--vs-text); text-decoration: none !important; }
.type-kpi:hover { border-color: var(--vs-accent); color: var(--vs-text); }
.type-kpi .fa { font-size: 26px; width: 30px; text-align: center; }
.type-kpi b { display: block; font-size: 14px; }
.type-kpi span { font-size: 11.5px; color: var(--vs-text-dim); }
.type-kpi.type-laptop { border-right-color: var(--type-laptop); } .type-kpi.type-laptop .fa { color: var(--type-laptop); }
.type-kpi.type-mobile { border-right-color: var(--type-mobile); } .type-kpi.type-mobile .fa { color: var(--type-mobile); }
.type-kpi.type-sim { border-right-color: var(--type-sim); } .type-kpi.type-sim .fa { color: var(--type-sim); }
.print-page .details-cell, .sign-page .details-cell { min-width: 0; font-size: 11px; }
@media (max-width: 900px) { .type-kpis { grid-template-columns: 1fr; } }

.demo-badge{background:#ff6a00;color:#fff;border-radius:10px;padding:2px 10px;font-size:11px;font-weight:700;margin-left:6px}
</style>

            '<button class="btn btn-success btn-action" id="asSave"><i class="fa fa-check"></i> حفظ وإنشاء سند التسليم</button><button class="btn btn-default btn-action" data-dismiss="modal">إلغاء</button>', 'modal-lg');
        employeeSelect($m.find('#asEmp'));
        if (preset.emp) {
            $m.find('#asEmp').append(new Option(preset.empName, preset.emp, true, true)).trigger('change');
        }
        var $item = $m.find('#asItem'), asType = '';
        $m.find('#asType').on('click', '[data-type]', function () {
            asType = String($(this).data('type'));
            $(this).addClass('active').siblings().removeClass('active');
            $item.select2('open');
        });
        $item.select2({
            dir: 'rtl', width: '100%', dropdownParent: $m, placeholder: 'أضف صنفًا...',
            language: { noResults: function () { return 'لا توجد أصناف متاحة مطابقة'; }, searching: function () { return 'جاري البحث...'; } },
            ajax: {
                url: 'api.php', dataType: 'json', delay: 250,
                data: function (p) { return { action: 'items.list', q: p.term || '', status: 'متاحة', type: asType }; },
                processResults: function (r) {
                    return {
                        results: r.data.slice(0, 50).map(function (i) {
                            return { id: i.id, text: i.type_label + ' — ' + i.code + ' — ' + i.name + (i.serial_no ? ' [' + i.serial_no + ']' : '') + (i.specs_text ? ' — ' + i.specs_text : ''), item: i };
                        })
                    };
                }
            },
            templateResult: function (d) {
                return d.item ? $('<span><i class="fa ' + typeDef(d.item.type).icon + '"></i> ' + esc(d.text) + '</span>') : d.text;
            }
        }).on('select2:select', function (e) {
            addLine(e.params.data.item);
            $item.val(null).trigger('change');
        });

        function addLine(i) {
            if (lines.some(function (l) { return l.id == i.id; })) return;
            lines.push(i);
            $m.find('#asLines tbody').append('<tr data-id="' + i.id + '"><td>' + typeBadge(i) + '</td><td>' + esc(i.code) + '</td><td>' + esc(i.name) + '</td><td dir="ltr">' + esc(i.serial_no || '-') + '</td><td class="details-cell">' + itemDetails(i) + '</td>' +
                '<td><select class="form-control input-sm l-cond">' + options(S.meta.conditions, i.item_condition) + '</select></td>' +
                '<td><input class="form-control input-sm l-notes"></td><td><button type="button" class="btn btn-danger btn-xs l-del"><i class="fa fa-times"></i></button></td></tr>');
        }
        $m.find('#asLines').on('click', '.l-del', function () {
            var id = $(this).closest('tr').data('id');
            lines = lines.filter(function (l) { return l.id != id; });
            $(this).closest('tr').remove();
        });
        if (preset.item) {
            api('items.get', { id: preset.item }, 'GET').then(function (d) { addLine(d.item); });
        }
        $m.find('#asSave').on('click', function () {
            var f = formData($m.find('#assignForm'));
            var payload = {

                return '<label class="checkbox-inline"><input type="checkbox" class="spec-check" data-key="' + f.key + '" value="' + esc(o) + '"' + ($.isArray(v) && v.indexOf(o) >= 0 ? ' checked' : '') + '> ' + esc(o) + '</label>';
            }).join('') + '</div>';

        var type = f.input === 'date' ? 'date' : f.input === 'number' ? 'number' : 'text', dl = 'dl-' + t + '-' + f.key;
        return '<input class="form-control spec" data-key="' + f.key + '" type="' + type + '"' + (type === 'number' ? ' step="0.01" min="0"' : '') + (f.ltr ? ' dir="ltr"' : '') +
            (f.required ? ' required' : '') + (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + (f.suggest ? ' list="' + dl + '"' : '') + ' value="' + esc(v || '') + '">' +
            (f.suggest ? datalist(dl, f.suggest) : '');

        return api(action, formData($form)).then(function (r) {
            $m.modal('hide');
            toast(msg);
            if (!noRefresh) refresh();
            return r;
        }).always(function () { $b.prop('disabled', false); });
    }

    function refresh() {
        if (current && current.reload) current.reload();
        else if (location.hash === '#dashboard' || !location.hash) views.dashboard();
    }

    // ------------------------------------------------------------ global actions

    $(document).on('click', '[data-act]', function (e) {
        e.preventDefault();
        var $t = $(this), id = $t.data('id');
        switch ($t.data('act')) {
            case 'assign': assignDialog({ emp: $t.data('emp'), empName: $t.data('emp-name'), item: $t.data('item') }); break;
            case 'handover': showHandover(id); break;
            case 'print-h': openPrint('print.php?h=' + id); break;
            case 'print-emp': openPrint('print.php?emp=' + id); break;
            case 'renew-link':
                confirmBox('سيتوقف الرابط القديم عن العمل. متابعة؟').then(function () { api('handovers.renew_link', { id: id }).then(handoverDialog); });
                break;
            case 'employee': employeeCard(id); break;
            case 'item': itemCard(id); break;
            case 'item-edit': itemForm(id, $t.data('type')); break;
            case 'backup': DEMO.go = 'api.php?action=backup.download'; break;
            case 'employee-edit': employeeForm(id); break;
            case 'user-edit': userForm(id); break;
            case 'item-delete':
                confirmBox('حذف الصنف نهائيًا؟').then(function () { api('items.delete', { id: id }).then(function () { $('#modal').modal('hide'); toast('تم الحذف'); refresh(); }); });
                break;
            case 'employee-delete':
                confirmBox('حذف الموظف نهائيًا؟').then(function () { api('employees.delete', { id: id }).then(function () { $('#modal').modal('hide'); toast('تم الحذف'); refresh(); loadLookups(); }); });
                break;
            case 'return-selected': var r = selectedCustody(); if (r) returnDialog(r, false); break;
            case 'transfer-selected': var t = selectedCustody(); if (t) returnDialog(t, true); break;
        }
    });

    // بطاقات الأنواع في لوحة المتابعة تفتح صفحة العهد على تبويب النوع
    $(document).on('click', '[data-tab-link]', function () { S.tabs['custody.list'] = String($(this).data('tab-link')); });

    $(document).on('click', '[data-copy]', function (e) { e.preventDefault(); copyText($(this).data('copy'), $(this)); });

    // ------------------------------------------------------------ routing + auth

    function route() {
        var name = (location.hash || '#dashboard').slice(1);
        if (!views[name] || ((name === 'users' || name === 'log') && !isAdmin())) name = 'dashboard';
        current = null;
        $('#menu li').removeClass('active').filter('[data-view="' + name + '"]').addClass('active');
        $('#modal').modal('hide');
        $('#content').off();
        views[name]();
    }

    function loadLookups() {
        return api('lookups', null, 'GET').then(function (d) { S.lookups = d; return d; });
    }

    function showLogin() {
        $('#appView').hide();
        $('#loginView').show();
    }

    function boot() {
        return api('auth.me', null, 'GET').then(function (d) {
            S.csrf = d.csrf;
            S.meta = d;
            S.user = d.user;
            if (!S.user) { showLogin(); return; }
            $('#loginView').hide();
            $('#appView').show();
            $('#userName').text(S.user.name + ' — ' + (d.roles[S.user.role] || ''));
            $('.admin-only').toggle(isAdmin());
            return loadLookups().then(function () {
                route();
                if (+S.user.must_change) passwordDialog(true);
            });
        });
    }

    $('#loginForm').on('submit', function (e) {
        e.preventDefault();
        $('#loginError').hide();
        api('auth.login', formData($(this))).then(boot, function (msg) { $('#loginError').text(msg).show(); });
    });

    $('#btnLogout').on('click', function () { api('auth.logout', {}).then(function () { location.hash = ''; location.reload(); }); });
    $('#btnChangePw').on('click', function () { passwordDialog(false); });
    $('#sidebarToggle').on('click', function () { $('body').toggleClass('sidebar-open'); });
    $(window).on('hashchange', function () { if (S.user) { $('body').removeClass('sidebar-open'); route(); } });

    boot();
})(jQuery);

</script>
</body>
</html>
