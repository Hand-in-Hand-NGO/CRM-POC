<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحة التمويل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-rtl/3.4.0/css/bootstrap-rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap">
  <style>
/* =====================================================================
   HandinHand CMS theme — font, palette and recurring components.
   Paste into the page <style> after bootstrap + bootstrap-rtl.
   Font link: https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap
   ===================================================================== */
:root {
    --live-font: 'Droid Arabic Kufi', 'Noto Kufi Arabic', Tahoma, Arial, sans-serif;

    --hih-header-gradient: linear-gradient(90deg, #d3f1f8 0%, #ebf6ed 17%, #fff9e4 34%, #f9e7de 47%, #f8f2e4 57%, #d9eaf4 64%, #e9efec 74%, #baeae6 100%);
    --hih-header-text: #535252;
    --hih-sidebar: #222d32;
    --hih-sidebar-active: #1e282c;
    --hih-sidebar-text: #b8c7ce;

    --hih-primary: #0093e9;
    --hih-success: #31c860;
    --hih-success-hover: #2db457;
    --hih-danger: #f96a74;
    --hih-warning: #ff6a00;
    --hih-focus: #67b9ec;

    --hih-default-bg: #f4f4f4;
    --hih-default-border: #ddd;
    --hih-default-text: #444;
    --hih-input-border: #d2d6de;

    --hih-toggle-all: #b7b7b7;
    --hih-toggle-on: #5bb75b;
    --hih-toggle-off: #da4f49;

    --hih-box-bg: #f6f6f6;
    --hih-box-border: #d7dbe0;

    --hih-chip-bg: #e6f1fb;
    --hih-picker-head: #d9e8f7;
    --hih-picker-odd: #c3e0f9;
    --hih-picker-even: #ffbec2;

    --hih-row-new: #d9edf7;
    --hih-row-new-hover: #becfd8;
    --hih-row-new-key: #e8f1ff;
    --hih-row-maint: #f2dede;
    --hih-row-maint-hover: #dbc6c6;
    --hih-row-maint-key: #fbe8e8;
    --hih-row-hover: #f96a741f;

    --hih-stats-head: #e9eef3;
    --hih-stats-border: #e3e6ea;
    --hih-stats-alt: #f7f9fb;
    --hih-stats-target: #fdf6df;
    --hih-stats-percent: #dff0d8;
    --hih-stats-percent-alt: #d3eacb;

    /* dashboard (cards / charts) */
    --vs-bg: #f5f6f8;
    --vs-bg-raised: #fff;
    --vs-surface: #fff;
    --vs-surface-2: #eef0f3;
    --vs-border: #e2e5ea;
    --vs-border-soft: #ececf0;
    --vs-text: #1a1d23;
    --vs-text-dim: #62697a;
    --vs-text-faint: #97a0ad;
    --vs-accent: #2f6fed;
    --vs-accent-hover: #2559c9;
    --vs-green: #15803d;
    --vs-radius-sm: 6px;
    --vs-radius: 10px;
    --vs-font-ui: var(--live-font);
    --vs-font-mono: var(--live-font);
    --vs-chart-axis: #6b7280;
    --vs-chart-grid: #d6d9df;
}

/* ---------- font ---------- */
body, h1, h2, h3, h4, h5, h6, .h1, .h2, .h3, .h4, .h5, .h6,
.tooltip, .popover, .daterangepicker, .select2-container, .select2-dropdown,
input, select, textarea, button { font-family: var(--live-font); }
body { direction: rtl; text-align: right; }

/* ---------- header / panels ---------- */
.main-header, .main-header .navbar, .main-header .logo,
.panel-primary > .panel-heading, .modal-header {
    background: var(--hih-header-gradient) !important;
    color: var(--hih-header-text) !important;
    border-color: var(--hih-box-border);
}
.main-header a, .main-header .navbar .nav > li > a, .modal-title { color: var(--hih-header-text) !important; }
.main-sidebar { background: var(--hih-sidebar); }
.main-sidebar .sidebar-menu > li > a { color: var(--hih-sidebar-text); }
.main-sidebar .sidebar-menu > li:hover > a, .main-sidebar .sidebar-menu > li.active > a { background: var(--hih-sidebar-active); color: #fff; }

.box-content { background: var(--hih-box-bg); border: 1px solid var(--hih-box-border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }

/* ---------- form controls ---------- */
.form-control { border-color: var(--hih-input-border); border-radius: 0; box-shadow: none; }
.form-control:focus { border-color: var(--hih-focus); box-shadow: none; }
label { font-weight: bold; }
.select2-container--default .select2-results__option--highlighted[aria-selected] { background: var(--hih-focus); }

/* ---------- buttons ---------- */
.btn-action, .filter-inline .btn { border-radius: 10px !important; }
.btn-primary { background: var(--hih-primary); border-color: var(--hih-primary); }
.btn-success { background: var(--hih-success); border-color: var(--hih-success-hover); }
.btn-success:hover, .btn-success:focus { background: var(--hih-success-hover); border-color: var(--hih-success-hover); }
.btn-danger { background: var(--hih-danger); border-color: var(--hih-danger); }
.btn-warning { background: var(--hih-warning); border-color: var(--hih-warning); }
.btn-default { background: var(--hih-default-bg); border-color: var(--hih-default-border); color: var(--hih-default-text); }

/* filter with its buttons directly beside it */
.filter-inline { display: flex; align-items: center; gap: 4px; }
.filter-inline > .form-control, .filter-inline > .select2-container { flex: 1 1 auto; min-width: 0; }

/* ---------- toggle groups (الكل / نعم / لا) ---------- */
.btn-group-justified .btn.active.toggle-all { background: var(--hih-toggle-all); color: #fff; }
.btn-group-justified .btn.active.toggle-on  { background: var(--hih-toggle-on);  color: #fff; }
.btn-group-justified .btn.active.toggle-off { background: var(--hih-toggle-off); color: #fff; }

/* ---------- chips + picker table ---------- */
.chip { display: inline-block; background: var(--hih-chip-bg); color: var(--hih-primary); border: 1px solid var(--hih-primary); border-radius: 15px; padding: 0 8px; margin: 1px 2px; font-size: 12px; }
.picker-table { width: 100%; border-collapse: collapse; }
.picker-table th { background: var(--hih-picker-head); text-align: center; }
.picker-table td, .picker-table th { border: 1px solid #ccc; padding: 4px 6px; cursor: pointer; }
.picker-table td.selected:nth-child(odd)  { background: var(--hih-picker-odd); }
.picker-table td.selected:nth-child(even) { background: var(--hih-picker-even); }

/* ---------- data table ---------- */
.table > thead > tr > th { text-align: center; white-space: nowrap; vertical-align: middle; }
.table > tbody > tr > td { text-align: center; vertical-align: middle; }
.table tbody tr:hover { background: var(--hih-row-hover); }
.table tbody tr.row-new   > td { background: var(--hih-row-new); }
.table tbody tr.row-new:hover > td { background: var(--hih-row-new-hover); }
.table tbody tr.row-new   > td.key { background: var(--hih-row-new-key); }
.table tbody tr.row-maint > td { background: var(--hih-row-maint); }
.table tbody tr.row-maint:hover > td { background: var(--hih-row-maint-hover); }
.table tbody tr.row-maint > td.key { background: var(--hih-row-maint-key); }
.info-label { color: gray; }
.table-scroll { overflow-x: auto; }   /* only the table scrolls; toolbar + pager stay fixed */

/* ---------- value + 🔍 + نسخ ---------- */

.case-value .case-text {
    margin-left: 3px;
}

.case-value .btn-xs {
    padding: 0 5px;
    font-size: 11px;
    line-height: 18px;
    border-radius: 3px !important;
}

.case-value .case-search {
    background: #fff;
    border-color: #ccc;
    color: #333;
}

.case-value .case-copy.copied {
    background-color: #31c860;
    border-color: #2db457;
}

/* ---------- side stats table ---------- */
.stats-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0;
}

.stats-table th,
.stats-table td {
    border: 1px solid #e3e6ea;
    padding: 4px 6px;
    text-align: center;
    vertical-align: middle;
}

.stats-table thead th {
    background: #e9eef3;
    color: #333;
    font-size: 11px;
    padding: 4px 3px;
    white-space: nowrap;
}

.stats-table td.stats-label {
    text-align: right;
    font-weight: bold;
    color: #333;
    white-space: normal;
    line-height: 1.3;
}

.stats-table td.stats-label small {
    display: block;
    font-weight: normal;
    color: #999;
    font-size: 10px;
    text-align: left;
}

.stats-table td.stats-num {
    font-weight: bold;
    color: #222;
    width: 56px;
    padding: 4px 3px;
}

.stats-table tr.row-period:nth-child(even) td {
    background: #f7f9fb;
}

.stats-table tr.row-target td {
    background: #fdf6df;
}

.stats-table tr.row-percent td {
    background: #dff0d8;
}

.stats-table tr.row-percent:nth-child(even) td {
    background: #d3eacb;
}


/* ---------- dashboard building blocks ---------- */
/* ---- chart-drawer building blocks ---- */
.vs-dash-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 16px; flex-wrap: wrap; gap: 10px; }
.vs-period-tabs { display: inline-flex; background: var(--vs-bg); border: 1px solid var(--vs-border); border-radius: var(--vs-radius-sm); padding: 3px; gap: 2px; flex-wrap: wrap; }
.vs-period-tabs button {
    border: none; background: none; color: var(--vs-text-dim); padding: 7px 14px; border-radius: 5px;
    font-size: 12.5px; cursor: pointer; font-family: inherit; font-weight: 600; transition: background .15s, color .15s;
}
.vs-period-tabs button:hover { color: var(--vs-text); }
.vs-period-tabs button.active { background: var(--vs-accent); color: #fff; }
.vs-period-range { font-size: 11.5px; color: var(--vs-text-faint); font-family: var(--vs-font-mono); }

.vs-kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
.vs-kpi { background: var(--vs-bg); border: 1px solid var(--vs-border); border-radius: var(--vs-radius); padding: 12px 10px; display: flex; flex-direction: column; gap: 5px; }
.vs-kpi .num { font-family: var(--vs-font-mono); font-size: 20px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.vs-kpi .lbl { font-size: 11px; color: var(--vs-text-dim); }
.vs-kpi.zero .num { color: var(--vs-text-faint); }

.vs-group-label { font-size: 11px; font-weight: 700; color: var(--vs-text-faint); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 10px; }
.vs-chart-group { margin-bottom: 22px; }
.vs-chart-group:last-child { margin-bottom: 0; }
.vs-chart-row-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.vs-chart-card { background: var(--vs-surface); border: 1px solid var(--vs-border); border-radius: var(--vs-radius); padding: 16px; }
.vs-chart-card-head { margin-bottom: 10px; }
.vs-chart-card-head h4 { margin: 0; font-size: 13.5px; font-weight: 700; }
.vs-chart-card-head p.sub { margin: 3px 0 0; font-size: 11.5px; color: var(--vs-text-dim); }

.vs-target-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.vs-target-card { background: var(--vs-bg); border: 1px solid var(--vs-border); border-radius: var(--vs-radius); padding: 12px; }
.vs-target-card .name { font-size: 12px; font-weight: 700; color: var(--vs-text); margin-bottom: 8px; }
.vs-target-card .row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px; font-size: 11.5px; color: var(--vs-text-dim); }
.vs-target-card .row b { font-family: var(--vs-font-mono); color: var(--vs-text); font-size: 12.5px; font-weight: 700; }
.vs-bar-track { height: 7px; border-radius: 999px; background: var(--vs-surface-2); overflow: hidden; margin: 7px 0 5px; }
.vs-bar-fill { height: 100%; border-radius: 999px; background: var(--vs-accent); transition: width .4s ease; }
.vs-bar-fill.ok { background: var(--vs-green); }
.vs-pct-badge { font-family: var(--vs-font-mono); font-size: 12.5px; font-weight: 700; }
.vs-pct-badge.ok { color: var(--vs-green); }
.vs-pct-badge.warn { color: var(--vs-accent); }
.vs-no-target { color: var(--vs-text-faint); font-size: 12px; text-align: center; padding: 30px 10px; }
.vs-chart-empty { display: flex; align-items: center; justify-content: center; height: 180px; color: var(--vs-text-faint); font-size: 12.5px; }

.vs-tooltip { background: var(--vs-bg-raised); border: 1px solid var(--vs-border); border-radius: var(--vs-radius-sm); padding: 8px 10px; box-shadow: 0 4px 14px rgba(0,0,0,.1); font-size: 12px; direction: rtl; font-family: var(--vs-font-ui); }
.vs-tooltip .t-label { font-weight: 700; margin-bottom: 4px; }
.vs-tooltip .t-row { display: flex; align-items: center; gap: 6px; }
.vs-tooltip .t-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.stats-panel .recharts-wrapper { direction: ltr; }

@media (min-width: 560px) {
    .vs-chart-row-2 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 700px) {
    .vs-kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .vs-target-grid { grid-template-columns: 1fr; }
}

.stats-refresh.spinning i { animation: fa-spin .8s linear infinite; }
.recharts-wrapper { direction: ltr; }   /* charts draw LTR; tooltips stay RTL */


    /* ---------- shell ---------- */
    html, body { background: #ecf0f5; font-size: 13px; color: #333; }
    .main-header { position: fixed; top: 0; right: 0; left: 0; height: 56px; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 0 66px 0 18px; border-bottom: 1px solid var(--hih-box-border); }
    .page-title { display: flex; align-items: center; gap: 10px; color: var(--hih-header-text); }
    .page-title .ttl-ic { width: 34px; height: 34px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; color: var(--hih-primary); font-size: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .page-title b { display: block; font-size: 16px; line-height: 1.3; }
    .page-title small { display: block; font-size: 11px; color: #7b7b7b; }
    .hdr-user { margin-right: auto; color: var(--hih-header-text); font-size: 12.5px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.65); border-radius: 20px; padding: 4px 6px 4px 12px; }
    .hdr-user .av { width: 26px; height: 26px; border-radius: 50%; background: var(--hih-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .main-sidebar { position: fixed; top: 0; bottom: 0; right: 0; width: 50px; z-index: 31; display: flex; flex-direction: column; padding-top: 56px; }
    .main-sidebar .logo { position: absolute; top: 0; right: 0; width: 50px; height: 56px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; background: var(--hih-sidebar-active); }
    .main-sidebar a { display: flex; align-items: center; justify-content: center; height: 46px; color: var(--hih-sidebar-text); font-size: 17px; text-decoration: none; }
    .main-sidebar a:hover, .main-sidebar a.active { background: var(--hih-sidebar-active); color: #fff; border-right: 3px solid var(--hih-primary); }
    .content { margin: 56px 50px 0 0; padding: 16px 18px 90px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
    .side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; padding-bottom: 4px; }

    /* ---------- cards ---------- */
    .card { background: #fff; border: 1px solid var(--hih-box-border); border-radius: 10px; }
    .card-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #edf0f3; font-weight: 700; font-size: 13px; color: #333; }
    .card-head .fa { color: var(--hih-primary); }
    .card-head .cnt { background: #eef2f6; color: #555; border-radius: 10px; padding: 0 8px; font-size: 11px; }
    .card-head .sp { flex: 1; }
    .card-body { padding: 12px 14px; }
    .muted { color: #999; }
    .empty { text-align: center; color: #999; padding: 22px 10px; font-size: 12.5px; }
    .empty .fa { display: block; font-size: 22px; color: #c9d1da; margin-bottom: 6px; }

    /* ---------- KPIs ---------- */
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .kpi { background: #fff; border: 1px solid var(--hih-box-border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: right; font: inherit; transition: border-color .15s, box-shadow .15s; }
    .kpi:hover { border-color: var(--k); }
    .kpi.on { border-color: var(--k); box-shadow: 0 0 0 2px color-mix(in srgb, var(--k) 25%, transparent); }
    .kpi .k-ic { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--k); background: color-mix(in srgb, var(--k) 12%, #fff); flex-shrink: 0; }
    .kpi b { display: block; font-size: 21px; line-height: 1.2; color: #222; font-variant-numeric: tabular-nums; }
    .kpi span { display: block; font-size: 11.5px; color: #777; }

    /* ---------- filters ---------- */

    .store-tabs button { border: 1px solid var(--hih-default-border); background: var(--hih-default-bg); color: #444; border-radius: 10px; padding: 6px 14px; font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    .store-tabs button .n { background: rgba(0,0,0,.07); border-radius: 10px; padding: 0 7px; font-size: 11px; }
    .store-tabs button.on.t-all { background: var(--hih-toggle-all); border-color: var(--hih-toggle-all); color: #fff; }
    .store-tabs button.on.t-new { background: var(--hih-primary); border-color: var(--hih-primary); color: #fff; }
    .store-tabs button.on.t-sv { background: #0093e9; border-color: #0093e9; color: #fff; }
    .sv-btn { color: #0093e9; border-color: #b9dcf5; }

    .af button { border: 0; background: rgba(0,147,233,.12); color: #0b6db0; width: 18px; height: 18px; border-radius: 50%; line-height: 16px; padding: 0; cursor: pointer; font-size: 12px; }

    /* ---------- table ---------- */
    .list-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid #edf0f3; }
    .state-tabs { display: flex; gap: 2px; background: #f1f3f6; border-radius: 10px; padding: 3px; }
    .state-tabs button { border: 0; background: transparent; border-radius: 8px; padding: 5px 12px; font: inherit; font-size: 12px; color: #555; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }

var LEVEL_MAP = {'بتر أسفل الركبة':'تحت الركبة','بتر أعلى الركبة':'فوق الركبة','بتر الساعد':'تحت الكوع','بتر أعلى المرفق':'فوق الكوع','بتر أصابع القدم':'مشط القدم'};
var FUNDING_MAP = {'تمويل مؤسسة':'بدون','ممول خاص':'متبرع فردي','مشروع اليونيسف':'مؤسسة مصر الخير','تمويل ذاتي':'بنك الطعام'};
var CODE_PREFIX = {'تحت الركبة':'BK','فوق الركبة':'AK','تحت الكوع':'BE','فوق الكوع':'AE','مشط القدم':'FT'};
// stage   = which of the 4 visits-page columns the case is waiting for (= task type)
// wait    = days waiting in that stage ; overdue = days past the scheduled maintenance date
// extra   = ready (limb back from manufacturing / maintenance finished, for the 2 delivery stages),
//           postponed {until, contact, reason} (engineering "مؤجل" from the visits page),
//           noShow (day offset of a missed visit recorded by reception)
function mk(id,name,gov,funding,level,age,attempts,pref,stage,wait,overdue,extra){
  var n = parseInt(id.slice(2),10);
  var prefixes = ['010','011','012','015'];
  var tail = String((n*7919 + 13579) % 100000000); while (tail.length<8) tail = '0'+tail;
  level = LEVEL_MAP[level] || level;
  var c = {id:id, name:name, gov:gov, funding:FUNDING_MAP[funding] || funding, level:level, age:age, attempts:attempts, pref:pref,
          stage:stage, order:TASK_TYPES[stage].order, waitingDays:wait, maintOverdue:overdue||0, phone: prefixes[n%4] + tail,
          code:(CODE_PREFIX[level]||'BK') + String(10 + n % 90) + String(100 + (n*37) % 900),
          ready: stage==='newDelivery' || stage==='maintDelivery' ? true : null, postponed:null, noShow:null};
  return Object.assign(c, extra || {});
}

// released = {caseId: {company, at}} from the funding page -> the case enters the medical evaluation pool
function releasePostponed(released){
  Object.keys(released||{}).forEach(function(id){
    var c = postponedById(id); if (!c || (CASE_MAP[id] && CASE_MAP[id].stage==='measurement')) return;
    c.stage = 'measurement'; c.order = TASK_TYPES.measurement.order; c.funding = released[id].company;
    if (CASES.indexOf(c)===-1) CASES.push(c);
    CASE_MAP[id] = c;
  });
}

// =====================================================================
// Funding store (shared with the operations room through localStorage)
// The page does two things only: assign a funder to cases, or hold cases
// (open-ended or for a number of days, with a note). Held cases can't be
// put in a task by operations and don't reach the call center.
// =====================================================================
var FUND_KEY = 'hih_funding_v1';
var CSR_USER = 'موظف CSR';
var BASE_COMPANIES = FUNDING_OPTIONS.filter(function(x){ return x!=='بدون'; });
function readStore(k, def){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function writeStore(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }

function emptyFilters(){ return {q:'', level:'', gov:'', age:'', company:'', stage:'', state:''}; }
var F = {
  store: null, company: '', newCompany: '',
  filters: emptyFilters(), sort: 'waitDesc', sel: [], modal: null, toast: null, view: 'cases',
};
function loadStores(){
  F.store = readStore(FUND_KEY, null) || {};
  F.store.companies = F.store.companies || []; F.store.alloc = F.store.alloc || {};
  F.store.holds = F.store.holds || {}; F.store.log = F.store.log || []; F.store.notes = F.store.notes || {};
  F.store.released = F.store.released || {}; F.store.opsNotes = F.store.opsNotes || [];
  F.surveys = readSurveys();
  releasePostponed(F.store.released);                 // sent to booking -> now in the medical evaluation pool
  waitingPostponed().forEach(function(c){ CASE_MAP[c.id] = c; });   // profile / notes find them too
}
// finished service-quality surveys (from the operations room) of the cases this page funded
function fundedSurveys(){
  return Object.keys(F.surveys||{}).map(function(k){ var r = F.surveys[k]; r.key = k; return r; }).filter(function(r){
    var c = caseById(r.cid); return r.status==='done' && c && funderOf(c);
  }).sort(function(a,b){ return (b.at||0) - (a.at||0); });
}

function timeFromMs(ms){ var d = new Date(ms), h = d.getHours(), m = d.getMinutes(); return (h%12||12)+':'+(m<10?'0':'')+m+' '+(h<12?'ص':'م'); }

function matchState(c, st){
  if (st==='funded') return !!funderOf(c);
  if (st==='unfunded') return !funderOf(c);
  if (st==='held') return !!holdOf(c);
  return true;
}
function baseFiltered(skipStage, skipState, from){
  var f = F.filters, q = f.q.trim().toUpperCase();
  var src = from || (!skipStage && f.stage==='postponed' ? waitingPostponed() : CASES.filter(inStores));
  return src.filter(function(c){
    if (q && c.name.indexOf(f.q.trim())===-1 && !(hasCode(c) && c.code.toUpperCase().indexOf(q)!==-1)) return false;
    if (f.level && c.level!==f.level) return false;
    if (f.gov && c.gov!==f.gov) return false;
    if (f.company && (f.company==='__none' ? funderOf(c) : funderOf(c)!==f.company)) return false;
    if (f.age){ var ab = AGE_BUCKETS.filter(function(x){ return x.key===f.age; })[0]; if (ab && ab.test && !ab.test(c.age)) return false; }
    if (!from && !skipStage && f.stage && f.stage!=='postponed' && c.stage!==f.stage) return false;

function filtered(){
  var s = F.sort;
  return baseFiltered().sort(function(a,b){
    if (s==='waitAsc') return a.waitingDays-b.waitingDays;

}

    '<a'+(F.view==='cases' ? ' class="active"' : '')+' href="#" title="صفحة التمويل"'+A('setView','cases')+'><i class="fa fa-money"></i></a>'+
    '<a'+(F.view==='forms' ? ' class="active"' : '')+' href="#" title="استبيانات شركات التمويل"'+A('setView','forms')+'><i class="fa fa-list-alt"></i></a></aside>';

function renderKpis(){
  var all = CASES.filter(inStores), f = F.filters.state;
  var n = {all:all.length, funded:0, unfunded:0, held:0};
  all.forEach(function(c){ if (funderOf(c)) n.funded++; else n.unfunded++; if (holdOf(c)) n.held++; });
  function k(key, val, label, icon, color){
    return '<button class="kpi'+(f===key?' on':'')+'" style="--k:'+color+';"'+A('setState', key)+'><span class="k-ic"><i class="fa fa-'+icon+'"></i></span><div><b>'+val+'</b><span>'+label+'</span></div></button>';
  }
  return '<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr));">'+
    k('', n.all, 'كل الحالات', 'th-large', '#64748b')+
    k('funded', n.funded, 'ممولة', 'check-circle', '#0093e9')+
    k('unfunded', n.unfunded, 'غير ممولة', 'circle-o', '#31c860')+
    k('held', n.held, 'موقوفة', 'pause-circle', '#ff6a00')+'</div>';
}

function renderFilters(){
  var f = F.filters, base = baseFiltered(true);
  var stages = [['','الكل','t-all'],['measurement',STORES.measurement,'t-new'],['newDelivery',STORES.newDelivery,'t-new'],['postponed','مؤجل لمرحلة أخرى','t-post'],['surveys','استبيانات الحالات الممولة','t-sv']];
  var govs = GOVERNORATES.filter(function(g){ return CASES.concat(waitingPostponed()).some(function(c){ return (inStores(c) || c.stage==='postponed') && c.gov===g; }); });

  var states = [['','الكل'],['funded','ممولة'],['unfunded','غير ممولة'],['held','موقوفة']];
  var levels = LEVEL_OPTIONS.concat(POSTPONED_LEVELS.filter(function(l){ return LEVEL_OPTIONS.indexOf(l)===-1; })).filter(function(l){ return CASES.concat(waitingPostponed()).some(function(c){ return (inStores(c) || c.stage==='postponed') && c.level===l; }); });

    '<div class="store-tabs">'+stages.map(function(s){
      return '<button class="'+s[2]+(f.stage===s[0]?' on':'')+'"'+A('setStage', s[0])+'><i class="fa fa-'+(s[0]==='surveys' ? 'star-half-o' : s[0]?'cube':'th-large')+'"></i>'+s[1]+'<span class="n">'+(s[0]==='surveys' ? fundedSurveys().length : s[0]==='postponed' ? postN : base.filter(function(c){ return !s[0] || c.stage===s[0]; }).length)+'</span></button>';
    }).join('')+'</div>'+
    '<div class="filters">'+
    '<div class="fg"><label>بحث</label><div class="search-box"><i class="fa fa-search"></i><input class="form-control" placeholder="الاسم أو الكود" value="'+esc(f.q)+'" data-k="q" data-input="setFilter" data-a="q"/></div></div>'+
    '<div class="fg"><label>مستوى البتر</label><select class="form-control w-sel" data-change="setFilter" data-a="level"><option value="">الكل</option>'+levels.map(function(l){ return '<option'+(f.level===l?' selected':'')+'>'+esc(l)+'</option>'; }).join('')+'</select></div>'+
    '<div class="fg"><label>الشركة الممولة</label><select class="form-control w-sel" data-change="setFilter" data-a="company"><option value="">الكل</option>'+companies().map(function(co){ return '<option'+(f.company===co?' selected':'')+'>'+esc(co)+'</option>'; }).join('')+'<option value="__none"'+(f.company==='__none'?' selected':'')+'>غير ممولة</option></select></div>'+
    '<div class="fg"><label>المحافظة</label><select class="form-control w-sel" data-change="setFilter" data-a="gov"><option value="">الكل</option>'+govs.map(function(g){ return '<option'+(f.gov===g?' selected':'')+'>'+esc(g)+'</option>'; }).join('')+'</select></div>'+
    '<div class="fg"><label>السن</label><select class="form-control w-sel" data-change="setFilter" data-a="age">'+AGE_BUCKETS.map(function(a){ return '<option value="'+a.key+'"'+(f.age===a.key?' selected':'')+'>'+a.label+'</option>'; }).join('')+'</select></div>'+
    '<div class="fg"><label>الحالة</label><div class="state-tabs">'+states.map(function(s){
      return '<button class="'+(f.state===s[0]?'on':'')+'"'+A('setState', s[0])+'>'+s[1]+' <span class="n">'+baseFiltered(false, true).filter(function(c){ return matchState(c, s[0]); }).length+'</span></button>';
    }).join('')+'</div></div>'+
    ((f.q || f.level || f.gov || f.age || f.company || f.state) ? '<div class="fg"><label>&nbsp;</label><button class="btn btn-link btn-sm" style="color:var(--hih-danger);"'+A('clearFilters')+'><i class="fa fa-times"></i> مسح الفلاتر</button></div>' : '')+
    '</div></div></div>';
}

function renderSurveys(){
  var f = F.filters, q = f.q.trim();
  var list = fundedSurveys().filter(function(r){ var c = caseById(r.cid); return (!q || c.name.indexOf(q)!==-1) && (!f.gov || c.gov===f.gov) && (!f.level || c.level===f.level) && (!f.company || funderOf(c)===f.company); });
  var h = '';
  h += '<div class="card"><div class="list-head"><span class="count"><b>'+list.length+'</b> استبيان</span></div><div class="table-scroll"><table class="ftable"><thead><tr>'+
    '<th>الحالة</th><th>الممول</th><th>الزيارة</th><th>النماذج</th><th>التقييم العام</th><th>الترشيح</th><th>التنبيهات</th><th>اتعمل</th><th></th></tr></thead><tbody>';
  list.forEach(function(r){
    var c = caseById(r.cid), ov = r.answers.overall, rr = SV_RATES.filter(function(x){ return x[0]===ov; })[0];
    h += '<tr><td><div class="who"><b>'+esc(c.name)+profBtn(c.id)+'</b><div class="sub">'+(hasCode(c) ? '<span class="code">'+c.code+'</span>' : '')+'<span>'+esc(c.gov)+'</span></div></div></td>'+
      '<td><span class="pill p-funded"><i class="fa fa-check"></i>'+esc(funderOf(c))+'</span></td>'+
      '<td>'+TASK_TYPES[r.type].label+'<span class="pill-sub">'+esc(r.day)+'</span></td>'+
      '<td>'+svRecForms(r).filter(function(x){ return x.status==='done'; }).map(function(x){ return esc(x.name)+' <span class="svx-ver">إصدار '+x.v+'</span>'; }).join('<br>')+'</td>'+
      '<td>'+(ov ? '<span class="sva-rate r'+ov+'">'+ov+' – '+rr[1]+'</span>' : '—')+'</td><td>'+esc(r.answers.recommend||'—')+'</td>'+
      '<td>'+(r.alerts && r.alerts.length ? '<span class="pill p-held"><i class="fa fa-exclamation-triangle"></i>'+r.alerts.length+'</span>' : '<span class="muted">—</span>')+'</td>'+
      '<td>'+esc(r.by||'')+'<span class="pill-sub">'+(r.at ? isoFromMs(r.at) : '')+'</span></td>'+
      '<td><button class="btn btn-default btn-sm btn-r"'+A('showSurvey', r.key)+'><i class="fa fa-eye"></i> عرض الإجابات</button></td></tr>';
  });
  h += '</tbody></table>';
  if (!list.length) h += '<div class="empty"><i class="fa fa-star-o"></i>لسه مفيش استبيانات للحالات الممولة</div>';
  return h + '</div></div>';
}
function renderTable(){

  var allOn = list.length && list.every(function(c){ return sel.indexOf(c.id)!==-1; });
  var h = 
    '<div class="card"><div class="list-head"><span class="count"><b>'+list.length+'</b> حالة</span><span class="sp"></span>'+
    '<button class="btn btn-success btn-sm btn-r"'+A('exportCsv')+'><i class="fa fa-file-excel-o"></i> تصدير إلى Excel</button></div>';
  function th(label, a, d){
    var on = F.sort===a || F.sort===d, nx = F.sort===d ? a : d;
    return '<th class="sortable'+(on?' sorted':'')+'"'+A('setSort', nx)+'>'+label+' <i class="fa fa-'+(on ? (F.sort===d ? 'sort-amount-desc' : 'sort-amount-asc') : 'sort')+'"></i></th>';
  }
  h += '<div class="table-scroll"><table class="ftable"><thead><tr>'+
    '<th class="cb"><input type="checkbox" title="تحديد الكل"'+(allOn?' checked':'')+(list.length?'':' disabled')+A('toggleAll')+'/></th>'+
    '<th>الحالة</th><th>المحافظة</th>'+th('السن','ageAsc','ageDesc')+'<th>مستوى البتر</th><th>الحصالة</th>'+th('مدة الانتظار','waitAsc','waitDesc')+'<th>التمويل</th><th>الإيقاف</th><th>الملاحظات</th><th>البحث الاجتماعي</th><th></th>'+
    '</tr></thead><tbody>';

      '<td>'+esc(c.gov)+'</td><td>'+c.age+'</td><td>'+esc(c.level)+'</td><td>'+storeLbl(c.stage)+'</td>'+
      '<td><div class="wait '+wc+'"><b>'+c.waitingDays+' يوم</b><div class="bar"><i style="width:'+Math.min(100, Math.round(c.waitingDays/365*100))+'%"></i></div></div></td>'+
      '<td>'+(fu ? '<span class="pill p-funded"><i class="fa fa-check"></i>'+esc(fu)+'</span>'+(a ? '<span class="pill-sub">'+isoFromMs(a.at)+'</span>' : '') : '<span class="pill p-unf">غير ممولة</span>')+'</td>'+
      '<td>'+(hd ? '<span class="pill p-held"><i class="fa fa-pause"></i>'+(hd.until ? 'لحد '+isoFromMs(hd.until) : 'موقوفة')+'</span>'+(hd.note ? '<span class="pill-sub note-cell">'+esc(hd.note)+'</span>' : '') : '<span class="muted">—</span>')+'</td>'+
      '<td>'+(notesOf(c).length ? '<button class="note-chip"'+A('showNotes', c.id)+' title="كل الملاحظات"><span>'+esc(notesOf(c)[notesOf(c).length-1].text)+'</span>'+
        (notesOf(c).length > 1 ? '<b>'+notesOf(c).length+'</b>' : '')+'</button>' : '<span class="muted">—</span>')+'</td>'+
      '<td><div class="row-act rs-act"><button class="icon-btn" title="عرض البحث الاجتماعي"'+A('rsView', c.id)+'><i class="fa fa-eye"></i></button>'+
        '<button class="icon-btn" title="تنزيل"'+A('rsDownload', c.id)+'><i class="fa fa-download"></i></button>'+
        '<button class="icon-btn" title="طباعة"'+A('rsPrint', c.id)+'><i class="fa fa-print"></i></button></div></td>'+
      '<td><div class="row-act">'+(surveysOf(c.id).length ? '<button class="icon-btn sv-btn" title="الاستبيانات ('+surveysOf(c.id).length+')"'+A('showCaseSurveys', c.id)+'><i class="fa fa-star-half-o"></i></button>' : '')+
        '<button class="icon-btn" title="إضافة ملاحظة"'+A('openNoteOne', c.id)+'><i class="fa fa-comment-o"></i></button>'+(hd ? '<button class="icon-btn" title="فك الإيقاف"'+A('releaseOne', c.id)+'><i class="fa fa-play"></i></button>' : '')+
        (a ? '<button class="icon-btn danger" title="إلغاء التمويل"'+A('unfund', c.id)+'><i class="fa fa-undo"></i></button>' : '')+'</div></td></tr>';
  });
  h += '</tbody></table>';
  if (!list.length) h += '<div class="empty"><i class="fa fa-search"></i>لا توجد حالات مطابقة</div>';
  return h + '</div></div>';

    '<button class="btn btn-default"'+A('openNote')+'><i class="fa fa-comment-o"></i> ملاحظة</button>'+

    '<select data-change="setCompany"><option value="">— الممول —</option>'+companies().map(function(c){ return '<option'+(F.company===c?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'<option value="__new">+ ممول جديد…</option></select>'+

// ---- استبيانات شركات التمويل
function renderForms(){
  if (SVE.id && SVE.id!=='base' && svfById(SVE.id)) return svfEditorHtml();
  var forms = SVF.forms.slice().sort(function(a,b){ return (a.company||'').localeCompare(b.company||'') || (b.savedAt||0) - (a.savedAt||0); });
  var h = '<div class="card forms-card"><div class="list-head"><span class="count"><i class="fa fa-list-alt"></i> استبيانات شركات التمويل <b>'+forms.length+'</b></span><span class="sp"></span>'+
    '<button class="btn btn-primary btn-sm btn-r"'+A('svfNew')+'><i class="fa fa-plus"></i> نموذج جديد</button></div>';
  if (!forms.length) return h + '<div class="empty"><i class="fa fa-list-alt"></i>لسه مفيش نماذج</div></div>';
  h += '<div class="table-scroll"><table class="ftable"><thead><tr><th>النموذج</th><th>شركة التمويل</th><th>الحالة</th><th>الأسئلة</th><th>الحالات الممولة</th><th>اتجاوب</th><th>آخر تعديل</th><th></th></tr></thead><tbody>';
  forms.forEach(function(f){
    var p = svfPublished(f), co = p ? p.company : f.company, n = co ? CASES.concat(waitingPostponed()).filter(function(c){ return funderOf(c)===co; }).length : 0;
    var answered = Object.keys(F.surveys||{}).filter(function(k){ var r = F.surveys[k]; return r.forms && r.forms[f.id] && r.forms[f.id].status==='done'; }).length;
    h += '<tr><td><b>'+esc(f.name || 'نموذج من غير اسم')+'</b></td><td>'+(co ? '<span class="pill p-funded">'+esc(co)+'</span>' : '<span class="muted">—</span>')+'</td>'+
      '<td>'+(p ? '<span class="svx-badge pub">منشور · إصدار '+p.v+'</span>' : '<span class="svx-badge draft">مسودة</span>')+(p && svfDirty(f) ? '<span class="svx-badge draft">تعديلات مش منشورة</span>' : '')+'</td>'+
      '<td>'+(p ? p.qs.length : (f.draft||[]).length)+'</td><td>'+n+'</td><td>'+answered+'</td>'+
      '<td>'+(f.savedAt ? isoFromMs(f.savedAt) : p ? isoFromMs(p.at) : '—')+'</td>'+
      '<td><div class="row-act"><button class="btn btn-default btn-sm btn-r"'+A('svfEdit', f.id)+'><i class="fa fa-pencil"></i> تعديل</button>'+
        (p ? '' : '<button class="icon-btn" title="حذف"'+A('svfRemove', f.id)+'><i class="fa fa-trash"></i></button>')+'</div></td></tr>';
  });
  return h + '</tbody></table></div></div>';
}
function renderCompanies(){
  var rows = companies().map(function(co){ return {co:co, n:CASES.filter(function(c){ return inStores(c) && funderOf(c)===co; }).length}; }).filter(function(r){ return r.n; });
  var h = '<div class="card"><div class="card-head"><i class="fa fa-building"></i>الحالات حسب الممول</div><div class="card-body">';
  if (!rows.length) return h + '<div class="empty" style="padding:10px;">مفيش حالات ممولة</div></div></div>';

  rows.forEach(function(r){
    h += '<div class="co-row"><b>'+esc(r.co)+'</b><span class="tot">'+r.n+' حالة</span><div class="co-bar"><i style="width:'+(r.n/max*100)+'%;background:#0093e9;"></i></div></div>';
  });
  return h + '</div></div>';
}

function renderHistory(){
  var log = F.store.log;
  var h = '<div class="card"><div class="card-head"><i class="fa fa-history"></i>السجل<span class="cnt">'+log.length+'</span></div><div class="card-body">';

    h += '<div class="hist"><b>'+esc(b.action)+'</b> · '+b.ids.length+' حالة'+(b.detail ? ' <span class="muted">('+esc(b.detail)+')</span>' : '')+

function renderModal(){
  var m = F.modal; if (!m) return '';

      '<table class="table table-bordered"><thead><tr><th>الكود</th><th>مستوى البتر</th><th>المرحلة</th><th>التمويل</th></tr></thead><tbody>'+others.map(function(o){
        return '<tr><td class="code">'+(hasCode(o) ? o.code : '—')+'</td><td>'+esc(o.level)+'</td><td>'+TASK_TYPES[o.stage].label+'</td><td>'+(funderOf(o) ? esc(funderOf(o)) : '<span class="muted">غير ممولة</span>')+'</td></tr>';
      }).join('')+'</tbody></table>';

      '<button class="btn btn-default"'+A('closeModal')+'>'+(m.fromSelect && free.length ? 'ده بس' : 'تمام')+'</button>';
    return modalShell('الحالة ليها طرف تاني', body, foot);
  }
  if (m.kind==='note'){
    var nIds = m.ids, one = nIds.length===1 ? caseById(nIds[0]) : null;
    return modalShell(one ? 'ملاحظة على ' + esc(one.name) : 'ملاحظة على ' + nIds.length + ' حالة',

      '<textarea class="form-control" rows="4" data-k="note-text" data-input="setNoteText" placeholder="اكتب الملاحظة">'+esc(m.text)+'</textarea>'+
      '<div class="ops-opt"><label style="margin:0;display:inline-flex;gap:6px;align-items:center;cursor:pointer;"><input type="checkbox"'+(m.toOps?' checked':'')+A('toggleNoteOps')+'/> ابعتها للأوبريشن</label>'+

function parseDay(v){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function addMonths(d, n){ var x = new Date(d.getTime()); x.setMonth(x.getMonth()+n); return x; }
function fmtDay(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
// eligibility shown before "أضف"
function ncResult(nc){
  var out = [], today = (function(){ var n = typeof nowDate==='function' ? nowDate() : new Date(); n = new Date(n.getTime()); n.setHours(0,0,0,0); return n; })();
  if (nc.level && UNSUPPORTED_LEVELS.indexOf(nc.level)!==-1) out.push({k:'stage', t:'مؤجل لمرحلة أخرى', d:'مستوى البتر ده ('+nc.level+') مش بنشتغل فيه حاليًا'});
  var ls = parseDay(nc.lastSurgery);
  if (ls && addMonths(ls, 6) > today) out.push({k:'6m', t:'مؤجل لإتمام 6 شهور', d:'آخر جراحة '+nc.lastSurgery+' – تكمل 6 شهور يوم '+fmtDay(addMonths(ls, 6)), until:fmtDay(addMonths(ls, 6))});
  var dob = parseDay(nc.dob);
  if (dob && addMonths(dob, 60) > today) out.push({k:'age', t:'مؤجل بسبب العمر', d:'الحالة أقل من 5 سنين – تكمل 5 سنين يوم '+fmtDay(addMonths(dob, 60)), until:fmtDay(addMonths(dob, 60))});
  var w = parseInt(nc.weight,10);
  if (w > 120) out.push({k:'weight', t:'مؤجل بسبب الوزن', d:'الوزن '+w+' كيلو (أكتر من 120)'});
  if (out.length) return {ok:false, list:out};
  if (!nc.level || !ls || !dob || !nc.weight) return {ok:null, list:[]};
  return {ok:true, list:[{k:'ok', t:'مقبول الشروط', d:''}]};
}

}
function ncMissing(nc){

  return miss;
}
function ncField(f, nc, act, pre){

  if (f[3]==='select' || f[3]==='gov' || f[3]==='level'){
    var list = f[3]==='gov' ? GOVERNORATES : f[3]==='level' ? LEVEL_OPTIONS.concat(UNSUPPORTED_LEVELS) : NC_OPTS[k];

// cleans the working draft; returns an error text or ''
function svfCheck(qs, forPublish){
  if (forPublish && !qs.length) return 'النموذج مفيهوش أسئلة';
  var ids = {};
  for (var i=0;i<qs.length;i++){
    var q = qs[i];
    q.text = (q.text||'').trim(); q.sec = (q.sec||'').trim();
    if (!q.text) return 'سؤال رقم ' + (i+1) + ' من غير نص';
    if (q.type==='single' || q.type==='multi'){
      q.options = (q.options||[]).map(function(o){ return (o||'').trim(); }).filter(Boolean);
      if (q.options.length < 2) return 'سؤال رقم ' + (i+1) + ' محتاج اختيارين على الأقل';
    } else delete q.options;
    if (q.alertOn && svqOpts(q).indexOf(q.alertOn)===-1) delete q.alertOn;
    if (q.cond){ var t = qs.filter(function(x){ return x.id===q.cond.q; })[0]; if (!t || !ids[t.id] || svqOpts(t).indexOf(q.cond.v)===-1) delete q.cond; }
    if (!q.sec) delete q.sec;
    ids[q.id] = true;
  }
  return '';
}
function svfGuard(){ if (!SVE.id || !svfCan(SVE.id)){ toast('مش مسموح لك تعدّل النموذج ده'); return false; } return true; }
var SVF_ACTIONS = {
  svfSel: function(id){ SVE.sel = id || null; render(); },
  svfSet: function(v, ab){
    if (!svfGuard()) return;
    var p = (ab||'').split('|'), q = svfQ(p[0]); if (!q) return;
    var k = p[1];
    if (k==='text' || k==='sec'){ q[k] = v; return; }
    if (k==='type'){ q.type = v; if ((v==='single' || v==='multi') && !(q.options && q.options.length)) q.options = ['',''];
      if (q.alertOn && svqOpts(q).indexOf(q.alertOn)===-1) delete q.alertOn; }
    else if (k==='visits'){ if (v) q.visits = v; else delete q.visits; }
    else if (k==='cond'){ if (v){ var i = v.indexOf('::'); q.cond = {q:v.slice(0, i), v:v.slice(i+2)}; } else delete q.cond; }
    else if (k==='alertOn'){ if (v) q.alertOn = v; else delete q.alertOn; }
    render();
  },
  svfReq: function(id){ if (!svfGuard()) return; var q = svfQ(id); if (q){ q.required = !q.required; render(); } },
  svfOpt: function(v, ab){ if (!svfGuard()) return; var p = (ab||'').split('|'), q = svfQ(p[0]); if (q && q.options) q.options[+p[1]] = v; },
  svfOptAdd: function(id){ if (!svfGuard()) return; var q = svfQ(id); if (!q) return; (q.options = q.options || []).push(''); render(); },
  svfOptDel: function(id, j){ if (!svfGuard()) return; var q = svfQ(id); if (!q || !q.options) return; var o = q.options.splice(+j, 1)[0]; if (q.alertOn===o) delete q.alertOn; render(); },
  svfAdd: function(){ if (!svfGuard()) return; var last = SVE.work[SVE.work.length-1], q = {id:svfNewId(), text:'', type:'yesno', required:true}; if (last && last.sec) q.sec = last.sec; SVE.work.push(q); SVE.sel = q.id; render(); },
  svfDup: function(id){ if (!svfGuard()) return; var i = SVE.work.indexOf(svfQ(id)); if (i===-1) return; var q = svClone(SVE.work[i]); q.id = svfNewId(); delete q.alertOn; SVE.work.splice(i+1, 0, q); SVE.sel = q.id; render(); },
  svfDel: function(id){ if (!svfGuard()) return; SVE.work = SVE.work.filter(function(q){ return q.id!==id; }); SVE.work.forEach(function(q){ if (q.cond && q.cond.q===id) delete q.cond; }); SVE.sel = null; render(); },
  svfMove: function(id, d){ if (!svfGuard()) return; var i = SVE.work.indexOf(svfQ(id)), j = i + parseInt(d,10); if (i===-1 || j<0 || j>=SVE.work.length) return; var t = SVE.work[i]; SVE.work[i] = SVE.work[j]; SVE.work[j] = t; render(); },
  svfName: function(v){ if (svfGuard()) SVE.name = v; },
  svfCompany: function(v){ if (!svfGuard()) return; SVE.company = v; render(); },
  svfStatus: function(k){ if (!svfGuard()) return; var i = SVE.statuses.indexOf(k); if (i===-1) SVE.statuses.push(k); else SVE.statuses.splice(i, 1); render(); },
  svfPreview: function(){ SVE.preview = SVE.preview ? null : {answers:{}, notes:{}, type:'newDelivery', miss:false}; render(); },
  svfPvType: function(t){ if (SVE.preview){ SVE.preview.type = t; render(); } },
  svfPvA: function(qid, v){ var pv = SVE.preview; if (!pv) return; var r = {qs:SVE.work, answers:pv.answers}; svSetAnswer(r, qid, v); render(); },
  svfPvT: function(v, qid){ if (SVE.preview) SVE.preview.answers[qid] = v; },
  svfPvN: function(v, sec){ if (SVE.preview) SVE.preview.notes[sec] = v; },
  svfPvCheck: function(){ var pv = SVE.preview; if (!pv) return; pv.miss = true; var m = svMissing({qs:SVE.work, answers:pv.answers}, pv.type); toast(m.length ? 'فاضل ' + m.length + ' سؤال إلزامي' : 'كل الأسئلة الإلزامية متجاوبة'); render(); },
  svfSave: function(silent){
    if (!svfGuard()) return false;
    var err = svfCheck(SVE.work, false); if (err){ toast(err); render(); return false; }
    loadSurveyForms(); var f = svfById(SVE.id); if (!f) return false;
    f.draft = svClone(SVE.work); f.name = SVE.id==='base' ? f.name : SVE.name.trim(); f.company = SVE.id==='base' || f.kind==='follow' ? '' : SVE.company;
    if (f.kind==='follow') f.statuses = SVE.statuses.slice();
    f.savedAt = Date.now(); f.savedBy = svfUser(); SVE.name = f.name;
    saveSurveyForms(); if (silent!==true){ toast('اتحفظت المسودة'); render(); }
    return true;
  },
  svfPublish: function(){
    if (!svfGuard()) return;
    if (SVE.id!=='base' && !SVE.name.trim()){ toast('اكتب اسم النموذج'); return render(); }
    var isF = svfIsFollow(SVE.id);
    if (SVE.id!=='base' && !isF && !SVE.company){ toast('اختار شركة التمويل'); return render(); }
    if (isF && !SVE.statuses.length){ toast('اختار حالة الطلب اللي النموذج يظهر معاها'); return render(); }
    var err = svfCheck(SVE.work, true); if (err){ toast(err); return render(); }
    if (!ACT.svfSave(true)) return;
    var f = svfById(SVE.id), p = svfPublished(f);
    if (p && !svfDirty(f)){ toast('مفيش تعديلات من آخر نشر'); return render(); }
    f.versions = f.versions || [];
    var ver = {v:f.versions.length + 1, at:Date.now(), by:svfUser(), name:f.name, company:f.company||'', qs:svClone(f.draft)};
    if (f.kind==='follow') ver.statuses = (f.statuses||[]).slice();
    f.versions.push(ver);
    saveSurveyForms(); SVE.preview = null; SVE.sel = null;
    toast('اتنشر الإصدار ' + f.versions.length + ' – بيتطبق على الاستبيانات الجديدة'); render();
  },
};
Object.assign(ACT, SVF_ACTIONS);
window.addEventListener('storage', function(e){ if (e.key===SVF_KEY){ loadSurveyForms(); render(); } });
loadSurveyForms();
/*__PF_END__*/
var PF_HOOKS = {
  base: function(id){ return {d:null, c:caseById(id)}; },
  who: function(){ return CSR_USER; },
  visits: function(){ return {meas:{day:'-', att:'-'}, deliv:{day:'-', att:'-'}}; },
  // what the funding page and the operations room recorded about the case
  events: function(id){
    var out = [], st = F.store || {};
    var a = (st.alloc||{})[id]; if (a) out.push({at:a.at, kind:'fund', title:'تمويل – ' + a.company, sub:'', by:a.by || ''});
    var hd = (st.holds||{})[id]; if (hd) out.push({at:hd.at, kind:'fund', title:'إيقاف', sub:[hd.until ? 'لحد ' + pfWhen(hd.until) : 'مفتوح', hd.note].filter(Boolean).join(' · '), by:hd.by || ''});
    ((st.notes||{})[id] || []).forEach(function(n){ out.push({at:n.at, kind:'note', title:n.toOps ? 'ملاحظة – اتبعتت للأوبريشن' : 'ملاحظة', sub:n.text, by:n.by}); });
    (st.released||{})[id] && out.push({at:st.released[id].at || 0, kind:'fund', title:'اتبعتت للحجز', sub:'', by:st.released[id].by || ''});
    Object.keys(F.surveys||{}).forEach(function(k){ var r = F.surveys[k]; if (r.cid===id && r.at) out.push({at:r.at, kind:'survey', title:'استبيان جودة الخدمة – ' + TASK_TYPES[r.type].label, sub:svRecForms(r).map(function(f){ return f.name; }).join('، '), by:r.by}); });
    return out;
  },
  afterSave: function(){ applyProfiles(); },
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type!=='checkbox')) return;
  var fn = ACT[el.getAttribute('data-act')]; if (!fn) return;
  if (el.getAttribute('data-act')!=='closeModalBg') e.stopPropagation();
  fn(el.getAttribute('data-a'), el.getAttribute('data-b'), null, e);
});
document.addEventListener('input', function(e){
  var el = e.target, act = el.getAttribute && el.getAttribute('data-input'); if (!act) return;
  ACT[act](el.value, el.getAttribute('data-a'));
});
document.addEventListener('change', function(e){
  var el = e.target, act = el.getAttribute && el.getAttribute('data-change'); if (!act) return;
  ACT[act](el.value, el.getAttribute('data-a'));
});
document.addEventListener('keydown', function(e){
  if (e.key!=='Escape') return;
  if (PROFILES.open){ ACT.closeProfile(); } else if (F.modal){ F.modal = null; render(); } else if (F.sel.length){ F.sel = []; render(); }
});
window.addEventListener('storage', function(e){ if (e.key===FUND_KEY || e.key===SURVEY_KEY){ loadStores(); render(); } });

loadStores();
loadProfiles(); applyProfiles();
root = document.getElementById('root');
render();
</script>
</body>
</html>
