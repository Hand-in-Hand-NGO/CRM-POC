<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحة التمويل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-rtl/3.4.0/css/bootstrap-rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap">
  <style>
/* =====================================================================
   HandinHand CMS theme — font, palette and recurring components.
   Paste into the page <style> after bootstrap + bootstrap-rtl.
   Font link: https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap
   ===================================================================== */
:root {
    --live-font: 'Droid Arabic Kufi', 'Noto Kufi Arabic', Tahoma, Arial, sans-serif;

    --hih-header-gradient: linear-gradient(90deg, #d3f1f8 0%, #ebf6ed 17%, #fff9e4 34%, #f9e7de 47%, #f8f2e4 57%, #d9eaf4 64%, #e9efec 74%, #baeae6 100%);
    --hih-header-text: #535252;
    --hih-sidebar: #222d32;
    --hih-sidebar-active: #1e282c;
    --hih-sidebar-text: #b8c7ce;

    --hih-primary: #0093e9;
    --hih-success: #31c860;
    --hih-success-hover: #2db457;
    --hih-danger: #f96a74;
    --hih-warning: #ff6a00;
    --hih-focus: #67b9ec;

    --hih-default-bg: #f4f4f4;
    --hih-default-border: #ddd;
    --hih-default-text: #444;
    --hih-input-border: #d2d6de;

    --hih-toggle-all: #b7b7b7;
    --hih-toggle-on: #5bb75b;
    --hih-toggle-off: #da4f49;

    --hih-box-bg: #f6f6f6;
    --hih-box-border: #d7dbe0;

    --hih-chip-bg: #e6f1fb;
    --hih-picker-head: #d9e8f7;
    --hih-picker-odd: #c3e0f9;
    --hih-picker-even: #ffbec2;

    --hih-row-new: #d9edf7;
    --hih-row-new-hover: #becfd8;
    --hih-row-new-key: #e8f1ff;
    --hih-row-maint: #f2dede;
    --hih-row-maint-hover: #dbc6c6;
    --hih-row-maint-key: #fbe8e8;
    --hih-row-hover: #f96a741f;

    --hih-stats-head: #e9eef3;
    --hih-stats-border: #e3e6ea;
    --hih-stats-alt: #f7f9fb;
    --hih-stats-target: #fdf6df;
    --hih-stats-percent: #dff0d8;
    --hih-stats-percent-alt: #d3eacb;

    /* dashboard (cards / charts) */
    --vs-bg: #f5f6f8;
    --vs-bg-raised: #fff;
    --vs-surface: #fff;
    --vs-surface-2: #eef0f3;
    --vs-border: #e2e5ea;
    --vs-border-soft: #ececf0;
    --vs-text: #1a1d23;
    --vs-text-dim: #62697a;
    --vs-text-faint: #97a0ad;
    --vs-accent: #2f6fed;
    --vs-accent-hover: #2559c9;
    --vs-green: #15803d;
    --vs-radius-sm: 6px;
    --vs-radius: 10px;
    --vs-font-ui: var(--live-font);
    --vs-font-mono: var(--live-font);
    --vs-chart-axis: #6b7280;
    --vs-chart-grid: #d6d9df;
}

/* ---------- font ---------- */
body, h1, h2, h3, h4, h5, h6, .h1, .h2, .h3, .h4, .h5, .h6,
.tooltip, .popover, .daterangepicker, .select2-container, .select2-dropdown,
input, select, textarea, button { font-family: var(--live-font); }
body { direction: rtl; text-align: right; }

/* ---------- header / panels ---------- */
.main-header, .main-header .navbar, .main-header .logo,
.panel-primary > .panel-heading, .modal-header {
    background: var(--hih-header-gradient) !important;
    color: var(--hih-header-text) !important;
    border-color: var(--hih-box-border);
}
.main-header a, .main-header .navbar .nav > li > a, .modal-title { color: var(--hih-header-text) !important; }
.main-sidebar { background: var(--hih-sidebar); }
.main-sidebar .sidebar-menu > li > a { color: var(--hih-sidebar-text); }
.main-sidebar .sidebar-menu > li:hover > a, .main-sidebar .sidebar-menu > li.active > a { background: var(--hih-sidebar-active); color: #fff; }

.box-content { background: var(--hih-box-bg); border: 1px solid var(--hih-box-border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }

/* ---------- form controls ---------- */
.form-control { border-color: var(--hih-input-border); border-radius: 0; box-shadow: none; }
.form-control:focus { border-color: var(--hih-focus); box-shadow: none; }
label { font-weight: bold; }
.select2-container--default .select2-results__option--highlighted[aria-selected] { background: var(--hih-focus); }

/* ---------- buttons ---------- */
.btn-action, .filter-inline .btn { border-radius: 10px !important; }
.btn-primary { background: var(--hih-primary); border-color: var(--hih-primary); }
.btn-success { background: var(--hih-success); border-color: var(--hih-success-hover); }
.btn-success:hover, .btn-success:focus { background: var(--hih-success-hover); border-color: var(--hih-success-hover); }
.btn-danger { background: var(--hih-danger); border-color: var(--hih-danger); }
.btn-warning { background: var(--hih-warning); border-color: var(--hih-warning); }
.btn-default { background: var(--hih-default-bg); border-color: var(--hih-default-border); color: var(--hih-default-text); }

/* filter with its buttons directly beside it */
.filter-inline { display: flex; align-items: center; gap: 4px; }
.filter-inline > .form-control, .filter-inline > .select2-container { flex: 1 1 auto; min-width: 0; }

/* ---------- toggle groups (الكل / نعم / لا) ---------- */
.btn-group-justified .btn.active.toggle-all { background: var(--hih-toggle-all); color: #fff; }
.btn-group-justified .btn.active.toggle-on  { background: var(--hih-toggle-on);  color: #fff; }
.btn-group-justified .btn.active.toggle-off { background: var(--hih-toggle-off); color: #fff; }

/* ---------- chips + picker table ---------- */
.chip { display: inline-block; background: var(--hih-chip-bg); color: var(--hih-primary); border: 1px solid var(--hih-primary); border-radius: 15px; padding: 0 8px; margin: 1px 2px; font-size: 12px; }
.picker-table { width: 100%; border-collapse: collapse; }
.picker-table th { background: var(--hih-picker-head); text-align: center; }
.picker-table td, .picker-table th { border: 1px solid #ccc; padding: 4px 6px; cursor: pointer; }
.picker-table td.selected:nth-child(odd)  { background: var(--hih-picker-odd); }
.picker-table td.selected:nth-child(even) { background: var(--hih-picker-even); }

/* ---------- data table ---------- */
.table > thead > tr > th { text-align: center; white-space: nowrap; vertical-align: middle; }
.table > tbody > tr > td { text-align: center; vertical-align: middle; }
.table tbody tr:hover { background: var(--hih-row-hover); }
.table tbody tr.row-new   > td { background: var(--hih-row-new); }
.table tbody tr.row-new:hover > td { background: var(--hih-row-new-hover); }
.table tbody tr.row-new   > td.key { background: var(--hih-row-new-key); }
.table tbody tr.row-maint > td { background: var(--hih-row-maint); }
.table tbody tr.row-maint:hover > td { background: var(--hih-row-maint-hover); }
.table tbody tr.row-maint > td.key { background: var(--hih-row-maint-key); }
.info-label { color: gray; }
.table-scroll { overflow-x: auto; }   /* only the table scrolls; toolbar + pager stay fixed */

/* ---------- value + 🔍 + نسخ ---------- */

.case-value .case-text {
    margin-left: 3px;
}

.case-value .btn-xs {
    padding: 0 5px;
    font-size: 11px;
    line-height: 18px;
    border-radius: 3px !important;
}

.case-value .case-search {
    background: #fff;
    border-color: #ccc;
    color: #333;
}

.case-value .case-copy.copied {
    background-color: #31c860;
    border-color: #2db457;
}

/* ---------- side stats table ---------- */
.stats-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0;
}

.stats-table th,
.stats-table td {
    border: 1px solid #e3e6ea;
    padding: 4px 6px;
    text-align: center;
    vertical-align: middle;
}

.stats-table thead th {
    background: #e9eef3;
    color: #333;
    font-size: 11px;
    padding: 4px 3px;
    white-space: nowrap;
}

.stats-table td.stats-label {
    text-align: right;
    font-weight: bold;
    color: #333;
    white-space: normal;
    line-height: 1.3;
}

.stats-table td.stats-label small {
    display: block;
    font-weight: normal;
    color: #999;
    font-size: 10px;
    text-align: left;
}

.stats-table td.stats-num {
    font-weight: bold;
    color: #222;
    width: 56px;
    padding: 4px 3px;
}

.stats-table tr.row-period:nth-child(even) td {
    background: #f7f9fb;
}

.stats-table tr.row-target td {
    background: #fdf6df;
}

.stats-table tr.row-percent td {
    background: #dff0d8;
}

.stats-table tr.row-percent:nth-child(even) td {
    background: #d3eacb;
}


/* ---------- dashboard building blocks ---------- */
/* ---- chart-drawer building blocks ---- */
.vs-dash-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 16px; flex-wrap: wrap; gap: 10px; }
.vs-period-tabs { display: inline-flex; background: var(--vs-bg); border: 1px solid var(--vs-border); border-radius: var(--vs-radius-sm); padding: 3px; gap: 2px; flex-wrap: wrap; }
.vs-period-tabs button {
    border: none; background: none; color: var(--vs-text-dim); padding: 7px 14px; border-radius: 5px;
    font-size: 12.5px; cursor: pointer; font-family: inherit; font-weight: 600; transition: background .15s, color .15s;
}
.vs-period-tabs button:hover { color: var(--vs-text); }
.vs-period-tabs button.active { background: var(--vs-accent); color: #fff; }
.vs-period-range { font-size: 11.5px; color: var(--vs-text-faint); font-family: var(--vs-font-mono); }

.vs-kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
.vs-kpi { background: var(--vs-bg); border: 1px solid var(--vs-border); border-radius: var(--vs-radius); padding: 12px 10px; display: flex; flex-direction: column; gap: 5px; }
.vs-kpi .num { font-family: var(--vs-font-mono); font-size: 20px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.vs-kpi .lbl { font-size: 11px; color: var(--vs-text-dim); }
.vs-kpi.zero .num { color: var(--vs-text-faint); }

.vs-group-label { font-size: 11px; font-weight: 700; color: var(--vs-text-faint); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 10px; }
.vs-chart-group { margin-bottom: 22px; }
.vs-chart-group:last-child { margin-bottom: 0; }
.vs-chart-row-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.vs-chart-card { background: var(--vs-surface); border: 1px solid var(--vs-border); border-radius: var(--vs-radius); padding: 16px; }
.vs-chart-card-head { margin-bottom: 10px; }
.vs-chart-card-head h4 { margin: 0; font-size: 13.5px; font-weight: 700; }
.vs-chart-card-head p.sub { margin: 3px 0 0; font-size: 11.5px; color: var(--vs-text-dim); }

.vs-target-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.vs-target-card { background: var(--vs-bg); border: 1px solid var(--vs-border); border-radius: var(--vs-radius); padding: 12px; }
.vs-target-card .name { font-size: 12px; font-weight: 700; color: var(--vs-text); margin-bottom: 8px; }
.vs-target-card .row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px; font-size: 11.5px; color: var(--vs-text-dim); }
.vs-target-card .row b { font-family: var(--vs-font-mono); color: var(--vs-text); font-size: 12.5px; font-weight: 700; }
.vs-bar-track { height: 7px; border-radius: 999px; background: var(--vs-surface-2); overflow: hidden; margin: 7px 0 5px; }
.vs-bar-fill { height: 100%; border-radius: 999px; background: var(--vs-accent); transition: width .4s ease; }
.vs-bar-fill.ok { background: var(--vs-green); }
.vs-pct-badge { font-family: var(--vs-font-mono); font-size: 12.5px; font-weight: 700; }
.vs-pct-badge.ok { color: var(--vs-green); }
.vs-pct-badge.warn { color: var(--vs-accent); }
.vs-no-target { color: var(--vs-text-faint); font-size: 12px; text-align: center; padding: 30px 10px; }
.vs-chart-empty { display: flex; align-items: center; justify-content: center; height: 180px; color: var(--vs-text-faint); font-size: 12.5px; }

.vs-tooltip { background: var(--vs-bg-raised); border: 1px solid var(--vs-border); border-radius: var(--vs-radius-sm); padding: 8px 10px; box-shadow: 0 4px 14px rgba(0,0,0,.1); font-size: 12px; direction: rtl; font-family: var(--vs-font-ui); }
.vs-tooltip .t-label { font-weight: 700; margin-bottom: 4px; }
.vs-tooltip .t-row { display: flex; align-items: center; gap: 6px; }
.vs-tooltip .t-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.stats-panel .recharts-wrapper { direction: ltr; }

@media (min-width: 560px) {
    .vs-chart-row-2 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 700px) {
    .vs-kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .vs-target-grid { grid-template-columns: 1fr; }
}

.stats-refresh.spinning i { animation: fa-spin .8s linear infinite; }
.recharts-wrapper { direction: ltr; }   /* charts draw LTR; tooltips stay RTL */


    /* ---------- shell ---------- */
    html, body { background: #ecf0f5; font-size: 13px; color: #333; }
    .main-header { position: fixed; top: 0; right: 0; left: 0; height: 56px; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 0 66px 0 18px; border-bottom: 1px solid var(--hih-box-border); }
    .page-title { display: flex; align-items: center; gap: 10px; color: var(--hih-header-text); }
    .page-title .ttl-ic { width: 34px; height: 34px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; color: var(--hih-primary); font-size: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .page-title b { display: block; font-size: 16px; line-height: 1.3; }
    .page-title small { display: block; font-size: 11px; color: #7b7b7b; }
    .hdr-user { margin-right: auto; color: var(--hih-header-text); font-size: 12.5px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.65); border-radius: 20px; padding: 4px 6px 4px 12px; }
    .hdr-user .av { width: 26px; height: 26px; border-radius: 50%; background: var(--hih-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .main-sidebar { position: fixed; top: 0; bottom: 0; right: 0; width: 50px; z-index: 31; display: flex; flex-direction: column; padding-top: 56px; }
    .main-sidebar .logo { position: absolute; top: 0; right: 0; width: 50px; height: 56px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; background: var(--hih-sidebar-active); }
    .main-sidebar a { display: flex; align-items: center; justify-content: center; height: 46px; color: var(--hih-sidebar-text); font-size: 17px; text-decoration: none; }
    .main-sidebar a:hover, .main-sidebar a.active { background: var(--hih-sidebar-active); color: #fff; border-right: 3px solid var(--hih-primary); }
    .content { margin: 56px 50px 0 0; padding: 16px 18px 90px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
    .side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; padding-bottom: 4px; }

    /* ---------- cards ---------- */
    .card { background: #fff; border: 1px solid var(--hih-box-border); border-radius: 10px; }
    .card-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #edf0f3; font-weight: 700; font-size: 13px; color: #333; }
    .card-head .fa { color: var(--hih-primary); }
    .card-head .cnt { background: #eef2f6; color: #555; border-radius: 10px; padding: 0 8px; font-size: 11px; }
    .card-head .sp { flex: 1; }
    .card-body { padding: 12px 14px; }
    .muted { color: #999; }
    .empty { text-align: center; color: #999; padding: 22px 10px; font-size: 12.5px; }
    .empty .fa { display: block; font-size: 22px; color: #c9d1da; margin-bottom: 6px; }

    /* ---------- KPIs ---------- */
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .kpi { background: #fff; border: 1px solid var(--hih-box-border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: right; font: inherit; transition: border-color .15s, box-shadow .15s; }
    .kpi:hover { border-color: var(--k); }
    .kpi.on { border-color: var(--k); box-shadow: 0 0 0 2px color-mix(in srgb, var(--k) 25%, transparent); }
    .kpi .k-ic { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--k); background: color-mix(in srgb, var(--k) 12%, #fff); flex-shrink: 0; }
    .kpi b { display: block; font-size: 21px; line-height: 1.2; color: #222; font-variant-numeric: tabular-nums; }
    .kpi span { display: block; font-size: 11.5px; color: #777; }

    /* ---------- filters ---------- */
    .store-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .store-tabs button { border: 1px solid var(--hih-default-border); background: var(--hih-default-bg); color: #444; border-radius: 10px; padding: 6px 14px; font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    .store-tabs button .n { background: rgba(0,0,0,.07); border-radius: 10px; padding: 0 7px; font-size: 11px; }
    .store-tabs button.on.t-all { background: var(--hih-toggle-all); border-color: var(--hih-toggle-all); color: #fff; }
    .store-tabs button.on.t-new { background: var(--hih-primary); border-color: var(--hih-primary); color: #fff; }
    .store-tabs button.on.t-maint { background: var(--hih-danger); border-color: var(--hih-danger); color: #fff; }
    .store-tabs button.on .n { background: rgba(255,255,255,.25); }
    .filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin-top: 12px; }
    .filters .fg label { display: block; font-size: 11.5px; font-weight: 700; color: #666; margin-bottom: 4px; }
    .filters .form-control { height: 32px; padding: 4px 8px; font-size: 12.5px; }
    .search-box { position: relative; }
    .search-box .fa { position: absolute; right: 10px; top: 9px; color: #aaa; }
    .search-box input { padding-right: 30px !important; width: 250px; }
    .w-sel { width: 150px; }
    .chip-toggle { display: inline-flex; align-items: center; gap: 6px; height: 32px; border: 1px dashed #c7ced6; border-radius: 16px; padding: 0 12px; cursor: pointer; font-size: 12px; color: #555; background: #fff; }
    .chip-toggle.on { border-style: solid; border-color: #f0a24a; background: #fff4e5; color: #b45309; font-weight: 700; }
    .btn-r { border-radius: 10px !important; }
    .btn-r .fa { margin-left: 5px; }
    .active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .af { display: inline-flex; align-items: center; gap: 6px; background: var(--hih-chip-bg); color: #0b6db0; border: 1px solid #b9dcf5; border-radius: 15px; padding: 1px 4px 1px 10px; font-size: 11.5px; }
    .af button { border: 0; background: rgba(0,147,233,.12); color: #0b6db0; width: 18px; height: 18px; border-radius: 50%; line-height: 16px; padding: 0; cursor: pointer; font-size: 12px; }

    /* ---------- table ---------- */
    .list-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid #edf0f3; }
    .state-tabs { display: flex; gap: 2px; background: #f1f3f6; border-radius: 10px; padding: 3px; }
    .state-tabs button { border: 0; background: transparent; border-radius: 8px; padding: 5px 12px; font: inherit; font-size: 12px; color: #555; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
    .state-tabs button .n { font-size: 11px; color: #888; }
    .state-tabs button.on { background: #fff; color: #222; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    .state-tabs button.on .n { color: var(--hih-primary); }
    .list-head .sp { flex: 1; }
    .list-head .count { color: #777; font-size: 12px; }
    .list-head .count b { color: #222; }
    .table-scroll { overflow: auto; max-height: calc(100vh - 330px); min-height: 220px; }
    .ftable { width: 100%; border-collapse: separate; border-spacing: 0; }
    .ftable thead th { position: sticky; top: 0; z-index: 2; background: #f7f9fb; color: #666; font-size: 11.5px; font-weight: 700; padding: 9px 10px; border-bottom: 1px solid #e3e6ea; white-space: nowrap; text-align: right; }
    .ftable thead th.sortable { cursor: pointer; }
    .ftable thead th.sortable:hover { color: var(--hih-primary); }
    .ftable thead th .fa { margin-right: 3px; color: #b5bec8; }
    .ftable thead th.sorted .fa { color: var(--hih-primary); }
    .ftable tbody td { padding: 9px 10px; border-bottom: 1px solid #eef1f4; font-size: 12.5px; vertical-align: middle; white-space: nowrap; }
    .ftable tbody tr { transition: background .1s; }

// =====================================================================
// Funding store (shared with the operations room through localStorage)
// =====================================================================
var FUND_KEY = 'hih_funding_v1', FUND_OPS_KEY = 'hih_funding_ops_v1', OPS_HOLD_KEY = 'hih_ops_holds_v1';
var CSR_USER = 'موظف CSR';
var BASE_COMPANIES = FUNDING_OPTIONS.filter(function(x){ return x!=='بدون'; });
function readStore(k, def){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function writeStore(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }

function emptyFilters(){ return {q:'', gov:'', level:'', stage:'', fund:'free', company:'', multi:false, plan:''}; }
var F = {
  store: null, ops: {}, opsHolds: {},
  company: '', newCompany: '', planCo: {},
  filters: emptyFilters(),
  sort: 'waitDesc', sel: [], modal: null, toast: null,
};
function loadStores(){
  F.store = readStore(FUND_KEY, null) || {companies:[], alloc:{}, batches:[]};
  F.store.alloc = F.store.alloc || {}; F.store.batches = F.store.batches || []; F.store.companies = F.store.companies || [];
  F.store.holds = F.store.holds || {}; F.store.plans = F.store.plans || [];
  F.ops = readStore(FUND_OPS_KEY, {}) || {};
  F.opsHolds = readStore(OPS_HOLD_KEY, {}) || {};
}
function saveStore(){ return writeStore(FUND_KEY, F.store); }
function companies(){ return BASE_COMPANIES.concat(F.store.companies.filter(function(c){ return BASE_COMPANIES.indexOf(c)===-1; })); }

// the funding page works on the two stores only
var STORES = {newDelivery:'مخزن الأطراف', maintDelivery:'مخزن أطراف الصيانة'};
function inStores(c){ return !!STORES[c.stage]; }
function allocOf(c){ return F.store.alloc[c.id] || null; }
function funderOf(c){ var a = allocOf(c); return a ? a.company : (c.funding!=='بدون' ? c.funding : ''); }
function isFunded(c){ return !!funderOf(c); }
// a case held in a funding plan: operations can't put it in a booking task until the plan is sent or released
function holdOf(c){ return F.store.holds[c.id] || null; }
// a case operations put on hold (missing papers, medical review…) – not available for funding either
function opsHoldOf(c){ return F.opsHolds[c.id] || null; }
function planById(id){ for (var i=0;i<F.store.plans.length;i++){ if (F.store.plans[i].id===id) return F.store.plans[i]; } return null; }
function planCases(id){ return Object.keys(F.store.holds).filter(function(cid){ return F.store.holds[cid].plan===id; }).map(caseById).filter(Boolean); }
// already in an operations task (scheduled / booked / attended)
function inTask(c){ var o = F.ops[c.id]; return !!(o && o.status && o.status!=='new'); }
function isMaint(c){ return TASK_TYPES[c.stage].order==='maintenance'; }
// one state per case, in this order
function stateOf(c){
  if (isFunded(c)) return 'funded';
  if (holdOf(c)) return 'held';
  if (opsHoldOf(c)) return 'ops';
  if (inTask(c)) return 'task';
  return 'free';
}
function isSelectable(c){ return inStores(c) && stateOf(c)==='free'; }

function opsInfo(c){
  var o = F.ops[c.id];
  if (!allocOf(c) && !(o && o.status && o.status!=='new')) return null;
  if (!o || o.status==='new') return {cls:'ops-wait', ic:'hourglass-half', txt:'مستني الأوبريشن يعمل مهمة الحجز', key:'new'};
  if (o.status==='scheduled') return {cls:'ops-sched', ic:'calendar', txt:'في مهمة حجز ' + o.day + (o.draft ? ' (مسودة)' : ''), key:'scheduled'};
  if (o.status==='booked') return {cls:'ops-booked', ic:'check-circle', txt:'اتحجز ' + o.day, key:'booked'};
  if (o.status==='attended') return {cls:'ops-booked', ic:'check-circle', txt:'حضر ' + o.day, key:'attended'};
  if (o.status==='noShow') return {cls:'ops-bad', ic:'times-circle', txt:'لم يحضر ' + o.day, key:'noShow'};
  return {cls:'muted', ic:'minus', txt:'-', key:o.status};
}

// Helpers
// =====================================================================
function A(act, a, b){ return ' data-act="'+act+'"' + (a!=null ? ' data-a="'+esc(a)+'"' : '') + (b!=null ? ' data-b="'+esc(b)+'"' : ''); }
function isoFromMs(ms){ var d = new Date(ms); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function timeFromMs(ms){ var d = new Date(ms), h = d.getHours(), m = d.getMinutes(); return (h%12||12)+':'+(m<10?'0':'')+m+' '+(h<12?'ص':'م'); }
var toastTimer = null;
function toast(msg){ F.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ F.toast = null; render(); }, 3500); }
function opts(list, cur, allLabel){ return '<option value="">'+(allLabel||'الكل')+'</option>' + list.map(function(o){ return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>'; }).join(''); }

// cases matching everything except the state tab (used for the tab counts)
function baseFiltered(skipStage){
  var f = F.filters, q = f.q.trim();
  return CASES.filter(function(c){
    if (!inStores(c)) return false;
    if (q && c.name.indexOf(q)===-1 && c.code.toUpperCase().indexOf(q.toUpperCase())===-1 && c.phone.indexOf(q)===-1) return false;
    if (f.gov && c.gov!==f.gov) return false;
    if (f.level && c.level!==f.level) return false;
    if (!skipStage && f.stage && c.stage!==f.stage) return false;
    if (f.plan && !(holdOf(c) && holdOf(c).plan===f.plan)) return false;
    if (f.company && funderOf(c)!==f.company) return false;
    if (f.multi && !otherLimbs(c).length) return false;
    return true;
  });
}
function matchState(c, fund){
  var s = stateOf(c);
  if (fund==='free') return s==='free';
  if (fund==='held') return s==='held';
  if (fund==='funded') return s==='funded';
  if (fund==='blocked') return s==='ops' || s==='task';
  return true;
}
function filtered(){
  var fund = F.filters.fund;
  var list = baseFiltered().filter(function(c){ return matchState(c, fund); });
  var s = F.sort;
  return list.sort(function(a,b){
    if (s==='waitAsc') return a.waitingDays-b.waitingDays;
    if (s==='ageAsc') return a.age-b.age;
    if (s==='ageDesc') return b.age-a.age;
    if (s==='gov') return a.gov.localeCompare(b.gov,'ar') || b.waitingDays-a.waitingDays;
    if (s==='person') return a.person.localeCompare(b.person) || a.id.localeCompare(b.id);
    return b.waitingDays-a.waitingDays;
  });
}

var root = null;
function render(){
  var ae = document.activeElement, k = ae && ae.getAttribute && ae.getAttribute('data-k'), ss = null, se = null;
  if (k){ try { ss = ae.selectionStart; se = ae.selectionEnd; } catch(e){} }
  var sc = root.querySelector('.table-scroll'), st = sc ? sc.scrollTop : 0;
  var sd = root.querySelector('.side'), sdt = sd ? sd.scrollTop : 0;
  root.innerHTML = renderApp();
  var sc2 = root.querySelector('.table-scroll'); if (sc2) sc2.scrollTop = st;
  var sd2 = root.querySelector('.side'); if (sd2) sd2.scrollTop = sdt;
  if (k){ var el = root.querySelector('[data-k="'+k+'"]'); if (el){ el.focus(); try { if (ss!=null) el.setSelectionRange(ss, se); } catch(e){} } }
}

  var waiting = Object.keys(F.store.alloc).map(caseById).filter(function(c){ var o = c && opsInfo(c); return o && o.key==='new'; }).length;
  var f = F.filters.fund;

  }

    k('free', n.free, 'متاحة للتمويل', 'inbox', '#31c860')+

    k('blocked', n.blocked, 'غير متاحة (في مهمة / موقوفة من الأوبريشن)', 'lock', '#64748b')+
    '</div>';
}

  function th(label, a, d){

  }
  h += '<div class="table-scroll"><table class="ftable"><thead><tr>'+
    '<th class="cb"><input type="checkbox" title="تحديد كل المتاح"'+(allOn?' checked':'')+(selectable.length?'':' disabled')+A('toggleAll')+'/></th>'+
    '<th>الحالة</th><th>المحافظة</th>'+th('السن','ageAsc','ageDesc')+'<th>الطرف</th><th>المخزن</th>'+th('مدة الانتظار','waitAsc','waitDesc')+'<th>حالة التمويل</th><th>غرفة العمليات</th><th></th>'+
    '</tr></thead><tbody>';
  var maxWait = 365;   // bar = share of a year
  list.forEach(function(c){
    var s = stateOf(c), on = sel.indexOf(c.id)!==-1, others = otherLimbs(c), a = allocOf(c), oi = opsInfo(c), hd = holdOf(c), pl = hd && planById(hd.plan), oh = opsHoldOf(c);
    var wc = c.waitingDays >= 180 ? 'w-hi' : c.waitingDays >= 90 ? 'w-md' : 'w-lo';
    var pill =
      s==='funded' ? '<span class="pill p-funded"><i class="fa fa-check"></i>'+esc(funderOf(c))+'</span>'+(a ? '<span class="pill-sub">'+isoFromMs(a.at)+'</span>' : '') :
      s==='held' ? '<span class="pill p-held"><i class="fa fa-pause"></i>'+esc(pl ? pl.name : 'خطة')+'</span><span class="pill-sub">موقوفة في خطة تمويل</span>' :
      s==='ops' ? '<span class="pill p-ops"><i class="fa fa-lock"></i>موقوفة من الأوبريشن</span><span class="pill-sub">'+esc(oh.reason)+'</span>' :
      s==='task' ? '<span class="pill p-task"><i class="fa fa-lock"></i>غير متاحة</span><span class="pill-sub">في مهمة حجز</span>' :
      '<span class="pill p-free"><i class="fa fa-circle" style="font-size:7px;"></i>متاحة</span>';
    var act = a ? '<button class="icon-btn danger" title="إلغاء التمويل"'+A('askUnfund', c.id)+'><i class="fa fa-undo"></i></button>'
      : hd ? '<button class="icon-btn" title="فك الإيقاف"'+A('releaseOne', c.id)+'><i class="fa fa-play"></i></button>' : '';
    h += '<tr class="'+(on?'sel':'')+(s!=='free' && s!=='held' && s!=='funded' ? ' dim' : '')+'">'+
      '<td class="cb"><input type="checkbox"'+(on?' checked':'')+(isSelectable(c)?'':' disabled')+A('toggleSel', c.id)+'/></td>'+
      '<td><div class="who"><b>'+esc(c.name)+'</b><div class="sub"><span class="code">'+c.code+'</span><span dir="ltr">'+fmtPhone(c.phone)+'</span>'+
        (others.length ? '<span class="limb-chip"'+A('showLimbs', c.id)+' title="الحالة ليها طرف تاني"><i class="fa fa-clone"></i> '+others.map(function(o){ return o.code; }).join('، ')+'</span>' : '')+'</div></div></td>'+
      '<td>'+esc(c.gov)+'</td><td>'+c.age+'</td><td>'+esc(c.level)+'</td>'+

  });
  h += '</tbody></table>';
  if (!list.length) h += '<div class="empty"><i class="fa fa-search"></i>لا توجد حالات مطابقة'+(F.filters.fund!=='all' ? ' – جرّب تبويب «الكل»' : '')+'</div>';

function renderStats(){
  var rows = companies().map(function(co){
    var r = {co:co, n:0, wait:0, sched:0, booked:0, att:0};
    Object.keys(F.store.alloc).forEach(function(cid){
      var a = F.store.alloc[cid], c = caseById(cid); if (!c || a.company!==co) return;
      r.n++; var oi = opsInfo(c);
      if (oi.key==='new') r.wait++; else if (oi.key==='scheduled') r.sched++; else if (oi.key==='booked') r.booked++; else if (oi.key==='attended') r.att++;
    });
    return r;
  }).filter(function(r){ return r.n; });
  var seg = [['wait','مستني الأوبريشن','#ff6a00'],['sched','في مهمة','#0093e9'],['booked','اتحجز','#31c860'],['att','حضر','#15803d']];
  var h = '<div class="card"><div class="card-head"><i class="fa fa-bar-chart"></i>متابعة التمويل</div><div class="card-body">';
  if (!rows.length) return h + '<div class="empty" style="padding:10px;"><i class="fa fa-line-chart"></i>لسه مفيش حالات اتمولت من الصفحة دي</div></div></div>';
  rows.forEach(function(r){
    h += '<div class="co-row"><b>'+esc(r.co)+'</b><span class="tot">'+r.n+' حالة</span>'+
      '<div class="co-bar">'+seg.map(function(s){ return r[s[0]] ? '<i style="width:'+(r[s[0]]/r.n*100)+'%;background:'+s[2]+';" title="'+s[1]+' '+r[s[0]]+'"></i>' : ''; }).join('')+'</div>'+
      '<div class="co-leg">'+seg.filter(function(s){ return r[s[0]]; }).map(function(s){ return '<span><i style="background:'+s[2]+';"></i>'+s[1]+' '+r[s[0]]+'</span>'; }).join('')+'</div></div>';
  });
  return h + '</div></div>';
}

    '<div class="modal-body">'+body+'</div><div class="modal-footer">'+foot+'</div></div></div></div>';

function limbTable(list){

function renderModal(){

      '<button class="btn btn-primary"'+A('addCompany')+(F.newCompany.trim() ? '' : ' disabled')+'><i class="fa fa-plus"></i> إضافة</button><button class="btn btn-default"'+A('closeModal')+'>إلغاء</button>');

      '<div class="form-group"><label>الخطة</label><select class="form-control" data-change="setHoldPlan">'+
        '<option value="">+ خطة جديدة</option>'+F.store.plans.map(function(p){ return '<option value="'+p.id+'"'+(m.plan===p.id?' selected':'')+'>'+esc(p.name)+' ('+planCases(p.id).length+')</option>'; }).join('')+'</select></div>'+
      (!m.plan ? '<div class="form-group"><label>اسم الخطة الجديدة</label><input class="form-control" data-k="plan-name" value="'+esc(m.name)+'" data-input="setHoldName" placeholder="مثال: خطة فودافون نوفمبر"/></div>' : '');
    return modalShell('إيقاف الحالات في خطة', hb, '<button class="btn btn-warning"'+A('confirmHold')+(m.plan || (m.name||'').trim() ? '' : ' disabled')+'><i class="fa fa-pause-circle"></i> إيقاف</button>'+
      '<button class="btn btn-default"'+A('closeModal')+'>إلغاء</button>');
  }
  if (m.kind==='releasePlan'){
    var rp = planById(m.plan);
    return modalShell('فك إيقاف الخطة', '<div>هيتفك إيقاف <b>'+planCases(m.plan).length+'</b> حالة في <b>'+esc(rp.name)+'</b> وترجع متاحة للأوبريشن، والخطة هتتمسح.</div>',
      '<button class="btn btn-danger"'+A('releasePlan', m.plan)+'><i class="fa fa-play-circle"></i> فك الإيقاف</button><button class="btn btn-default"'+A('closeModal')+'>رجوع</button>');
  }
  if (m.kind==='confirm'){
    var ids = (m.ids || F.sel).slice(), byStage = {}, co = m.company || F.company;
    ids.forEach(function(id){ var c = caseById(id); byStage[c.stage] = (byStage[c.stage]||0) + 1; });
    var missing = [];
    ids.forEach(function(id){ var c = caseById(id); otherLimbs(c).forEach(function(o){ if (isSelectable(o) && ids.indexOf(o.id)===-1) missing.push({c:c, o:o}); }); });
    var body = '<div class="note note-info"><i class="fa fa-paper-plane"></i><div>هيتسجل تمويل <b>'+ids.length+'</b> حالة بواسطة <b>'+esc(co)+'</b> ويظهروا في غرفة العمليات تحت «تمويل جديد» عشان الأوبريشن يعمل مهمة الحجز.</div></div>'+
      '<div class="sum-grid">'+Object.keys(byStage).map(function(k){ return '<div><b>'+byStage[k]+'</b><span class="store-lbl '+(k==='maintDelivery'?'st-maint':'st-new')+'"><i></i>'+(STORES[k]||TASK_TYPES[k].label)+'</span></div>'; }).join('')+'</div>'+
      (missing.length ? '<div class="note note-warn"><i class="fa fa-exclamation-triangle"></i><div>حالات ليها كود تاني مش متحدد:<ul style="margin:4px 0 0;padding-right:18px;">'+
        missing.map(function(x){ return '<li><b>'+esc(x.c.name)+'</b> – متحدد <span class="code">'+x.c.code+'</span> والكود التاني <span class="code">'+x.o.code+'</span> ('+esc(x.o.level)+')</li>'; }).join('')+'</ul></div></div>' : '');
    var foot = '<button class="btn btn-success"'+A('confirmFunding')+'><i class="fa fa-check"></i> تأكيد التمويل والإرسال</button>'+

      (oi && oi.key==='scheduled' ? '<div class="note note-warn" style="margin-top:10px;"><i class="fa fa-exclamation-triangle"></i><div>الحالة موجودة في مهمة حجز يوم '+F.ops[c2.id].day+' – الأوبريشن هيفضل شايفها في المهمة.</div></div>' : ''),
      '<button class="btn btn-danger"'+A('unfund', c2.id)+'><i class="fa fa-undo"></i> إلغاء التمويل</button><button class="btn btn-default"'+A('closeModal')+'>رجوع</button>');
  }
  return '';
}

// =====================================================================
// Actions
// =====================================================================
var ACT = {
  setCompany: function(v){
    if (v==='__new'){ F.newCompany = ''; F.modal = {kind:'company'}; return render(); }
    F.company = v; render();
  },
  setNewCompany: function(v){ F.newCompany = v; render(); },
  addCompany: function(){
    var n = F.newCompany.trim(); if (!n) return;
    if (companies().indexOf(n)===-1){ loadStores(); F.store.companies.push(n); saveStore(); }
    F.company = n; F.newCompany = ''; F.modal = null; toast('تمت إضافة ' + n); render();
  },
  setPlanCo: function(v, pid){
    if (v==='__new'){ F.modal = {kind:'company'}; return render(); }
    F.planCo[pid] = v; render();
  },
  setStage: function(v){ F.filters.stage = v; render(); },
  setFund: function(v){ F.filters.fund = v; render(); },
  setFilter: function(v, key){ F.filters[key] = v; render(); },
  clearOne: function(key){ F.filters[key] = key==='multi' ? false : ''; render(); },
  setSort: function(v){ F.sort = v; render(); },
  toggleMulti: function(){ F.filters.multi = !F.filters.multi; render(); },
  clearFilters: function(){ var fund = F.filters.fund, stage = F.filters.stage; F.filters = emptyFilters(); F.filters.fund = fund; F.filters.stage = stage; render(); },
  clearSel: function(){ F.sel = []; render(); },
  toggleAll: function(){
    var ids = filtered().filter(isSelectable).map(function(c){ return c.id; });
    var allOn = ids.length && ids.every(function(id){ return F.sel.indexOf(id)!==-1; });
    if (allOn) F.sel = F.sel.filter(function(id){ return ids.indexOf(id)===-1; });
    else ids.forEach(function(id){ if (F.sel.indexOf(id)===-1) F.sel.push(id); });
    render();
  },
  toggleSel: function(cid){
    var c = caseById(cid); if (!c || !isSelectable(c)) return;
    var i = F.sel.indexOf(cid);
    if (i!==-1){ F.sel.splice(i,1); return render(); }
    F.sel.push(cid);
    // same person has another code (another limb) -> tell the CSR
    if (otherLimbs(c).length) F.modal = {kind:'limb', cid:cid, fromSelect:true};
    render();
  },
  showLimbs: function(cid){ F.modal = {kind:'limb', cid:cid, fromSelect:false}; render(); },
  selectOthers: function(cid){
    otherLimbs(caseById(cid)).forEach(function(o){ if (isSelectable(o) && F.sel.indexOf(o.id)===-1) F.sel.push(o.id); });
    F.modal = null; render();
  },
  openConfirm: function(){ if (!F.sel.length || !F.company) return; F.modal = {kind:'confirm', company:F.company}; render(); },
  confirmFunding: function(){
    loadStores();                                   // merge with anything saved from another tab
    var m = F.modal || {}, src = m.ids || F.sel, co = m.company || F.company;
    var ids = src.filter(function(id){ return !F.store.alloc[id]; }), at = Date.now(), batch = 'b' + at;
    ids.forEach(function(id){ F.store.alloc[id] = {company:co, at:at, by:CSR_USER, batch:batch}; delete F.store.holds[id]; });
    if (m.plan) F.store.plans = F.store.plans.filter(function(p){ return p.id!==m.plan; });   // plan sent -> done
    F.store.batches.push({id:batch, company:co, at:at, by:CSR_USER, ids:ids, plan: m.plan ? (planById(m.plan)||{}).name : null});
    if (!saveStore()){ toast('مقدرناش نحفظ – المتصفح مانع التخزين'); return render(); }
    if (!m.ids) F.sel = [];
    F.modal = null; F.filters.plan = '';
    toast('تم تمويل ' + ids.length + ' حالة بواسطة ' + co + ' واتبعتوا لغرفة العمليات');
    render();
  },
  openHold: function(){ if (!F.sel.length) return; F.modal = {kind:'hold', plan: F.store.plans.length ? F.store.plans[F.store.plans.length-1].id : '', name:''}; render(); },
  setHoldPlan: function(v){ F.modal.plan = v; render(); },
  setHoldName: function(v){ F.modal.name = v; render(); },
  confirmHold: function(){
    var m = F.modal; loadStores();
    var pid = m.plan, at = Date.now();
    if (!pid){ pid = 'p' + at; F.store.plans.push({id:pid, name:m.name.trim(), at:at, by:CSR_USER}); }
    var ids = F.sel.filter(function(id){ var c = caseById(id); return c && isSelectable(c); });
    ids.forEach(function(id){ F.store.holds[id] = {plan:pid, at:at, by:CSR_USER}; });
    if (!saveStore()){ toast('مقدرناش نحفظ – المتصفح مانع التخزين'); return render(); }
    F.sel = []; F.modal = null;
    toast('اتوقفت ' + ids.length + ' حالة في ' + planById(pid).name + ' – الأوبريشن والكول سنتر مش هيشتغلوا عليها');
    render();
  },
  showPlan: function(id){ F.filters.plan = id; F.filters.fund = 'held'; render(); },
  sendPlan: function(id){
    var co = F.planCo[id] || F.company;
    if (!co){ toast('اختار الشركة الممولة الأول'); return render(); }
    var ids = planCases(id).map(function(c){ return c.id; }); if (!ids.length) return;
    F.modal = {kind:'confirm', ids:ids, plan:id, company:co}; render();
  },
  askReleasePlan: function(id){ F.modal = {kind:'releasePlan', plan:id}; render(); },
  releasePlan: function(id){
    loadStores(); var n = 0;
    Object.keys(F.store.holds).forEach(function(cid){ if (F.store.holds[cid].plan===id){ delete F.store.holds[cid]; n++; } });
    F.store.plans = F.store.plans.filter(function(p){ return p.id!==id; });
    saveStore(); F.modal = null; if (F.filters.plan===id) F.filters.plan = '';
    toast('اتفك إيقاف ' + n + ' حالة ورجعت متاحة للأوبريشن'); render();
  },
  releaseOne: function(cid){
    loadStores(); var h = F.store.holds[cid]; if (!h) return;
    delete F.store.holds[cid];
    if (!planCases(h.plan).length) F.store.plans = F.store.plans.filter(function(p){ return p.id!==h.plan; });
    saveStore(); toast('اتفك إيقاف الحالة'); render();
  },
  askUnfund: function(cid){ F.modal = {kind:'unfund', cid:cid}; render(); },
  unfund: function(cid){
    loadStores(); delete F.store.alloc[cid]; saveStore();
    F.modal = null; toast('تم إلغاء التمويل'); render();
  },
  closeModal: function(){ F.modal = null; render(); },
  closeModalBg: function(v, a, b, e){ if (e && e.target.classList.contains('show-modal')){ F.modal = null; render(); } },
  exportCsv: function(){
    function q(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }
    var LBL = {free:'متاحة', held:'موقوفة في خطة', funded:'ممولة', ops:'موقوفة من الأوبريشن', task:'في مهمة حجز'};
    var rows = [['كود الحالة','الاسم','التليفون','المحافظة','السن','الطرف','المخزن','مدة الانتظار','الحالة','الشركة الممولة','غرفة العمليات'].map(q)];
    filtered().forEach(function(c){ var oi = opsInfo(c); rows.push([c.code, c.name, c.phone, c.gov, c.age, c.level, STORES[c.stage], c.waitingDays, LBL[stateOf(c)], funderOf(c)||'', oi ? oi.txt : ''].map(q)); });
    var blob = new Blob(['﻿' + rows.map(function(r){ return r.join(','); }).join('\r\n')], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'التمويل-' + isoFromMs(Date.now()) + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  },
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type!=='checkbox')) return;
  var fn = ACT[el.getAttribute('data-act')]; if (!fn) return;
  if (el.getAttribute('data-act')!=='closeModalBg') e.stopPropagation();
  fn(el.getAttribute('data-a'), el.getAttribute('data-b'), null, e);
});
document.addEventListener('input', function(e){
  var el = e.target, act = el.getAttribute && el.getAttribute('data-input'); if (!act) return;
  ACT[act](el.value, el.getAttribute('data-a'));
});
document.addEventListener('change', function(e){
  var el = e.target, act = el.getAttribute && el.getAttribute('data-change'); if (!act) return;
  ACT[act](el.value, el.getAttribute('data-a'));
});
document.addEventListener('keydown', function(e){
  if (e.key!=='Escape') return;
  if (F.modal){ F.modal = null; render(); } else if (F.sel.length){ F.sel = []; render(); }
});
// live updates from the operations room (another tab)
window.addEventListener('storage', function(e){
  if (e.key!==FUND_KEY && e.key!==FUND_OPS_KEY && e.key!==OPS_HOLD_KEY) return;
  loadStores();
  F.sel = F.sel.filter(function(id){ return isSelectable(caseById(id)); });
  render();
});

loadStores();
root = document.getElementById('root');
render();
</script>
</body>
</html>
