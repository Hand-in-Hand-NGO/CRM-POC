<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الزيارات</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-rtl/3.4.0/css/bootstrap-rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-daterangepicker/3.1/daterangepicker.min.css">

    <style>
        /* =========================================================
           Layout shell (header + right sidebar) — mirrors the CMS
           ========================================================= */
        body {
            background: #fff;
            font-size: 12px;
            color: #333;
            margin: 0;
        }

        .main-header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 36px;
            z-index: 1030;
            background: linear-gradient(90deg, rgba(211, 241, 248, 1) 0%, rgba(235, 246, 237, 1) 17%, rgba(255, 249, 228, 1) 34%, rgba(249, 231, 222, 1) 47%, rgba(248, 242, 228, 1) 57%, rgba(217, 234, 244, 1) 64%, rgba(233, 239, 236, 1) 74%, rgba(186, 234, 230, 1) 100%);
            box-shadow: 0 0.46875rem 2.1875rem rgba(90, 97, 105, 0.1), 0 0.125rem 0.1875rem rgba(90, 97, 105, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .main-header a {
            color: #535252;
            margin: 0 8px;
            text-decoration: none;
        }

        .main-header .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .main-header .user-chip i {
            font-size: 18px;
        }

        .main-sidebar {
            position: fixed;
            top: 36px;
            right: 0;
            bottom: 0;
            width: 32px;
            background: #222d32;
            z-index: 1020;
            padding-top: 6px;
            text-align: center;
        }

        .main-sidebar a {
            display: block;
            color: #b8c7ce;
            padding: 7px 0;
            font-size: 12px;
        }

        .main-sidebar a.active,
        .main-sidebar a:hover {
            color: #fff;
            background: #1e282c;
        }

        .stats-toggle {
            position: fixed;
            top: 40px;
            left: 0;
            width: 24px;
            height: 24px;
            background: #0093e9;
            color: #fff;
            border: 0;
            z-index: 1025;
        }

        .content-wrapper {
            margin-top: 36px;
            margin-right: 32px;
            padding: 12px 8px;
        }

        /* =========================================================
           Panel
           ========================================================= */
        .panel-primary {
            border: 0;
            box-shadow: 0 0.46875rem 2.1875rem rgba(90, 97, 105, 0.1), 0 0.25rem 0.53125rem rgba(90, 97, 105, 0.12) !important;
        }

        .panel-primary > .panel-heading {
            color: #535252 !important;
            background: linear-gradient(90deg, rgba(211, 241, 248, 1) 0%, rgba(235, 246, 237, 1) 17%, rgba(255, 249, 228, 1) 34%, rgba(249, 231, 222, 1) 47%, rgba(248, 242, 228, 1) 57%, rgba(217, 234, 244, 1) 64%, rgba(233, 239, 236, 1) 74%, rgba(186, 234, 230, 1) 100%);
            border: 0 !important;
            padding: 5px 15px;
        }

        .panel-title {
            font-size: 12px;
            cursor: pointer;
        }

        /* =========================================================
           Filters — copied from the original page
           ========================================================= */
        .control-label {
            font-weight: bold;
        }

        .form-control {
            height: 30px;
            font-size: 12px;
            padding: 4px 8px;
        }

        .btn-md {
            padding: 3px 8px;
            font-size: 11px;
        }

        .orderCategory .btn,
        .remove-filter,
        .copy-filter,
        .paste-filter,
        .today-date-period,
        .week-date-period,
        .remove-date-period,
        .remove-date,
        #search-icon,
        #bulk-download-manager-btn,
        #collapse-btn {
            margin: 0px 5px;
            border-radius: 10px !important;
        }

        .box-content {
            padding: 10px;
            background-color: #f6f6f6;
            border-radius: 10px !important;
            border: 1px solid #d7dbe0;
        }

        .no-padding {
            padding: 0px !important;
        }

        .btn-default.btn-all.active {
            background-color: #B7B7B7;
            color: white;
        }

        .btn-default.btn-on.active {
            background-color: #5BB75B;
            color: white;
        }

        .btn-default.btn-off.active {
            background-color: #DA4F49;
            color: white;
        }

        .btn-group-justified .btn {
            font-size: 11px;
            padding: 3px 6px;
        }

        .btn-group-justified input[type=radio] {
            display: none;
        }

        #selectedStatusBtn,
        #selectedResponsibleTeamBtn,
        #selectedComponentsBtn {
            background: white;
            border: 1px solid #e0e2e8;
            width: 100%;
            color: #a9a9a9;
            white-space: normal;
            height: 30px;
            border-radius: 8px;
            text-align: right;
            font-size: 12px;
        }

        #selectedStatusBtn.has-value,
        #selectedResponsibleTeamBtn.has-value,
        #selectedComponentsBtn.has-value {
            height: auto;
            min-height: 30px;
        }

        .status-filter .dropdown-menu,
        .responsibleTeam-filter .dropdown-menu,
        .components-filter .dropdown-menu {
            min-width: 1000px;
            overflow: auto;
            background: #f4f4f4;
        }

        #statusDropdown,
        #responsibleTeamDropdown,
        #componentsDropdown {
            padding: 10px !important;
            right: 0px !important;
            border: 1px solid #e5e5e5;
        }

        .status-table {
            width: 100%;
            table-layout: fixed;
            background-color: white;
            margin: 0px !important;
        }

        .status-table th {
            text-align: center;
            background: #d9e8f7;
            white-space: nowrap;
            border: 1px solid gray !important;
        }

        .status-table td {
            text-align: center;
            cursor: pointer;
            transition: .2s;
            border: 1px solid gray !important;
        }

        .status-table td:empty {
            cursor: default;
        }

        .status-table th:nth-child(odd),
        .status-table td:nth-child(odd) {
            background: #c3e0f9;
        }

        .status-table th:nth-child(even),
        .status-table td:nth-child(even) {
            background: #ffbec2;
        }

        .status-table td.selected:nth-child(odd) {
            background: #0093e9;
            color: #fff;
            font-weight: bold;
        }

        .status-table td.selected:nth-child(even) {
            background: #f96a74;
            color: #fff;
            font-weight: bold;
        }

        .selected-chip {
            display: inline-block;
            background: #e6f1fb !important;
            border-radius: 15px;
            color: #0093e9;
            font-size: 11px;
            border: 1px solid #0093e9;
            padding: 1px 8px;
            margin: 1px;
        }

        .selected-chip .chip-x {
            cursor: pointer;
            margin-right: 4px;
        }

        .select2-container--default .select2-selection--multiple {
            border-radius: 8px !important;
            border: 1px solid #d2d6de !important;
            min-height: 30px;
        }

        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #67B9EC !important;
        }

        .daterangepicker .applyBtn,
        .daterangepicker .cancelBtn {
            display: none !important;
        }

        /* category tabs */
        .orderCategory .btn {
            font-size: 13px;
            padding: 5px 10px;
        }

        .orderCategory .btn.active {
            background: #e6e6e6;
            box-shadow: inset 0 3px 5px rgba(0, 0, 0, .125);
        }

        .orderCategory input {
            display: none;
        }

        /* =========================================================
           Table
           ========================================================= */
        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 8px;
        }

        .table-toolbar select {
            width: 60px;
            display: inline-block;
            height: 24px;
            padding: 0 4px;
        }

        #orders-table {
            font-size: 11px;
            margin-bottom: 8px;
        }

        #orders-table tr th {
            white-space: nowrap;
            text-align: center;
            vertical-align: middle;
            background: #fff;
        }

        #orders-table td {
            vertical-align: top;
        }

        #orders-table tbody tr.primary-row {
            background-color: #d9edf7 !important;
        }

        #orders-table tbody tr.danger-row {
            background-color: #f2dede !important;
        }

        #orders-table tbody tr.primary-row:hover {
            background-color: #becfd8 !important;
        }

        #orders-table tbody tr.danger-row:hover {
            background-color: #dbc6c6 !important;
        }

        td.NewOrder {
            background-color: #e8f1ff !important;
        }

        td.MaintenanceOrder {
            background-color: #fbe8e8 !important;
        }

        .CaseCode,
        .CaseInfo {
            cursor: pointer;
            transition: all .3s ease;
        }

        .CaseCode:hover,
        .CaseInfo:hover {
            color: #020304;
            background: #ddd !important;
        }

        .info-table td {
            padding: 0 2px;
            border: 0 !important;
            background: transparent !important;
        }

        .titleInfo {
            white-space: nowrap;
            color: gray;
            text-align: right !important;
            width: 1px;
        }

        .info {
            white-space: nowrap;
            text-align: right !important;
        }

        .add-assessment {
            color: #0093e9;
            font-size: 16px;
            cursor: pointer;
        }

        .assess-label {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #ccd;
            white-space: nowrap;
        }

        .assess-label small {
            display: block;
            color: #777;
        }

        .pager-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pager-bar .pagination {
            margin: 0;
        }

        .pager-bar .pagination > li > a {
            padding: 3px 9px;
            font-size: 11px;
            cursor: pointer;
        }

        .empty-row td {
            text-align: center;
            padding: 30px !important;
            color: #888;
        }

        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #333;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            z-index: 2000;
            display: none;
        }

        .modal-header-primary {
            padding: 9px 15px;
            background: linear-gradient(90deg, rgba(211, 241, 248, 1) 0%, rgba(255, 249, 228, 1) 34%, rgba(186, 234, 230, 1) 100%);
        }

        .modal-header-primary .close {
            float: left;
        }

        .assessment-options .btn {
            margin: 3px;
        }

        @media print {

            .main-header,
            .main-sidebar,
            .stats-toggle,
            #new_order .panel-heading,
            #search-form,
            .table-toolbar,
            .pager-bar,
            #collapseExample {
                display: none !important;
            }

            .content-wrapper {
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <!-- ===================== Header ===================== -->
    <header class="main-header">
        <div>
            <a href="#"><i class="fa fa-home"></i></a>
            <a href="#"><i class="fa fa-bars"></i></a>
        </div>
        <div>
            <a href="#"><i class="fa fa-calendar"></i></a>
            <a href="#"><i class="fa fa-sun-o" style="color:#f0ad4e"></i></a>
            <a href="#">EN</a>
            <a href="#" class="user-chip"><span>يوسف محمد</span> <i class="fa fa-user-circle"></i></a>
        </div>
    </header>

    <!-- ===================== Sidebar ===================== -->
    <aside class="main-sidebar">
        <a href="#" title="الرئيسية"><i class="fa fa-home"></i></a>
        <a href="#" title="لوحة التحكم"><i class="fa fa-dashboard"></i></a>
        <a href="#" title="قسم الطلبات"><i class="fa fa-folder-open"></i></a>
        <a href="#" title="قسم طلبات الصيانة"><i class="fa fa-folder-open"></i></a>
        <a href="#" title="قسم الأبحاث"><i class="fa fa-search"></i></a>
        <a href="#" title="قسم التوقيع"><i class="fa fa-pencil"></i></a>
        <a href="#" title="الكول سنتر"><i class="fa fa-phone"></i></a>
        <a href="#" title="قسم الإستقبال"><i class="fa fa-file"></i></a>
        <a href="#" title="القسم النفسى"><i class="fa fa-user-md"></i></a>
        <a href="#" title="القسم الهندسى" class="active"><i class="fa fa-briefcase"></i></a>
        <a href="#" title="المتابعات"><i class="fa fa-calendar"></i></a>
        <a href="#" title="الإعدادات"><i class="fa fa-cog"></i></a>
        <a href="#" title="السجلات"><i class="fa fa-history"></i></a>
    </aside>

    <button class="stats-toggle" title="الإحصائيات"><i class="fa fa-chevron-right"></i></button>

    <!-- ===================== Content ===================== -->
    <div class="content-wrapper">
        <div class="panel-group" id="new_order">
            <div class="panel panel-primary">
                <div class="panel-heading">
                    <h4 class="panel-title" data-toggle="collapse" data-target="#collapseTwo">
                        <i class="fa fa-fw fa-search"></i>
                    </h4>
                </div>
                <div id="collapseTwo" class="panel-collapse collapse in">
                    <div class="panel-body">

                        <!-- ===================== FILTERS (same structure as the CMS) ===================== -->
                        <form class="form-horizontal" id="search-form" autocomplete="off" onsubmit="return false;">
                            <div class="form-group">
                                <div class="col-md-8 col-sm-12">
                                    <div class="box-body">

                                        <!-- Case Name / Order Code -->
                                        <div class="form-group">
                                            <div class="col-sm-12">
                                                <label for="caseNameOrCode" class="control-label">اسم الحالة / كود الطلب</label>
                                                <div class="row">
                                                    <div class="col-lg-8 col-md-9 col-sm-12">
                                                        <input type="text" name="caseNameOrCode" id="caseNameOrCode" class="form-control" placeholder="ابحث بالاسم أو الكود" />
                                                    </div>
                                                    <div>
                                                        <div class="btn-group" data-id="caseNameOrCode" style="float: left;">
                                                            <button type="button" class="btn btn-md btn-danger remove-filter" title="مسح"><i class="fa fa-times"></i> مسح</button>
                                                            <button type="button" class="btn btn-md btn-primary copy-filter" title="نسخ"><i class="fa fa-copy"></i> نسخ</button>
                                                            <button type="button" class="btn btn-md btn-success paste-filter" title="لصق"><i class="fa fa-paste"></i> لصق</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group">
                                            <!-- City -->
                                            <div class="col-lg-6 col-md-6 col-sm-12">
                                                <label for="city" class="control-label">المحافظة</label>
                                                <select id="city" name="city[]" multiple class="form-control"></select>
                                            </div>
                                        </div>

                                        <div class="form-group">
                                            <!-- Amputation Level -->
                                            <div class="col-lg-6 col-md-6 col-sm-12">
                                                <label for="amputationLevel" class="control-label">مستوى البتر</label>
                                                <select id="amputationLevel" name="amputationLevel[]" multiple class="form-control"></select>
                                            </div>
                                        </div>

                                        <!-- Responsible Team -->
                                        <div class="form-group">
                                            <div class="col-sm-12">
                                                <label class="control-label">الفريق المسؤول</label>
                                                <div class="dropdown responsibleTeam-filter">
                                                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown" id="selectedResponsibleTeamBtn">اختر الفريق المسؤول</button>
                                                    <div class="dropdown-menu" id="responsibleTeamDropdown"></div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Components -->
                                        <div class="form-group">
                                            <div class="col-sm-12">
                                                <label class="control-label">المكونات</label>
                                                <div class="dropdown components-filter">
                                                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown" id="selectedComponentsBtn">المكونات</button>
                                                    <div class="dropdown-menu" id="componentsDropdown"></div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Engineering Assessment -->
                                        <div class="form-group">
                                            <div class="col-sm-12">
                                                <label class="control-label">التقييم الهندسى</label>
                                                <div class="dropdown status-filter">
                                                    <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown" id="selectedStatusBtn">اختر حالة</button>
                                                    <div class="dropdown-menu" id="statusDropdown"></div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Assessment Date -->
                                        <div class="form-group">
                                            <div class="col-sm-12">
                                                <label for="assessmentDatePeriod" class="control-label">تاريخ التقييم الهندسى</label>
                                                <div class="row">
                                                    <div class="col-lg-8 col-md-9 col-sm-12">
                                                        <div class="input-group">
                                                            <input type="text" id="assessmentDatePeriod" class="form-control" placeholder="اختر الفترة" />
                                                            <span class="input-group-addon"><span class="glyphicon glyphicon-calendar"></span></span>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div class="btn-group" data-target="assessment" style="float: left;">
                                                            <button type="button" class="btn btn-md btn-danger remove-date-period" title="مسح"><i class="fa fa-times"></i> مسح</button>
                                                            <button type="button" class="btn btn-md btn-primary today-date-period" title="اليوم"><i class="fa fa-calendar-o"></i> اليوم</button>
                                                            <button type="button" class="btn btn-md btn-success week-date-period" title="هذا الاسبوع"><i class="fa fa-calendar-o"></i> هذا الاسبوع</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Visit Date -->
                                        <div class="form-group">
                                            <div class="col-sm-12">
                                                <label for="visitDatePeriod" class="control-label">تاريخ حجز الزيارة</label>
                                                <div class="row">
                                                    <div class="col-lg-8 col-md-9 col-sm-12">
                                                        <div class="input-group">
                                                            <input type="text" id="visitDatePeriod" class="form-control" placeholder="اختر الفترة" />
                                                            <span class="input-group-addon"><span class="glyphicon glyphicon-calendar"></span></span>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div class="btn-group" data-target="visit" style="float: left;">
                                                            <button type="button" class="btn btn-md btn-danger remove-date-period" title="مسح"><i class="fa fa-times"></i> مسح</button>
                                                            <button type="button" class="btn btn-md btn-primary today-date-period" title="اليوم"><i class="fa fa-calendar-o"></i> اليوم</button>
                                                            <button type="button" class="btn btn-md btn-success week-date-period" title="هذا الاسبوع"><i class="fa fa-calendar-o"></i> هذا الاسبوع</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Days between measurement and ready -->
                                        <div class="form-group">
                                            <div class="col-sm-12">
                                                <div class="row">
                                                    <div class="col-sm-12">
                                                        <label for="daysFrom" class="control-label">عدد الأيام بين أخذ المقاس وجاهزية التسليم</label>
                                                    </div>
                                                </div>
                                                <div class="row">
                                                    <div class="col-sm-5">
                                                        <input type="number" min="0" step="1" id="daysFrom" class="form-control" placeholder="أكثر من" />
                                                    </div>
                                                    <div class="col-sm-5">
                                                        <input type="number" min="0" step="1" id="daysTo" class="form-control" placeholder="أقل من" />
                                                    </div>
                                                    <div class="col-sm-2 text-left no-padding">
                                                        <button type="button" class="btn btn-md btn-danger remove-date" id="clearDays"><i class="fa fa-times"></i></button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Order Type / Is Attend -->
                                        <div class="form-group">
                                            <div class="col-lg-6 col-md-6 col-sm-12">
                                                <div class="box-content">
                                                    <label class="control-label">نوع الطلب</label>
                                                    <div class="btn-group btn-group-justified" id="searchOrderType" data-toggle="buttons">
                                                        <label class="btn btn-default btn-all active"><input type="radio" value="-1" name="searchOrderType" checked> الكل</label>
                                                        <label class="btn btn-default btn-on"><input type="radio" value="new" name="searchOrderType"> طلب جديد</label>
                                                        <label class="btn btn-default btn-off"><input type="radio" value="maintenance" name="searchOrderType"> طلب صيانة</label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-6 col-md-6 col-sm-12">
                                                <div class="box-content">
                                                    <label class="control-label">هل حضر</label>
                                                    <div class="btn-group btn-group-justified" id="isAttend" data-toggle="buttons">
                                                        <label class="btn btn-default btn-all active"><input type="radio" value="-1" name="isAttend" checked> الكل</label>
                                                        <label class="btn btn-default btn-on"><input type="radio" value="1" name="isAttend"> حضر</label>
                                                        <label class="btn btn-default btn-off"><input type="radio" value="0" name="isAttend"> لم يحضر</label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>

                            <div class="box-footer" style="border-top:1px solid #f4f4f4; padding-top:10px;">
                                <div class="form-group">
                                    <div class="col-md-4 col-sm-12 pull-left">
                                        <div class="btn-group" style="float: left;">
                                            <button type="button" id="search-icon" class="btn btn-sm btn-success"><span class="glyphicon glyphicon-search"></span> بحث</button>
                                            <button type="button" id="collapse-btn" class="btn btn-sm btn-default" data-toggle="collapse" data-target="#collapseExample"><span class="glyphicon glyphicon-th text-primary"></span> تفاصيل الجدول</button>
                                            <button type="button" id="bulk-download-manager-btn" class="btn btn-sm btn-warning"><i class="fa fa-folder-open"></i> إدارة الملفات</button>
                                        </div>
                                    </div>
                                    <div class="col-md-8">
                                        <div class="btn-group orderCategory" data-toggle="buttons">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-daterangepicker/3.1/daterangepicker.min.js"></script>

    <script>
        // =====================================================================
        // Lookup data (same values as the CMS page)
        // =====================================================================
        var TODAY = moment('2026-10-04');

        var CITIES = ['القاهرة', 'الجيزة', 'الإسكندرية', 'الدقهلية', 'المنوفية', 'الشرقية', 'الغربية', 'القليوبية', 'أسيوط', 'سوهاج', 'المنيا', 'بني سويف', 'الفيوم', 'قنا', 'أسوان'];
        var AMPUTATION_LEVELS = ['تحت الركبة', 'فوق الركبة', 'تحت الكوع', 'فوق الكوع', 'مفصل الركبة', 'مفصل الحوض', 'القدم الجزئي', 'الرسغ'];
        var SIDES = ['أيمن', 'أيسر'];
        var CAUSES = ['حادث', 'مرضي', 'سكر', 'خلقي', 'ورم'];
        var FIRST = ['محمود', 'السيد', 'أحمد', 'محمد', 'مصطفى', 'إبراهيم', 'علي', 'حسن', 'خالد', 'عمر', 'فاطمة', 'منى', 'سارة', 'هدى', 'ياسمين', 'كريم', 'طارق', 'نادية', 'رشا', 'عبدالله'];
        var MIDDLE = ['أحمد', 'محمد', 'إبراهيم', 'صالح', 'عبدالرحمن', 'حسين', 'سعيد', 'فتحي', 'جمال', 'رمضان'];
        var LAST = ['سليمان', 'صالح', 'عبدالعزيز', 'الشافعي', 'منصور', 'النجار', 'حسانين', 'عوض', 'شلبي', 'زكي'];
        var FUNDING = ['-', '-', '-', 'متبرع فردي', 'مؤسسة مصر الخير', 'بنك الطعام'];

        var STATUS_GROUPS = {
            new_mdm: {
                title: 'التقييم الطبى والقياسات',
                items: [{ id: 1, name: 'تم أخد مقاس' }, { id: 22, name: 'مؤجل' }, { id: 18, name: 'خارج المعايير' }, { id: 19, name: 'عدم رغبة الحالة' }, { id: 20, name: 'عدم إحتياج الحالة' }]
            },
            new_fitting: {
                title: 'تسليم طرف جديد',
                items: [{ id: 3, name: 'تم التسليم' }, { id: 22, name: 'مؤجل' }, { id: 4, name: 'إعادة تصنيع (تلف فى الطرف وقت التسليم)' }, { id: 7, name: 'تم أخذ مقاس جديد (تعديل فى المقاس السابق)' }, { id: 36, name: 'تعديل في التصميم (نفس المقاس السابق)' }, { id: 5, name: 'رفض الإستلام' }, { id: 2, name: 'مستبعد (الطرف غير مناسب ولا يوجد حل)' }]
            },
            maintenance_mdm: {
                title: 'تقييم الصيانة',
                items: [{ id: 37, name: 'توفير قطع غيار' }, { id: 15, name: 'تم نهاية الصيانة' }, { id: 22, name: 'مؤجل' }, { id: 7, name: 'تم أخذ مقاس جديد (تعديل فى المقاس السابق)' }, { id: 36, name: 'تعديل في التصميم (نفس المقاس السابق)' }, { id: 9, name: 'تصنيع قطع غيار' }, { id: 34, name: 'مستبعد من الصيانة' }, { id: 35, name: 'استرداد الطرف' }]
            },
            maintenance_fitting: {
                title: 'تسليم صيانة',
                items: [{ id: 37, name: 'توفير قطع غيار' }, { id: 3, name: 'تم التسليم' }, { id: 22, name: 'مؤجل' }, { id: 4, name: 'إعادة تصنيع (تلف فى الطرف وقت التسليم)' }, { id: 7, name: 'تم أخذ مقاس جديد (تعديل فى المقاس السابق)' }, { id: 36, name: 'تعديل في التصميم (نفس المقاس السابق)' }, { id: 9, name: 'تصنيع قطع غيار' }, { id: 34, name: 'مستبعد من الصيانة' }]
            }
        };

        var TEAM_GROUPS = {
            'مهندس / علاج طبيعى': [
                { id: 'engineer-154', name: 'همام' }, { id: 'engineer-188', name: 'سامح' }, { id: 'engineer-229', name: 'كيرلس' }, { id: 'engineer-230', name: 'سلمى' },
                { id: 'engineer-272', name: 'عبد المقصود' }, { id: 'engineer-288', name: 'youssef mostafa' }, { id: 'engineer-287', name: 'eslam ahmed' }, { id: 'engineer-291', name: 'اسلام رجب' },
                { id: 'engineer-292', name: 'اسلام عاصم' }, { id: 'engineer-293', name: 'يحيى الغايش' }, { id: 'engineer-308', name: 'اشرف محمد' }, { id: 'engineer-307', name: 'محمود مغربي' },
                { id: 'engineer-306', name: 'اسلام جمال' }, { id: 'engineer-305', name: 'هنا جوهر' }
            ],
            'فنى أطراف/تجميع': [
                { id: 'technical-157', name: 'محمد أشرف' }, { id: 'assembly_technician-160', name: 'يسري عبد العزيز' }, { id: 'technical-16', name: 'عمرو' },
                { id: 'technical-17', name: 'عبدالله' }, { id: 'assembly_technician-310', name: 'شعبان' }, { id: 'assembly_technician-309', name: 'جمعة' }
            ]
        };

        var COMPONENT_GROUPS = {
            'الاكسسوارات': [
                { id: '33', name: 'جوانتى سيليكون' }, { id: '34', name: 'تريكو' }, { id: '32', name: 'بطانة' }, { id: '31', name: 'سكوتش' }, { id: '28', name: 'شاوما' },
                { id: '29', name: 'شراب شاوما' }, { id: '30', name: 'ركبة قماش' }, { id: '27', name: 'شراب تريكو' }, { id: '26', name: 'سوفت سوكيت TPU' },
                { id: '24', name: 'شراب قطن' }, { id: '25', name: 'شراب جيل' }, { id: '22', name: 'حزام' }
            ],
            'المكونات': [
                { id: '35', name: 'ذراع' }, { id: '36', name: 'كف تصنيع داخلي' }, { id: '37', name: 'جوانتي تجميل' }, { id: '38', name: 'سوكيت PP' }, { id: '40', name: 'صمام' },
                { id: '41', name: 'شوكة' }, { id: '42', name: 'Shuttle Lock' }, { id: '45', name: 'ركبة' }, { id: '47', name: 'ماسورة' }, { id: '48', name: 'قدم' },
                { id: '55', name: 'مفصل حوض' }, { id: '58', name: 'جلبة تطويل' }
            ],
            'قطع الغيار': [],
            'الخامات': [
                { id: '63', name: 'pp' }, { id: '64', name: 'PLA' }, { id: '66', name: 'TPU 95A' }, { id: '67', name: 'TPU 87A' }, { id: '69', name: 'PETG' }, { id: '71', name: 'ABS' }
            ]
        };

        var ALL_TEAM = [].concat(TEAM_GROUPS['مهندس / علاج طبيعى'], TEAM_GROUPS['فنى أطراف/تجميع']);
        var ACCESSORIES = COMPONENT_GROUPS['الاكسسوارات'];
        var COMPONENTS = COMPONENT_GROUPS['المكونات'];

        // =====================================================================
        // Mock rows (seeded so the data is the same on every reload)
        // =====================================================================
        var seed = 7;
        function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
        function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
        function pickSome(arr, max) {
            var n = Math.floor(rnd() * (max + 1)), out = [];
            while (out.length < n && out.length < arr.length) {
                var x = pick(arr);
                if (out.indexOf(x) === -1) out.push(x);
            }
            return out;
        }
        function dateAround(daysBack, span) { return TODAY.clone().subtract(daysBack - Math.floor(rnd() * span), 'days').format('YYYY-MM-DD'); }
        function statusName(group, id) {
            var it = STATUS_GROUPS[group].items.filter(function (x) { return x.id == id; })[0];
            return it ? it.name : '';
        }

        var ROWS = [];
        for (var i = 0; i < 64; i++) {
            var type = rnd() < 0.62 ? 'new' : 'maintenance';
            var surgery = dateAround(500, 400);
            var row = {
                id: 1000 + i,
                type: type,
                submitDate: dateAround(20, 25),
                code: rnd() < 0.3 ? '-' : (pick(['BK', 'AK', 'BE', 'AE']) + String(Math.floor(rnd() * 90) + 10) + String(Math.floor(rnd() * 900) + 100)),
                name: pick(FIRST) + ' ' + pick(MIDDLE) + ' ' + pick(MIDDLE) + ' ' + pick(LAST),
                city: pick(CITIES),
                nid: String(2) + String(Math.floor(rnd() * 9e12 + 1e12)).slice(0, 13),
                funding: pick(FUNDING),
                level: pick(AMPUTATION_LEVELS),
                side: pick(SIDES),
                amputationDate: surgery,
                cause: pick(CAUSES),
                surgeryDate: surgery,
                visitDate: dateAround(3, 10),
                days: null,
                attended: rnd() < 0.35 ? null : (rnd() < 0.75 ? 1 : 0),
                hasLimb: type === 'maintenance' ? 'نعم' : (rnd() < 0.2 ? 'نعم' : '-'),
                accessories: pickSome(ACCESSORIES, 2),
                components: pickSome(COMPONENTS, 3),
                spareParts: [],
                videos: Math.floor(rnd() * 4),
                assessments: {},
                notes: rnd() < 0.3 ? pick(['الحالة محتاجة متابعة', 'تأجيل لحين التئام الجرح', 'تم التواصل تليفونياً', 'القطع المطلوب توفيرها: بطانة']) : '',
                postponeDate: '',
                team: pickSome(ALL_TEAM, 2)
            };

            // assessment progress
            var r = rnd();
            if (type === 'new') {
                if (r > 0.45) {
                    row.assessments.new_mdm = { id: pick([1, 1, 1, 22, 18]), date: dateAround(30, 20), notes: '' };
                    if (row.assessments.new_mdm.id == 1 && r > 0.7) {
                        row.assessments.new_fitting = { id: pick([3, 3, 22, 4, 7]), date: dateAround(5, 8), notes: '' };
                        row.days = Math.floor(rnd() * 25) + 3;
                    }
                }
            } else {
                if (r > 0.45) {
                    row.assessments.maintenance_mdm = { id: pick([15, 37, 22, 9]), date: dateAround(25, 20), notes: '' };
                    if (r > 0.75) {
                        row.assessments.maintenance_fitting = { id: pick([3, 3, 22]), date: dateAround(5, 8), notes: '' };
                        row.days = Math.floor(rnd() * 15) + 1;
                    }
                }
            }
            var anyPostponed = Object.keys(row.assessments).some(function (k) { return row.assessments[k].id == 22; });
            if (anyPostponed) row.postponeDate = TODAY.clone().add(Math.floor(rnd() * 20) + 2, 'days').format('YYYY-MM-DD');
            ROWS.push(row);
        }

        // Which stage is the row currently waiting on
        // Final statuses close the stage (no more ➕)
        var FINAL = {
            new_mdm: [18, 19, 20],
            new_fitting: [3, 5, 2],
            maintenance_mdm: [34, 35],
            maintenance_fitting: [3, 34]
        };
        function isFinal(row, stage) {
            var a = row.assessments[stage];
            return a && FINAL[stage].indexOf(+a.id) !== -1;
        }
        function currentStage(row) {
            if (row.type === 'new') {
                if (isFinal(row, 'new_mdm') || isFinal(row, 'new_fitting')) return 'done';
                if (!row.assessments.new_mdm || row.assessments.new_mdm.id != 1) return 'new_mdm';
                return 'new_fitting';
            }
            if (isFinal(row, 'maintenance_mdm') || isFinal(row, 'maintenance_fitting')) return 'done';
            if (!row.assessments.maintenance_mdm || row.assessments.maintenance_mdm.id == 22) return 'maintenance_mdm';
            return 'maintenance_fitting';
        }

        // =====================================================================
        // Columns (same order as the CMS; hidden = the "تاريخ الحضور" columns)
        // =====================================================================
        function assessmentCell(stage) {
            return function (row) {
                if (row.type !== stage.split('_')[0]) return '-';
                var a = row.assessments[stage];
                var canAdd = currentStage(row) === stage;
                var html = '';
                if (a) html += '<span class="assess-label">' + statusName(stage, a.id) + '<small>' + a.date + '</small></span><br>';
                if (canAdd) html += '<i class="fa fa-plus-square add-assessment" data-id="' + row.id + '" data-stage="' + stage + '" title="إضافة تقييم"></i>';
                return html || '-';
            };
        }
        function attendDate(stage) {
            return function (row) { var a = row.assessments[stage]; return a ? a.date : '-'; };
        }
        function list(arr) { return arr.length ? arr.map(function (x) { return x.name; }).join('<br>') : '-'; }

        var COLUMNS = [
            { title: 'نوع الطلب', render: function (r) { return r.type === 'new' ? 'طلب جديد' : 'طلب صيانة'; } },
            { title: 'تاريخ تقديم الطلب', render: function (r) { return r.submitDate; } },
            { title: 'كود الحالة', cls: 'CaseCode', render: function (r) { return r.code; } },
            {
                title: 'بيانات الحالة', cls: 'CaseInfo', render: function (r) {
                    return '<table class="info-table"><tr><td class="titleInfo">الاسم:</td><td class="info CaseName">' + r.name + '</td></tr>' +
                        '<tr><td class="titleInfo">المحافظة:</td><td class="info">' + r.city + '</td></tr>' +
                        '<tr><td class="titleInfo">رقم الهوية:</td><td class="info">' + r.nid + '</td></tr></table>';
                }
            },
            { title: 'بيانات التمويل', render: function (r) { return r.funding; } },
            {
                title: 'بيانات البتر', render: function (r) {
                    return '<table class="info-table"><tr><td class="titleInfo">مستوى البتر:</td><td class="info">' + r.level + '</td></tr>' +
                        '<tr><td class="titleInfo">الطرف المبتور:</td><td class="info">' + r.side + '</td></tr>' +
                        '<tr><td class="titleInfo">تاريخ البتر:</td><td class="info">' + r.amputationDate + '</td></tr>' +
                        '<tr><td class="titleInfo">سبب البتر:</td><td class="info">' + r.cause + '</td></tr>' +
                        '<tr><td class="titleInfo">اخر جراحة:</td><td class="info">' + r.surgeryDate + '</td></tr></table>';
                }
            },
            { title: 'تاريخ حجز الزيارة', render: function (r) { return r.visitDate; } },
            { title: 'عدد الأيام بين أخذ المقاس وجاهزية التسليم', render: function (r) { return r.days === null ? '-' : r.days; } },
            { title: 'هل حضر', render: function (r) { return r.attended === null ? '-' : (r.attended ? '<span class="text-success">حضر</span>' : '<span class="text-danger">لم يحضر</span>'); } },
            { title: 'لديه طرف ؟', render: function (r) { return r.hasLimb; } },
            { title: 'الاكسسوارات', render: function (r) { return list(r.accessories); } },
            { title: 'المكونات', render: function (r) { return list(r.components); } },
            { title: 'قطع غيار', render: function (r) { return list(r.spareParts); } },
            { title: 'الفيديوهات', render: function (r) { return r.videos ? '<i class="fa fa-video-camera text-primary"></i> ' + r.videos : '-'; } },
            { title: 'التقييم الطبي و القياسات', render: assessmentCell('new_mdm') },
            { title: 'تاريخ الحضور', hidden: true, noToggle: true, render: attendDate('new_mdm') },
            { title: 'تسليم طرف جديد', render: assessmentCell('new_fitting') },
            { title: 'تاريخ الحضور', hidden: true, noToggle: true, render: attendDate('new_fitting') },
            { title: 'تقييم الصيانة', render: assessmentCell('maintenance_mdm') },
            { title: 'تاريخ الحضور', hidden: true, noToggle: true, render: attendDate('maintenance_mdm') },
            { title: 'تسليم الصيانة', render: assessmentCell('maintenance_fitting') },
            { title: 'تاريخ حضور تسليم الصيانة', hidden: true, render: attendDate('maintenance_fitting') },
            { title: 'ملاحظات التقييم الهندسى', render: function (r) { return r.notes || ''; } },
            { title: 'تاريخ التأجيل', render: function (r) { return r.postponeDate || '-'; } },
            { title: 'الفريق المسؤول', render: function (r) { return list(r.team).replace(/^-$/, ''); } }
        ];

        // restore column visibility
        try {
            var savedCols = JSON.parse(localStorage.getItem('mock_visits_columns') || 'null');
            if (savedCols) COLUMNS.forEach(function (c, idx) { if (!c.noToggle) c.hidden = savedCols.indexOf(idx) === -1; });
        } catch (e) { }

        // =====================================================================
        // Filter state
        // =====================================================================
        var state = {
            page: 1,
            pageSize: 20,
            assessment: { from: '', to: '' },
            visit: { from: '', to: '' },
            statuses: [],   // e.g. "new_mdm_1"
            teams: [],
            components: []
        };

        function toast(msg) {
            $('#toast').text(msg).stop(true, true).fadeIn(150).delay(1400).fadeOut(300);
        }

        function inRange(date, range) {
            if (!range.from) return true;
            if (!date) return false;
            return date >= range.from && date <= range.to;
        }

        function filteredRows() {
            var q = $.trim($('#caseNameOrCode').val()).toLowerCase();
            var cities = $('#city').val() || [];
            var levels = $('#amputationLevel').val() || [];
            var orderType = $('input[name=searchOrderType]:checked').val();
            var attend = $('input[name=isAttend]:checked').val();
            var category = $('input[name=orderCategory]:checked').val();
            var dFrom = $('#daysFrom').val(), dTo = $('#daysTo').val();

            return ROWS.filter(function (r) {
                if (q && r.name.toLowerCase().indexOf(q) === -1 && r.code.toLowerCase().indexOf(q) === -1) return false;
                if (cities.length && cities.indexOf(r.city) === -1) return false;
                if (levels.length && levels.indexOf(r.level) === -1) return false;
                if (orderType !== '-1' && r.type !== orderType) return false;
                if (attend !== '-1' && String(r.attended) !== attend) return false;
                if (category !== 'all' && currentStage(r) !== category) return false;
                if (dFrom !== '' && (r.days === null || r.days <= +dFrom)) return false;
                if (dTo !== '' && (r.days === null || r.days >= +dTo)) return false;
                if (state.teams.length && !r.team.some(function (t) { return state.teams.indexOf(t.id) !== -1; })) return false;
                if (state.components.length && !r.accessories.concat(r.components).some(function (c) { return state.components.indexOf(c.id) !== -1; })) return false;
                if (state.statuses.length) {
                    var hit = Object.keys(r.assessments).some(function (k) { return state.statuses.indexOf(k + '_' + r.assessments[k].id) !== -1; });
                    if (!hit) return false;
                }
                if (state.assessment.from) {
                    var anyDate = Object.keys(r.assessments).some(function (k) { return inRange(r.assessments[k].date, state.assessment); });
                    if (!anyDate) return false;
                }
                if (!inRange(r.visitDate, state.visit)) return false;
                return true;
            });
        }

        // =====================================================================
        // Rendering
        // =====================================================================
        function renderHead() {
            $('#headRow').html(COLUMNS.map(function (c) {
                return c.hidden ? '' : '<th>' + c.title + '</th>';
            }).join(''));
        }

        function renderColumnToggles() {
            var html = '<div class="col-lg-4 text-warning"><label><input type="checkbox" id="toggleAll"> اختيار الكل</label></div>';
            COLUMNS.forEach(function (c, idx) {
                if (c.noToggle) return;
                html += '<div class="col-lg-4"><label style="font-weight:normal"><input type="checkbox" class="toggle-vis" data-column="' + idx + '"' + (c.hidden ? '' : ' checked') + '> ' + c.title + '</label></div>';
            });
            $('#columnToggles').html(html);
            $('#toggleAll').prop('checked', $('.toggle-vis:not(:checked)').length === 0);
        }

        function renderBody() {
            var rows = filteredRows();
            var total = rows.length;
            var size = state.pageSize === -1 ? total || 1 : state.pageSize;
            var pages = Math.max(1, Math.ceil(total / size));
            if (state.page > pages) state.page = pages;
            var start = (state.page - 1) * size;
            var pageRows = rows.slice(start, start + size);
            var visibleCount = COLUMNS.filter(function (c) { return !c.hidden; }).length;

            if (!pageRows.length) {
                $('#bodyRows').html('<tr class="empty-row"><td colspan="' + visibleCount + '">لم يتم العثور علي أي نتائج</td></tr>');
            } else {
                $('#bodyRows').html(pageRows.map(function (r) {
                    var rowCls = r.type === 'new' ? 'primary-row' : 'danger-row';
                    var orderCls = r.type === 'new' ? 'NewOrder' : 'MaintenanceOrder';
                    return '<tr class="' + rowCls + '" data-id="' + r.id + '">' + COLUMNS.map(function (c) {
                        if (c.hidden) return '';
                        var cls = c.cls ? c.cls + ' ' + orderCls : '';
                        return '<td class="' + cls + '">' + c.render(r) + '</td>';
                    }).join('') + '</tr>';
                }).join(''));
            }

            $('#pageInfo').text(total ? ('عرض ' + (start + 1) + ' إلي ' + Math.min(start + size, total) + ' من ' + total + ' سجل') : '');

            var p = '';
            function li(label, page, disabled, active) {
                return '<li class="' + (disabled ? 'disabled' : '') + (active ? ' active' : '') + '"><a data-page="' + page + '">' + label + '</a></li>';
            }
            p += li('الأول', 1, state.page === 1);
            p += li('السابق', state.page - 1, state.page === 1);
            for (var i = 1; i <= pages; i++) p += li(i, i, false, i === state.page);
            p += li('التالي', state.page + 1, state.page === pages);
            p += li('الأخير', pages, state.page === pages);
            $('#pagination').html(p);
        }

        function render() {
            renderHead();
            renderBody();
        }

        // =====================================================================
        // Table-dropdown filters (status / team / components)
        // =====================================================================
        function buildPickerTable(container, groups, cellClass, clearId) {
            var headers = Object.keys(groups);
            var maxRows = Math.max.apply(null, headers.map(function (h) { return groups[h].length; }));
            var html = '<div class="text-left" style="margin-bottom:10px;"><button type="button" class="btn btn-xs btn-danger" id="' + clearId + '"><i class="glyphicon glyphicon-remove"></i> إزالة التحديد</button></div>';
            html += '<table class="table table-bordered status-table"><thead><tr>' + headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
            for (var i = 0; i < maxRows; i++) {
                html += '<tr>' + headers.map(function (h) {
                    var it = groups[h][i];
                    return it ? '<td class="' + cellClass + '" data-id="' + it.id + '" data-name="' + it.name + '">' + it.name + '</td>' : '<td></td>';
                }).join('') + '</tr>';
            }
            $(container).html(html + '</tbody></table>');
        }

        function setupPicker(opts) {
            // opts: key (state array), container, button, placeholder, cellClass, clearId, groups
            buildPickerTable(opts.container, opts.groups, opts.cellClass, opts.clearId);
            var names = {};

            function refresh() {
                $(opts.container + ' .' + opts.cellClass).each(function () {
                    $(this).toggleClass('selected', state[opts.key].indexOf(String($(this).data('id'))) !== -1);
                });
                var $btn = $(opts.button);
                if (state[opts.key].length) {
                    $btn.addClass('has-value').html(state[opts.key].map(function (id) {
                        return '<span class="selected-chip">' + names[id] + ' <span class="chip-x" data-key="' + opts.key + '" data-id="' + id + '">&times;</span></span>';
                    }).join(' '));
                } else {
                    $btn.removeClass('has-value').text(opts.placeholder);
                }
            }
            opts.refresh = refresh;

            $(document).on('click', opts.container + ' .' + opts.cellClass, function (e) {
                e.stopPropagation();
                var id = String($(this).data('id'));
                names[id] = $(this).data('name');
                var idx = state[opts.key].indexOf(id);
                if (idx === -1) state[opts.key].push(id); else state[opts.key].splice(idx, 1);
                refresh();
            });
            $(document).on('click', '#' + opts.clearId, function (e) {
                e.stopPropagation();
                state[opts.key] = [];
                refresh();
            });
            return opts;
        }

        // status groups need the "<stage>_<id>" ids
        var statusGroupsForPicker = {};
        Object.keys(STATUS_GROUPS).forEach(function (k) {
            statusGroupsForPicker[STATUS_GROUPS[k].title] = STATUS_GROUPS[k].items.map(function (it) { return { id: k + '_' + it.id, name: it.name }; });
        });

        var pickers = [
            setupPicker({ key: 'statuses', container: '#statusDropdown', button: '#selectedStatusBtn', placeholder: 'اختر حالة', cellClass: 'status-cell', clearId: 'clearStatusSelection', groups: statusGroupsForPicker }),
            setupPicker({ key: 'teams', container: '#responsibleTeamDropdown', button: '#selectedResponsibleTeamBtn', placeholder: 'اختر الفريق المسؤول', cellClass: 'responsibleTeam-cell', clearId: 'clearResponsibleTeamSelection', groups: TEAM_GROUPS }),
            setupPicker({ key: 'components', container: '#componentsDropdown', button: '#selectedComponentsBtn', placeholder: 'المكونات', cellClass: 'components-cell', clearId: 'clearComponentsSelection', groups: COMPONENT_GROUPS })
        ];

        // remove a chip from the trigger button without opening the dropdown
        $(document).on('click', '.chip-x', function (e) {
            e.stopPropagation();
            var key = $(this).data('key'), id = String($(this).data('id'));
            state[key].splice(state[key].indexOf(id), 1);
            pickers.forEach(function (p) { if (p.key === key) p.refresh(); });
        });

        $(document).on('click', '.dropdown-menu', function (e) { e.stopPropagation(); });

        // =====================================================================
        // Wiring
        // =====================================================================
        $(function () {
            $('#city').select2({ width: '100%', placeholder: 'اختر المحافظة', allowClear: true, dir: 'rtl', data: CITIES.map(function (c) { return { id: c, text: c }; }) });
            $('#amputationLevel').select2({ width: '100%', placeholder: 'اختر مستوى البتر', allowClear: true, dir: 'rtl', data: AMPUTATION_LEVELS.map(function (c) { return { id: c, text: c }; }) });

            // date ranges
            ['assessment', 'visit'].forEach(function (key) {
                var $input = $('#' + key + 'DatePeriod');
                $input.daterangepicker({
                    autoUpdateInput: false,
                    autoApply: true,
                    opens: 'left',
                    locale: { format: 'YYYY-MM-DD' }
                }, function (start, end) {
                    setRange(key, start.format('YYYY-MM-DD'), end.format('YYYY-MM-DD'));
                });
                $input.next('.input-group-addon').on('click', function () { $input.focus(); });
            });

            function setRange(key, from, to) {
                state[key] = { from: from, to: to };
                $('#' + key + 'DatePeriod').val(from ? ('من ' + from + ' إلى ' + to) : '');
                if (from) {
                    var drp = $('#' + key + 'DatePeriod').data('daterangepicker');
                    drp.setStartDate(from);
                    drp.setEndDate(to);
                }
            }

            $('.remove-date-period').on('click', function () { setRange($(this).closest('.btn-group').data('target'), '', ''); });
            $('.today-date-period').on('click', function () {
                var t = TODAY.format('YYYY-MM-DD');
                setRange($(this).closest('.btn-group').data('target'), t, t);
            });
            $('.week-date-period').on('click', function () {
                var first = TODAY.clone().subtract(TODAY.day(), 'days'); // Sunday
                setRange($(this).closest('.btn-group').data('target'), first.format('YYYY-MM-DD'), first.clone().add(4, 'days').format('YYYY-MM-DD'));
            });
            $('#clearDays').on('click', function () { $('#daysFrom, #daysTo').val(''); });

            // text filter buttons
            $('.remove-filter').on('click', function () { $('#caseNameOrCode').val(''); });
            $('.copy-filter').on('click', function () {
                var v = $('#caseNameOrCode').val();
                (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { toast('تم النسخ'); }, function () { toast('تعذر النسخ'); });
            });
            $('.paste-filter').on('click', function () {
                if (!navigator.clipboard || !navigator.clipboard.readText) return toast('المتصفح لا يسمح باللصق');
                navigator.clipboard.readText().then(function (t) { $('#caseNameOrCode').val(t); }, function () { toast('تعذر اللصق'); });
            });
            $('#caseNameOrCode').on('keydown', function (e) { if (e.key === 'Enter') { state.page = 1; render(); } });

            // search + instant category tabs (like the CMS)
            $('#search-icon').on('click', function () { state.page = 1; render(); });
            $('input[name=orderCategory]').on('change', function () { state.page = 1; render(); });

            // paging
            $('#pageSize').on('change', function () { state.pageSize = +$(this).val(); state.page = 1; render(); });
            $(document).on('click', '#pagination a', function () {
                var $li = $(this).parent();
                if ($li.hasClass('disabled') || $li.hasClass('active')) return;
                state.page = +$(this).data('page');
                renderBody();
            });

            // column toggles
            renderColumnToggles();
            function saveColumns() {
                var visible = [];
                COLUMNS.forEach(function (c, idx) { if (!c.hidden && !c.noToggle) visible.push(idx); });
                try { localStorage.setItem('mock_visits_columns', JSON.stringify(visible)); } catch (e) { }
            }
            $(document).on('change', '.toggle-vis', function () {
                COLUMNS[+$(this).data('column')].hidden = !this.checked;
                $('#toggleAll').prop('checked', $('.toggle-vis:not(:checked)').length === 0);
                saveColumns();
                render();
            });
            $(document).on('change', '#toggleAll', function () {
                var on = this.checked;
                $('.toggle-vis').each(function () { this.checked = on; COLUMNS[+$(this).data('column')].hidden = !on; });
                saveColumns();
                render();
            });

            // click case code / name => copy & search by it
            $(document).on('click', '.CaseCode, .CaseInfo', function () {
                var v = $(this).hasClass('CaseCode') ? $.trim($(this).text()) : $.trim($(this).find('.CaseName').text());
                if (v === '-') return;
                resetFilters();
                $('#caseNameOrCode').val(v);
                if (navigator.clipboard) navigator.clipboard.writeText(v).catch(function () { });
                state.page = 1;
                render();
                toast('تم النسخ والبحث: ' + v);
            });

            function resetFilters() {
                $('#search-form input[type=text], #search-form input[type=number]').val('');
                $('#city, #amputationLevel').val(null).trigger('change');
                ['searchOrderType', 'isAttend'].forEach(function (n) { $('#' + n + ' .btn-all').click(); });
                $('.orderCategory input[value=all]').parent().click();
                state.assessment = { from: '', to: '' };
                state.visit = { from: '', to: '' };
                state.statuses = []; state.teams = []; state.components = [];
                pickers.forEach(function (p) { p.refresh(); });
            }

            // assessment modal
            var modalCtx = null;
            $(document).on('click', '.add-assessment', function (e) {
                e.stopPropagation();
                var row = ROWS.filter(function (r) { return r.id == $(this).data('id'); }.bind(this))[0];
                var stage = $(this).data('stage');
                modalCtx = { row: row, stage: stage, statusId: null };
                $('#modalStage').text(STATUS_GROUPS[stage].title);
                $('#modalCase').text(row.name + (row.code !== '-' ? ' (' + row.code + ')' : ''));
                $('#modalOptions').html(STATUS_GROUPS[stage].items.map(function (it) {
                    return '<button type="button" class="btn btn-default btn-sm" data-sid="' + it.id + '">' + it.name + '</button>';
                }).join(''));
                $('#modalDate').val(TODAY.format('YYYY-MM-DD'));
                $('#modalNotes').val('');
                $('#assessmentModal').modal('show');
            });
            $(document).on('click', '#modalOptions .btn', function () {
                $('#modalOptions .btn').removeClass('btn-primary active').addClass('btn-default');
                $(this).removeClass('btn-default').addClass('btn-primary active');
                modalCtx.statusId = $(this).data('sid');
            });
            $('#modalSave').on('click', function () {
                if (!modalCtx.statusId) return toast('اختر التقييم أولاً');
                modalCtx.row.assessments[modalCtx.stage] = { id: modalCtx.statusId, date: $('#modalDate').val(), notes: $('#modalNotes').val() };
                if ($('#modalNotes').val()) modalCtx.row.notes = $('#modalNotes').val();
                modalCtx.row.attended = 1;
                $('#assessmentModal').modal('hide');
                renderBody();
                toast('تم الإضافة بنجاح');
            });

            // print / excel
            $('#printBtn').on('click', function () { window.print(); });
            $('#excelBtn').on('click', function () {
                var cols = COLUMNS.filter(function (c) { return !c.hidden; });
                var lines = [cols.map(function (c) { return '"' + c.title + '"'; }).join(',')];
                filteredRows().forEach(function (r) {
                    lines.push(cols.map(function (c) {
                        var txt = $('<div>').html(String(c.render(r)).replace(/<br>/g, ' | ').replace(/<\/tr>/g, ' ')).text().replace(/\s+/g, ' ').trim();
                        return '"' + txt.replace(/"/g, '""') + '"';
                    }).join(','));
                });
                var blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'orders.csv';
                a.click();
            });

            $('#bulk-download-manager-btn').on('click', function () { toast('إدارة الملفات (غير مفعلة في النسخة التجريبية)'); });

            render();
        });
    </script>
</body>

</html>
