document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || !root || !root.contains(el)) return;
  if (el.disabled) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el.getAttribute('data-a'), el.getAttribute('data-b'), el.getAttribute('data-c'));
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (!el.getAttribute || !el.getAttribute('data-input')) return;
  if (el.getAttribute('inputmode')==='numeric'){
    // digits only (Arabic-Indic digits are accepted and converted)
    var pos = el.selectionStart, v = el.value.replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0) - 0x0660); });
    var clean = v.replace(/[^0-9]/g, '');
    if (clean !== el.value){ pos = Math.max(0, pos - (v.length - clean.length)); el.value = clean; try { el.setSelectionRange(pos, pos); } catch(err){} }
  }
  var fn = ACT[el.getAttribute('data-input')];
  if (fn) fn(el.value, el.getAttribute('data-a'));
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (!el.getAttribute || !el.getAttribute('data-change')) return;
  var fn = ACT[el.getAttribute('data-change')];
  if (fn) fn(el.value, el.getAttribute('data-a'));
});
document.addEventListener('keydown', function(e){
  if (e.key==='Escape' && S.callOpen){ ACT.closeCall(); return; }
  if (e.key==='Escape' && S.poolOpen){ ACT.closePool(); return; }
  if (e.key==='Escape' && S.overlay){
    if (S.overlay==='confirm') ACT.cancelConfirm();
    else if (S.overlay==='addCases') ACT.closeAddCases();
    else { closeAllOverlays(); render(); }
  }
});

// ---------- drag & drop (DOM-only hover state, no re-render while dragging) ----------
var drag = null;
document.addEventListener('dragstart', function(e){
  if (!isAdmin()) return;
  var tEl = e.target.closest && e.target.closest('[data-drag-type],[data-drag-task]');
  if (!tEl) return;
  drag = tEl.hasAttribute('data-drag-type') ? {type:tEl.getAttribute('data-drag-type')} : {task:tEl.getAttribute('data-drag-task')};
  try { e.dataTransfer.setData('text/plain', 'x'); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
});
document.addEventListener('dragover', function(e){
  if (!drag) return;
  var col = e.target.closest && e.target.closest('[data-drop-day]');
  if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ if (x!==col) x.classList.remove('drop-hot'); });
  col.classList.add('drop-hot');
});
document.addEventListener('drop', function(e){
  if (!drag) return;
  var col = e.target.closest && e.target.closest('[data-drop-day]');
  e.preventDefault();
  var d = drag; drag = null;
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ x.classList.remove('drop-hot'); });
  if (!col) return;
  var off = parseInt(col.getAttribute('data-drop-day'),10);
  if (d.type) openCreate(d.type, off); else if (d.task) moveTask(d.task, off);
});
document.addEventListener('dragend', function(){
  drag = null;
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ x.classList.remove('drop-hot'); });
});

// =====================================================================
// Call-center statistics drawer (same visual system as the visits page)
// =====================================================================
var DASH_TYPE_COLORS = {measurement:'#2f6fed', newDelivery:'#15803d', maintEval:'#f96a74', maintDelivery:'#ff6a00'};
var DASH_OUTCOME_COLORS = {booked:'#15803d', notInterested:'#97a0ad', noAnswer:'#dc2626', unavailable:'#f97316'};
var DASH_PERIODS = [['today','اليوم'],['week','الأسبوع'],['month','الشهر'],['quarter','ربع سنوي'],['year','سنوية']];
var DASH_HOURS = [9,10,11,12,13,14,15,16];

// mock history of earlier calls (stands in for the server) — per agent profile, answer rate by hour
var CALL_HISTORY = (function(){
  var out = [], s = 11;
  function r(){ s = (s*9301 + 49297) % 233280; return s/233280; }
  var prof = {a1:{calls:38, book:.62, show:.84}, a2:{calls:44, book:.52, show:.78}, a3:{calls:31, book:.45, show:.72}};
  var types = ['measurement','measurement','measurement','measurement','newDelivery','newDelivery','newDelivery','maintEval','maintEval','maintDelivery'];
  var ans = {9:.48, 10:.6, 11:.72, 12:.74, 13:.66, 14:.58, 15:.52, 16:.42};
  var T = daysBetween(BASE_SUNDAY, REAL_TODAY);
  var nowH = new Date().getHours();
  for (var d = T-400; d <= T; d++){
    var wd = dateOf(d).getDay(); if (wd===5) continue;
    AGENTS.forEach(function(a){
      var p = prof[a.id], n = Math.round(p.calls*(0.75 + r()*0.5)*(wd===6 ? 0.6 : 1));
      for (var i=0;i<n;i++){
        var h = 9 + Math.floor(r()*8), type = types[Math.floor(r()*types.length)];
        if (d===T && h >= nowH) continue;
        var incoming = r() < 0.07, outcome;
        if (!incoming && r() > ans[h]) outcome = r() < 0.72 ? 'noAnswer' : 'unavailable';
        else { var x = r(); outcome = x < p.book + 0.1 ? 'booked' : 'notInterested'; }
        var e = {d:d, h:h, agentId:a.id, type:type, outcome:outcome, incoming:incoming, att:null};
        if (outcome==='booked'){ var vd = d + 2 + Math.floor(r()*6); if (vd < T){ e.vd = vd; e.att = r() < p.show ? 'attended' : 'noShow'; } }
        out.push(e);
      }
    });
  }
  return out;
})();
function liveCallEvents(){
  return S.callLog.map(function(l){
    var t = findTask(l.taskId), dt = new Date(l.at), bt = l.bookTid ? findTask(l.bookTid) : t;
    var o = l.outcome==='bookedAlt' ? 'booked' : l.outcome;
    var e = {d:daysBetween(BASE_SUNDAY, dt), h:dt.getHours(), agentId:l.agentId, type:t ? t.type : 'measurement', outcome:o, incoming:l.callType==='وارد', att:null};
    if (o==='booked' && bt){ var a = S.attendance[nextCallKey(bt.id, l.caseId)]; e.att = a ? a.status : null; e.vd = bt.dateOffset; }
    return e;
  });
}
function dashRange(kind, step){
  var today = startOfDay(nowDate()), from, to;
  if (kind==='today'){ from = new Date(today.getTime()); from.setDate(from.getDate()+step); to = new Date(from.getTime()); }
  else if (kind==='week'){ from = new Date(today.getTime()); from.setDate(from.getDate()-from.getDay()+7*step); to = new Date(from.getTime()); to.setDate(to.getDate()+6); }
  else if (kind==='month'){ from = new Date(today.getFullYear(), today.getMonth()+step, 1); to = new Date(from.getFullYear(), from.getMonth()+1, 0); }
  else if (kind==='quarter'){ var q = Math.floor(today.getMonth()/3) + step; from = new Date(today.getFullYear(), q*3, 1); to = new Date(from.getFullYear(), from.getMonth()+3, 0); }
  else { from = new Date(today.getFullYear()+step, 0, 1); to = new Date(from.getFullYear(), 11, 31); }
  var f = daysBetween(BASE_SUNDAY, from), tt = Math.min(daysBetween(BASE_SUNDAY, to), daysBetween(BASE_SUNDAY, today));
  return {from:f, to:tt, label: f===tt ? isoDate(f) : isoDate(f) + ' - ' + isoDate(tt)};
}
// buckets for the trend chart
function dashBuckets(kind, R){
  var out = [];
  if (kind==='today') return DASH_HOURS.map(function(h){ return {label:h+':00', test:function(e){ return e.h===h; }}; });
  if (kind==='week' || kind==='month'){
    for (var d = R.from; d <= R.to; d++) (function(d){ var dd = dateOf(d); out.push({label: kind==='week' ? WEEKDAYS_AR[dd.getDay()] : String(dd.getDate()), test:function(e){ return e.d===d; }}); })(d);
    return out;
  }
  if (kind==='quarter'){
    for (var w = R.from; w <= R.to; w += 7) (function(w){ out.push({label:shortDate(w), test:function(e){ return e.d>=w && e.d<w+7; }}); })(w);
    return out;
  }
  var y = dateOf(R.from).getFullYear();
  for (var m = 0; m < 12; m++) (function(m){
    var a = daysBetween(BASE_SUNDAY, new Date(y, m, 1)), b = daysBetween(BASE_SUNDAY, new Date(y, m+1, 0));
    if (a <= R.to) out.push({label:MONTHS_AR[m], test:function(e){ return e.d>=a && e.d<=b; }});
  })(m);
  return out;
}
function pct(a, b){ return b ? Math.round(a/b*1000)/10 : 0; }
function nfmt(n){ return Number(n).toLocaleString('en-US'); }
function summarize(ev){
  var s = {calls:ev.length, answered:0, booked:0, incoming:0, attended:0, noShow:0, byOutcome:{}, byType:{}};
  Object.keys(DASH_OUTCOME_COLORS).forEach(function(k){ s.byOutcome[k] = 0; });
  Object.keys(TASK_TYPES).forEach(function(k){ s.byType[k] = {calls:0, booked:0}; });
  ev.forEach(function(e){
    if (NOT_ANSWERED.indexOf(e.outcome)===-1) s.answered++;
    if (e.incoming) s.incoming++;
    s.byOutcome[e.outcome] = (s.byOutcome[e.outcome]||0) + 1;
    if (s.byType[e.type]) s.byType[e.type].calls++;
    if (e.outcome==='booked'){ s.booked++; if (s.byType[e.type]) s.byType[e.type].booked++; if (e.att==='attended') s.attended++; else if (e.att==='noShow') s.noShow++; }
  });
  return s;
}
function dashData(){
  var R = dashRange(S.dashPeriod, S.dashStep);
  var all = CALL_HISTORY.concat(liveCallEvents()).filter(function(e){ return e.d>=R.from && e.d<=R.to; });
  var ev = S.dashAgent ? all.filter(function(e){ return e.agentId===S.dashAgent; }) : all;
  var sum = summarize(ev);
  var agents = AGENTS.map(function(a){
    var ae = all.filter(function(e){ return e.agentId===a.id; });
    var days = {}; ae.forEach(function(e){ days[e.d] = 1; });
    var s = summarize(ae); s.agent = a; s.days = Object.keys(days).length; return s;
  });
  var buckets = dashBuckets(S.dashPeriod, R).map(function(b){
    var be = ev.filter(b.test);
    return {label:b.label, calls:be.length, booked:be.filter(function(e){ return e.outcome==='booked'; }).length};
  });
  var hours = DASH_HOURS.map(function(h){
    var he = ev.filter(function(e){ return e.h===h && !e.incoming; });
    var ans = he.filter(function(e){ return FAILED_OUTCOMES.indexOf(e.outcome)===-1; }).length;
    return {label:h+':00', calls:he.length, rate:pct(ans, he.length)};
  });

// ---------- tiny SVG charts (Recharts look) ----------
function niceMax(v){ if (v<=0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function tipHtml(label, rows){
  return '<div class="t-label">'+esc(label)+'</div>' + rows.map(function(r){ return '<div class="t-row"><span class="t-dot" style="background:'+r[2]+'"></span><span>'+esc(r[0])+': <b>'+esc(r[1])+'</b></span></div>'; }).join('');
}
function svgFrame(W, H, pl, pb, pt, max, unit){
  var h = '', n = 4;
  for (var i=0;i<=n;i++){
    var y = pt + (H-pt-pb) * (1 - i/n), v = max*i/n;
    h += '<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="#e2e5ea" stroke-dasharray="3 3"/>';
    h += '<text x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+(Math.round(v*10)/10)+(unit||'')+'</text>';
  }
  h += '<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="#d6d9df"/>';
  return h;
}
function xLabels(cats, W, H, pl, pb){
  var step = (W-pl-6)/cats.length, every = Math.ceil(cats.length/12), h = '';
  cats.forEach(function(c, i){ if (i % every===0) h += '<text x="'+(pl+step*(i+0.5))+'" y="'+(H-pb+15)+'" text-anchor="middle">'+esc(c)+'</text>'; });
  return h;
}
function svgBars(cats, series, opts){
  opts = opts || {};
  var W = opts.w || 560, H = opts.h || 200, pl = 38, pb = 24, pt = 8;
  var max = opts.max || niceMax(Math.max.apply(null, [0].concat(series.map(function(s){ return Math.max.apply(null, s.values); }))));
  var h = '<svg class="vs-svg" viewBox="0 0 '+W+' '+H+'">' + svgFrame(W, H, pl, pb, pt, max, opts.unit);
  var gw = (W-pl-6)/cats.length, bw = Math.min(30, gw*0.72/series.length);
  cats.forEach(function(c, i){
    var x0 = pl + gw*i + (gw - bw*series.length)/2;
    var tip = esc(tipHtml(c, series.map(function(s){ return [s.name, (opts.fmt ? opts.fmt(s.values[i], i) : nfmt(s.values[i])), s.color]; })));
    h += '<rect x="'+(pl+gw*i)+'" y="'+pt+'" width="'+gw+'" height="'+(H-pt-pb)+'" fill="transparent" data-tip="'+tip+'"/>';
    series.forEach(function(s, k){
      var v = s.values[i], bh = (H-pt-pb) * v/max;
      h += '<rect x="'+(x0+bw*k)+'" y="'+(H-pb-bh)+'" width="'+(bw-2)+'" height="'+Math.max(0,bh)+'" rx="3" fill="'+s.color+'" data-tip="'+tip+'"/>';
    });
  });
  return h + xLabels(cats, W, H, pl, pb) + '</svg>' + legend(series);
}
function svgLine(cats, series, opts){
  opts = opts || {};
  var W = 560, H = opts.h || 220, pl = 38, pb = 24, pt = 8;
  var max = niceMax(Math.max.apply(null, [0].concat(series.map(function(s){ return Math.max.apply(null, s.values); }))));
  var h = '<svg class="vs-svg" viewBox="0 0 '+W+' '+H+'">' + svgFrame(W, H, pl, pb, pt, max);
  var step = (W-pl-6)/cats.length;
  function X(i){ return pl + step*(i+0.5); }
  function Y(v){ return H-pb - (H-pt-pb)*v/max; }
  series.forEach(function(s){
    h += '<polyline fill="none" stroke="'+s.color+'" stroke-width="2.2" points="'+s.values.map(function(v,i){ return X(i)+','+Y(v); }).join(' ')+'"/>';
    if (cats.length <= 31) s.values.forEach(function(v,i){ h += '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>'; });
  });
  cats.forEach(function(c, i){
    var tip = esc(tipHtml(c, series.map(function(s){ return [s.name, nfmt(s.values[i]), s.color]; })));
    h += '<rect x="'+(pl+step*i)+'" y="'+pt+'" width="'+step+'" height="'+(H-pt-pb)+'" fill="transparent" data-tip="'+tip+'"/>';
  });
  return h + xLabels(cats, W, H, pl, pb) + '</svg>' + legend(series);
}
function legend(series){
  if (series.length < 2) return '';
  return '<div class="vs-legend">'+series.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>'; }).join('')+'</div>';
}

  return !!(att && att.status==='attended');
}
function openMaintenance(id){ var c = CASE_MAP[id]; return !!(c && (c.stage==='maintEval' || c.stage==='maintDelivery') && !maintenanceClosed(id)); }
function emptyInboundForm(){ return {date:isoDate(todayOffset()), callType:'وارد', place:'', notes:'', responsible:'', reason:'', showHist:false}; }

function renderInbound(){
  var ib = S.inbound, q = (ib.q||'').trim();
  var h = '<div class="inb-bar"><div class="inb-title">'+ic('phone',15,'#2f6fed')+' مكالمة واردة</div>'+
    '<input class="cms-input inb-search" placeholder="ابحث باسم الحالة أو الكود أو التليفون" value="'+esc(ib.q)+'" data-k="inb-q" data-input="inboundSearch"/>';
  if (q.length >= 2 && !ib.pick){
    var qu = q.toUpperCase();
    var res = DELIVERED.filter(function(d){ return d.name.indexOf(q)!==-1 || d.code.indexOf(qu)!==-1 || d.phone.indexOf(q)!==-1; }).slice(0, 8);
    h += '<div class="inb-results">' + (res.length ? res.map(function(d){
      return '<div class="inb-item"'+A('inboundPick', d.id)+'><b>'+esc(d.name)+'</b><span class="case-code" dir="ltr">'+d.code+'</span><span>'+esc(d.gov)+'</span><span dir="ltr">'+fmtPhone(d.phone)+'</span>'+
        (openMaintenance(d.id) ? '<span class="prio-badge">عنده طلب صيانة مفتوح</span>' : '<span class="inb-muted">استلم <span dir="ltr">'+d.delivered+'</span></span>')+'</div>';
    }).join('') : '<div class="inb-empty">لم يتم العثور علي أي نتائج</div>') + '</div>';
  }
  return h + '</div>';
}
function profRow(k, v){ return '<div class="pf-k">'+k+':</div><div class="pf-v">'+esc(v==null || v==='' ? '-' : v)+'</div>'; }
function renderInboundCase(){
  var d = DELIVERED_MAP[S.inbound.pick]; if (!d) return '';
  var f = S.inbound.form, open = openMaintenance(d.id);
  var h = '<div class="inb-case"><div class="cms-head"><div class="cms-title">'+ic('user',15,'#535252')+' '+esc(d.name)+' – طلب صيانة</div>'+
    '<button class="cms-close" title="رجوع لقائمتي"'+A('inboundClose')+'>'+ic('x',15,'#535252',2.4)+'</button></div><div class="cms-body">';
  h += '<div class="pf-grid">'+
    profRow('كود الطرف', d.code)+'<div></div><div></div>'+
    profRow('رقم الهوية', d.nid)+profRow('اسم الحالة', d.name)+
    profRow('الحالة الإجتماعية', d.marital)+profRow('النوع', d.gender)+
    profRow('تاريخ الميلاد', d.birth)+profRow('المحافظة', d.gov)+
    profRow('القسم او المركز', d.markaz)+profRow('المنطقة او الشياخة', d.area)+
    profRow('عنوان الإقامة', d.address)+profRow('العنوان بالبطاقة', d.cardAddress)+
    profRow('التليفون', d.phone)+profRow('رقم هاتف 1', d.phone1)+
    profRow('رقم هاتف 2', d.phone2)+profRow('المؤهل الدراسى', d.edu)+
    profRow('الوظيفة', d.job)+profRow('كيف عرفتنا', d.howKnown)+
    profRow('الأمراض المزمنة', d.chronic)+profRow('الوزن', d.weight)+
    profRow('مستوى البتر', d.level)+profRow('البتر بالطرف', d.side)+
    profRow('تاريخ البتر', d.ampDate)+profRow('سبب البتر', d.cause)+
    profRow('تفاصيل سبب البتر', d.causeDetails)+profRow('تاريخ اخر جراحة في مكان البتر', d.lastSurgery)+
    profRow('تاريخ استلام الطرف', d.delivered)+profRow('التمويل', d.funding)+'</div>';
  if (open) h += '<div class="rule-hint warn">الحالة عندها طلب صيانة مفتوح بالفعل</div>';
  // maintenance request form (same fields as the CMS)
  function sel(field, opts){ return '<select class="cms-input" data-change="inboundField" data-a="'+field+'"><option value="">اختر</option>'+opts.map(function(o){ return '<option'+(f[field]===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+'</select>'; }
  h += '<div class="cms-form" style="margin-top:16px;border-top:1px solid #eee;padding-top:16px;">';
  h += '<div class="cms-row"><label class="cms-label">تاريخ تقديم الطلب <span class="req">*</span></label><div class="cms-field"><input class="cms-input" type="date" value="'+esc(f.date)+'" data-k="inb-date" data-input="inboundField" data-a="date"/></div>'+
    '<label class="cms-label">نوع المكالمة <span class="req">*</span></label><div class="cms-field">'+sel('callType', ['وارد','صادر'])+'</div></div>';
  h += '<div class="cms-row"><label class="cms-label">مكان الصيانة <span class="req">*</span></label><div class="cms-field">'+sel('place', ['داخل المؤسسة', 'قافلة – ' + d.gov])+'</div>'+
    '<label class="cms-label">الملاحظات <span class="req">*</span></label><div class="cms-field"><textarea class="cms-input" rows="2" placeholder="الملاحظات" data-k="inb-notes" data-input="inboundField" data-a="notes">'+esc(f.notes)+'</textarea></div></div>';
  h += '<div class="cms-row"><label class="cms-label">هل يوجد مسئول عن الحالة <span class="req">*</span></label><div class="cms-field">'+sel('responsible', ['لا','نعم'])+'</div>'+
    '<label class="cms-label">سبب الصيانة <span class="req">*</span></label><div class="cms-field">'+sel('reason', MAINT_REASONS)+
    '<button class="cms-btn inb-changes"'+A('inboundHist')+'>'+ic('history',12,'#fff')+' التغييرات التي تمت ('+d.requests.length+')</button></div></div>';
  if (f.showHist){
    h += '<table class="cms-table" style="margin-bottom:12px;"><thead><tr><th>تاريخ الطلب</th><th>نوع المكالمة</th><th>مكان الصيانة</th><th>سبب الصيانة</th><th>الملاحظات</th><th>بواسطة</th></tr></thead><tbody>'+
      (d.requests.length ? d.requests.slice().reverse().map(function(x){ return '<tr><td dir="ltr" style="text-align:right;">'+x.date+'</td><td>'+esc(x.callType)+'</td><td>'+esc(x.place)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.notes)+'</td><td>'+esc(x.by)+'</td></tr>'; }).join('')
        : '<tr><td colspan="6" class="cms-empty">لم يتم العثور علي أي نتائج</td></tr>')+'</tbody></table>';
  }
  h += '<div class="cms-actions" style="justify-content:flex-start;"><button class="cms-btn cms-add"'+A('inboundAdd')+(open?' disabled style="opacity:.5;cursor:not-allowed;"':'')+'>'+pathIc('M12 5v14M5 12h14',13,'#fff',3)+' أضف</button></div>';
  return h + '</div></div></div>';
}
Object.assign(ACT, {
  inboundSearch: function(v){ S.inbound.q = v; S.inbound.pick = null; render(); },
  inboundPick: function(id){ S.inbound.pick = id; S.inbound.form = emptyInboundForm(); render(); },
  inboundClose: function(){ S.inbound = {q:'', pick:null, form:emptyInboundForm()}; render(); },
  inboundField: function(v, field){ S.inbound.form[field] = v; render(); },
  inboundHist: function(){ S.inbound.form.showHist = !S.inbound.form.showHist; render(); },
  inboundAdd: function(){
    var d = DELIVERED_MAP[S.inbound.pick], f = S.inbound.form; if (!d || openMaintenance(d.id)) return;
    var miss = [['date','تاريخ تقديم الطلب'],['callType','نوع المكالمة'],['place','مكان الصيانة'],['notes','الملاحظات'],['responsible','هل يوجد مسئول عن الحالة'],['reason','سبب الصيانة']]
      .filter(function(x){ return !String(f[x[0]]||'').trim(); });
    if (miss.length){ toast('اكمل: ' + miss.map(function(x){ return x[1]; }).join('، ')); return render(); }
    var convoy = f.place.indexOf('قافلة')===0;
    // the case becomes a maintenance request waiting for "تقييم الصيانة"
    var c = CASE_MAP[d.id];
    if (!c){
      c = mk(d.id, d.name, d.gov, d.funding, d.level, d.age, 0, convoy ? 'قافلة' : 'داخل المؤسسة', 'maintEval', 0, 0);
      c.phone = d.phone; c.code = d.code;
      CASES.push(c); CASE_MAP[c.id] = c;
    } else { if (S.bookings.maintDelivery) delete S.bookings.maintDelivery[c.id]; if (S.bookings.maintEval) delete S.bookings.maintEval[c.id]; c.stage = 'maintEval'; c.order = 'maintenance'; c.waitingDays = 0; c.ready = null; c.pref = convoy ? 'قافلة' : 'داخل المؤسسة'; }
    d.requests.push({date:f.date, callType:f.callType, place:f.place, reason:f.reason, notes:f.notes.trim(), responsible:f.responsible, by:agentName(S.agentId)});
    // nearest published "تقييم الصيانة" day with room, in the requested place
    var tOff = todayOffset();
    var target = S.tasks.filter(function(t){
      return t.type==='maintEval' && t.status==='published' && t.dateOffset>=tOff && taskBookedCount(t) < bookingGoal(t) &&
        (convoy ? (t.loc==='convoy' && t.gov===d.gov) : t.loc==='org');
    }).sort(function(a,b){ return a.dateOffset - b.dateOffset; })[0];
    S.callLog.push({id:'L'+Date.now(), taskId: target ? target.id : null, caseId:c.id, agentId:S.agentId, at:now(), outcome:'maintRequest',
      callType:f.callType, note:f.reason + ' – ' + f.notes.trim()});
    S.inbound = {q:'', pick:null, form:emptyInboundForm()};
    if (!target){
      toast('اتسجل طلب الصيانة ونزل في حصالة تقييم صيانة – مفيش موعد تقييم صيانة متاح');
      return render();
    }
    if (target.candidateIds.indexOf(c.id)===-1) target.candidateIds.push(c.id);
    target.assignee[c.id] = S.agentId;
    target.priority = target.priority || {}; target.priority[c.id] = true;
    S.callOpen = {tid:target.id, cid:c.id};
    S.callDraft = {callType:f.callType, outcome:'booked', bookTid:target.id, bookTime:'', note:''};
    toast('اتسجل طلب الصيانة – حدد الحجز');
    render();
  },
});

// =====================================================================
// Init
// =====================================================================
root = document.getElementById('root');
loadFunding();
render();
// keep clocks / countdowns fresh without disturbing typing
setInterval(function(){
  var ae = document.activeElement;
  if (ae && (ae.tagName==='TEXTAREA' || ae.tagName==='INPUT') && ae.type!=='checkbox') return;
  render();
}, 30000);

</script>
