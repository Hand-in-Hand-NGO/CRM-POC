<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>غرفة العمليات</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#f3f4f7; --surface:#ffffff; --surface-alt:#f8f9fb;
      --border:#e3e5ea; --border-strong:#cdd1d9;
      --text:#1b2130; --text-muted:#5b6472; --text-faint:#98a0ac;
      --brand-meas:#2563eb; --brand-meas-tint:#eaf1ff;
      --brand-newd:#059669; --brand-newd-tint:#e6f7f1;
      --brand-eval:#c2660a; --brand-eval-tint:#fdf1e0;
      --brand-maintd:#7c3aed; --brand-maintd-tint:#f2eafd;
      --success:#15803d; --success-tint:#e9f7ee;
      --danger:#c81e3a; --danger-tint:#fceced;
      --warning:#b45309; --warning-tint:#fdf1e0;
      --neutral-tint:#eef0f3;
      --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
      --shadow-sm:0 1px 2px rgba(20,24,34,.06);
      --shadow-md:0 6px 20px rgba(20,24,34,.12);
      --shadow-lg:0 16px 48px rgba(20,24,34,.22);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    .app{
      font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; width:100%; position:relative;
      -webkit-font-smoothing:antialiased;
    }
    a{color:var(--brand-meas);text-decoration:none;}
    a:hover{color:#1d4ed8;}
    button{font-family:inherit;}
    ::selection{background:#c9dcff;}

    /* ---------- top bar ---------- */
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 22px; background:var(--surface); border-bottom:1px solid var(--border);
    }
    .brandblock{display:flex; align-items:center; gap:10px;}
    .brand-mark{
      width:34px;height:34px;border-radius:9px;background:#101828;
      display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    }
    .page-title{font-size:18px;font-weight:800;color:var(--text);}
    .page-subtitle{font-size:12px;color:var(--text-muted);margin-top:1px;}
    .topbar-right{display:flex;align-items:center;gap:10px;}
    .role-pill{
      display:flex;align-items:center;gap:7px;background:var(--surface-alt);
      border:1px solid var(--border); border-radius:999px; padding:6px 12px;font-size:12.5px;color:var(--text-muted);
    }
    .role-pill b{color:var(--text);font-weight:700;}
    .role-dot{width:7px;height:7px;border-radius:50%;background:#2563eb;flex:0 0 auto;}

    /* ---------- sub bar : nav + filters ---------- */
    .subbar{
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
      padding:12px 22px; background:var(--surface); border-bottom:1px solid var(--border);
    }
    .view-nav{display:flex;align-items:center;gap:6px;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:3px;}
    .view-btn{
      border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;
      color:var(--text-muted);cursor:pointer;
    }
    .view-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);}
    .view-btn.disabled{color:var(--text-faint);cursor:not-allowed;}
    .week-nav{display:flex;align-items:center;gap:8px;}
    .nav-arrow{
      width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
      display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);
    }
    .nav-arrow:hover{border-color:var(--border-strong);color:var(--text);}
    .week-label{font-size:13.5px;font-weight:700;color:var(--text);min-width:150px;text-align:center;}
    .today-btn{
      border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;
      font-size:12.5px;font-weight:700;color:var(--text-muted);cursor:pointer;
    }
    .today-btn:hover{border-color:var(--border-strong);color:var(--text);}
    .type-filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
    .type-filter-label{font-size:12px;color:var(--text-faint);margin-left:2px;}
    .type-chip{
      display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--border);
      background:var(--surface);font-size:12.5px;font-weight:700;color:var(--text-muted);cursor:pointer;
    }
    .type-chip .sw{width:8px;height:8px;border-radius:2px;}
    .type-chip.active{background:var(--tint);border-color:var(--edge);color:var(--edge);}

    /* ---------- palette ---------- */
    .palette-row{padding:14px 22px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
    .palette-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;}
    .palette-title{font-size:12.5px;font-weight:700;color:var(--text-muted);}
    .palette-hint{font-size:11.5px;color:var(--text-faint);}
    .palette-chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .palette-spacer{flex:1;}
    .forever-btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:20px;padding:0 14px;font:inherit;font-size:20px;line-height:28px;font-weight:700;cursor:pointer;color:var(--text);}
    .forever-btn.on{background:var(--brand-meas);border-color:var(--brand-meas);color:#fff;}
    .series-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:8px 12px;}
    .series-row .btn{margin-inline-start:auto;}
    .pick-all{margin:10px 0 0;font-weight:700;}
    .pick-list li{cursor:pointer;align-items:center;border-color:var(--border) !important;background:var(--surface) !important;gap:10px;}
    .pick-list li.on{background:#f3f7ff !important;border-color:#bcd3ff !important;}
    .pick-list li span{flex:1;}
    .pick-list li b{color:var(--text) !important;}
    .pick-list input{pointer-events:none;width:15px;height:15px;}
    .btn-emg{background:var(--danger) !important;color:#fff !important;border-color:var(--danger) !important;}
    .emg-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .emg-bar .btn-emg{display:inline-flex;align-items:center;gap:6px;}
    .cms-btn.btn-emg{margin-inline-start:8px;display:inline-flex;align-items:center;gap:5px;}
    .emg-line{display:flex;align-items:center;gap:5px;width:100%;margin:-4px 0 10px;border:1px solid #f3b9c3;background:#fff7f8;color:var(--danger);border-radius:8px;padding:4px 8px;font:inherit;font-size:11px;font-weight:800;cursor:pointer;}
    .emg-pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 12px;margin-bottom:6px;font:inherit;cursor:pointer;text-align:right;}
    .emg-pick:hover{border-color:#f3b9c3;background:#fff7f8;}
    .emg-pick span,.emg-who span{font-size:11.5px;color:var(--text-muted);}
    .emg-who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff7f8;border:1px solid #f3b9c3;border-radius:10px;padding:9px 12px;margin-bottom:14px;}
    .emg-who .link-btn{margin-inline-start:auto;}
    .cap-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .cap-type{border:1px solid var(--border);border-inline-start:3px solid var(--edge);border-radius:10px;padding:9px 11px;background:var(--surface-alt);}
    .cap-type-head{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-bottom:6px;}
    /*__PFCSS_START__*/
    .prof-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid #b9dcf5;background:#e6f1fb;color:#0b6db0;border-radius:15px;padding:1px 9px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;vertical-align:middle;margin-inline-start:6px;line-height:1.7;}
    .prof-btn:hover{background:#0093e9;color:#fff;border-color:#0093e9;}
    .pf-scrim{position:fixed;inset:0;background:rgba(15,18,26,.42);z-index:1060;}
    .pf-modal{position:fixed;top:50%;right:50%;transform:translate(50%,-50%);width:1180px;max-width:96vw;max-height:94vh;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 16px 48px rgba(20,24,34,.22);z-index:1061;text-align:right;direction:rtl;}
    .pf-modal .prof-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(90deg,#d3f1f8 0%,#ebf6ed 17%,#fff9e4 34%,#f9e7de 47%,#f8f2e4 57%,#d9eaf4 64%,#e9efec 74%,#baeae6 100%);color:#535252;font-size:14px;border-radius:14px 14px 0 0;}
    .pf-modal .prof-body{overflow:auto;padding:14px 18px;flex:1;}
    .pf-modal .prof-foot{padding:10px 16px;border-top:1px solid #e3e5ea;}
    .pf-modal .cms-close{border:none;background:transparent;cursor:pointer;padding:2px;opacity:.75;}
    .pf-modal .cms-row{display:grid;grid-template-columns:170px minmax(0,1fr) 170px minmax(0,1fr);gap:10px 14px;align-items:start;margin-bottom:10px;}
    .pf-modal .cms-label{font-size:13px;font-weight:700;color:#333;padding-top:7px;margin:0;}
    .pf-modal .cms-label .req{color:#dd4b39;}
    .pf-modal .cms-input{width:100%;border:1px solid #d2d6de;border-radius:0;padding:6px 10px;font:inherit;font-size:13px;background:#fff;color:#333;min-height:32px;}
    .pf-modal .cms-input:focus{outline:none;border-color:#3c8dbc;}
    .pf-modal .cms-input.nc-miss{border-color:#dd4b39;background:#fff6f5;}
    .pf-modal .cms-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:3px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;}
    .pf-modal .cms-add{background:#00a65a;border-color:#008d4c;}
    .pf-modal .cms-table{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid #ddd;}
    .pf-modal .cms-table th{background:#fff;border:1px solid #ddd;padding:8px;text-align:right;font-weight:700;color:#333;}
    .pf-modal .cms-table td{border:1px solid #ddd;padding:7px 8px;color:#333;vertical-align:top;}
    .pf-modal .cms-table tbody tr:nth-child(odd){background:#f9f9f9;}
    .pf-modal .cms-empty{text-align:center;color:#555;}
    .pf-modal .cms-ro{background:#eee;border:1px solid #d2d6de;padding:5px 10px;font-size:12.5px;min-height:30px;color:#555;}
    .pf-modal .cms-del{border:0;background:#f96a74;color:#fff;border-radius:4px;width:24px;height:22px;cursor:pointer;}
    .pf-panel{border:1px solid #d7dbe0;border-radius:6px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
    .pf-panel-head{background:#f4f4f4;border-bottom:1px solid #d7dbe0;padding:8px 12px;font-size:12.5px;color:#444;}
    .pf-panel-body{padding:12px;}
    .pf-upload{display:flex;justify-content:flex-end;margin-bottom:12px;}
    .pf-upload .cms-btn{cursor:pointer;border-radius:0;margin:0;}
    .pf-upload input[type=file]{display:none !important;}
    .pf-up-file{background:#0093e9 !important;} .pf-up-video{background:#31c860 !important;}
    .pf-form{padding:4px 0;}
    .pf-result{background:#00c0ef;color:#fff;font-weight:700;font-size:12.5px;padding:12px 14px;margin:6px 0 14px;border-radius:2px;}
    .pf-result.ok{background:#31c860;}
    .pf-band{padding:8px 14px;margin-bottom:8px;}
    .pf-band.b-purple{background:#f6eefb;} .pf-band.b-orange{background:#fdf3ea;} .pf-band.b-blue{background:#eef5fc;} .pf-band.b-green{background:#eefbf0;}
    .pf-band .cms-row{margin:4px 0;}
    .pf-kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px;}
    .pf-kv{display:grid;grid-template-columns:180px 1fr;gap:10px;font-size:12px;padding:5px 0;}
    .pf-kv span{font-weight:700;color:#333;} .pf-kv b{font-weight:400;color:#555;}
    .pf-yn{display:inline-flex;border:1px solid #ccc;}
    .pf-yn button{border:0;background:#fff;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
    .pf-yn button.on{background:#ddd;font-weight:700;} .pf-yn button.on.off{background:#f96a74;color:#fff;}
    .pf-changes{background:#f96a74 !important;width:100%;justify-content:center;}
    .pf-status.post{color:#b45309;font-weight:700;} .pf-status.ok{color:#15803d;font-weight:700;}
    .pf-reason{font-size:12.5px;color:#555;padding-top:7px;}
    .pf-hint{font-size:11.5px;color:#888;padding-top:8px;display:block;}
    .sva-sec{border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;margin-bottom:8px;text-align:right;}
    .sva-t{font-weight:800;font-size:13px;color:#0b6db0;margin-bottom:4px;}
    .sva-q{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #eef0f3;}
    .sva-q:last-child{border-bottom:0;}
    .sva-rate{font-weight:800;white-space:nowrap;} .sva-rate.r5,.sva-rate.r4{color:#15803d;} .sva-rate.r3{color:#b45309;} .sva-rate.r2,.sva-rate.r1{color:#c81e3a;}
    .sva-txt{font-weight:700;color:#333;} .sva-none{color:#aaa;}
    .sva-note{font-size:12px;color:#7a5a00;background:#fffbea;border-radius:6px;padding:5px 8px;margin-top:6px;}
    /*__PFCSS_END__*/
    .sv-intro{display:flex;gap:8px;align-items:center;background:#e6f1fb;color:#0b5f96;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;}
    .sv-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
    .sv-row.later{opacity:.6;}
    .sv-row .q-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;}
    .sv-acts{display:flex;gap:6px;}
    .sv-case{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;}
    .sv-sec{border:1px solid #e5e7eb;border-radius:10px;padding:10px 14px;margin-bottom:10px;}
    .sv-sec-t{font-weight:800;font-size:13.5px;color:#0b6db0;margin-bottom:8px;}
    .sv-q{margin-bottom:10px;}
    .sv-q-t{font-size:13px;font-weight:700;color:#333;margin-bottom:6px;}
    .sv-rates{display:flex;gap:6px;flex-wrap:wrap;}
    .sv-rates button{display:inline-flex;align-items:center;gap:5px;border:1px solid #d2d6de;background:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;}
    .sv-rates button b{font-size:13px;}
    .sv-rates button.on.r5,.sv-rates button.on.r4{background:#15803d;border-color:#15803d;color:#fff;}
    .sv-rates button.on.r3{background:#b45309;border-color:#b45309;color:#fff;}
    .sv-rates button.on.r2,.sv-rates button.on.r1{background:#c81e3a;border-color:#c81e3a;color:#fff;}
    .sv-choices{display:flex;gap:6px;flex-wrap:wrap;}
    .sv-choices button{border:1px solid #d2d6de;background:#fff;border-radius:20px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer;}
    .sv-choices button.on{background:#334155;border-color:#334155;color:#fff;}
    .sv-note{margin-top:4px;font-size:12px;}
    .sv-alerts{margin:6px 0 0;padding-right:18px;font-size:12.5px;color:#7f1d1d;}
    .sv-avg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
    .sv-avg-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface);display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;font-size:12.5px;font-weight:700;}
    .sv-avg-card b{font-size:18px;}
    .sv-avg-card .cap-track{grid-column:1/-1;}
    .sv-avg-card em{grid-column:1/-1;font-style:normal;font-size:11px;color:var(--text-faint);font-weight:400;}
    .kpi.kpi-alert b{color:var(--danger);}
    .sv-kpi b{display:block;font-size:22px;font-weight:800;line-height:1.2;} .sv-kpi span{display:block;font-size:12px;color:var(--text-muted);}
    .notif-btn{position:relative;}
    .notif-n{background:#c81e3a;color:#fff;border-radius:10px;padding:0 6px;font-size:10.5px;font-weight:800;margin-inline-start:4px;}
    .fn-item{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
    .fn-item.new{border-color:#93c5fd;background:#f5f9ff;}
    .fn-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;}
    .fn-new{background:#0093e9;color:#fff;border-radius:10px;padding:0 8px;font-size:10.5px;font-weight:800;}
    .fn-day{display:inline-flex;align-items:center;gap:4px;background:#e6f1fb;color:#0b6db0;border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:700;}
    .fn-text{font-size:13.5px;margin:6px 0;}
    .fn-cases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
    .fn-case{font-size:11.5px;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:2px 8px;}
    .fn-acts{display:flex;gap:6px;flex-wrap:wrap;}
    .cf-opt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:12.5px;}
    .confirm-days{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
    .cf-opt .switch-row{white-space:nowrap;}
    .cap-break{margin-top:8px;font-size:12px;}
    .cap-break div{display:grid;grid-template-columns:110px 1fr auto;gap:8px;padding:4px 0;border-top:1px dashed var(--border);}
    .cap-break b{font-weight:800;}
    .set-sub{font-size:12px;font-weight:700;color:var(--text-muted);margin:12px 0 6px;}
    .pool-filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
    .week-row-head{padding:14px 22px 0;font-size:12.5px;font-weight:800;color:var(--text-muted);}
    .month-weeks .calendar-grid{border-bottom:1px solid var(--border);padding-bottom:18px;}
    .day-col.other-month{opacity:.5;}
    .day-month{font-size:11px;font-weight:700;color:var(--text-faint);margin-inline-start:4px;}
    .confirm-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;background:var(--success-tint);border-radius:10px;padding:8px 12px;margin:-6px 0 14px;}
    .palette-chip{
      display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:999px;border:1.5px dashed var(--edge);
      background:#fff;cursor:grab;user-select:none;
      transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .palette-chip:hover{background:var(--tint);}
    .palette-chip .grip{display:inline-flex;opacity:.7;}
    .palette-chip:active{cursor:grabbing;}
    .palette-chip:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
    .palette-chip.disabled{opacity:.55;cursor:not-allowed;border-style:solid;}
    .palette-chip.disabled:hover{transform:none;box-shadow:none;}
    .palette-ic{width:24px;height:24px;border-radius:50%;background:var(--edge);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .palette-text{display:flex;flex-direction:column;gap:1px;}
    .palette-label{font-size:13px;font-weight:700;color:var(--edge);}
    .palette-sub{font-size:10.5px;color:var(--text-muted);}
    .lock-badge{margin-right:auto;color:var(--text-faint);}

    /* ---------- calendar ---------- */
    .calendar-grid{display:flex;gap:0;padding:16px 22px 40px;align-items:flex-start;}
    .day-col{flex:1 1 0;min-width:0;border-right:1px solid var(--border);padding:0 9px;transition:background .12s ease;}
    .day-col:first-child{border-right:none;}
    .day-col.is-today{background:#eef4ff;border-radius:12px;box-shadow:inset 0 0 0 2px #93b8ff;padding-top:8px;margin-top:-8px;padding-bottom:8px;border-right-color:transparent;}
    .day-col.is-today + .day-col{border-right-color:transparent;}
    .day-col.is-today .day-num{color:var(--brand-meas);}
    .day-col.drop-hot .day-body{background:#eef4ff;border-color:#93b8ff;}
    .day-header{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px;}
    .day-header-left{display:flex;align-items:center;gap:7px;}
    .day-name{font-size:12.5px;font-weight:700;color:var(--text-muted);}
    .day-num{font-size:15px;font-weight:800;color:var(--text);}
    .today-badge{
      display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;
      border-radius:7px;background:#101828;color:#fff;font-size:11px;font-weight:800;
    }
    .day-body{
      min-height:300px;border:1.5px dashed transparent;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:8px;
    }
    .empty-day{
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
      padding:26px 8px;color:var(--text-faint);text-align:center;flex:1;
    }
    .empty-day span{font-size:11.5px;line-height:1.5;}

    .task-card{
      background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:pointer;
      box-shadow:var(--shadow-sm); position:relative; overflow:hidden; transition:opacity .12s ease, box-shadow .12s ease;
    }
    .task-card:hover{box-shadow:var(--shadow-md);}
    .task-card.today-card{border:2px solid var(--edge);background:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb, var(--edge) 22%, transparent), var(--shadow-md);}
    .task-card.dim{opacity:.32;}
    .task-card .bar{position:absolute;top:0;bottom:0;right:0;width:4px;}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:8px;}
    .card-type{display:flex;align-items:center;gap:7px;}
    .card-ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .card-title{font-size:13px;font-weight:800;color:var(--text);line-height:1.3;}
    .full-badge{
      font-size:9.5px;font-weight:800;background:var(--success-tint);color:var(--success);border-radius:5px;padding:2px 6px;white-space:nowrap;
    }
    .loc-badge{
      display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);
      background:var(--surface-alt);border:1px solid var(--border);border-radius:6px;padding:3px 7px;margin-bottom:9px;
    }
    .progress-line{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;}
    .book-nums{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:5px;font-size:11px;color:var(--text-muted);font-weight:600;white-space:nowrap;}
    .book-nums b{font-size:14px;font-weight:800;color:var(--text);}
    .progress-num{font-size:13px;font-weight:800;color:var(--text);}
    .progress-tag{font-size:10.5px;color:var(--text-faint);}
    .progress-track{height:6px;border-radius:99px;background:var(--neutral-tint);overflow:hidden;}
    .progress-fill{height:100%;border-radius:99px;}
    .candidates-line{margin-top:8px;font-size:11px;color:var(--text-faint);}

    /* ---------- month view ---------- */
    .month-wrap{padding:16px 22px 40px;}
    .month-weekday-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin-bottom:6px;}
    .month-weekday{text-align:center;font-size:12px;font-weight:700;color:var(--text-muted);padding:6px 0;}
    .month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;}
    .month-cell{
      min-height:96px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:8px;
      cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:box-shadow .12s ease,border-color .12s ease;
    }
    .month-cell:hover{box-shadow:var(--shadow-sm);border-color:var(--border-strong);}
    .month-cell.dim{background:var(--surface-alt);opacity:.5;}
    .month-cell.is-today .month-cell-date{
      background:#101828;color:#fff;border-radius:6px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    }
    .month-cell-date{font-size:12.5px;font-weight:800;color:var(--text);}
    .month-dots{display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
    .month-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
    .month-more{font-size:10px;font-weight:700;color:var(--text-faint);}

    /* ---------- scrim / overlays ---------- */
    .scrim{position:fixed;inset:0;background:rgba(15,18,26,.42);z-index:40;}
    .scrim-top{z-index:60;}
    .drawer{
      position:fixed;top:0;bottom:0;right:0;width:420px;max-width:92%;background:var(--surface);
      box-shadow:var(--shadow-lg);z-index:41;display:flex;flex-direction:column;
    }
    .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--border);}
    .drawer-head-left{display:flex;align-items:center;gap:10px;}
    .drawer-title{font-size:15.5px;font-weight:800;color:var(--text);}
    .drawer-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .icon-btn{
      width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
      display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);flex:0 0 auto;
    }
    .icon-btn:hover{border-color:var(--border-strong);color:var(--text);}
    .icon-btn.danger:hover{border-color:var(--danger);color:var(--danger);}
    .drawer-body{padding:18px 20px 90px;overflow-y:auto;flex:1;}
    .drawer-foot{
      position:absolute;bottom:0;right:0;left:0;padding:14px 20px;background:var(--surface);
      border-top:1px solid var(--border);display:flex;gap:10px;
    }
    .drawer{position:fixed;}
    .drawer-foot-wrap{margin-top:auto;}

    .field{margin-bottom:16px;}
    .field-label{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:7px;}
    .field-hint{font-size:11px;color:var(--text-faint);margin-top:5px;}
    .seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
    .seg-btn{
      flex:1;border:none;background:var(--surface);padding:9px 8px;font-size:12.5px;font-weight:700;color:var(--text-muted);
      cursor:pointer;border-left:1px solid var(--border);
    }
    .seg-btn:first-child{border-left:none;}
    .seg-btn.on{background:#eaf1ff;color:var(--brand-meas);}
    .text-input, .num-input, .select-input{
      width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--text);
      background:var(--surface);font-family:inherit;
    }
    .text-input:focus, .num-input:focus, .select-input:focus{outline:none;border-color:#93b8ff;box-shadow:0 0 0 3px #eaf1ff;}
    .readonly-box{
      display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:9px;
      padding:9px 11px;font-size:12.5px;color:var(--text-muted);background:var(--surface-alt);
    }
    .combo-wrap{position:relative;}
    .combo-list{
      position:absolute;top:calc(100% + 4px);right:0;left:0;background:var(--surface);border:1px solid var(--border);
      border-radius:9px;box-shadow:var(--shadow-md);max-height:190px;overflow-y:auto;z-index:5;
    }
    .combo-item{padding:9px 11px;font-size:12.5px;color:var(--text);cursor:pointer;}
    .combo-item:hover{background:var(--surface-alt);}
    .combo-empty{padding:10px 11px;font-size:12px;color:var(--text-faint);}
    .addcases-summary{
      display:flex;align-items:center;justify-content:space-between;border:1px dashed var(--border-strong);border-radius:9px;
      padding:10px 12px;font-size:12.5px;color:var(--text-muted);
    }
    .link-btn{border:none;background:none;color:var(--brand-meas);font-size:12.5px;font-weight:700;cursor:pointer;padding:0;}

    .btn{
      border-radius:9px;padding:10px 16px;font-size:13px;font-weight:800;cursor:pointer;border:1px solid transparent;
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
    }
    .btn-primary{background:#101828;color:#fff;}
    .btn-primary:hover{background:#000;}
    .btn-primary:disabled{background:#c7cbd3;cursor:not-allowed;}
    .btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border);}
    .btn-secondary:hover{border-color:var(--border-strong);}
    .btn-danger{background:var(--danger);color:#fff;}
    .btn-danger:hover{background:#a8122c;}
    .btn-outline-dashed{background:var(--surface);color:var(--text-muted);border:1.5px dashed var(--border-strong);}
    .btn-outline-dashed:hover{color:var(--text);border-color:var(--text-muted);}
    .btn-block{width:100%;}
    .btn-sm{padding:7px 11px;font-size:12px;border-radius:7px;}

    /* ---------- modal ---------- */
    .modal{
      position:fixed;top:50%;right:50%;transform:translate(50%,-50%);background:var(--surface);border-radius:14px;
      box-shadow:var(--shadow-lg);z-index:41;display:flex;flex-direction:column;max-height:88vh;
    }
    .modal-lg{width:920px;max-width:94vw;}
    .modal-sm{width:420px;max-width:92vw;z-index:61;}
    .modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
    .modal-body{padding:16px 22px;overflow-y:auto;flex:1;}
    .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-start;}

    .filters-bar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:10px;}
    .filter-field{display:flex;flex-direction:column;gap:5px;min-width:132px;}
    .filter-field label{font-size:10.5px;font-weight:700;color:var(--text-faint);}
    .filter-select, .filter-search{
      border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12.5px;color:var(--text);
      background:var(--surface);font-family:inherit;
    }
    .filter-search{min-width:190px;}
    .clear-btn{
      align-self:flex-end;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
      border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;
    }
    .clear-btn:hover{color:var(--text);border-color:var(--border-strong);}
    .chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
    .filter-chip{
      display:flex;align-items:center;gap:6px;background:#eaf1ff;color:var(--brand-meas);border-radius:999px;
      padding:4px 6px 4px 10px;font-size:11.5px;font-weight:700;
    }
    .filter-chip button{border:none;background:rgba(37,99,235,.14);color:var(--brand-meas);border-radius:50%;width:16px;height:16px;cursor:pointer;font-size:10px;line-height:1;}

    .count-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .count-main{font-size:13px;color:var(--text);}
    .count-main b{font-weight:800;}
    .count-selected{font-size:12.5px;color:var(--brand-meas);font-weight:700;}

    table.cases-table{width:100%;border-collapse:collapse;font-size:12.5px;}
    table.cases-table thead th{
      text-align:right;color:var(--text-faint);font-weight:700;font-size:11px;padding:8px 9px;border-bottom:1px solid var(--border);
      background:var(--surface-alt);position:sticky;top:0;z-index:3;white-space:nowrap;box-shadow:0 1px 0 var(--border);
    }
    table.cases-table tbody td{padding:9px 9px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
    table.cases-table tbody tr:hover{background:var(--surface-alt);}
    .table-empty{padding:34px 10px;text-align:center;color:var(--text-faint);font-size:12.5px;}
    input[type="checkbox"]{width:15px;height:15px;accent-color:#101828;cursor:pointer;}

    /* ---------- detail drawer specifics ---------- */
    .metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px;}
    .metric-box{border:1px solid var(--border);border-radius:9px;padding:9px 8px;text-align:center;background:var(--surface-alt);}
    .metric-val{font-size:16px;font-weight:800;color:var(--text);}
    .metric-lbl{font-size:9.5px;color:var(--text-faint);margin-top:2px;}
    .big-progress-label{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
    .big-progress-num{font-size:15px;font-weight:800;}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
    .info-item{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--surface-alt);}
    .info-item .k{font-size:10px;color:var(--text-faint);margin-bottom:3px;}
    .info-item .v{font-size:12.5px;font-weight:700;color:var(--text);}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 9px;}
    .section-title{font-size:12.5px;font-weight:800;color:var(--text);}
    .case-search{border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;width:170px;}
    .case-row{border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:8px;background:var(--surface);}
    .case-row.locked{background:var(--surface-alt);opacity:.75;}
    .case-row.inactive{opacity:.55;}
    .case-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
    .case-id-line{display:flex;align-items:center;gap:8px;}
    .case-code{font-size:10.5px;color:var(--text-faint);font-weight:700;}
    .case-name{font-size:13px;font-weight:700;color:var(--text);}
    .case-sub{font-size:11px;color:var(--text-muted);margin-top:3px;}
    .status-tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;font-size:10.5px;font-weight:700;white-space:nowrap;}
    .status-tag .dot{width:6px;height:6px;border-radius:50%;}
    .call-btn{
      display:flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface);border-radius:8px;
      padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--text);cursor:pointer;
    }
    .call-btn:hover{border-color:var(--brand-meas);color:var(--brand-meas);}
    .outcome-panel{margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;gap:7px;}
    .outcome-btn{
      border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;
      cursor:pointer;
    }
    .alt-wrap{margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);}
    .alt-title{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
    .alt-chip{
      display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;
      margin:0 0 6px 6px;font-size:11px;background:var(--surface-alt);
    }
    .alt-chip button{border:none;background:#101828;color:#fff;border-radius:6px;padding:4px 8px;font-size:10.5px;font-weight:700;cursor:pointer;}
    .alt-empty{font-size:11px;color:var(--text-faint);}
    .bulk-bar{
      display:flex;align-items:center;justify-content:space-between;background:#fceced;border:1px solid #f3b9c3;
      border-radius:9px;padding:8px 11px;margin-bottom:10px;font-size:12px;color:var(--danger);
    }
    .target-edit-row{display:flex;align-items:center;gap:8px;}


    .loading-overlay{
      position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    }
    .spinner{width:30px;height:30px;border-radius:50%;border:3px solid #dfe2e8;border-top-color:#101828;animation:spin 0.85s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-text{font-size:12.5px;color:var(--text-muted);font-weight:700;}

    /* =====================================================================
       Additions: capacity, draft/publish, auto-suggest, call queue, call log,
       retry rules, convoy info
       ===================================================================== */
    .topbar-right{flex-wrap:wrap;justify-content:flex-end;}
    .top-select{
      border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12.5px;font-family:inherit;
      background:var(--surface-alt);color:var(--text);font-weight:700;
    }
    .top-btn{
      display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
      border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--text-muted);cursor:pointer;
    }
    .top-btn:hover{border-color:var(--border-strong);color:var(--text);}

    .main-tabs{display:flex;gap:4px;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:3px;}
    .main-tab{
      display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;padding:7px 14px;border-radius:8px;
      font-size:13px;font-weight:800;color:var(--text-muted);cursor:pointer;
    }
    .main-tab.active{background:#101828;color:#fff;}
    .main-tab .count{background:rgba(255,255,255,.18);border-radius:999px;padding:0 7px;font-size:11px;}
    .main-tab:not(.active) .count{background:var(--neutral-tint);color:var(--text);}

    /* ---------- plan strip (draft / publish) ---------- */
    .plan-strip{
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      padding:10px 22px;background:#fffdf5;border-bottom:1px solid #f3e3b5;font-size:12.5px;color:var(--text-muted);
    }
    .plan-strip.ok{background:#f3fbf6;border-bottom-color:#cfead9;}
    .plan-strip.info{background:var(--surface-alt);border-bottom-color:var(--border);}
    .plan-stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .plan-stat{display:inline-flex;align-items:center;gap:6px;}
    .plan-stat b{color:var(--text);font-weight:800;}
    .pdot{width:8px;height:8px;border-radius:50%;display:inline-block;}

    .task-card.draft{border:1.5px dashed var(--border-strong);background:#fcfcfd;}
    .draft-badge{
      font-size:9.5px;font-weight:800;background:#fff4d6;color:#8a5a00;border:1px solid #f0d58a;border-radius:5px;padding:1px 6px;white-space:nowrap;
    }
    .pub-badge{
      font-size:9.5px;font-weight:800;background:var(--success-tint);color:var(--success);border-radius:5px;padding:2px 6px;white-space:nowrap;
    }
    .card-badges{display:flex;flex-wrap:wrap;gap:4px;}
    .task-card .card-top{flex-wrap:wrap;}
    .cand-warn{color:var(--warning);font-weight:700;}
    .my-line{margin-top:6px;font-size:11px;color:var(--brand-meas);font-weight:700;}

    /* ---------- capacity ---------- */
    .cap-mini{
      display:block;margin:0 2px 10px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);
      cursor:pointer;
    }
    .cap-mini:hover{border-color:var(--border-strong);}
    .cap-mini-top{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--text-muted);margin-bottom:4px;}
    .cap-mini-top b{font-size:11px;}
    .cap-track{height:5px;border-radius:99px;background:var(--neutral-tint);overflow:hidden;}
    .cap-fill{height:100%;border-radius:99px;}
    .cap-ok{color:var(--success);} .cap-warn{color:var(--warning);} .cap-over{color:var(--danger);}
    .bg-ok{background:#22a35a;} .bg-warn{background:#e0a100;} .bg-over{background:var(--danger);}
    .cap-table{width:100%;border-collapse:collapse;font-size:12px;}
    .cap-table td{padding:7px 4px;border-bottom:1px solid var(--border);vertical-align:middle;}
    .cap-table td.num{font-weight:800;white-space:nowrap;text-align:left;}
    .cap-table .sub{font-size:10.5px;color:var(--text-faint);}
    .cap-box{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface-alt);margin-bottom:16px;}
    .cap-box.over{border-color:#f3b9c3;background:#fff7f8;}
    .cap-box-title{font-size:12px;font-weight:800;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
    .cap-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .cap-inputs label{display:block;font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:5px;}
    .warn-list{margin:10px 0 0;padding:0;list-style:none;}
    .warn-list li{
      display:flex;justify-content:space-between;gap:10px;border:1px solid #f3b9c3;background:#fff7f8;border-radius:8px;
      padding:7px 10px;margin-bottom:6px;font-size:12px;color:var(--text);
    }
    .warn-list li b{color:var(--danger);}

    /* ---------- recommendation / overbooking ---------- */
    .reco-box{
      border:1px solid #cfe0ff;background:#f5f9ff;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px;color:var(--text-muted);line-height:1.8;
    }
    .reco-box b{color:var(--text);}
    .reco-box.lack{border-color:#f0d58a;background:#fffbea;}
    .reco-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
    .btn-auto{background:#eaf1ff;color:var(--brand-meas);border:1px solid #cfe0ff;}
    .btn-auto:hover{background:#dde9ff;}
    .btn-auto:disabled{opacity:.5;cursor:not-allowed;}

    /* ---------- add cases tabs + ranked list ---------- */
    .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;}
    .tab{
      border:none;background:transparent;padding:9px 14px;font-size:13px;font-weight:800;color:var(--text-muted);cursor:pointer;
      border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px;
    }
    .tab.active{color:var(--text);border-bottom-color:#101828;}
    .rank-num{font-size:11px;font-weight:800;color:var(--text-faint);}
    .score-cell{min-width:110px;}
    .score-bar{height:6px;border-radius:99px;background:var(--neutral-tint);overflow:hidden;margin-top:3px;}
    .score-fill{height:100%;background:#2563eb;border-radius:99px;}
    .reason{
      display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin:1px 0 1px 4px;
      background:#eef4ff;color:#1d4ed8;white-space:nowrap;
    }
    .reason.child{background:#fdeef6;color:#b0306f;}
    .reason.teen{background:#f6effd;color:#7c3aed;}
    .reason.overdue{background:#fdf1e0;color:#b45309;}
    .reason.gov{background:#e6f7f1;color:#047857;}
    .reason.pref{background:#e6f7f1;color:#047857;}
    .reason.neg{background:#eef0f3;color:#5b6472;}
    .excluded-note{font-size:11.5px;color:var(--text-faint);margin-top:8px;}

    /* ---------- case rows extras ---------- */
    .phone-chip{
      display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:7px;padding:2px 4px 2px 8px;
      font-size:11.5px;font-weight:700;color:var(--text);background:var(--surface-alt);direction:ltr;
    }
    .phone-chip a{color:var(--text);}
    .copy-btn{
      border:none;background:var(--surface);border-radius:5px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
      cursor:pointer;color:var(--text-muted);
    }
    .copy-btn:hover{color:var(--brand-meas);}
    .case-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--text-muted);}
    .meta-sep{color:var(--border-strong);}
    .next-call{display:inline-flex;align-items:center;gap:4px;color:var(--warning);font-weight:700;}
    .assignee{display:inline-flex;align-items:center;gap:4px;}
    .mini-select{border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-size:11px;font-family:inherit;background:var(--surface);}
    .row-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;}
    .ghost-btn{
      display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface);border-radius:8px;
      padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--text-muted);cursor:pointer;
    }
    .ghost-btn:hover{color:var(--text);border-color:var(--border-strong);}
    .call-btn:disabled{opacity:.5;cursor:not-allowed;}
    .call-btn.primary{background:#101828;color:#fff;border-color:#101828;}
    .call-btn.primary:hover{background:#000;color:#fff;}
    .switch-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);cursor:pointer;}

    /* ---------- call panel ---------- */
    .call-panel{margin-top:10px;border:1px solid #cfe0ff;border-radius:10px;background:#fbfdff;padding:11px 12px;}
    .script-sub{font-size:11px;font-weight:800;color:var(--text-muted);margin:8px 0 4px;}
    .convoy-box{border:1px solid #e4d7fb;border-radius:10px;background:#faf7ff;padding:10px 12px;margin-bottom:14px;}
    .call-panel .convoy-box{margin-bottom:10px;}
    .convoy-box.org{background:var(--surface);border-color:var(--border);}
    .convoy-head{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#5b21b6;margin-bottom:8px;}
    .convoy-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);}
    .convoy-grid{display:grid;grid-template-columns:110px minmax(0,1.4fr) minmax(0,1fr);gap:8px;}
    .convoy-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 9px;}
    .convoy-item .k{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text-faint);margin-bottom:3px;}
    .convoy-item .v{font-size:12.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .convoy-notes{font-size:12px;color:#8a5a00;background:#fffbea;border-radius:7px;padding:7px 9px;margin-top:8px;line-height:1.7;}
    .missing{color:var(--danger);font-weight:700;}
    .outcome-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;}
    .outcome-btn.sel{color:#fff !important;}
    .note-input{
      width:100%;min-height:58px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;
      resize:vertical;background:var(--surface);color:var(--text);
    }
    .note-input:focus{outline:none;border-color:#93b8ff;box-shadow:0 0 0 3px #eaf1ff;}
    .rule-hint{font-size:11.5px;color:var(--text-muted);background:var(--surface-alt);border-radius:7px;padding:6px 9px;margin:8px 0;line-height:1.7;}
    .rule-hint.warn{background:#fff4d6;color:#8a5a00;}
    .rule-hint.danger{background:#fceced;color:var(--danger);}
    .panel-foot{display:flex;gap:8px;margin-top:9px;}

    /* ---------- call log ---------- */
    .log-list{margin-top:9px;border-top:1px dashed var(--border);padding-top:8px;}
    .log-item{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--neutral-tint);font-size:11.5px;}
    .log-item:last-child{border-bottom:none;}
    .log-time{color:var(--text-faint);white-space:nowrap;min-width:92px;}
    .log-body{flex:1;}
    .log-who{color:var(--text-muted);}
    .log-note{color:var(--text);margin-top:2px;line-height:1.6;}
    .log-legacy{font-size:11px;color:var(--text-faint);padding:4px 0;}

    /* ---------- queue ---------- */
    .queue-wrap{padding:16px 22px 50px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start;}
    .queue-wrap.single{grid-template-columns:minmax(0,1fr);}
    .q-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
    .q-title{font-size:16px;font-weight:800;color:var(--text);}
    .q-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px;}
    .kpi{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 13px;}
    .kpi-val{font-size:20px;font-weight:800;color:var(--text);}
    .kpi-lbl{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
    .q-section{margin-bottom:18px;}
    .q-section-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:800;color:var(--text);}
    .q-section-head .cnt{background:var(--neutral-tint);border-radius:999px;padding:1px 9px;font-size:11.5px;}
    .q-section-head .hint{font-weight:500;font-size:11.5px;color:var(--text-faint);}
    .q-item{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
    .q-item .bar{position:absolute;top:0;bottom:0;right:0;width:4px;}
    .q-item.later{background:#fcfcfd;}
    .q-grid{display:grid;grid-template-columns:34px minmax(0,1.5fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px;align-items:center;}
    .q-rank{font-size:13px;font-weight:800;color:var(--text-faint);text-align:center;}
    .q-name{font-size:13.5px;font-weight:800;color:var(--text);}
    .q-line{font-size:11.5px;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .task-chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;}
    .q-empty{border:1px dashed var(--border-strong);border-radius:11px;padding:22px;text-align:center;color:var(--text-faint);font-size:12.5px;background:var(--surface);}
    .side-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:12px;}
    .side-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
    .hold-badge{display:inline-flex;align-items:center;gap:3px;background:#eef1f5;color:#475569;border:1px solid #cbd3dd;border-radius:20px;padding:0 7px;font-size:10.5px;font-weight:700;white-space:nowrap;}
    .hold-badge.big{font-size:11.5px;padding:2px 9px;}
    .held-row td{background:#f6f7f9;color:var(--text-muted);}
    .hold-btn{color:#475569;}
    .btn-held{background:#eef1f5;color:#334155;border:1px solid #cbd3dd;}
    .hold-info,.hold-warn{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:9px 11px;font-size:12px;margin-bottom:10px;line-height:1.7;}
    .hold-info{background:#eef1f5;color:#334155;}
    .hold-warn{background:var(--warning-tint);color:#8a4b08;}
    .reason-pills{display:flex;flex-wrap:wrap;gap:6px;}
    .reason-pills button{border:1px solid var(--border-strong);background:var(--surface);border-radius:20px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer;color:var(--text);}
    .reason-pills button.on{background:#334155;border-color:#334155;color:#fff;}
    .ag-card{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--surface-alt);}
    .ag-card:last-child{margin-bottom:0;}
    .ag-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
    .ag-av{width:30px;height:30px;border-radius:50%;background:var(--brand-meas-tint);color:var(--brand-meas);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .ag-id{flex:1;min-width:0;}
    .ag-id b{display:block;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ag-bar{height:4px;border-radius:4px;background:var(--neutral-tint);margin-top:5px;overflow:hidden;}
    .ag-bar i{display:block;height:100%;background:var(--brand-meas);border-radius:4px;}
    .ag-rate{font-size:11px;font-weight:800;color:var(--success);background:var(--success-tint);border-radius:20px;padding:2px 8px;flex-shrink:0;}
    .ag-rate.none{color:var(--text-faint);background:var(--neutral-tint);}
    .ag-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
    .ag-stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 2px;text-align:center;}
    .ag-stat b{display:block;font-size:15px;font-weight:800;color:var(--text);line-height:1.3;}
    .ag-stat span{display:block;font-size:10.5px;color:var(--text-muted);}
    .ag-stat.warn b{color:var(--warning);}
    .ag-stat.ok b{color:var(--success);}
    .agent-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--neutral-tint);font-size:12px;}
    .agent-row:last-child{border-bottom:none;}
    .agent-row .nums{display:flex;gap:10px;color:var(--text-muted);font-size:11.5px;}
    .agent-row .nums b{color:var(--text);}
    .rules-list{margin:0;padding:0 16px 0 0;font-size:12px;line-height:1.9;color:var(--text-muted);}
    .rules-list b{color:var(--text);}

    /* ---------- settings modal ---------- */
    .set-section{border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:12px;}
    .set-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:3px;}
    .set-desc{font-size:11.5px;color:var(--text-faint);margin-bottom:10px;line-height:1.7;}
    .set-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
    .set-grid.four{grid-template-columns:repeat(4,minmax(0,1fr));}
    .set-grid label{display:block;font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:5px;}
    .input-suffix{display:flex;align-items:center;gap:6px;}
    .input-suffix span{font-size:11.5px;color:var(--text-faint);white-space:nowrap;}
    .text-area{
      width:100%;min-height:96px;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;line-height:1.8;
      font-family:inherit;color:var(--text);resize:vertical;
    }
    .text-area:focus{outline:none;border-color:#93b8ff;box-shadow:0 0 0 3px #eaf1ff;}
    .type-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .type-seg-btn{
      display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:9px;
      padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--text-muted);cursor:pointer;font-family:inherit;
    }
    .type-seg-btn.on{background:var(--tint);border-color:var(--edge);color:var(--edge);}
    .visits-link{
      display:flex;align-items:flex-start;gap:7px;font-size:11.5px;line-height:1.8;color:var(--text-muted);
      background:#f0f7ff;border:1px dashed #b9d3ff;border-radius:9px;padding:8px 10px;margin-bottom:14px;
    }
    .visits-link b{color:var(--text);}
    .day-add{
      width:22px;height:22px;border-radius:7px;border:1px dashed var(--border-strong);background:var(--surface);color:var(--text-muted);
      display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;line-height:1;padding:0;
    }
    .day-add:hover{color:var(--text);border-color:var(--text-muted);}
    .day-add-wrap{position:relative;display:inline-flex;}
    .day-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:4px;display:flex;flex-direction:column;min-width:190px;}
    .day-menu button{display:flex;align-items:center;gap:7px;border:none;background:none;padding:8px 10px;border-radius:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;text-align:right;white-space:nowrap;}
    .day-menu button:hover{background:#f4f6fa;}
    .cms-modal{
      position:fixed;top:40px;left:50%;transform:translateX(-50%);width:1000px;max-width:96vw;max-height:calc(100vh - 80px);
      background:#fff;border-radius:6px;box-shadow:0 5px 15px rgba(0,0,0,.5);z-index:61;display:flex;flex-direction:column;overflow:hidden;
    }
    .cms-head{
      display:flex;align-items:center;justify-content:space-between;padding:10px 15px;
      background:linear-gradient(90deg, rgba(211,241,248,1) 0%, rgba(255,249,228,1) 34%, rgba(186,234,230,1) 100%);
    }
    .cms-title{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700;color:#535252;}
    .cms-close{border:none;background:transparent;cursor:pointer;padding:2px;opacity:.75;}
    .cms-close:hover{opacity:1;}
    .cms-body{padding:16px 18px 18px;overflow-y:auto;}
    .cms-case{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;margin-bottom:12px;}
    .cms-muted{color:#777;font-size:12px;}
    .cms-form{border-bottom:1px solid #eee;padding-bottom:14px;margin-bottom:16px;}
    .cms-row{display:grid;grid-template-columns:130px minmax(0,1fr) 110px minmax(0,1fr);gap:10px 14px;align-items:start;margin-bottom:12px;}
    .cms-label{font-size:13px;font-weight:700;color:#333;padding-top:7px;}
    .cms-label .req{color:#dd4b39;}
    .cms-field.wide{grid-column:span 3;max-width:480px;}
    .cms-input{
      width:100%;border:1px solid #d2d6de;border-radius:0;padding:6px 10px;font-size:13px;font-family:inherit;color:#555;background:#fff;
      min-height:34px;
    }
    .cms-input:focus{outline:none;border-color:#3c8dbc;}
    .cms-input:disabled{background:#eee;color:#999;cursor:not-allowed;}
    textarea.cms-input{resize:vertical;}
    .cms-actions{display:flex;gap:6px;justify-content:center;margin-top:6px;}
    .cms-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:3px;padding:6px 14px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
    .cms-add{background:#00a65a;border-color:#008d4c;}
    .cms-add:hover{background:#008d4c;}
    .cms-cancel{background:#f56b7b;border-color:#e45a6a;}
    .cms-cancel:hover{background:#dd4b39;}
    .cms-table{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid #ddd;}
    .cms-table th{background:#fff;border:1px solid #ddd;padding:8px;text-align:right;font-weight:700;color:#333;}
    .cms-table td{border:1px solid #ddd;padding:7px 8px;color:#333;vertical-align:top;}
    .cms-table tbody tr:nth-child(odd){background:#f9f9f9;}
    .cms-empty{text-align:center;color:#555;}
    .cms-modal .convoy-box{margin-bottom:12px;}
    @media (max-width:800px){ .cms-row{grid-template-columns:1fr;} .cms-field.wide{grid-column:auto;} }
    .sort-th{cursor:pointer;user-select:none;}
    .sort-th:hover,.sort-th.on{color:var(--text) !important;}
    .prio-star{border:none;background:transparent;cursor:pointer;font-size:17px;line-height:1;color:#c7cbd3;padding:0 2px;}
    .prio-star:hover{color:#e0a100;}
    .prio-star.on{color:#e0a100;}
    .prio-txt{color:#b7791f;font-weight:800;}
    .prio-badge{display:inline-block;font-size:10.5px;font-weight:800;background:#fff4d6;color:#8a5a00;border:1px solid #f0d58a;border-radius:5px;padding:1px 6px;margin-right:4px;white-space:nowrap;}
    .pools-wrap{padding:12px 22px 14px;background:var(--bg);border-bottom:1px solid var(--border);}
    .section-cap{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px;}
    .pools-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
    .pool-btn{
      display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-right:4px solid var(--edge);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;
      font-family:inherit;text-align:right;box-shadow:var(--shadow-sm);transition:box-shadow .12s ease, transform .12s ease;
    }
    .pool-btn:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
    .pool-num{font-size:24px;font-weight:800;color:var(--edge);line-height:1;min-width:30px;text-align:center;}
    .pool-text{flex:1;display:flex;flex-direction:column;gap:2px;}
    .pool-name{font-size:13px;font-weight:800;color:var(--text);}
    .pool-sub{font-size:11px;color:var(--text-faint);}
    .pool-ic{width:32px;height:32px;border-radius:9px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .focus-wrap{max-width:760px;margin:22px auto 60px;padding:0 16px;}
    .focus-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .focus-total{display:flex;flex-direction:column;align-items:center;background:#101828;color:#fff;border-radius:12px;padding:8px 18px;}
    .focus-total b{font-size:24px;line-height:1.1;}
    .focus-total span{font-size:11.5px;opacity:.85;}
    .focus-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow-md);}
    .focus-card .bar{position:absolute;top:0;bottom:0;right:0;width:5px;}
    .focus-card.empty{text-align:center;padding:40px 20px;box-shadow:none;}
    .focus-empty-t{font-size:16px;font-weight:800;margin:8px 0 4px;}
    .focus-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
    .focus-name{font-size:22px;font-weight:800;color:var(--text);}
    .focus-phone{margin:8px 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .send-btns{display:inline-flex;gap:6px;}
    .rec-send{display:flex;gap:5px;flex-wrap:wrap;}
    .rec-send .send-btn{padding:4px 8px;font-size:11.5px;white-space:nowrap;}
    .rec-sent{margin-top:4px;font-size:11px;color:#15803d;display:flex;align-items:center;gap:3px;}
    .cms-table tbody tr.rec-new{background:#eef9f1 !important;}
    .send-btn{display:inline-flex;align-items:center;gap:5px;border:none;border-radius:8px;padding:6px 11px;font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;}
    .send-btn.wa{background:#25a95a;} .send-btn.wa:hover{background:#1f8f4c;}
    .send-btn.sms{background:#0093e9;} .send-btn.sms:hover{background:#0080cc;}
    .focus-phone .phone-chip{font-size:15px;padding:4px 6px 4px 12px;}
    .focus-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
    .focus-grid div{background:var(--surface-alt);border:1px solid var(--border);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;}
    .focus-grid span{font-size:11px;color:var(--text-faint);}
    .focus-grid b{font-size:13px;color:var(--text);}
    .focus-actions{display:flex;align-items:center;gap:10px;margin-top:16px;}
    .focus-call{display:inline-flex;align-items:center;gap:8px;background:#15803d;color:#fff;border:none;border-radius:10px;padding:12px 30px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
    .focus-call:hover{background:#116632;}

    /* =====================================================================
       Call-center statistics drawer — same visual system as the visits page
       dashboard (vs- variables, KPI grid, chart cards, period tabs)
       ===================================================================== */
    :root{
      --vs-bg:#f5f6f8; --vs-bg-raised:#ffffff; --vs-surface:#ffffff; --vs-surface-2:#eef0f3;
      --vs-border:#e2e5ea; --vs-border-soft:#ececf0; --vs-text:#1a1d23; --vs-text-dim:#62697a; --vs-text-faint:#97a0ad;
      --vs-accent:#2f6fed; --vs-accent-hover:#2559c9; --vs-green:#15803d; --vs-radius-sm:6px; --vs-radius:10px;
      --vs-font-ui:'Droid Arabic Kufi','Noto Kufi Arabic',Tahoma,Arial,sans-serif; --vs-font-mono:var(--vs-font-ui);
    }
    .stats-toggle{
      position:fixed;top:120px;left:0;width:26px;height:30px;background:var(--vs-accent);color:#fff;border:0;border-radius:0 4px 4px 0;
      z-index:39;cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .stats-toggle:hover{background:var(--vs-accent-hover);}
    .stats-toggle.open{left:min(640px, calc(100vw - 80px));}
    .stats-panel{
      position:fixed;top:0;left:0;width:640px;max-width:calc(100vw - 80px);height:100vh;background:var(--vs-bg-raised);
      border:1px solid var(--vs-border);box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:39;font-family:var(--vs-font-ui);color:var(--vs-text);
      display:flex;flex-direction:column;overflow:hidden;
    }
    .stats-panel.anim{animation:vsSlide .25s ease;}
    .stats-scrim{position:fixed;inset:0;background:rgba(15,18,26,.18);z-index:38;}
    @keyframes vsSlide{from{transform:translateX(-100%);}to{transform:translateX(0);}}
    .stats-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--vs-border-soft);background:var(--vs-bg-raised);flex:none;}
    .stats-title{font-weight:700;font-size:15.5px;color:var(--vs-text);display:flex;align-items:center;gap:8px;}
    .stats-head .vs-btn{
      display:inline-flex;align-items:center;gap:5px;border:1px solid var(--vs-border);background:var(--vs-bg-raised);color:var(--vs-text-dim);
      border-radius:var(--vs-radius-sm);padding:6px 11px;font-size:12px;font-family:inherit;cursor:pointer;margin-right:4px;
    }
    .stats-head .vs-btn.green{background:#00a65a;border-color:#008d4c;color:#fff;}
    .stats-body-scroll{flex:1 1 auto;overflow-y:auto;padding:18px;}
    .vs-dash-head{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 16px;gap:8px;}
    .vs-period-tabs{display:inline-flex;background:var(--vs-bg);border:1px solid var(--vs-border);border-radius:var(--vs-radius-sm);padding:3px;gap:2px;flex-wrap:wrap;}
    .vs-period-tabs button{border:none;background:none;color:var(--vs-text-dim);padding:7px 14px;border-radius:5px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
    .vs-period-tabs button:hover{color:var(--vs-text);}
    .vs-period-tabs button.active{background:var(--vs-accent);color:#fff;}
    .vs-picker{display:inline-flex;align-items:center;gap:4px;}
    .vs-picker-btn,.vs-step{border:1px solid var(--vs-border);background:var(--vs-bg-raised);color:var(--vs-text);border-radius:var(--vs-radius-sm);font-family:inherit;font-size:12px;height:30px;cursor:pointer;}
    .vs-picker-btn{padding:0 10px;font-weight:600;cursor:default;display:inline-flex;align-items:center;gap:6px;}
    .vs-step{width:30px;color:var(--vs-text-dim);display:inline-flex;align-items:center;justify-content:center;}
    .vs-step:hover:not(:disabled){border-color:var(--vs-accent);}
    .vs-step:disabled{opacity:.35;cursor:default;}
    .vs-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
    .vs-kpi-grid.last{margin-bottom:22px;}
    .vs-kpi{background:var(--vs-bg);border:1px solid var(--vs-border);border-radius:var(--vs-radius);padding:12px 10px;display:flex;flex-direction:column;gap:5px;}
    .vs-kpi .num{font-family:var(--vs-font-mono);font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
    .vs-kpi .num small{font-size:12px;font-weight:600;color:var(--vs-text-dim);}
    .vs-kpi .lbl{font-size:11px;color:var(--vs-text-dim);line-height:1.4;}
    .vs-kpi.zero .num{color:var(--vs-text-faint);}
    .vs-kpi.good .num{color:var(--vs-green);}
    .vs-kpi.warn .num{color:#c27c0e;}
    .vs-kpi.bad .num{color:#dc2626;}
    .vs-group-label{font-size:11px;font-weight:700;color:var(--vs-text-faint);letter-spacing:.5px;margin:0 0 10px;}
    .vs-chart-group{margin-bottom:22px;}
    .vs-chart-row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .vs-chart-card{background:var(--vs-surface);border:1px solid var(--vs-border);border-radius:var(--vs-radius);padding:16px;}
    .vs-chart-card-head{margin-bottom:10px;}
    .vs-chart-card-head h4{margin:0;font-size:13.5px;font-weight:700;}
    .vs-chart-card-head p.sub{margin:3px 0 0;font-size:11.5px;color:var(--vs-text-dim);}
    .vs-chart-empty{display:flex;align-items:center;justify-content:center;height:160px;color:var(--vs-text-faint);font-size:12.5px;}

function caseStatus(t, cid){

  if (att && att.status==='attended') return {key:'attended', label:'حضر' + (att.timeIn ? ' – دخول ' + fmtClock(att.timeIn) : '')};
  if (att && att.status==='noShow') return {key:'noShow', label:'لم يحضر'};
  if (at === t.id){
    if (t.dateOffset <= todayOffset()) return {key:'booked', label: t.dateOffset < todayOffset() ? 'محجوز – لم يُسجل حضور' : 'محجوز – في انتظار الاستقبال'};
    var cf = S.confirmations[nextCallKey(t.id, cid)];
    return {key:'booked', label: cf && cf.status==='confirmed' ? 'محجوز – أكد الحضور' : 'تم الحجز بنجاح'};
  }
  if (at && at !== t.id) return {key:'lockedElsewhere', label:'تم حجز الحالة في موعد آخر'};
  var cs = t.callStatus[cid];
  if (cs === 'cancelled') return {key:'cancelled', label:'اعتذر عن الموعد'};

function confirmItems(agent){

    if (t.status!=='published' || !inConfirmWindow(t, tOff)) return;
    t.candidateIds.forEach(function(cid){
      if ((S.bookings[t.type]||{})[cid]!==t.id || !confirmNeeded(t, cid) || caseHoldLabel(cid)) return;
      if (agent && confirmOwner(t, cid)!==agent) return;
      var cf = S.confirmations[nextCallKey(t.id, cid)];
      if (cf && (cf.status==='confirmed' || cf.status==='cancelled')) return;
      out.push({t:t, cid:cid, cf:cf||null, later: !!(cf && cf.nextAt && cf.nextAt > now())});
    });

function confirmStats(t){

    if (cf && cf.status==='cancelled'){ o.cancelled++; return; }
    if ((S.bookings[t.type]||{})[cid]!==t.id || !confirmNeeded(t, cid)) return;

  if (r.freq==='month'){
    // same date every month, or the same weekday of the month (e.g. 2nd Tuesday; 5th = last)
    var base = dateOf(d.dateOffset), months = r.forever ? Math.ceil((until - d.dateOffset)/28) + 1 : Math.max(1, Math.min(24, parseInt(r.months,10)||1)), out = [];

// Capacity

// =====================================================================
// Auto-suggest / priority
// =====================================================================
// attendance (حضر من المحجوزين) and booking (اتحجز من المكالمات) rates per type,
// computed from the dashboard call data of the last RATE_DAYS days
var RATE_DAYS = 90, RATE_FALLBACK = {att:0.8, book:0.5}, _ratesCache = {key:null, val:null};
function autoRates(){
  if (typeof CALL_HISTORY === 'undefined' || !CALL_HISTORY) return null;
  var T = todayOffset(), key = T+'|'+S.callLog.length+'|'+Object.keys(S.attendance).length;
  if (_ratesCache.key === key) return _ratesCache.val;
  var acc = {};
  Object.keys(TASK_TYPES).forEach(function(k){ acc[k] = {calls:0, booked:0, attended:0, noShow:0}; });
  CALL_HISTORY.concat(liveCallEvents()).forEach(function(e){
    if (e.d < T-RATE_DAYS || e.d > T || !acc[e.type] || e.incoming) return;
    var a = acc[e.type]; a.calls++;
    if (e.outcome==='booked'){ a.booked++; if (e.att==='attended') a.attended++; else if (e.att==='noShow') a.noShow++; }
  });
  // average of the daily attendance % (attended / booked per visit day)
  var days = {};
  CALL_HISTORY.concat(liveCallEvents()).forEach(function(e){
    if (!e.att || e.vd==null || e.vd < T-RATE_DAYS || e.vd >= T) return;
    var x = days[e.vd] || (days[e.vd] = {booked:0, attended:0});
    x.booked++; if (e.att==='attended') x.attended++;
  });
  var dk = Object.keys(days), sumPct = 0, booked = 0, attended = 0;
  dk.forEach(function(k){ var x = days[k]; sumPct += x.attended/x.booked; booked += x.booked; attended += x.attended; });
  var daily = {att: dk.length ? sumPct/dk.length : RATE_FALLBACK.att, days:dk.length, avgBooked: dk.length ? booked/dk.length : 0, avgAttended: dk.length ? attended/dk.length : 0};
  var val = {daily:daily};
  Object.keys(acc).forEach(function(k){
    var a = acc[k];
    val[k] = {att: daily.att, book: a.calls ? a.booked/a.calls : RATE_FALLBACK.book,
      attended:a.attended, noShow:a.noShow, calls:a.calls, booked:a.booked};

function rateFor(type){ var r = autoRates(); return r && r[type] ? r[type] : {att:RATE_FALLBACK.att, book:RATE_FALLBACK.book}; }

  else if (activeBooking(ctx.type, c.id)){
    var ab = activeBooking(ctx.type, c.id);
    eligible = false; why = ab.attended ? 'تمت الزيارة (حضر)' : (ab.tid===ctx.id ? 'محجوزة في هذه المهمة' : 'محجوزة في موعد آخر');

  else if (c.postponed && c.postponed.until > ctx.dateOffset){ eligible = false; why = 'مؤجل هندسيًا حتى ' + shortDate(c.postponed.until); }
  else if (ctx.loc==='convoy' && ctx.gov && c.gov!==ctx.gov){ eligible = false; why = 'محافظة مختلفة عن القافلة'; }

  }

  }

  if (c.pref){

function agentLoads(){

    t.candidateIds.forEach(function(cid){

// Call types and who handles them (set by the call-center supervisor)
// =====================================================================
var CALL_CATS = [

function autoAssign(t, rebalance){
  // a task given to one agent: every open case goes to that agent
  if (t.owner){
    var n = 0;
    t.candidateIds.forEach(function(cid){
      if (!isOpenStatus(caseStatus(t,cid).key)) return;
      if (t.assignee[cid] && !rebalance) return;
      if (t.assignee[cid]!==t.owner){ t.assignee[cid] = t.owner; n++; }
    });
    return n;
  }
  var loads = agentLoads();
  if (rebalance){
    t.candidateIds.forEach(function(cid){
      var a = t.assignee[cid];
      if (a && isOpenStatus(caseStatus(t,cid).key) && loads[a]!=null) loads[a]--;
    });
  }
  var count = 0;
  t.candidateIds.forEach(function(cid){
    if (!isOpenStatus(caseStatus(t,cid).key)) return;
    if (t.assignee[cid] && !rebalance) return;
    // only agents who take this call type (see "توزيع أنواع المكالمات")
    var best = leastLoaded(agentsFor(catOfType(t.type)), loads);
    t.assignee[cid] = best; loads[best] = (loads[best]||0) + 1; count++;
  });

}

var toastTimer = null;
function toast(msg){
  S.toast = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ S.toast = null; render(); }, 3200);
}
function tomorrowNine(){ var d = startOfDay(nowDate()); d.setDate(d.getDate()+1); d.setHours(9,0,0,0); return d.getTime(); }
function nextCallFor(t, cid){
  var n = S.nextCallAt[nextCallKey(t.id, cid)] || 0;
  if (failedToday(cid) >= S.settings.maxPerDay) n = Math.max(n, tomorrowNine());
  return n > now() ? n : 0;
}
function canCall(t, cid){
  if (!isCC() || caseHoldLabel(cid)) return false;
  var a = t.assignee[cid];
  return !a || a === S.agentId;
}
function closeAllOverlays(){
  S.overlay = null; S.createDraft = null; S.detailTaskId = null; S.addCasesMode = null; S.confirm = null;
  S.callOpen = null; S.capacityDay = null; S.settingsDraft = null; S.convoyEdit = null;
}
function weekRange(wk){ return [wk*7, wk*7+6]; }
// the days the calendar shows now (a week, or the whole month)
function viewRange(){
  if (S.viewMode!=='month') return weekRange(S.weekOffset);
  var md = new Date(BASE_MONTH.getFullYear(), BASE_MONTH.getMonth()+S.monthOffset, 1), last = new Date(md.getFullYear(), md.getMonth()+1, 0);
  return [daysBetween(BASE_SUNDAY, md), daysBetween(BASE_SUNDAY, last)];
}

  saveTaskEdit: function(){
    var d = S.createDraft, t = d && findTask(d.editId); if (!t || !isAdmin()) return;
    var target = draftTarget(d); if (target<=0 || (d.loc==='convoy' && !d.gov)) return;
    var booked = taskBookedCount(t);
    if (d.dateOffset!==t.dateOffset && booked){ toast('فيه حالات محجوزة – مينفعش تتنقل ليوم تاني'); return render(); }
    var att = d.targetMode==='attendance' ? draftAttend(d) : null;
    var after = S.tasks.map(function(x){ return x.id===t.id ? Object.assign({}, x, {dateOffset:d.dateOffset, target:target, mode:d.targetMode, attendTarget:att}) : x; });
    var apply = function(){
      var ch = [];
      if (t.dateOffset!==d.dateOffset) ch.push('اليوم: ' + dayLabel(t.dateOffset) + ' ← ' + dayLabel(d.dateOffset));
      if (t.target!==target) ch.push('الحجز: ' + t.target + ' ← ' + target);
      if (t.loc!==d.loc || (t.gov||'')!==(d.loc==='convoy' ? d.gov : '')) ch.push('المكان: ' + locLabelFor(t) + ' ← ' + (d.loc==='convoy' ? 'قافلة – ' + d.gov : 'داخل المؤسسة'));
      var cd = Math.max(1, parseInt(d.confirmDays,10)||2), con = d.confirmOn!==false;
      if ((t.confirmOn!==false)!==con) ch.push(con ? 'تفعيل تأكيد الحضور' : 'إلغاء تأكيد الحضور');
      else if (con && confirmDaysOf(t)!==cd) ch.push('التأكيد قبل الموعد: ' + confirmDaysOf(t) + ' ← ' + cd + ' يوم');
      t.dateOffset = d.dateOffset; t.target = target; t.mode = d.targetMode; t.attendTarget = att;
      t.loc = d.loc; t.gov = d.loc==='convoy' ? d.gov : null; t.confirmDays = cd; t.confirmOn = con;
      if (d.loc==='convoy'){
        var cv = [d.meetingPoint||'', d.mapUrl||'', d.meetingTime||'', d.convoyNotes||''].join('|')!==[t.meetingPoint||'', t.mapUrl||'', t.meetingTime||'', t.convoyNotes||''].join('|');
        if (cv) ch.push('بيانات القافلة');
        t.meetingPoint = (d.meetingPoint||'').trim(); t.mapUrl = (d.mapUrl||'').trim(); t.meetingTime = d.meetingTime||''; t.convoyNotes = (d.convoyNotes||'').trim();
      }
      var madeN = d.repeat.on && !t.seriesId ? repeatFromTask(t, d) : 0;
      if (madeN) ch.push('تكرار ' + t.seriesLabel);
      if (ch.length) audit('تعديل المهمة', t, ch.join(' · '));
      S.overlay = null; S.detailTaskId = null; S.createDraft = null; S.confirm = null;
      toast(madeN ? 'المهمة بقت متكررة ' + t.seriesLabel + (d.repeat.forever ? '' : ' – اتعمل ' + madeN + ' مهمة') : ch.length ? 'تم حفظ التعديلات' : 'مفيش تعديلات'); render();
    };
    var withCap = function(){ guardCapacity(d.dateOffset, after, apply, 'detail'); };
    if (target < booked){
      S.overlay = 'confirm';
      S.confirm = {title:'تأكيد التغيير', tone:'primary', message:'الحجز الجديد (' + target + ') أقل من العدد المحجوز حاليًا (' + booked + '). هل تريد المتابعة؟',
        confirmLabel:'تأكيد التغيير', returnTo:'detail', onConfirm:withCap};
      render();
    } else withCap();
  },

  saveCall: function(){
    var co = S.callOpen, d = S.callDraft; if (!co) return;
    if (!d.callType) { toast('اختار نوع المكالمة'); return render(); }
    if (!d.outcome) { toast('اختار استجابة المكالمة'); return render(); }
    if (!d.note.trim()) { toast('اكتب نتيجة التواصل'); return render(); }
    var t = findTask(co.tid), cid = co.cid, o = d.outcome, c = caseById(cid);
    var key = nextCallKey(t.id, cid);
    var wasHTR = isHardToReach(cid);
    var entry = {id:'L'+Date.now(), taskId:t.id, caseId:cid, agentId:S.agentId, at:now(), outcome:o, note:d.note.trim(), callType:d.callType};
    var msg = '';
    if (o==='standby'){
      t.standby = t.standby || [];
      if (t.standby.indexOf(cid)===-1) t.standby.push(cid);
      delete S.nextCallAt[key]; delete t.callStatus[cid];
      msg = c.name + ' اتسجل احتياطي #' + t.standby.length + ' – لو حد اعتذر هيظهر للاتصال على طول';
    } else if (o==='booked'){
      var to = findTask(d.bookTid) || t;
      [t, to].forEach(function(x){ if (x.standby){ var si = x.standby.indexOf(cid); if (si!==-1) x.standby.splice(si,1); } });
      S.bookings[t.type][cid] = to.id;
      if (to.candidateIds.indexOf(cid)===-1) to.candidateIds.push(cid);
      if (!to.assignee[cid]) to.assignee[cid] = t.assignee[cid] || S.agentId;
      if (d.bookTime) S.bookTimes[nextCallKey(to.id, cid)] = d.bookTime;
      delete S.nextCallAt[key]; delete t.callStatus[cid];
      entry.bookTid = to.id; entry.bookTime = d.bookTime;
      msg = 'تم حجز ' + c.name + ' في ' + dayLabel(to.dateOffset) + (d.bookTime ? ' الساعة ' + fmtClock(d.bookTime) : '');
      if (S.settings.msgOn){ sendMsg('booking', to, cid).auto = true; msg += ' · اتبعتت رسالة ' + CHANNELS[S.settings.msgChannel]; }
    } else {
      t.callStatus[cid] = o;
      if (FAILED_OUTCOMES.indexOf(o)!==-1){
        S.callLog.push(entry); entry = null;
        if (!wasHTR && isHardToReach(cid)){
          delete S.nextCallAt[key];
          msg = 'تم تصنيف ' + c.name + ' "صعب الوصول" بعد ' + failedTotal(cid) + ' محاولات فاشلة';
        } else if (failedToday(cid) >= S.settings.maxPerDay){
          S.nextCallAt[key] = tomorrowNine();
          msg = 'استُنفدت محاولات اليوم (' + S.settings.maxPerDay + ') – الحالة هترجع في قائمتك بكرة ' + fmtTime(tomorrowNine());
        } else {
          S.nextCallAt[key] = now() + S.settings.retryMinutes*60000;
          msg = 'الحالة هترجع في قائمتك تلقائيًا الساعة ' + fmtTime(S.nextCallAt[key]);
        }
      } else {
        delete S.nextCallAt[key];
        msg = 'تم تسجيل الاتصال';
      }
    }
    if (entry) S.callLog.push(entry);
    if (o==='booked' && entry){
      S.callJustBooked = entry.id;
      S.callDraft = {callType:'صادر', outcome:'', bookTid:entry.bookTid, bookTime:'', note:''};
      toast(msg + ' – ابعت التأكيد من السجل تحت'); return render();
    }
    S.callOpen = null;
    toast(msg); render();
  },

var root = null, pendingCaret = null;
function render(){
  if (!root) return;

  var ae = document.activeElement, focusK = null, selS = null, selE = null;
  if (ae && ae.getAttribute && ae.getAttribute('data-k')){
    focusK = ae.getAttribute('data-k');
    try { selS = ae.selectionStart; selE = ae.selectionEnd; } catch(e){}
  }
  var scrolls = {};
  root.querySelectorAll('[data-scroll]').forEach(function(el){ scrolls[el.getAttribute('data-scroll')] = el.scrollTop; });
  root.innerHTML = renderApp();
  syncFundingOps();
  root.querySelectorAll('[data-scroll]').forEach(function(el){ var v = scrolls[el.getAttribute('data-scroll')]; if (v) el.scrollTop = v; });
  if (pendingCaret){ focusK = pendingCaret.k; selS = selE = pendingCaret.pos; pendingCaret = null; }

  }
}
