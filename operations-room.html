// "المؤجلات" of a pool (display only – doesn't change the request status or whether the case can be booked):
// medical evaluation: weight / age / 6 months / مؤجل لمرحلة أخرى + wound / binding / physio postponements recorded there;
// the other pools: wound / binding / physio postponements recorded in that stage (the case resumes from there)
var PP_KINDS = {wound:'تأجيل جرح', binding:'تأجيل ربط', physio:'تأجيل علاج طبيعي'};
function ppActive(c){ return c.postponed && PP_KINDS[c.postponed.kind] && (c.postponed.until==null || c.postponed.until > todayOffset()); }
// short names for the postponement cell (like the CMS: "مؤجل (ربط، علاج طبيعي)")
var PP_SHORT = {physio:'علاج طبيعي', wound:'جرح', binding:'ربط'};
var NC_SHORT = {weight:'وزن زائد', age:'السن', '6m':'6 شهور من آخر جراحة', stage:'مرحلة أخرى'};
function postponedFor(k){
  var out = [];
  CASES.forEach(function(c){
    var reasons = [], until = null, tags = [], date = '', untilIso = '';
    if (ppActive(c) && (c.postponed.stage || c.stage)===k){
      reasons.push(PP_KINDS[c.postponed.kind] + (c.postponed.reason ? ' – ' + c.postponed.reason : '')); until = c.postponed.until;
      tags.push(PP_SHORT[c.postponed.kind] || PP_KINDS[c.postponed.kind]);
      date = isoDate(c.postponed.at!=null ? c.postponed.at : (until!=null ? until - 14 : todayOffset() - 7));
      if (until!=null) untilIso = isoDate(until);
    }
    if (k==='measurement' && c.stage==='measurement'){
      var pr = profileOf(c.id), r = ncResult({level:pr.level, lastSurgery:pr.lastSurgery, dob:pr.dob, weight:pr.weight});
      if (r.ok===false) r.list.forEach(function(x){
        reasons.push(x.t + (x.k==='weight' ? ' (' + pr.weight + ' كيلو)' : '')); tags.push(NC_SHORT[x.k] || x.t);
        if (!date) date = pr.date || ''; if (x.until && x.until > untilIso) untilIso = x.until;
      });
    }
    if (reasons.length) out.push({c:c, reasons:reasons, until:until, tags:tags, date:date || isoDate(todayOffset() - (c.waitingDays||0)), untilIso:untilIso});
  });
  if (k==='measurement') POSTPONED.filter(function(c){ return c.stage==='postponed'; }).forEach(function(c){
    var pr = profileOf(c.id);
    out.push({c:c, reasons:['مؤجل لمرحلة أخرى – ' + c.level], until:null, tags:['مرحلة أخرى'], date:(pr && pr.date) || isoDate(todayOffset() - (c.waitingDays||0)), untilIso:''});
  });
  return out;
}

function queueItems(agent){
  var tOff = todayOffset(), items = [];
  S.tasks.forEach(function(t){
    if (t.status!=='published' || t.dateOffset < tOff) return;
    var full = t.target>0 && taskBookedCount(t) >= bookingGoal(t);
    t.candidateIds.forEach(function(cid){
      if (agent && t.assignee[cid]!==agent) return;
      if (caseHoldLabel(cid)) return;                 // held cases are off the call lists
      var st = caseStatus(t, cid);
      if (!isOpenStatus(st.key)) return;
      var nxt = nextCallFor(t, cid);
      var group = st.key==='hardToReach' ? 'htr' : full ? 'full' : nxt ? 'later' : 'due';
      items.push({t:t, cid:cid, st:st, nxt:nxt, group:group, prio: !!(t.priority && t.priority[cid]) || st.key==='standbyUp', p:priorityOf(t, caseById(cid))});
    });
  });
  // one row per case: keep the nearest appointment, list the other tasks on it
  items.sort(function(a,b){ return a.t.dateOffset - b.t.dateOffset; });
  var byCase = {}, out = [];
  items.forEach(function(x){
    var first = byCase[x.cid];
    if (first){ first.alsoIn.push(x.t); return; }
    x.alsoIn = []; byCase[x.cid] = x; out.push(x);
  });
  return out;
}

function queueOrder(a, b){ return (b.prio - a.prio) || (a.t.dateOffset - b.t.dateOffset) || (b.p.score - a.p.score); }

function committeeNoteOf(cid){
  if (!_commNotes){
    _commNotes = {};

      if (c.stage!=='measurement') return;
      var s = 0; for (var i=0;i<c.id.length;i++) s = (s*31 + c.id.charCodeAt(i)) % 9973;
      if (s % 3===0) return;
      var miss = [COMMITTEE_ATTACH[s % COMMITTEE_ATTACH.length]];
      if (s % 2) miss.push(COMMITTEE_ATTACH[(s + 3) % COMMITTEE_ATTACH.length]);
      if (c.age < 18 && miss.indexOf('صورة بطاقة ولي الأمر')===-1) miss.push('صورة بطاقة ولي الأمر');
      _commNotes[c.id] = {missing:miss, text:COMMITTEE_NOTE_TXT[s % COMMITTEE_NOTE_TXT.length], by:'لجنة القبول', at:now() - (2 + s % 20)*86400000};

  }
  return _commNotes[cid] || null;

function renderOverlays(){
  switch (S.overlay){
    case 'create': return S.createDraft ? renderCreate() : '';
    case 'addCases': return S.addCasesMode ? renderAddCases() : '';
    case 'detail': return renderDetail();
    case 'confirm':
      var under = S.confirm && S.confirm.returnTo;
      return (under==='detail' ? renderDetail() : under==='addCases' && S.addCasesMode ? renderAddCases() : under==='create' && S.createDraft ? renderCreate() : under==='capacity' ? renderCapacity() : '') + renderConfirm();
    case 'capacity': return renderCapacity();
    case 'settings': return renderSettings();
    case 'risk': return renderRisk();
    case 'audit': return renderAudit();
    case 'holds': return renderHolds();
    case 'fundNotes': return renderFundNotes();
  }
  return '';
}

function addCasesCtx(){
  var m = S.addCasesMode;
  if (m.kind==='create'){
    var d = S.createDraft;
    return {id:'__draft', type:d.type, loc:d.loc, gov:d.gov, dateOffset:d.dateOffset, target:draftTarget(d)};

// the "الحالات" window of a task = that type's pool: its bookable cases (priority order) + the ones already picked,
// with the pool's filters (search, code, funder, amputation level, sort)
function filteredCases(){
  var f = S.addCasesFilters, ctx = addCasesCtx(), sel = S.addCasesSelected, pctx = poolCtx(ctx), q = (f.q||'').trim(), cq = (f.code||'').trim().toUpperCase();
  var pp = postponedIds(ctx.type);
  // المؤجلات live in their own tab only (an exception picked there is counted in the selection, not listed here)
  var scored = CASES.map(function(c){ return priorityOf(pctx, c); }).filter(function(p){ return !pp[p.c.id] && (p.eligible || sel.indexOf(p.c.id)!==-1); });
  var list = scored.filter(function(p){
    var c = p.c;
    if (c.stage!==ctx.type && sel.indexOf(c.id)===-1) return false;
    if (f.gov && c.gov!==f.gov) return false;
    if (f.funding && (f.funding==='بدون' ? c.funding!=='بدون' : c.funding!==f.funding)) return false;
    if (f.level && c.level!==f.level) return false;
    if (!caseMatchQ(c, q, ctx.type!=='measurement')) return false;
    return true;
  });
  var srt = S.addCasesSort || '';
  list.sort(function(a,b){
    if (srt==='gov') return a.c.gov.localeCompare(b.c.gov, 'ar') || a.c.age - b.c.age;
    if (srt==='ageAsc') return a.c.age - b.c.age;
    if (srt==='ageDesc') return b.c.age - a.c.age;
    if (srt==='waitDesc') return b.c.waitingDays - a.c.waitingDays;
    return b.score - a.score;   // priority, like the pool
  });
  return list.map(function(p){ return p.c; });
}
function poolCtx(ctx){ return {id:ctx.id, type:ctx.type, loc:'org', gov:null, dateOffset:ctx.dateOffset}; }

function currentAddCasesIds(){

// =====================================================================
// Funding page link (صفحة التمويل) – shared through localStorage
//   hih_funding_v1     : written by the funding page  {companies, alloc:{caseId:{company,at,by,batch}}, batches}
//   hih_funding_ops_v1 : written here                 {caseId:{status, day, tid, type}}
// =====================================================================
var FUND_KEY = 'hih_funding_v1', FUND_OPS_KEY = 'hih_funding_ops_v1';
var FUND = {companies:[], alloc:{}, batches:[]}, fundOpsLast = '';
function readStore(k, def){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function writeStore(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function loadFunding(){
  FUND = readStore(FUND_KEY, null) || {companies:[], alloc:{}, batches:[]};
  releasePostponed(FUND.released);
  FUND.alloc = FUND.alloc || {}; FUND.holds = FUND.holds || {}; FUND.plans = FUND.plans || [];
  CASES.forEach(function(c){
    if (c.baseFunding===undefined) c.baseFunding = c.funding;
    var a = FUND.alloc[c.id]; c.funding = a ? a.company : c.baseFunding;
  });
  (FUND.companies||[]).forEach(function(n){ if (FUNDING_OPTIONS.indexOf(n)===-1) FUNDING_OPTIONS.push(n); });
}
function fundOf(cid){ return FUND.alloc[cid] || null; }
// the funding page can hold a case (open-ended or until a date): operations can't put it in a task
// and the call center doesn't see it. Returns a short label, '' when not held.
function fundHoldOf(cid){
  if (typeof FUND==='undefined' || !FUND || !FUND.holds) return null;
  var h = FUND.holds[cid]; if (!h) return null;
  if (h.until && h.until < Date.now()) return null;    // hold period over
  return h;
}
function fundHold(cid){
  var h = fundHoldOf(cid); if (!h) return '';
  return h.until ? 'لحد ' + isoDateMs(h.until) : 'من صفحة التمويل';
}
function isoDateMs(ms){ var d = new Date(ms); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
// a held case (from the funding page): the call center can't work on it
function caseHoldLabel(cid){ var f = fundHold(cid); return f ? 'موقوفة ' + f : ''; }
function heldCases(type){
  return CASES.filter(function(c){ return (!type || c.stage===type) && fundHold(c.id); });
}
// where a funded case stands in the operations room
function fundOpsStatus(c){
  var tOff = todayOffset(), tid = (S.bookings[c.stage]||{})[c.id];
  if (tid){
    var bt = findTask(tid), att = S.attendance[nextCallKey(tid, c.id)];
    if (bt) return {status: att ? att.status : 'booked', day:isoDate(bt.dateOffset), tid:tid, type:bt.type};
  }
  var in_ = S.tasks.filter(function(t){ return t.type===c.stage && t.dateOffset>=tOff && t.candidateIds.indexOf(c.id)!==-1; })
    .sort(function(a,b){ return a.dateOffset-b.dateOffset; })[0];
  if (in_) return {status:'scheduled', day:isoDate(in_.dateOffset), tid:in_.id, type:in_.type, draft: in_.status==='draft'};
  return {status:'new'};
}
function syncFundingOps(){
  var out = {};
  Object.keys(FUND.alloc).forEach(function(cid){ var c = caseById(cid); if (c) out[cid] = fundOpsStatus(c); });
  CASES.forEach(function(c){
    if (out[c.id]) return;
    var st = fundOpsStatus(c); if (st.status!=='new') out[c.id] = st;
  });
  var str = JSON.stringify(out);
  if (str !== fundOpsLast){ fundOpsLast = str; writeStore(FUND_OPS_KEY, out); }
}
window.addEventListener('storage', function(e){
  if (e.key!==FUND_KEY) return;
  var before = (FUND.opsNotes||[]).length;
  loadFunding();
  var fresh = (FUND.opsNotes||[]).length - before;
  if (fresh > 0 && isAdmin()) toast('وصلت ملاحظة من التمويل: ' + FUND.opsNotes[FUND.opsNotes.length-1].text.slice(0, 60));
  render();
});
// notes the funding page sends to operations ("الحالات دي ممولة ومحتاجة تتحجز يوم …")
var NOTES_SEEN_KEY = 'hih_ops_notes_seen';
function seenFundNotes(){ return readStore(NOTES_SEEN_KEY, []) || []; }
function unreadFundNotes(){ var seen = seenFundNotes(); return (FUND.opsNotes||[]).filter(function(n){ return seen.indexOf(n.id)===-1; }).length; }
function isoToOffset(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m ? daysBetween(BASE_SUNDAY, new Date(+m[1], +m[2]-1, +m[3])) : null; }
function renderFundNotes(){
  var list = (FUND.opsNotes||[]).slice().reverse(), seen = S.notesSeenBefore || [];
  var h = '<div class="scrim"'+A('closePanel')+'></div><div class="modal" style="width:820px;max-width:95vw;">'+
    panelHead(ic('bell',16,'#0093e9')+' إشعارات التمويل', list.length+' ملاحظة')+'<div class="modal-body" data-scroll="fnotes">';
  if (!list.length) return h + '<div class="table-empty">مفيش ملاحظات من التمويل</div></div></div>';
  list.forEach(function(n){
    var cases = n.ids.map(function(id){ return caseById(id) || postponedById(id); }).filter(Boolean), byType = {};
    cases.forEach(function(c){ if (TASK_TYPES[c.stage]) (byType[c.stage] = byType[c.stage] || []).push(c.id); });
    var dayOff = isoToOffset(n.day);
    h += '<div class="fn-item'+(seen.indexOf(n.id)===-1 ? ' new' : '')+'"><div class="fn-top">'+(seen.indexOf(n.id)===-1 ? '<span class="fn-new">جديد</span>' : '')+
        '<b>'+esc(n.by)+'</b><span class="field-hint" style="margin:0;">'+fmtWhen(n.at)+'</span>'+
        (n.day ? '<span class="fn-day">'+ic('calendar',12,'#0b6db0')+' يتحجز يوم '+(dayOff!=null ? dayLabel(dayOff) : esc(n.day))+'</span>' : '')+'</div>'+
      '<div class="fn-text">'+esc(n.text)+'</div>'+
      '<div class="fn-cases">'+cases.map(function(c){ var m = TASK_TYPES[c.stage]; return '<span class="fn-case">'+esc(c.name)+(m ? ' · <span style="color:'+m.color+';">'+POOL_NAMES[c.stage]+'</span>' : ' · مؤجل لمرحلة أخرى')+(c.funding && c.funding!=='بدون' ? ' · '+esc(c.funding) : '')+profBtn(c.id)+'</span>'; }).join('')+'</div>'+
      '<div class="fn-acts">'+Object.keys(byType).map(function(k){
        return '<button class="btn btn-primary btn-sm"'+A('noteToTask', n.id, k)+'>'+ic('calendar',12,'#fff')+' إنشاء مهمة '+TASK_TYPES[k].short+' ('+byType[k].length+')'+(n.day ? ' يوم '+(dayOff!=null ? shortDate(dayOff) : n.day) : '')+'</button>';
      }).join('')+'</div></div>';
  });
  return h + '</div></div>';
}
function holdBtn(cid){
  if (!isAdmin()) return '';
  if (fundHold(cid)) return '<span class="field-hint" style="margin:0;">بيتفك من صفحة التمويل</span>';
  return '';
}
function renderHolds(){
  var list = heldCases();
  var h = '<div class="scrim"'+A('closePanel')+'></div><div class="modal" style="width:860px;max-width:95vw;">'+
    panelHead(ic('lock',16,'#475569')+' الحالات الموقوفة', list.length+' حالة')+'<div class="modal-body" data-scroll="holds">';
  if (!list.length) return h + '<div class="table-empty">مفيش حالات موقوفة</div></div></div>';
  h += '<table class="cases-table"><thead><tr><th>كود الحالة</th><th>الاسم</th><th>المرحلة</th><th>المدة</th><th>ملاحظات</th><th>أوقفها</th></tr></thead><tbody>';
  list.forEach(function(c){
    var fh = fundHoldOf(c.id), m = TASK_TYPES[c.stage];
    h += '<tr><td dir="ltr" style="text-align:right;">'+(c.stage==='measurement' ? '—' : c.code)+'</td><td style="font-weight:700;">'+esc(c.name)+profBtn(c.id)+'</td>'+
      '<td><span class="task-chip" style="background:'+m.tint+';color:'+m.color+';">'+m.short+'</span></td>'+
      '<td>'+(fh && fh.until ? 'لحد '+isoDateMs(fh.until) : 'مفتوحة')+'</td>'+
      '<td>'+esc(fh && fh.note || '—')+'</td>'+
      '<td>'+esc(fh && fh.by || 'صفحة التمويل')+(fh ? '<div class="field-hint" style="margin:0;">'+fmtWhen(fh.at)+'</div>' : '')+'</td></tr>';
  });
  return h + '</tbody></table></div></div>';
}


// =====================================================================
// SMS / WhatsApp to the case: after booking, and a reminder the day before
// (simulated here – the real system sends through the SMS / WhatsApp gateway)
// =====================================================================
var CHANNELS = {whatsapp:'واتساب', sms:'SMS'};
function msgFields(t, cid){
  var c = caseById(cid), key = nextCallKey(t.id, cid), time = S.bookTimes[key] || (t.loc==='convoy' ? t.meetingTime : '');
  var map = t.loc==='convoy' ? safeUrl(t.mapUrl) : safeUrl(S.settings.orgMapUrl);
  return {'الاسم':c.name.split(' ')[0], 'النوع':TASK_TYPES[t.type].label, 'الميعاد':'يوم ' + dayLabel(t.dateOffset) + (time ? ' الساعة ' + fmtClock(time) : ''),
    'المكان': t.loc==='convoy' ? ((t.meetingPoint ? t.meetingPoint + ' – ' : '') + 'قافلة ' + (t.gov||'')) : 'مقر مؤسسة هاند إن هاند',
    'الخريطة': map || 'هيتبعت لحضرتك قبل الميعاد',
    'ملاحظات': [t.loc==='convoy' && t.convoyNotes ? 'ملاحظات: ' + t.convoyNotes : '', t.type==='measurement' && committeeNoteOf(cid) ? 'برجاء إحضار: ' + committeeNoteOf(cid).missing.join('، ') : ''].filter(Boolean).join('\n')};
}
// lines that end up empty (e.g. no notes) are dropped
function fillTpl(tpl, f){
  return String(tpl||'').replace(/\{([^}]+)\}/g, function(m, k){ return f[k]!=null ? f[k] : m; })
    .split('\n').filter(function(l){ return l.trim(); }).join('\n');
}
var MSG_TPL = {booking:'msgBookTpl', reminder:'msgRemindTpl', info:'msgInfoTpl'};
var MSG_KIND = {booking:'رسالة الحجز', reminder:'تذكير', info:'بيانات الموعد'};
function msgText(kind, t, cid){ return fillTpl(S.settings[MSG_TPL[kind]], msgFields(t, cid)); }
function sendMsg(kind, t, cid, channel){
  var m = {id:'M'+Date.now()+Math.random().toString(36).slice(2,6), caseId:cid, tid:t.id, kind:kind, channel:channel || S.settings.msgChannel, at:now(), text:msgText(kind, t, cid), status:'sent', by: isCC() ? S.agentId : null};
  S.messages.push(m); return m;
}
// Egyptian mobile -> international format for wa.me / sms:
function intlPhone(p){ return '20' + String(p).replace(/^0/, ''); }
var WA_ICON_PATH = 'M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z';
// buttons next to the phone: open WhatsApp / SMS on the agent's device with the appointment info ready
function sendInfoBtns(t, cid){
  return '<span class="send-btns"><button class="send-btn wa" title="ابعت بيانات الموعد واللوكيشن على واتساب"'+A('sendInfo', t.id+'|'+cid, 'whatsapp')+'>'+pathIc(WA_ICON_PATH,14,'#fff',2)+' واتساب</button>'+
    '<button class="send-btn sms" title="ابعت بيانات الموعد واللوكيشن SMS"'+A('sendInfo', t.id+'|'+cid, 'sms')+'>'+ic('send',13,'#fff')+' SMS</button></span>';
}
function msgsFor(cid){ return S.messages.filter(function(m){ return m.caseId===cid; }); }
function lastMsg(t, cid, kind){ var l = S.messages.filter(function(m){ return m.caseId===cid && m.tid===t.id && m.kind===kind; }); return l[l.length-1] || null; }
// reminders go out on the day before, from the configured time
function sendDueReminders(){
  if (!S.settings.msgOn || !S.settings.reminderOn) return 0;
  var n = nowDate(), p = (S.settings.reminderTime||'10:00').split(':');
  if (n.getHours()*60 + n.getMinutes() < (+p[0])*60 + (+p[1]||0)) return 0;
  var tOff = todayOffset(), sent = 0;
  S.tasks.forEach(function(t){
    if (t.status!=='published' || !inConfirmWindow(t, tOff)) return;   // same number of days as the confirmation call
    t.candidateIds.forEach(function(cid){
      if ((S.bookings[t.type]||{})[cid]!==t.id || lastMsg(t, cid, 'reminder')) return;
      sendMsg('reminder', t, cid); sent++;
    });
  });
  return sent;
}
function msgChips(t, cid){
  var b = lastMsg(t, cid, 'booking'), r = lastMsg(t, cid, 'reminder'), h = '';
  if (b) h += '<span class="msg-chip" title="'+esc(b.text)+'">'+ic('send',11)+' رسالة الحجز · '+CHANNELS[b.channel]+'</span>';
  if (r) h += '<span class="msg-chip" title="'+esc(r.text)+'">'+ic('clock',11)+' التذكير اتبعت</span>';
  return h;
}
function renderMsgs(cid){
  var l = msgsFor(cid).slice().sort(function(a,b){ return b.at-a.at; });
  if (!l.length) return '';
  return '<div class="msg-list">'+l.map(function(m){
    return '<div class="msg-item"><div class="msg-meta">'+(MSG_KIND[m.kind]||'رسالة')+' · '+CHANNELS[m.channel]+(m.auto || !m.by ? ' · أوتوماتيك' : ' · '+esc(agentName(m.by)))+' · '+fmtWhen(m.at)+' · <span class="cap-ok">اتبعتت</span></div><div class="msg-text">'+esc(m.text)+'</div></div>';
  }).join('')+'</div>';
}


// =====================================================================
// Call-center supervisor: assign calls / tasks, route call types
// =====================================================================
function assignRows(){
  var rows = [], tOff = todayOffset();
  S.tasks.forEach(function(t){
    if (t.status!=='published' || t.dateOffset < tOff) return;
    t.candidateIds.forEach(function(cid){
      var st = caseStatus(t, cid); if (!isOpenStatus(st.key)) return;

// cleans the working draft; returns an error text or ''
function svfCheck(qs, forPublish){
  if (forPublish && !qs.length) return 'النموذج مفيهوش أسئلة';
  var ids = {};
  for (var i=0;i<qs.length;i++){
    var q = qs[i];
    q.text = (q.text||'').trim(); q.sec = (q.sec||'').trim();
    if (!q.text) return 'سؤال رقم ' + (i+1) + ' من غير نص';
    if (q.type==='single' || q.type==='multi'){
      q.options = (q.options||[]).map(function(o){ return (o||'').trim(); }).filter(Boolean);
      if (q.options.length < 2) return 'سؤال رقم ' + (i+1) + ' محتاج اختيارين على الأقل';
    } else delete q.options;
    if (q.alertOn && svqOpts(q).indexOf(q.alertOn)===-1) delete q.alertOn;
    if (q.cond){ var t = qs.filter(function(x){ return x.id===q.cond.q; })[0]; if (!t || !ids[t.id] || svqOpts(t).indexOf(q.cond.v)===-1) delete q.cond; }
    if (!q.sec) delete q.sec;
    ids[q.id] = true;
  }
  return '';
}
function svfGuard(){ if (!SVE.id || !svfCan(SVE.id)){ toast('مش مسموح لك تعدّل النموذج ده'); return false; } return true; }
var SVF_ACTIONS = {
  svfSel: function(id){ SVE.sel = id || null; render(); },
  svfSet: function(v, ab){
    if (!svfGuard()) return;
    var p = (ab||'').split('|'), q = svfQ(p[0]); if (!q) return;
    var k = p[1];
    if (k==='text' || k==='sec'){ q[k] = v; return; }
    if (k==='type'){ q.type = v; if ((v==='single' || v==='multi') && !(q.options && q.options.length)) q.options = ['',''];
      if (q.alertOn && svqOpts(q).indexOf(q.alertOn)===-1) delete q.alertOn; }
    else if (k==='visits'){ if (v) q.visits = v; else delete q.visits; }
    else if (k==='cond'){ if (v){ var i = v.indexOf('::'); q.cond = {q:v.slice(0, i), v:v.slice(i+2)}; } else delete q.cond; }
    else if (k==='alertOn'){ if (v) q.alertOn = v; else delete q.alertOn; }
    render();
  },
  svfReq: function(id){ if (!svfGuard()) return; var q = svfQ(id); if (q){ q.required = !q.required; render(); } },
  svfOpt: function(v, ab){ if (!svfGuard()) return; var p = (ab||'').split('|'), q = svfQ(p[0]); if (q && q.options) q.options[+p[1]] = v; },
  svfOptAdd: function(id){ if (!svfGuard()) return; var q = svfQ(id); if (!q) return; (q.options = q.options || []).push(''); render(); },
  svfOptDel: function(id, j){ if (!svfGuard()) return; var q = svfQ(id); if (!q || !q.options) return; var o = q.options.splice(+j, 1)[0]; if (q.alertOn===o) delete q.alertOn; render(); },
  svfAdd: function(){ if (!svfGuard()) return; var last = SVE.work[SVE.work.length-1], q = {id:svfNewId(), text:'', type:'yesno', required:true}; if (last && last.sec) q.sec = last.sec; SVE.work.push(q); SVE.sel = q.id; render(); },
  svfDup: function(id){ if (!svfGuard()) return; var i = SVE.work.indexOf(svfQ(id)); if (i===-1) return; var q = svClone(SVE.work[i]); q.id = svfNewId(); delete q.alertOn; SVE.work.splice(i+1, 0, q); SVE.sel = q.id; render(); },
  svfDel: function(id){ if (!svfGuard()) return; SVE.work = SVE.work.filter(function(q){ return q.id!==id; }); SVE.work.forEach(function(q){ if (q.cond && q.cond.q===id) delete q.cond; }); SVE.sel = null; render(); },
  svfMove: function(id, d){ if (!svfGuard()) return; var i = SVE.work.indexOf(svfQ(id)), j = i + parseInt(d,10); if (i===-1 || j<0 || j>=SVE.work.length) return; var t = SVE.work[i]; SVE.work[i] = SVE.work[j]; SVE.work[j] = t; render(); },
  svfName: function(v){ if (svfGuard()) SVE.name = v; },
  svfCompany: function(v){ if (!svfGuard()) return; SVE.company = v; render(); },
  svfStatus: function(k){ if (!svfGuard()) return; var i = SVE.statuses.indexOf(k); if (i===-1) SVE.statuses.push(k); else SVE.statuses.splice(i, 1); render(); },
  svfPreview: function(){ SVE.preview = SVE.preview ? null : {answers:{}, notes:{}, type:'newDelivery', miss:false}; render(); },
  svfPvType: function(t){ if (SVE.preview){ SVE.preview.type = t; render(); } },
  svfPvA: function(qid, v){ var pv = SVE.preview; if (!pv) return; var r = {qs:SVE.work, answers:pv.answers}; svSetAnswer(r, qid, v); render(); },
  svfPvT: function(v, qid){ if (SVE.preview) SVE.preview.answers[qid] = v; },
  svfPvN: function(v, sec){ if (SVE.preview) SVE.preview.notes[sec] = v; },
  svfPvCheck: function(){ var pv = SVE.preview; if (!pv) return; pv.miss = true; var m = svMissing({qs:SVE.work, answers:pv.answers}, pv.type); toast(m.length ? 'فاضل ' + m.length + ' سؤال إلزامي' : 'كل الأسئلة الإلزامية متجاوبة'); render(); },
  svfSave: function(silent){
    if (!svfGuard()) return false;
    var err = svfCheck(SVE.work, false); if (err){ toast(err); render(); return false; }
    loadSurveyForms(); var f = svfById(SVE.id); if (!f) return false;
    f.draft = svClone(SVE.work); f.name = SVE.id==='base' ? f.name : SVE.name.trim(); f.company = SVE.id==='base' || f.kind==='follow' ? '' : SVE.company;
    if (f.kind==='follow') f.statuses = SVE.statuses.slice();
    f.savedAt = Date.now(); f.savedBy = svfUser(); SVE.name = f.name;
    saveSurveyForms(); if (silent!==true){ toast('اتحفظت المسودة'); render(); }
    return true;
  },
  svfPublish: function(){
    if (!svfGuard()) return;
    if (SVE.id!=='base' && !SVE.name.trim()){ toast('اكتب اسم النموذج'); return render(); }
    var isF = svfIsFollow(SVE.id);
    if (SVE.id!=='base' && !isF && !SVE.company){ toast('اختار شركة التمويل'); return render(); }
    if (isF && !SVE.statuses.length){ toast('اختار حالة الطلب اللي النموذج يظهر معاها'); return render(); }
    var err = svfCheck(SVE.work, true); if (err){ toast(err); return render(); }
    if (!ACT.svfSave(true)) return;
    var f = svfById(SVE.id), p = svfPublished(f);
    if (p && !svfDirty(f)){ toast('مفيش تعديلات من آخر نشر'); return render(); }
    f.versions = f.versions || [];
    var ver = {v:f.versions.length + 1, at:Date.now(), by:svfUser(), name:f.name, company:f.company||'', qs:svClone(f.draft)};
    if (f.kind==='follow') ver.statuses = (f.statuses||[]).slice();
    f.versions.push(ver);
    saveSurveyForms(); SVE.preview = null; SVE.sel = null;
    toast('اتنشر الإصدار ' + f.versions.length + ' – بيتطبق على الاستبيانات الجديدة'); render();
  },
};
Object.assign(ACT, SVF_ACTIONS);

// all the calls waiting for the agent = the sum of the counts on their tabs
function agentTotal(me){ var save = S.agentId; S.agentId = me; var n = agentTabs().reduce(function(sum, t){ return sum + (t[2]||0); }, 0); S.agentId = save; return n; }
// booking calls + attendance confirmations waiting for the agent
function bookingCount(me){
  var items = queueItems(me).filter(function(x){ return x.group==='due' || x.group==='other' || x.group==='later' || (x.group==='full' && (x.t.standby||[]).length < S.settings.standbyMax); });
  return items.length + confirmItems(me).length;
}
// only the tabs of the call types the supervisor gave this agent, each with its count
function agentTabs(){
  var me = S.agentId, tabs = [];
  // outbound calls (with how many are waiting)
  if (['measurement','delivery','maintEval','confirm'].some(function(k){ return canDo(me, k); })) tabs.push(['calls','الحجز', bookingCount(me)]);
  if (canDo(me, 'committee')) tabs.push(['committee','تبليغ اللجنة', committeeFor(me).filter(function(k){ return k.status!=='notified'; }).length]);
  if (canDo(me, 'survey')) tabs.push(['survey','متابعة جودة الخدمة (Survey)', surveyItems(me).filter(function(x){ return !x.later; }).length]);
  if (canDo(me, 'followup')) tabs.push(['followup','المتابعات', followItems(me).filter(function(x){ return !x.later; }).length]);
  // inbound calls (emergency bookings live under مكالمة واردة)
  var inb = tabs.length;
  if (canDo(me, 'inbound') || canDo(me, 'emergency')) tabs.push(['inbound','مكالمة واردة']);
  if (canDo(me, 'newCase')) tabs.push(['newCase','إضافة حالة جديدة']);
  if (inb && tabs.length > inb) tabs[inb].push(null, true);   // divider before the inbound group
  return tabs;
}

// =====================================================================
// Events
// =====================================================================
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || !root || !root.contains(el)) return;
  if (el.disabled) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el.getAttribute('data-a'), el.getAttribute('data-b'), el.getAttribute('data-c'), e);
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (!el.getAttribute || !el.getAttribute('data-input')) return;
  if (el.getAttribute('inputmode')==='numeric'){
    // digits only (Arabic-Indic digits are accepted and converted)
    var pos = el.selectionStart, v = el.value.replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0) - 0x0660); });
    var clean = v.replace(/[^0-9]/g, '');
    if (clean !== el.value){ pos = Math.max(0, pos - (v.length - clean.length)); el.value = clean; try { el.setSelectionRange(pos, pos); } catch(err){} }
  }
  var fn = ACT[el.getAttribute('data-input')];
  if (fn) fn(el.value, el.getAttribute('data-a'));
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (!el.getAttribute || !el.getAttribute('data-change')) return;
  var fn = ACT[el.getAttribute('data-change')];
  if (fn) fn(el.value, el.getAttribute('data-a'));
});
document.addEventListener('keydown', function(e){
  if (e.key==='Escape' && S.fuOpen){ ACT.fuClose(); return; }
  if (e.key==='Escape' && S.callOpen){ ACT.closeCall(); return; }
  if (e.key==='Escape' && S.poolOpen){ ACT.closePool(); return; }
  if (e.key==='Escape' && S.dashOpen && !S.overlay){ ACT.closeDash(); return; }
  if (e.key==='Escape' && S.overlay){
    if (PROFILES.open) ACT.closeProfile();
    else if (S.overlay==='confirm') ACT.cancelConfirm();
    else if (S.overlay==='addCases') ACT.closeAddCases();
    else { closeAllOverlays(); render(); }
  }
});

// ---------- drag & drop (DOM-only hover state, no re-render while dragging) ----------
var drag = null;
document.addEventListener('dragstart', function(e){
  if (!isAdmin()) return;
  var tEl = e.target.closest && e.target.closest('[data-drag-type],[data-drag-task]');
  if (!tEl) return;
  drag = tEl.hasAttribute('data-drag-type') ? {type:tEl.getAttribute('data-drag-type')} : {task:tEl.getAttribute('data-drag-task')};
  try { e.dataTransfer.setData('text/plain', 'x'); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
});
document.addEventListener('dragover', function(e){
  if (!drag) return;
  var col = e.target.closest && e.target.closest('[data-drop-day]');
  if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ if (x!==col) x.classList.remove('drop-hot'); });

var DASH_TYPE_COLORS = {measurement:'#2f6fed', newDelivery:'#15803d', maintEval:'#f96a74', maintDelivery:'#ff6a00'};
var DASH_OUTCOME_COLORS = {booked:'#15803d', notInterested:'#97a0ad', noAnswer:'#dc2626', unavailable:'#f97316'};
var DASH_PERIODS = [['today','اليوم'],['week','الأسبوع'],['month','الشهر'],['quarter','ربع سنوي'],['year','سنوية']];
var DASH_HOURS = [9,10,11,12,13,14,15,16];

// mock history of earlier calls (stands in for the server) — per agent profile, answer rate by hour
var CALL_HISTORY = (function(){
  var out = [], s = 11;
  function r(){ s = (s*9301 + 49297) % 233280; return s/233280; }
  var prof = {a1:{calls:38, book:.62, show:.84}, a2:{calls:44, book:.52, show:.78}, a3:{calls:31, book:.45, show:.72}};
  var types = ['measurement','measurement','measurement','measurement','newDelivery','newDelivery','newDelivery','maintEval','maintEval','maintDelivery'];
  var ans = {9:.48, 10:.6, 11:.72, 12:.74, 13:.66, 14:.58, 15:.52, 16:.42};
  var T = daysBetween(BASE_SUNDAY, REAL_TODAY);
  var nowH = new Date().getHours();
  for (var d = T-400; d <= T; d++){
    var wd = dateOf(d).getDay(); if (wd===5) continue;
    AGENTS.forEach(function(a){
      var p = prof[a.id], n = Math.round(p.calls*(0.75 + r()*0.5)*(wd===6 ? 0.6 : 1));
      for (var i=0;i<n;i++){
        var h = 9 + Math.floor(r()*8), type = types[Math.floor(r()*types.length)];
        if (d===T && h >= nowH) continue;
        var incoming = r() < 0.07, outcome;
        if (!incoming && r() > ans[h]) outcome = r() < 0.72 ? 'noAnswer' : 'unavailable';
        else { var x = r(); outcome = x < p.book + 0.1 ? 'booked' : 'notInterested'; }
        var e = {d:d, h:h, agentId:a.id, type:type, outcome:outcome, incoming:incoming, att:null};
        if (outcome==='booked'){ var vd = d + 2 + Math.floor(r()*6); if (vd < T){ e.vd = vd; e.att = r() < p.show ? 'attended' : 'noShow'; } }
        out.push(e);
      }
    });
  }
  return out;
})();
function liveCallEvents(){
  return S.callLog.map(function(l){
    var t = findTask(l.taskId), dt = new Date(l.at), bt = l.bookTid ? findTask(l.bookTid) : t;
    var o = l.outcome==='bookedAlt' ? 'booked' : l.outcome;
    var e = {d:daysBetween(BASE_SUNDAY, dt), h:dt.getHours(), agentId:l.agentId, type:t ? t.type : 'measurement', outcome:o, incoming:l.callType==='وارد', att:null};
    if (o==='booked' && bt){ var a = S.attendance[nextCallKey(bt.id, l.caseId)]; e.att = a ? a.status : null; e.vd = bt.dateOffset; }
    return e;
  });
}
function dashRange(kind, step){
  var today = startOfDay(nowDate()), from, to;
  if (kind==='today'){ from = new Date(today.getTime()); from.setDate(from.getDate()+step); to = new Date(from.getTime()); }
  else if (kind==='week'){ from = new Date(today.getTime()); from.setDate(from.getDate()-from.getDay()+7*step); to = new Date(from.getTime()); to.setDate(to.getDate()+6); }
  else if (kind==='month'){ from = new Date(today.getFullYear(), today.getMonth()+step, 1); to = new Date(from.getFullYear(), from.getMonth()+1, 0); }
  else if (kind==='quarter'){ var q = Math.floor(today.getMonth()/3) + step; from = new Date(today.getFullYear(), q*3, 1); to = new Date(from.getFullYear(), from.getMonth()+3, 0); }
  else { from = new Date(today.getFullYear()+step, 0, 1); to = new Date(from.getFullYear(), 11, 31); }
  var f = daysBetween(BASE_SUNDAY, from), tt = Math.min(daysBetween(BASE_SUNDAY, to), daysBetween(BASE_SUNDAY, today));
  return {from:f, to:tt, label: f===tt ? isoDate(f) : isoDate(f) + ' - ' + isoDate(tt)};
}
// buckets for the trend chart
function dashBuckets(kind, R){
  var out = [];
  if (kind==='today') return DASH_HOURS.map(function(h){ return {label:h+':00', test:function(e){ return e.h===h; }}; });
  if (kind==='week' || kind==='month'){
    for (var d = R.from; d <= R.to; d++) (function(d){ var dd = dateOf(d); out.push({label: kind==='week' ? WEEKDAYS_AR[dd.getDay()] : String(dd.getDate()), test:function(e){ return e.d===d; }}); })(d);
    return out;
  }
  if (kind==='quarter'){
    for (var w = R.from; w <= R.to; w += 7) (function(w){ out.push({label:shortDate(w), test:function(e){ return e.d>=w && e.d<w+7; }}); })(w);
    return out;
  }
  var y = dateOf(R.from).getFullYear();
  for (var m = 0; m < 12; m++) (function(m){
    var a = daysBetween(BASE_SUNDAY, new Date(y, m, 1)), b = daysBetween(BASE_SUNDAY, new Date(y, m+1, 0));
    if (a <= R.to) out.push({label:MONTHS_AR[m], test:function(e){ return e.d>=a && e.d<=b; }});
  })(m);
  return out;
}
function pct(a, b){ return b ? Math.round(a/b*1000)/10 : 0; }
function nfmt(n){ return Number(n).toLocaleString('en-US'); }
function summarize(ev){
  var s = {calls:ev.length, answered:0, booked:0, incoming:0, attended:0, noShow:0, byOutcome:{}, byType:{}};
  Object.keys(DASH_OUTCOME_COLORS).forEach(function(k){ s.byOutcome[k] = 0; });
  Object.keys(TASK_TYPES).forEach(function(k){ s.byType[k] = {calls:0, booked:0}; });
  ev.forEach(function(e){
    if (NOT_ANSWERED.indexOf(e.outcome)===-1) s.answered++;
    if (e.incoming) s.incoming++;
    s.byOutcome[e.outcome] = (s.byOutcome[e.outcome]||0) + 1;
    if (s.byType[e.type]) s.byType[e.type].calls++;
    if (e.outcome==='booked'){ s.booked++; if (s.byType[e.type]) s.byType[e.type].booked++; if (e.att==='attended') s.attended++; else if (e.att==='noShow') s.noShow++; }
  });
  return s;
}
function dashData(){
  var R = dashRange(S.dashPeriod, S.dashStep);
  var all = CALL_HISTORY.concat(liveCallEvents()).filter(function(e){ return e.d>=R.from && e.d<=R.to; });
  var ev = S.dashAgent ? all.filter(function(e){ return e.agentId===S.dashAgent; }) : all;
  var sum = summarize(ev);
  var agents = AGENTS.map(function(a){
    var ae = all.filter(function(e){ return e.agentId===a.id; });
    var days = {}; ae.forEach(function(e){ days[e.d] = 1; });
    var s = summarize(ae); s.agent = a; s.days = Object.keys(days).length; return s;
  });
  var buckets = dashBuckets(S.dashPeriod, R).map(function(b){
    var be = ev.filter(b.test);
    return {label:b.label, calls:be.length, booked:be.filter(function(e){ return e.outcome==='booked'; }).length};
  });
  var hours = DASH_HOURS.map(function(h){
    var he = ev.filter(function(e){ return e.h===h && !e.incoming; });
    var ans = he.filter(function(e){ return FAILED_OUTCOMES.indexOf(e.outcome)===-1; }).length;
    return {label:h+':00', calls:he.length, rate:pct(ans, he.length)};
  });
  return {R:R, sum:sum, agents:agents, buckets:buckets, hours:hours};
}

// ---------- tiny SVG charts (Recharts look) ----------
function niceMax(v){ if (v<=0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function tipHtml(label, rows){
  return '<div class="t-label">'+esc(label)+'</div>' + rows.map(function(r){ return '<div class="t-row"><span class="t-dot" style="background:'+r[2]+'"></span><span>'+esc(r[0])+': <b>'+esc(r[1])+'</b></span></div>'; }).join('');
}
function svgFrame(W, H, pl, pb, pt, max, unit){
  var h = '', n = 4;
  for (var i=0;i<=n;i++){
    var y = pt + (H-pt-pb) * (1 - i/n), v = max*i/n;
    h += '<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="#e2e5ea" stroke-dasharray="3 3"/>';
    h += '<text x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+(Math.round(v*10)/10)+(unit||'')+'</text>';
  }
  h += '<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="#d6d9df"/>';
  return h;
}
function xLabels(cats, W, H, pl, pb){
  var step = (W-pl-6)/cats.length, every = Math.ceil(cats.length/12), h = '';
  cats.forEach(function(c, i){ if (i % every===0) h += '<text x="'+(pl+step*(i+0.5))+'" y="'+(H-pb+15)+'" text-anchor="middle">'+esc(c)+'</text>'; });
  return h;
}
function svgBars(cats, series, opts){
  opts = opts || {};
  var W = opts.w || 560, H = opts.h || 200, pl = 38, pb = 24, pt = 8;
  var max = opts.max || niceMax(Math.max.apply(null, [0].concat(series.map(function(s){ return Math.max.apply(null, s.values); }))));
  var h = '<svg class="vs-svg" viewBox="0 0 '+W+' '+H+'">' + svgFrame(W, H, pl, pb, pt, max, opts.unit);
  var gw = (W-pl-6)/cats.length, bw = Math.min(30, gw*0.72/series.length);
  cats.forEach(function(c, i){
    var x0 = pl + gw*i + (gw - bw*series.length)/2;
    var tip = esc(tipHtml(c, series.map(function(s){ return [s.name, (opts.fmt ? opts.fmt(s.values[i], i) : nfmt(s.values[i])), s.color]; })));
    h += '<rect x="'+(pl+gw*i)+'" y="'+pt+'" width="'+gw+'" height="'+(H-pt-pb)+'" fill="transparent" data-tip="'+tip+'"/>';
    series.forEach(function(s, k){
      var v = s.values[i], bh = (H-pt-pb) * v/max;
      h += '<rect x="'+(x0+bw*k)+'" y="'+(H-pb-bh)+'" width="'+(bw-2)+'" height="'+Math.max(0,bh)+'" rx="3" fill="'+s.color+'" data-tip="'+tip+'"/>';
    });
  });
  return h + xLabels(cats, W, H, pl, pb) + '</svg>' + legend(series);
}
function svgLine(cats, series, opts){
  opts = opts || {};
  var W = 560, H = opts.h || 220, pl = 38, pb = 24, pt = 8;
  var max = niceMax(Math.max.apply(null, [0].concat(series.map(function(s){ return Math.max.apply(null, s.values); }))));
  var h = '<svg class="vs-svg" viewBox="0 0 '+W+' '+H+'">' + svgFrame(W, H, pl, pb, pt, max);
  var step = (W-pl-6)/cats.length;
  function X(i){ return pl + step*(i+0.5); }
  function Y(v){ return H-pb - (H-pt-pb)*v/max; }
  series.forEach(function(s){
    h += '<polyline fill="none" stroke="'+s.color+'" stroke-width="2.2" points="'+s.values.map(function(v,i){ return X(i)+','+Y(v); }).join(' ')+'"/>';
    if (cats.length <= 31) s.values.forEach(function(v,i){ h += '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>'; });
  });
  cats.forEach(function(c, i){
    var tip = esc(tipHtml(c, series.map(function(s){ return [s.name, nfmt(s.values[i]), s.color]; })));
    h += '<rect x="'+(pl+step*i)+'" y="'+pt+'" width="'+step+'" height="'+(H-pt-pb)+'" fill="transparent" data-tip="'+tip+'"/>';
  });
  return h + xLabels(cats, W, H, pl, pb) + '</svg>' + legend(series);
}
function legend(series){
  if (series.length < 2) return '';

// =====================================================================
// المتابعات (follow-ups): every case that received a new limb is called every N months (3 by default)
// after the delivery / the last follow-up. Same popup as the CMS "إضافة متابعة"; the follow-up forms
// are built by the call-center supervisor with the survey-form editor. Maintenance orders have no follow-up.
// =====================================================================
function followCases(){
  var out = DELIVERED.map(function(d){ return {id:d.id, delivered:d.delivered}; }), seen = {};
  out.forEach(function(x){ seen[x.id] = 1; });
  Object.keys(S.attendance).forEach(function(k){
    if (S.attendance[k].status!=='attended') return;
    var p = k.split('|'), t = findTask(p[0]);
    if (t && t.type==='newDelivery' && !seen[p[1]]){ seen[p[1]] = 1; out.push({id:p[1], delivered:isoDate(t.dateOffset)}); }
  });
  return out;
}
function followLog(id){ return S.followUps[id] || []; }
function followLast(id){ var l = followLog(id).filter(function(e){ return e.done; }); return l[l.length-1] || null; }
function followStopped(id){ return followLog(id).some(function(e){ var st = followStatus(e.status); return st && st.stop; }); }
function followDueAt(x){
  var last = followLast(x.id), b = new Date(last ? last.at : new Date(x.delivered).getTime());
  b.setMonth(b.getMonth() + (S.settings.followMonths || 3)); return b.getTime();
}
// daily distribution set by the supervisor: each agent gets up to their daily number of follow-ups,
// oldest due first. Cases the agent already called today stay with them (and count in the number);
// cases the supervisor assigned by hand go to that agent. The rest wait for the next days.
function followQuotaOf(a){ var q = S.followQuota[a]; return q!=null ? q : S.settings.followDaily; }

  var agents = agentsFor('followup'), used = {}, owner = {}, due = [];
  agents.forEach(function(a){ used[a] = 0; });
  // every case an agent worked today counts in that agent's number (finished or waiting for a retry)
  Object.keys(S.followUps).forEach(function(id){ var a = followTouchedToday(id); if (a && used[a]!=null){ used[a]++; owner[id] = a; } });
  followCases().forEach(function(x){
    if (followStopped(x.id)) return;
    var d = followDueAt(x); if (d > now()) return;
    due.push({x:x, due:d});

  due.forEach(function(o){ var id = o.x.id, m = S.followAssign[id]; if (!owner[id] && m && used[m]!=null){ owner[id] = m; used[m]++; } });
  var i = 0;
  due.forEach(function(o){
    var id = o.x.id; if (owner[id]) return;
    for (var k=0;k<agents.length;k++){
      var a = agents[(i + k) % agents.length];
      if (used[a] < followQuotaOf(a)){ owner[id] = a; used[a]++; i = (i + k + 1) % agents.length; return; }
    }

}

    var x = o.x, cy = S.followCycle[x.id] || {}, owner = plan.owner[x.id] || null;
    if (agent && owner!==agent) return null;

function openFundingPage(e){
  if (!FUNDING_PAGE_B64) return;                   // not bundled -> follow the link to funding.html
  var w = window.open('', '_blank'); if (!w) return;
  if (e) e.preventDefault();
  var bytes = Uint8Array.from(atob(FUNDING_PAGE_B64), function(ch){ return ch.charCodeAt(0); });
  w.document.open(); w.document.write(new TextDecoder('utf-8').decode(bytes)); w.document.close();
}

// case profile hooks (the profile itself is the shared block above)
var PF_HOOKS = {
  base: function(id){ return {d:DELIVERED_MAP[id] || null, c:caseById(id)}; },
  who: function(){ return actorName(); },
  visits: function(id){ return {meas:profVisit(id, 'measurement'), deliv:profVisit(id, 'newDelivery')}; },
  // everything done on the case in the operations room (newest first in ملف الحالة)
  events: function(id){
    var out = [];
    S.callLog.forEach(function(l){
      if (l.caseId!==id) return;
      var t = findTask(l.taskId), bt = l.bookTid ? findTask(l.bookTid) : null, od = outcomeDef(l.outcome);
      out.push({at:l.at, kind: l.outcome==='maintRequest' ? 'maint' : 'call', title:od.label + (t ? ' – ' + TASK_TYPES[t.type].label : ''),
        sub:[l.callType, bt ? 'الحجز ' + dayLabel(bt.dateOffset) : '', l.note].filter(Boolean).join(' · '), by:agentName(l.agentId)});
    });
    Object.keys(S.attendance).forEach(function(k){
      var p = k.split('|'); if (p[1]!==id) return;
      var a = S.attendance[k], t = findTask(p[0]); if (!t || (a.status!=='attended' && a.status!=='noShow')) return;
      out.push({at:new Date(BASE_SUNDAY.getTime() + t.dateOffset*86400000).getTime() + 10*3600000, kind:'visit', title:(a.status==='attended' ? 'حضر ' : 'لم يحضر ') + TASK_TYPES[t.type].label, sub:locLabelFor(t) + (a.timeIn ? ' · ' + a.timeIn : '')});
    });
    S.messages.forEach(function(m){ if (m.caseId===id) out.push({at:m.at, kind:'msg', title:MSG_KIND[m.kind] + ' – ' + CHANNELS[m.channel], sub:m.text.split('\n')[0], by:m.by ? agentName(m.by) : ''}); });
    followLog(id).forEach(function(e){ out.push({at:e.at, kind:'follow', title:'متابعة – ' + (e.status ? fuStatusLabel(e.status) : 'لم يرد'), sub:[e.callType, e.form ? e.form.name : '', e.maint ? 'طلب صيانة' : '', e.notes].filter(Boolean).join(' · '), by:e.by}); });
    Object.keys(S.surveys).forEach(function(k){
      if (k.split('|')[1]!==id) return;
      var sv = S.surveys[k]; if (!sv.at && sv.status!=='closed') return;
      out.push({at:sv.at || now(), kind:'survey', title:sv.status==='done' ? 'استبيان جودة الخدمة' + (sv.alert ? ' – فيه تنبيه' : '') : sv.status==='closed' ? 'استبيان – اتقفل لم يرد' : 'استبيان – جاري',
        sub:Object.keys(sv.forms||{}).map(function(f){ return sv.forms[f].name; }).join('، '), by:sv.by ? agentName(sv.by) : ''});
    });
    (S.emergencies||[]).forEach(function(e){ if (e.cid===id) out.push({at:e.at, kind:'maint', title:'حجز طوارئ – ' + e.kind, sub:dayLabel(e.dateOffset) + (e.details ? ' · ' + e.details : ''), by:e.byName}); });
    var d = DELIVERED_MAP[id];
    if (d){
      out.push({at:pfDayMs(d.delivered) + 9*3600000, kind:'visit', title:'استلم الطرف', sub:d.level});
      d.requests.forEach(function(r){ out.push({at:pfDayMs(r.date) + 9*3600000, kind:'maint', title:'طلب صيانة – ' + r.reason, sub:[r.place, r.notes].filter(Boolean).join(' · '), by:r.by}); });
    }
    var fa = FUND.alloc && FUND.alloc[id];
    if (fa) out.push({at:fa.at, kind:'fund', title:'تمويل – ' + fa.company, sub:'', by:fa.by || ''});
    var fh = FUND.holds && FUND.holds[id];
    if (fh) out.push({at:fh.at, kind:'fund', title:'إيقاف من صفحة التمويل', sub:[fh.until ? 'لحد ' + pfWhen(fh.until) : 'مفتوح', fh.note].filter(Boolean).join(' · '), by:fh.by || ''});
    fundNotesFor(id).forEach(function(n){ out.push({at:n.at, kind:'note', title:'ملاحظة من التمويل', sub:n.text, by:n.by}); });
    return out;
  },
  afterSave: function(id, d, ch){ applyProfiles(); if (ch.length) S.audit.unshift({at:now(), who:actorName(), action:'تعديل ملف الحالة', tid:null, label:d.name, detail:ch.map(function(x){ return x.field; }).join('، ')}); },
};
function profVisit(id, type){
  var tid = (S.bookings[type]||{})[id], t = tid && findTask(tid);
  if (!t){   // no current booking: the latest visit of that type the case attended / missed
    Object.keys(S.attendance).forEach(function(k){ var p = k.split('|'), x = findTask(p[0]); if (p[1]===id && x && x.type===type && (!t || x.dateOffset > t.dateOffset)){ t = x; tid = x.id; } });
  }
  if (!t) return {day:'-', att:'-'};
  var a = S.attendance[nextCallKey(tid, id)];
  return {day: isoDate(t.dateOffset), att: a ? (a.status==='attended' ? 'حضر' : a.status==='noShow' ? 'لم يحضر' : '-') : '-'};
}

// =====================================================================
// Init
// =====================================================================
root = document.getElementById('root');
loadFunding();
seedFollowUps();
loadProfiles(); applyProfiles();
// surveys saved earlier in this browser come back; then publish for the funding page
(function(){ var saved = readSurveys(); function aid(n){ return (AGENTS.filter(function(a){ return a.name===n; })[0]||{}).id; }
  Object.keys(saved).forEach(function(k){ var r = saved[k]; if (!findTask(k.split('|')[0]) || !r.status) return;
    var sv = {status:r.status, at:r.at, tries:r.tries, nextAt:r.nextAt||null, by:aid(r.by)};
    if (r.forms){ sv.forms = {}; Object.keys(r.forms).forEach(function(f){ var x = r.forms[f]; x.by = aid(x.by) || x.by; sv.forms[f] = x; }); }
    else { sv.answers = r.answers; sv.notes = r.notes; svNormalize(sv); }
    S.surveys[k] = sv; });
  Object.keys(S.surveys).forEach(function(k){ svNormalize(S.surveys[k]); }); })();
publishSurveys();
render();
// keep clocks / countdowns fresh without disturbing typing
setInterval(function(){
  var ae = document.activeElement;
  if (ae && (ae.tagName==='TEXTAREA' || ae.tagName==='INPUT') && ae.type!=='checkbox') return;
  render();
}, 30000);
