// =====================================================================
// Funding page link (صفحة التمويل) – shared through localStorage
//   hih_funding_v1     : written by the funding page  {companies, alloc:{caseId:{company,at,by,batch}}, batches}
//   hih_funding_ops_v1 : written here                 {caseId:{status, day, tid, type}}
// =====================================================================
var FUND_KEY = 'hih_funding_v1', FUND_OPS_KEY = 'hih_funding_ops_v1';
var FUND = {companies:[], alloc:{}, batches:[]}, fundOpsLast = '';
function readStore(k, def){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function writeStore(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function loadFunding(){
  FUND = readStore(FUND_KEY, null) || {companies:[], alloc:{}, batches:[]};
  FUND.alloc = FUND.alloc || {}; FUND.holds = FUND.holds || {}; FUND.plans = FUND.plans || [];
  CASES.forEach(function(c){
    if (c.baseFunding===undefined) c.baseFunding = c.funding;
    var a = FUND.alloc[c.id]; c.funding = a ? a.company : c.baseFunding;
  });
  (FUND.companies||[]).forEach(function(n){ if (FUNDING_OPTIONS.indexOf(n)===-1) FUNDING_OPTIONS.push(n); });
}
function fundOf(cid){ return FUND.alloc[cid] || null; }
// plan name when the CSR holds the case for funding (operations can't put it in a task)
function fundHold(cid){
  if (typeof FUND==='undefined' || !FUND || !FUND.holds || !FUND.holds[cid]) return '';
  var pid = FUND.holds[cid].plan, pl = (FUND.plans||[]).filter(function(p){ return p.id===pid; })[0];
  return pl ? pl.name : 'خطة تمويل';
}
// operations can hold a case: nobody books it, the call center doesn't see it, until operations releases it
var OPS_HOLD_KEY = 'hih_ops_holds_v1';
var HOLD_REASONS = ['نقص أوراق','مراجعة طبية','طلب من الحالة','مراجعة إدارية','مشكلة في التمويل','أخرى'];
function opsHold(cid){ return S.opsHolds[cid] || null; }
// any hold (operations or funding plan): the call center can't work on the case
function caseHoldLabel(cid){
  var o = opsHold(cid); if (o) return 'موقوفة – ' + o.reason;
  var f = fundHold(cid); return f ? 'موقوفة للتمويل – ' + f : '';
}
function saveOpsHolds(){ writeStore(OPS_HOLD_KEY, S.opsHolds); }
function heldCases(type){
  return CASES.filter(function(c){ return (!type || c.stage===type) && (opsHold(c.id) || fundHold(c.id)); });
}
// where a funded case stands in the operations room
function fundOpsStatus(c){
  var tOff = todayOffset(), tid = (S.bookings[c.stage]||{})[c.id];
  if (tid){
    var bt = findTask(tid), att = S.attendance[nextCallKey(tid, c.id)];
    if (bt) return {status: att ? att.status : 'booked', day:isoDate(bt.dateOffset), tid:tid, type:bt.type};
  }
  var in_ = S.tasks.filter(function(t){ return t.type===c.stage && t.dateOffset>=tOff && t.candidateIds.indexOf(c.id)!==-1; })
    .sort(function(a,b){ return a.dateOffset-b.dateOffset; })[0];
  if (in_) return {status:'scheduled', day:isoDate(in_.dateOffset), tid:in_.id, type:in_.type, draft: in_.status==='draft'};
  return {status:'new'};
}
function syncFundingOps(){
  var out = {};
  Object.keys(FUND.alloc).forEach(function(cid){ var c = caseById(cid); if (c) out[cid] = fundOpsStatus(c); });
  CASES.forEach(function(c){
    if (out[c.id]) return;
    var st = fundOpsStatus(c); if (st.status!=='new') out[c.id] = st;
  });
  var str = JSON.stringify(out);
  if (str !== fundOpsLast){ fundOpsLast = str; writeStore(FUND_OPS_KEY, out); }
}
function fundedNew(){
  return Object.keys(FUND.alloc).map(caseById).filter(function(c){ return c && fundOpsStatus(c).status==='new'; });
}
window.addEventListener('storage', function(e){
  if (e.key!==FUND_KEY) return;
  var before = fundedNew().length;
  loadFunding();
  var after = fundedNew().length;
  if (after > before) toast('وصل تمويل جديد من الـ CSR – ' + (after-before) + ' حالة');
  render();
});
function holdBtn(cid){
  if (!isAdmin()) return '';
  if (opsHold(cid)) return '<button class="ghost-btn"'+A('releaseHold', cid)+'>'+ic('undo',12)+'فك الإيقاف</button>';
  if (fundHold(cid)) return '<span class="field-hint" style="margin:0;">بيتفك من صفحة التمويل</span>';
  return '<button class="ghost-btn hold-btn"'+A('askHold', cid)+'>'+ic('lock',12)+'إيقاف</button>';
}
function renderHoldDlg(){
  var d = S.holdDlg; if (!d) return '';
  var c = caseById(d.cid);
  var tasks = S.tasks.filter(function(t){ return t.dateOffset>=todayOffset() && t.candidateIds.indexOf(d.cid)!==-1; });
  var booked = tasks.filter(function(t){ return (S.bookings[t.type]||{})[d.cid]===t.id; });
  return '<div class="scrim scrim-top"'+A('closeHoldDlg')+'></div><div class="modal modal-sm"><div class="modal-head"><div><div class="drawer-title">إيقاف الحالة</div>'+
    '<div class="drawer-sub">'+esc(c.name)+' · <span dir="ltr">'+c.code+'</span></div></div><button class="icon-btn"'+A('closeHoldDlg')+'>'+ic('x',15,null,2)+'</button></div>'+
    '<div class="modal-body"><div class="hold-info">'+ic('lock',13,'#475569')+'<div>الحالة مش هتتحط في أي مهمة، ومش هتظهر في قوايم الكول سنتر لحد ما تفك الإيقاف.</div></div>'+
    (tasks.length ? '<div class="hold-warn">'+ic('alert',13,'#b45309')+'<div>الحالة موجودة في '+tasks.length+' مهمة'+(booked.length ? ' ومحجوزة يوم '+dayLabel(booked[0].dateOffset)+' – الحجز هيفضل زي ما هو بس مكالمة التأكيد هتقف' : ' – هتفضل في المهمة بس محدش هيتصل بيها')+'.</div></div>' : '')+
    '<div class="field"><label class="field-label">سبب الإيقاف</label><div class="reason-pills">'+HOLD_REASONS.map(function(r){
      return '<button class="'+(d.reason===r?'on':'')+'"'+A('setHoldReason', r)+'>'+r+'</button>'; }).join('')+'</div></div>'+
    '<div class="field"><label class="field-label">ملاحظة (اختياري)</label><textarea class="note-input" rows="2" data-k="hold-note" data-input="setHoldNote" placeholder="مثال: مستني صورة البطاقة">'+esc(d.note)+'</textarea></div></div>'+
    '<div class="modal-foot"><button class="btn btn-danger"'+A('confirmHold')+(d.reason ? '' : ' disabled')+'>'+ic('lock',13,'#fff')+' إيقاف الحالة</button><button class="btn btn-secondary"'+A('closeHoldDlg')+'>إلغاء</button></div></div>';
}
function renderHolds(){
  var list = heldCases();
  var h = '<div class="scrim"'+A('closePanel')+'></div><div class="modal" style="width:860px;max-width:95vw;">'+
    panelHead(ic('lock',16,'#475569')+' الحالات الموقوفة', list.length+' حالة – مش بتتحط في مهام ومش بتظهر للكول سنتر')+'<div class="modal-body" data-scroll="holds">';
  if (!list.length) return h + '<div class="table-empty">مفيش حالات موقوفة</div></div></div>';
  h += '<table class="cases-table"><thead><tr><th>كود الحالة</th><th>الاسم</th><th>المرحلة</th><th>السبب</th><th>أوقفها</th><th></th></tr></thead><tbody>';
  list.forEach(function(c){
    var o = opsHold(c.id), m = TASK_TYPES[c.stage];
    h += '<tr><td dir="ltr" style="text-align:right;">'+c.code+'</td><td style="font-weight:700;">'+esc(c.name)+'</td>'+
      '<td><span class="task-chip" style="background:'+m.tint+';color:'+m.color+';">'+m.short+'</span></td>'+
      '<td>'+(o ? esc(o.reason)+(o.note ? '<div class="field-hint" style="margin:0;">'+esc(o.note)+'</div>' : '') : 'خطة تمويل: '+esc(fundHold(c.id)))+'</td>'+
      '<td>'+(o ? esc(o.by)+'<div class="field-hint" style="margin:0;">'+fmtWhen(o.at)+'</div>' : 'صفحة التمويل (CSR)')+'</td>'+
      '<td style="text-align:left;">'+holdBtn(c.id)+'</td></tr>';
  });
  return h + '</tbody></table></div></div>';
}
function renderFunded(){
  var list = fundedNew(), groups = {};
  list.forEach(function(c){
    var a = fundOf(c.id), k = a.company + '|' + c.stage;
    (groups[k] = groups[k] || {company:a.company, type:c.stage, cases:[]}).cases.push(c);
  });
  var keys = Object.keys(groups).sort();
  var h = '<div class="scrim"'+A('closePanel')+'></div><div class="modal" style="width:880px;max-width:95vw;">'+
    panelHead(ic('send',16,'#2f6fed')+' حالات ممولة جديدة من الـ CSR', list.length+' حالة محتاجة مهمة حجز')+'<div class="modal-body" data-scroll="funded">';
  if (!keys.length) return h + '<div class="table-empty">مفيش حالات ممولة جديدة</div></div></div>';
  keys.forEach(function(k){
    var g = groups[k], m = TASK_TYPES[g.type], ctx = {id:'__fund', type:g.type, loc:'org', gov:null, dateOffset:todayOffset()};
    var ok = g.cases.filter(function(c){ return priorityOf(ctx, c).eligible; });
    h += '<div class="fund-group"><div class="fund-head"><span class="task-chip" style="background:'+m.tint+';color:'+m.color+';">'+pathIc(m.iconPath,12,m.color)+m.short+'</span>'+
      '<b>'+esc(g.company)+'</b><span class="field-hint" style="margin:0;">'+g.cases.length+' حالة</span>'+
      (ok.length ? '<button class="btn btn-primary btn-sm" style="margin-inline-start:auto;"'+A('createFromFunding', k)+'>'+ic('calendar',13,'#fff')+' إنشاء مهمة حجز ('+ok.length+')</button>' : '')+'</div>';
    h += '<table class="cases-table"><thead><tr><th>كود الحالة</th><th>الاسم</th><th>المحافظة</th><th>الطرف</th><th>اتمول</th><th>الحالة</th></tr></thead><tbody>'+
      g.cases.map(function(c){
        var p = priorityOf(ctx, c), a = fundOf(c.id), others = otherLimbs(c);
        return '<tr><td dir="ltr" style="text-align:right;">'+c.code+'</td><td style="font-weight:700;">'+esc(c.name)+
          (others.length ? ' <span class="limb-badge" title="'+esc(others.map(function(o){ return o.code+' – '+o.level; }).join('، '))+'">له طرف تاني: '+others.map(function(o){ return o.code; }).join('، ')+'</span>' : '')+'</td>'+
          '<td>'+esc(c.gov)+'</td><td>'+esc(c.level)+'</td><td>'+fmtWhen(a.at)+'<div class="field-hint" style="margin:0;">'+esc(a.by||'')+'</div></td>'+
          '<td>'+(p.eligible ? '<span class="cap-ok">جاهز للحجز</span>' : '<span class="cap-over">'+esc(p.why)+'</span>')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  });
  return h + '</div></div>';
}


// =====================================================================
// SMS / WhatsApp to the case: after booking, and a reminder the day before
// (simulated here – the real system sends through the SMS / WhatsApp gateway)
// =====================================================================
var CHANNELS = {whatsapp:'واتساب', sms:'SMS'};
function msgFields(t, cid){
  var c = caseById(cid), key = nextCallKey(t.id, cid), time = S.bookTimes[key] || (t.loc==='convoy' ? t.meetingTime : '');
  var map = t.loc==='convoy' ? safeUrl(t.mapUrl) : safeUrl(S.settings.orgMapUrl);
  return {'الاسم':c.name.split(' ')[0], 'النوع':TASK_TYPES[t.type].label, 'الميعاد':'يوم ' + dayLabel(t.dateOffset) + (time ? ' الساعة ' + fmtClock(time) : ''),
    'المكان': t.loc==='convoy' ? ((t.meetingPoint ? t.meetingPoint + ' – ' : '') + 'قافلة ' + (t.gov||'')) : 'مقر مؤسسة هاند إن هاند',
    'الخريطة': map || 'هيتبعت لحضرتك قبل الميعاد',
    'ملاحظات': t.loc==='convoy' && t.convoyNotes ? 'ملاحظات: ' + t.convoyNotes : ''};
}
// lines that end up empty (e.g. no notes) are dropped
function fillTpl(tpl, f){
  return String(tpl||'').replace(/\{([^}]+)\}/g, function(m, k){ return f[k]!=null ? f[k] : m; })
    .split('\n').filter(function(l){ return l.trim(); }).join('\n');
}
var MSG_TPL = {booking:'msgBookTpl', reminder:'msgRemindTpl', info:'msgInfoTpl'};
var MSG_KIND = {booking:'رسالة الحجز', reminder:'تذكير', info:'بيانات الموعد'};
function msgText(kind, t, cid){ return fillTpl(S.settings[MSG_TPL[kind]], msgFields(t, cid)); }
function sendMsg(kind, t, cid, channel){
  var m = {id:'M'+Date.now()+Math.random().toString(36).slice(2,6), caseId:cid, tid:t.id, kind:kind, channel:channel || S.settings.msgChannel, at:now(), text:msgText(kind, t, cid), status:'sent', by: isCC() ? S.agentId : null};
  S.messages.push(m); return m;
}
// Egyptian mobile -> international format for wa.me / sms:
function intlPhone(p){ return '20' + String(p).replace(/^0/, ''); }
var WA_ICON_PATH = 'M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z';
// buttons next to the phone: open WhatsApp / SMS on the agent's device with the appointment info ready
function sendInfoBtns(t, cid){
  return '<span class="send-btns"><button class="send-btn wa" title="ابعت بيانات الموعد واللوكيشن على واتساب"'+A('sendInfo', t.id+'|'+cid, 'whatsapp')+'>'+pathIc(WA_ICON_PATH,14,'#fff',2)+' واتساب</button>'+
    '<button class="send-btn sms" title="ابعت بيانات الموعد واللوكيشن SMS"'+A('sendInfo', t.id+'|'+cid, 'sms')+'>'+ic('send',13,'#fff')+' SMS</button></span>';
}
function msgsFor(cid){ return S.messages.filter(function(m){ return m.caseId===cid; }); }
function lastMsg(t, cid, kind){ var l = S.messages.filter(function(m){ return m.caseId===cid && m.tid===t.id && m.kind===kind; }); return l[l.length-1] || null; }
// reminders go out on the day before, from the configured time
function sendDueReminders(){
  if (!S.settings.msgOn || !S.settings.reminderOn) return 0;
  var n = nowDate(), p = (S.settings.reminderTime||'10:00').split(':');
  if (n.getHours()*60 + n.getMinutes() < (+p[0])*60 + (+p[1]||0)) return 0;
  var tOff = todayOffset(), sent = 0;
  S.tasks.forEach(function(t){
    if (t.status!=='published' || t.dateOffset - tOff !== 1) return;
    t.candidateIds.forEach(function(cid){
      if ((S.bookings[t.type]||{})[cid]!==t.id || lastMsg(t, cid, 'reminder')) return;
      sendMsg('reminder', t, cid); sent++;
    });
  });
  return sent;
}
function msgChips(t, cid){
  var b = lastMsg(t, cid, 'booking'), r = lastMsg(t, cid, 'reminder'), h = '';
  if (b) h += '<span class="msg-chip" title="'+esc(b.text)+'">'+ic('send',11)+' رسالة الحجز · '+CHANNELS[b.channel]+'</span>';
  if (r) h += '<span class="msg-chip" title="'+esc(r.text)+'">'+ic('clock',11)+' التذكير اتبعت</span>';
  return h;
}
function renderMsgs(cid){
  var l = msgsFor(cid).slice().sort(function(a,b){ return b.at-a.at; });
  if (!l.length) return '';
  return '<div class="msg-list">'+l.map(function(m){
    return '<div class="msg-item"><div class="msg-meta">'+(MSG_KIND[m.kind]||'رسالة')+' · '+CHANNELS[m.channel]+(m.auto || !m.by ? ' · أوتوماتيك' : ' · '+esc(agentName(m.by)))+' · '+fmtWhen(m.at)+' · <span class="cap-ok">اتبعتت</span></div><div class="msg-text">'+esc(m.text)+'</div></div>';
  }).join('')+'</div>';
}


// =====================================================================
// Call-center supervisor: assign calls / tasks, route call types
// =====================================================================
function assignRows(){
  var rows = [], tOff = todayOffset();
  S.tasks.forEach(function(t){
    if (t.status!=='published' || t.dateOffset < tOff) return;
    t.candidateIds.forEach(function(cid){
      var st = caseStatus(t, cid); if (!isOpenStatus(st.key)) return;
      var c = caseById(cid); if (!c) return;
      rows.push({key:'b|'+t.id+'|'+cid, cat:catOfType(t.type), type:TASK_TYPES[t.type].short, day:t.dateOffset, place:locLabelFor(t), status:st.label, agent:t.assignee[cid]||'', name:c.name, code:c.code, gov:c.gov, task:t});
    });
  });
  confirmItems('').forEach(function(x){
    var c = caseById(x.cid);
    rows.push({key:'c|'+x.t.id+'|'+x.cid, cat:'confirm', type:'تأكيد الحجز', day:x.t.dateOffset, place:locLabelFor(x.t), status: x.cf && x.cf.status==='noAnswer' ? 'لم يرد' : 'لسه', agent:confirmOwner(x.t, x.cid), name:c.name, code:c.code, gov:c.gov, task:x.t});
  });
  S.committee.forEach(function(k){
    if (k.status==='notified') return;
    rows.push({key:'k|'+k.id, cat:'committee', type:'تبليغ اللجنة', day:k.day, place:k.decision, status: k.status==='noAnswer' ? 'لم يرد' : 'لسه', agent:k.assignee, name:k.name, code:'', gov:k.gov});
  });
  return rows;
}
function filteredAssignRows(){
  var f = S.assignF, q = (f.q||'').trim();
  return assignRows().filter(function(r){
    if (f.cat && r.cat!==f.cat) return false;
    if (f.day!=='' && f.day!=null && String(r.day)!==String(f.day)) return false;
    if (f.gov && r.gov!==f.gov) return false;
    if (f.agent==='__none' && r.agent) return false;
    if (f.agent && f.agent!=='__none' && r.agent!==f.agent) return false;
    if (q && r.name.indexOf(q)===-1 && (r.code||'').indexOf(q.toUpperCase())===-1) return false;
    return true;
  }).sort(function(a,b){ return a.day-b.day || a.cat.localeCompare(b.cat); });
}
function setRowAgent(key, agent){
  var p = key.split('|');
  if (p[0]==='k'){ var k = S.committee.filter(function(x){ return x.id===p[1]; })[0]; if (k) k.assignee = agent; return; }
  var t = findTask(p[1]); if (t) t.assignee[p[2]] = agent;
}

    '<div class="filter-field"><label>نوع المكالمة</label><select class="filter-select" data-change="setAssignF" data-a="cat"><option value="">الكل</option>'+

      days.map(function(d){ return '<option value="'+d+'"'+(String(f.day)===String(d)?' selected':'')+'>'+dayLabel(d)+'</option>'; }).join('')+'</select></div>'+
    '<div class="filter-field"><label>المحافظة</label><select class="filter-select" data-change="setAssignF" data-a="gov"><option value="">الكل</option>'+
      govs.map(function(g){ return '<option'+(f.gov===g?' selected':'')+'>'+esc(g)+'</option>'; }).join('')+'</select></div>'+
    '<div class="filter-field"><label>الموظف الحالي</label><select class="filter-select" data-change="setAssignF" data-a="agent"><option value="">الكل</option><option value="__none"'+(f.agent==='__none'?' selected':'')+'>غير مسندة</option>'+agentOpts(f.agent)+'</select></div>'+
    '<button class="clear-btn"'+A('clearAssignF')+'>مسح الفلاتر</button></div>';
  h += '<div class="assign-bar"><span><b>'+rows.length+'</b> مكالمة'+(sel.length ? ' · تم تحديد <b>'+sel.length+'</b>' : '')+'</span>'+
    '<span class="assign-to">إسناد '+(sel.length ? 'المحدد' : 'كل اللي ظاهر')+' لـ <select class="filter-select" data-change="setAssignTo"><option value="">اختار الموظف</option>'+agentOpts(S.assignTo)+'</select>'+
    '<button class="btn btn-primary btn-sm"'+A('assignBulk')+(S.assignTo && rows.length ? '' : ' disabled')+'>'+ic('user',13,'#fff')+' إسناد ('+(sel.length || rows.length)+')</button></span></div>';
  h += '<div class="assign-table"><table class="cases-table"><thead><tr><th style="width:34px;"></th><th>الحالة</th><th>نوع المكالمة</th><th>الميعاد</th><th>المكان / القرار</th><th>المحافظة</th><th>الوضع</th><th>الموظف</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var on = sel.indexOf(r.key)!==-1;
    h += '<tr'+(on?' class="row-on"':'')+'><td><input type="checkbox"'+(on?' checked':'')+A('toggleAssignSel', r.key)+'/></td>'+

function parseDay(v){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function addMonths(d, n){ var x = new Date(d.getTime()); x.setMonth(x.getMonth()+n); return x; }
function fmtDay(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
// eligibility shown before "أضف"
function ncResult(nc){
  var out = [], today = startOfDay(nowDate());
  if (nc.level && UNSUPPORTED_LEVELS.indexOf(nc.level)!==-1) out.push({k:'stage', t:'مؤجل لمرحلة أخرى', d:'مستوى البتر ده ('+nc.level+') مش بنشتغل فيه حاليًا'});
  var ls = parseDay(nc.lastSurgery);
  if (ls && addMonths(ls, 6) > today) out.push({k:'6m', t:'مؤجل لإتمام 6 شهور', d:'آخر جراحة '+nc.lastSurgery+' – تكمل 6 شهور يوم '+fmtDay(addMonths(ls, 6))});
  var dob = parseDay(nc.dob);
  if (dob && addMonths(dob, 60) > today) out.push({k:'age', t:'مؤجل بسبب العمر', d:'الحالة أقل من 5 سنين – تكمل 5 سنين يوم '+fmtDay(addMonths(dob, 60))});
  var w = parseInt(nc.weight,10);
  if (w > 120) out.push({k:'weight', t:'مؤجل بسبب الوزن', d:'الوزن '+w+' كيلو (أكتر من 120)'});
  if (out.length) return {ok:false, list:out};
  if (!nc.level || !ls || !dob || !nc.weight) return {ok:null, list:[]};
  return {ok:true, list:[{k:'ok', t:'مقبول الشروط', d:''}]};
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || !root || !root.contains(el)) return;
  if (el.disabled) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el.getAttribute('data-a'), el.getAttribute('data-b'), el.getAttribute('data-c'), e);
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (!el.getAttribute || !el.getAttribute('data-input')) return;
  if (el.getAttribute('inputmode')==='numeric'){
    // digits only (Arabic-Indic digits are accepted and converted)
    var pos = el.selectionStart, v = el.value.replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0) - 0x0660); });
    var clean = v.replace(/[^0-9]/g, '');
    if (clean !== el.value){ pos = Math.max(0, pos - (v.length - clean.length)); el.value = clean; try { el.setSelectionRange(pos, pos); } catch(err){} }
  }
  var fn = ACT[el.getAttribute('data-input')];
  if (fn) fn(el.value, el.getAttribute('data-a'));
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (!el.getAttribute || !el.getAttribute('data-change')) return;
  var fn = ACT[el.getAttribute('data-change')];
  if (fn) fn(el.value, el.getAttribute('data-a'));
});
document.addEventListener('keydown', function(e){
  if (e.key==='Escape' && S.callOpen){ ACT.closeCall(); return; }
  if (e.key==='Escape' && S.poolOpen){ ACT.closePool(); return; }
  if (e.key==='Escape' && S.dashOpen && !S.overlay){ ACT.closeDash(); return; }
  if (e.key==='Escape' && S.overlay){
    if (S.holdDlg) ACT.closeHoldDlg();
    else if (S.overlay==='confirm') ACT.cancelConfirm();
    else if (S.overlay==='addCases') ACT.closeAddCases();
    else { closeAllOverlays(); render(); }
  }
});

// ---------- drag & drop (DOM-only hover state, no re-render while dragging) ----------
var drag = null;
document.addEventListener('dragstart', function(e){
  if (!isAdmin()) return;
  var tEl = e.target.closest && e.target.closest('[data-drag-type],[data-drag-task]');
  if (!tEl) return;
  drag = tEl.hasAttribute('data-drag-type') ? {type:tEl.getAttribute('data-drag-type')} : {task:tEl.getAttribute('data-drag-task')};
  try { e.dataTransfer.setData('text/plain', 'x'); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
});
document.addEventListener('dragover', function(e){
  if (!drag) return;
  var col = e.target.closest && e.target.closest('[data-drop-day]');
  if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ if (x!==col) x.classList.remove('drop-hot'); });
  col.classList.add('drop-hot');
});
document.addEventListener('drop', function(e){
  if (!drag) return;
  var col = e.target.closest && e.target.closest('[data-drop-day]');
  e.preventDefault();
  var d = drag; drag = null;
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ x.classList.remove('drop-hot'); });
  if (!col) return;
  var off = parseInt(col.getAttribute('data-drop-day'),10);
  if (d.type) openCreate(d.type, off); else if (d.task) moveTask(d.task, off);
});
document.addEventListener('dragend', function(){
  drag = null;
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ x.classList.remove('drop-hot'); });
});

var DASH_TYPE_COLORS = {measurement:'#2f6fed', newDelivery:'#15803d', maintEval:'#f96a74', maintDelivery:'#ff6a00'};
var DASH_OUTCOME_COLORS = {booked:'#15803d', notInterested:'#97a0ad', noAnswer:'#dc2626', unavailable:'#f97316'};
var DASH_PERIODS = [['today','اليوم'],['week','الأسبوع'],['month','الشهر'],['quarter','ربع سنوي'],['year','سنوية']];
var DASH_HOURS = [9,10,11,12,13,14,15,16];

// mock history of earlier calls (stands in for the server) — per agent profile, answer rate by hour
var CALL_HISTORY = (function(){
  var out = [], s = 11;
  function r(){ s = (s*9301 + 49297) % 233280; return s/233280; }
  var prof = {a1:{calls:38, book:.62, show:.84}, a2:{calls:44, book:.52, show:.78}, a3:{calls:31, book:.45, show:.72}};
  var types = ['measurement','measurement','measurement','measurement','newDelivery','newDelivery','newDelivery','maintEval','maintEval','maintDelivery'];
  var ans = {9:.48, 10:.6, 11:.72, 12:.74, 13:.66, 14:.58, 15:.52, 16:.42};
  var T = daysBetween(BASE_SUNDAY, REAL_TODAY);
  var nowH = new Date().getHours();
  for (var d = T-400; d <= T; d++){
    var wd = dateOf(d).getDay(); if (wd===5) continue;
    AGENTS.forEach(function(a){
      var p = prof[a.id], n = Math.round(p.calls*(0.75 + r()*0.5)*(wd===6 ? 0.6 : 1));
      for (var i=0;i<n;i++){
        var h = 9 + Math.floor(r()*8), type = types[Math.floor(r()*types.length)];
        if (d===T && h >= nowH) continue;
        var incoming = r() < 0.07, outcome;
        if (!incoming && r() > ans[h]) outcome = r() < 0.72 ? 'noAnswer' : 'unavailable';
        else { var x = r(); outcome = x < p.book + 0.1 ? 'booked' : 'notInterested'; }
        var e = {d:d, h:h, agentId:a.id, type:type, outcome:outcome, incoming:incoming, att:null};
        if (outcome==='booked'){ var vd = d + 2 + Math.floor(r()*6); if (vd < T){ e.vd = vd; e.att = r() < p.show ? 'attended' : 'noShow'; } }
        out.push(e);
      }
    });
  }
  return out;
})();
function liveCallEvents(){
  return S.callLog.map(function(l){
    var t = findTask(l.taskId), dt = new Date(l.at), bt = l.bookTid ? findTask(l.bookTid) : t;
    var o = l.outcome==='bookedAlt' ? 'booked' : l.outcome;
    var e = {d:daysBetween(BASE_SUNDAY, dt), h:dt.getHours(), agentId:l.agentId, type:t ? t.type : 'measurement', outcome:o, incoming:l.callType==='وارد', att:null};
    if (o==='booked' && bt){ var a = S.attendance[nextCallKey(bt.id, l.caseId)]; e.att = a ? a.status : null; e.vd = bt.dateOffset; }
    return e;
  });
}
function dashRange(kind, step){
  var today = startOfDay(nowDate()), from, to;
  if (kind==='today'){ from = new Date(today.getTime()); from.setDate(from.getDate()+step); to = new Date(from.getTime()); }
  else if (kind==='week'){ from = new Date(today.getTime()); from.setDate(from.getDate()-from.getDay()+7*step); to = new Date(from.getTime()); to.setDate(to.getDate()+6); }
  else if (kind==='month'){ from = new Date(today.getFullYear(), today.getMonth()+step, 1); to = new Date(from.getFullYear(), from.getMonth()+1, 0); }
  else if (kind==='quarter'){ var q = Math.floor(today.getMonth()/3) + step; from = new Date(today.getFullYear(), q*3, 1); to = new Date(from.getFullYear(), from.getMonth()+3, 0); }
  else { from = new Date(today.getFullYear()+step, 0, 1); to = new Date(from.getFullYear(), 11, 31); }
  var f = daysBetween(BASE_SUNDAY, from), tt = Math.min(daysBetween(BASE_SUNDAY, to), daysBetween(BASE_SUNDAY, today));
  return {from:f, to:tt, label: f===tt ? isoDate(f) : isoDate(f) + ' - ' + isoDate(tt)};
}
// buckets for the trend chart
function dashBuckets(kind, R){
  var out = [];
  if (kind==='today') return DASH_HOURS.map(function(h){ return {label:h+':00', test:function(e){ return e.h===h; }}; });
  if (kind==='week' || kind==='month'){
    for (var d = R.from; d <= R.to; d++) (function(d){ var dd = dateOf(d); out.push({label: kind==='week' ? WEEKDAYS_AR[dd.getDay()] : String(dd.getDate()), test:function(e){ return e.d===d; }}); })(d);
    return out;
  }
  if (kind==='quarter'){
    for (var w = R.from; w <= R.to; w += 7) (function(w){ out.push({label:shortDate(w), test:function(e){ return e.d>=w && e.d<w+7; }}); })(w);
    return out;
  }
  var y = dateOf(R.from).getFullYear();
  for (var m = 0; m < 12; m++) (function(m){
    var a = daysBetween(BASE_SUNDAY, new Date(y, m, 1)), b = daysBetween(BASE_SUNDAY, new Date(y, m+1, 0));
    if (a <= R.to) out.push({label:MONTHS_AR[m], test:function(e){ return e.d>=a && e.d<=b; }});
  })(m);
  return out;
}
function pct(a, b){ return b ? Math.round(a/b*1000)/10 : 0; }
function nfmt(n){ return Number(n).toLocaleString('en-US'); }
function summarize(ev){
  var s = {calls:ev.length, answered:0, booked:0, incoming:0, attended:0, noShow:0, byOutcome:{}, byType:{}};
  Object.keys(DASH_OUTCOME_COLORS).forEach(function(k){ s.byOutcome[k] = 0; });
  Object.keys(TASK_TYPES).forEach(function(k){ s.byType[k] = {calls:0, booked:0}; });
  ev.forEach(function(e){
    if (NOT_ANSWERED.indexOf(e.outcome)===-1) s.answered++;
    if (e.incoming) s.incoming++;
    s.byOutcome[e.outcome] = (s.byOutcome[e.outcome]||0) + 1;
    if (s.byType[e.type]) s.byType[e.type].calls++;
    if (e.outcome==='booked'){ s.booked++; if (s.byType[e.type]) s.byType[e.type].booked++; if (e.att==='attended') s.attended++; else if (e.att==='noShow') s.noShow++; }
  });
  return s;
}
function dashData(){
  var R = dashRange(S.dashPeriod, S.dashStep);
  var all = CALL_HISTORY.concat(liveCallEvents()).filter(function(e){ return e.d>=R.from && e.d<=R.to; });
  var ev = S.dashAgent ? all.filter(function(e){ return e.agentId===S.dashAgent; }) : all;
  var sum = summarize(ev);
  var agents = AGENTS.map(function(a){
    var ae = all.filter(function(e){ return e.agentId===a.id; });
    var days = {}; ae.forEach(function(e){ days[e.d] = 1; });
    var s = summarize(ae); s.agent = a; s.days = Object.keys(days).length; return s;
  });
  var buckets = dashBuckets(S.dashPeriod, R).map(function(b){
    var be = ev.filter(b.test);
    return {label:b.label, calls:be.length, booked:be.filter(function(e){ return e.outcome==='booked'; }).length};
  });
  var hours = DASH_HOURS.map(function(h){
    var he = ev.filter(function(e){ return e.h===h && !e.incoming; });
    var ans = he.filter(function(e){ return FAILED_OUTCOMES.indexOf(e.outcome)===-1; }).length;
    return {label:h+':00', calls:he.length, rate:pct(ans, he.length)};
  });
  return {R:R, sum:sum, agents:agents, buckets:buckets, hours:hours};
}

// ---------- tiny SVG charts (Recharts look) ----------
function niceMax(v){ if (v<=0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function tipHtml(label, rows){
  return '<div class="t-label">'+esc(label)+'</div>' + rows.map(function(r){ return '<div class="t-row"><span class="t-dot" style="background:'+r[2]+'"></span><span>'+esc(r[0])+': <b>'+esc(r[1])+'</b></span></div>'; }).join('');
}
function svgFrame(W, H, pl, pb, pt, max, unit){
  var h = '', n = 4;
  for (var i=0;i<=n;i++){
    var y = pt + (H-pt-pb) * (1 - i/n), v = max*i/n;
    h += '<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="#e2e5ea" stroke-dasharray="3 3"/>';
    h += '<text x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+(Math.round(v*10)/10)+(unit||'')+'</text>';
  }
  h += '<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="#d6d9df"/>';
  return h;
}
function xLabels(cats, W, H, pl, pb){
  var step = (W-pl-6)/cats.length, every = Math.ceil(cats.length/12), h = '';
  cats.forEach(function(c, i){ if (i % every===0) h += '<text x="'+(pl+step*(i+0.5))+'" y="'+(H-pb+15)+'" text-anchor="middle">'+esc(c)+'</text>'; });
  return h;
}
function svgBars(cats, series, opts){
  opts = opts || {};
  var W = opts.w || 560, H = opts.h || 200, pl = 38, pb = 24, pt = 8;
  var max = opts.max || niceMax(Math.max.apply(null, [0].concat(series.map(function(s){ return Math.max.apply(null, s.values); }))));
  var h = '<svg class="vs-svg" viewBox="0 0 '+W+' '+H+'">' + svgFrame(W, H, pl, pb, pt, max, opts.unit);
  var gw = (W-pl-6)/cats.length, bw = Math.min(30, gw*0.72/series.length);
  cats.forEach(function(c, i){
    var x0 = pl + gw*i + (gw - bw*series.length)/2;
    var tip = esc(tipHtml(c, series.map(function(s){ return [s.name, (opts.fmt ? opts.fmt(s.values[i], i) : nfmt(s.values[i])), s.color]; })));
    h += '<rect x="'+(pl+gw*i)+'" y="'+pt+'" width="'+gw+'" height="'+(H-pt-pb)+'" fill="transparent" data-tip="'+tip+'"/>';
    series.forEach(function(s, k){
      var v = s.values[i], bh = (H-pt-pb) * v/max;
      h += '<rect x="'+(x0+bw*k)+'" y="'+(H-pb-bh)+'" width="'+(bw-2)+'" height="'+Math.max(0,bh)+'" rx="3" fill="'+s.color+'" data-tip="'+tip+'"/>';
    });
  });
  return h + xLabels(cats, W, H, pl, pb) + '</svg>' + legend(series);
}
function svgLine(cats, series, opts){
  opts = opts || {};
  var W = 560, H = opts.h || 220, pl = 38, pb = 24, pt = 8;
  var max = niceMax(Math.max.apply(null, [0].concat(series.map(function(s){ return Math.max.apply(null, s.values); }))));
  var h = '<svg class="vs-svg" viewBox="0 0 '+W+' '+H+'">' + svgFrame(W, H, pl, pb, pt, max);
  var step = (W-pl-6)/cats.length;
  function X(i){ return pl + step*(i+0.5); }
  function Y(v){ return H-pb - (H-pt-pb)*v/max; }
  series.forEach(function(s){
    h += '<polyline fill="none" stroke="'+s.color+'" stroke-width="2.2" points="'+s.values.map(function(v,i){ return X(i)+','+Y(v); }).join(' ')+'"/>';
    if (cats.length <= 31) s.values.forEach(function(v,i){ h += '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>'; });
  });
  cats.forEach(function(c, i){
    var tip = esc(tipHtml(c, series.map(function(s){ return [s.name, nfmt(s.values[i]), s.color]; })));
    h += '<rect x="'+(pl+step*i)+'" y="'+pt+'" width="'+step+'" height="'+(H-pt-pb)+'" fill="transparent" data-tip="'+tip+'"/>';
  });
  return h + xLabels(cats, W, H, pl, pb) + '</svg>' + legend(series);
}
function legend(series){
  if (series.length < 2) return '';
  return '<div class="vs-legend">'+series.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>'; }).join('')+'</div>';
}
function chartCard(title, sub, body){

function dashCsv(){

    [q('إجمالي المكالمات'), s.calls], [q('تم الحجز'), s.booked], [q('نسبة الرد %'), pct(s.answered, s.calls)], [q('نسبة الحجز %'), pct(s.booked, s.calls)],
    [q('نسبة الحضور %'), pct(s.attended, s.attended+s.noShow)], [q('لم يحضر'), s.noShow], [],
    [q('الموظف'), q('المكالمات'), q('نسبة الرد %'), q('الحجز'), q('نسبة الحجز %'), q('نسبة الحضور %')]];
  D.agents.forEach(function(a){ rows.push([q(a.agent.name), a.calls, pct(a.answered,a.calls), a.booked, pct(a.booked,a.calls), pct(a.attended, a.attended+a.noShow)]); });
  rows.push([]); rows.push([q('استجابة المكالمة'), q('العدد'), q('%')]);

(function(){

var DELIVERED = (function(){
  var s = 23; function r(){ s = (s*9301 + 49297) % 233280; return s/233280; }
  function pick(a){ return a[Math.floor(r()*a.length)]; }
  var FIRST = ['حسناء','محمد','أحمد','فاطمة','مصطفى','سعاد','إبراهيم','منى','كريم','هدى','عبد الله','نجلاء','سيد','رشا','حسن','آمال','طارق','نادية','يوسف','سامية'];
  var MID = ['محمد','أحمد','شعبان','علي','حسن','عبد الحميد','إبراهيم','سعيد','فتحي','جمال'];
  var LAST = ['عزب','سليمان','النجار','منصور','عوض','شلبي','زكي','حسانين','الشافعي','عبد العزيز'];
  var PLACES = {'القاهرة':['المطرية','عين شمس','شبرا'], 'الجيزة':['إمبابة','الهرم','أوسيم'], 'بني سويف':['سمسطا','الواسطى','ناصر'], 'المنيا':['مطاي','سمالوط','ملوي'],
    'أسوان':['كوم امبو','إدفو','دراو'], 'سوهاج':['طهطا','جرجا','المراغة'], 'الفيوم':['سنورس','إطسا','طامية'], 'الشرقية':['الزقازيق','بلبيس','منيا القمح']};
  var govs = Object.keys(PLACES);
  function dstr(y0, y1){ var y = y0 + Math.floor(r()*(y1-y0+1)), m = 1 + Math.floor(r()*12), d = 1 + Math.floor(r()*28); return y + '-' + ('0'+m).slice(-2) + '-' + ('0'+d).slice(-2); }
  function phone(){ var t = String(Math.floor(r()*1e8)); while (t.length<8) t = '0'+t; return pick(['010','011','012','015']) + t; }
  var out = [];
  function make(id, name, gov, age, level, ph){
    var markaz = pick(PLACES[gov] || ['المركز']), female = /ة$|ء$|ى$|سعاد|آمال|منى|هدى|نجلاء|رشا|نادية|سامية|فاطمة|حسناء|ليلى|هالة/.test(name.split(' ')[0]);
    var birthY = new Date().getFullYear() - age, amp = dstr(birthY + Math.min(age-1, 5), new Date().getFullYear() - 2);
    return {id:id, name:name, gov:gov, age:age, level:level, phone:ph, gender: female ? 'أنثى' : 'ذكر',
      code:(CODE_PREFIX[level]||'BK') + String(10 + (out.length*7) % 90) + String(100 + (out.length*53) % 900),
      nid:(age>=18?'2':'3') + (function(){ var x=''; for (var k=0;k<13;k++) x += Math.floor(r()*10); return x; })(), marital: age<18 ? 'أعزب' : pick(['متزوج','متزوج','أعزب','أرمل','مطلق']),
      birth: birthY + '-' + ('0'+(1+Math.floor(r()*12))).slice(-2) + '-' + ('0'+(1+Math.floor(r()*28))).slice(-2), markaz:markaz, area:pick(['-','الشياخة الأولى','الشياخة الثانية','-']),
      address:markaz, cardAddress:pick(['-', markaz + ' – ' + gov]), phone1:ph, phone2:r()<0.4 ? phone() : '-', edu:pick(['بدون','بدون','إعدادية','دبلوم','جامعي']),
      job:age<18 ? 'طالب' : pick(['بدون عمل','عامل','موظف','ربة منزل','مزارع']), howKnown:pick(['جهة او جمعية او مؤسسة أخرى','فيسبوك','معرفة شخصية','حالة سابقة']),
      chronic:pick(['بدون','بدون','سكر','ضغط','سكر وضغط']), weight:35 + Math.floor(r()*70), side:pick(['أيمن','أيسر']), ampDate:amp,
      cause:pick(['حادث','طبيعي','سكر','خلقي','ورم']), causeDetails:'-', lastSurgery:dstr(2015, new Date().getFullYear()-1),
      delivered:dstr(new Date().getFullYear()-3, new Date().getFullYear()), funding:pick(FUNDING_OPTIONS), requests:[]};
  }
  // cases that already have an open maintenance request in the operations room
  CASES.filter(function(c){ return c.order==='maintenance'; }).forEach(function(c){ out.push(make(c.id, c.name, c.gov, c.age, c.level, c.phone)); });
  for (var i=0;i<34;i++){

    out.push(d);
  }
  return out;
})();

  inboundClose: function(){ S.inbound = {q:'', pick:null, form:emptyInboundForm()}; render(); },
  inboundField: function(v, field){ S.inbound.form[field] = v; render(); },
  inboundHist: function(){ S.inbound.form.showHist = !S.inbound.form.showHist; render(); },
  inboundAdd: function(){
    var d = DELIVERED_MAP[S.inbound.pick], f = S.inbound.form; if (!d || openMaintenance(d.id)) return;
    var miss = [['date','تاريخ تقديم الطلب'],['callType','نوع المكالمة'],['place','مكان الصيانة'],['notes','الملاحظات'],['responsible','هل يوجد مسئول عن الحالة'],['reason','سبب الصيانة']]
      .filter(function(x){ return !String(f[x[0]]||'').trim(); });
    if (miss.length){ toast('اكمل: ' + miss.map(function(x){ return x[1]; }).join('، ')); return render(); }
    var convoy = f.place.indexOf('قافلة')===0;
    // the case becomes a maintenance request waiting for "تقييم الصيانة"
    var c = CASE_MAP[d.id];
    if (!c){
      c = mk(d.id, d.name, d.gov, d.funding, d.level, d.age, 0, convoy ? 'قافلة' : 'داخل المؤسسة', 'maintEval', 0, 0);
      c.phone = d.phone; c.code = d.code;
      CASES.push(c); CASE_MAP[c.id] = c;
    } else { if (S.bookings.maintDelivery) delete S.bookings.maintDelivery[c.id]; if (S.bookings.maintEval) delete S.bookings.maintEval[c.id]; c.stage = 'maintEval'; c.order = 'maintenance'; c.waitingDays = 0; c.ready = null; c.pref = convoy ? 'قافلة' : 'داخل المؤسسة'; }
    d.requests.push({date:f.date, callType:f.callType, place:f.place, reason:f.reason, notes:f.notes.trim(), responsible:f.responsible, by:agentName(S.agentId)});
    // nearest published "تقييم الصيانة" day with room, in the requested place
    var tOff = todayOffset();
    var target = S.tasks.filter(function(t){
      return t.type==='maintEval' && t.status==='published' && t.dateOffset>=tOff && taskBookedCount(t) < bookingGoal(t) &&
        (convoy ? (t.loc==='convoy' && t.gov===d.gov) : t.loc==='org');
    }).sort(function(a,b){ return a.dateOffset - b.dateOffset; })[0];
    S.callLog.push({id:'L'+Date.now(), taskId: target ? target.id : null, caseId:c.id, agentId:S.agentId, at:now(), outcome:'maintRequest',
      callType:f.callType, note:f.reason + ' – ' + f.notes.trim()});
    S.inbound = {q:'', pick:null, form:emptyInboundForm()};
    if (!target){
      toast('اتسجل طلب الصيانة ونزل في حصالة تقييم صيانة – مفيش موعد تقييم صيانة متاح');
      return render();
    }
    if (target.candidateIds.indexOf(c.id)===-1) target.candidateIds.push(c.id);
    target.assignee[c.id] = S.agentId;
    target.priority = target.priority || {}; target.priority[c.id] = true;
    S.callOpen = {tid:target.id, cid:c.id};
    S.callDraft = {callType:f.callType, outcome:'booked', bookTid:target.id, bookTime:'', note:''};
    toast('اتسجل طلب الصيانة – حدد الحجز');
    render();
  },
});
