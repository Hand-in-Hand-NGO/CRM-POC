function queueItems(agent){
  var tOff = todayOffset(), items = [];
  S.tasks.forEach(function(t){
    if (t.status!=='published' || t.dateOffset < tOff) return;
    var full = t.target>0 && taskBookedCount(t) >= bookingGoal(t);
    t.candidateIds.forEach(function(cid){
      if (agent && t.assignee[cid]!==agent) return;
      if (caseHoldLabel(cid)) return;                 // held cases are off the call lists
      var st = caseStatus(t, cid);
      if (!isOpenStatus(st.key)) return;
      var nxt = nextCallFor(t, cid);
      var group = st.key==='hardToReach' ? 'htr' : full ? 'full' : nxt ? 'later' : 'due';
      items.push({t:t, cid:cid, st:st, nxt:nxt, group:group, prio: !!(t.priority && t.priority[cid]) || st.key==='standbyUp', p:priorityOf(t, caseById(cid))});
    });
  });
  // one row per case: keep the nearest appointment, list the other tasks on it
  items.sort(function(a,b){ return a.t.dateOffset - b.t.dateOffset; });
  var byCase = {}, out = [];
  items.forEach(function(x){
    var first = byCase[x.cid];
    if (first){ first.alsoIn.push(x.t); return; }
    x.alsoIn = []; byCase[x.cid] = x; out.push(x);
  });
  return out;
}

function queueOrder(a, b){ return (b.prio - a.prio) || (a.t.dateOffset - b.t.dateOffset) || (b.p.score - a.p.score); }
function renderQueue(){

    return '<button class="'+(S.supTab===x[0]?'on':'')+'"'+A('setSupTab', x[0])+'>'+x[1]+'</button>'; }).join('')+'</div>';
  if (S.supTab==='assign') return '<div class="sup-wrap">'+tabs+renderAssign()+'</div>';
  if (S.supTab==='routing') return '<div class="sup-wrap">'+tabs+renderRouting()+'</div>';
  if (S.supTab==='survey') return '<div class="sup-wrap">'+tabs+renderSurveyReport()+'</div>';
  return '<div class="sup-wrap">'+tabs+renderLists()+'</div>';
}

  h += '</div></div>';
  return h;

function renderConvoyBox(t){

    return '<div class="convoy-box org"><div class="convoy-row">'+pathIc(ORG_ICON_PATH,14)+'<span><b>الحضور:</b> داخل المؤسسة – '+dayLabel(t.dateOffset)+'</span></div></div>';
  }
  var miss = convoyMissing(t), url = safeUrl(t.mapUrl);
  var h = '<div class="convoy-box"><div class="convoy-head">'+pathIc(CONVOY_ICON_PATH,15,'#7c3aed')+' بيانات القافلة – '+esc(t.gov||'')+' · '+dayLabel(t.dateOffset)+'</div>';
  h += '<div class="convoy-grid">'+
    '<div class="convoy-item"><div class="k">'+ic('clock',12)+' ميعاد الحضور</div><div class="v">'+(t.meetingTime ? fmtClock(t.meetingTime) : '<span class="missing">لم يُحدد</span>')+'</div></div>'+
    '<div class="convoy-item"><div class="k">'+ic('pin',12)+' مكان الحضور</div><div class="v">'+(t.meetingPoint ? esc(t.meetingPoint) : '<span class="missing">لم يُحدد</span>')+'</div></div>'+
    '<div class="convoy-item"><div class="k">'+ic('pin',12)+' اللوكيشن</div><div class="v">'+(url
      ? '<a href="'+esc(url)+'" target="_blank" rel="noopener">فتح على الخريطة</a> <button class="copy-btn" title="نسخ اللينك لإرساله للحالة"'+A('copyText', url)+'>'+ic('copy',12)+'</button>'
      : '<span class="missing">لم يُحدد</span>')+'</div></div></div>';
  if (t.convoyNotes) h += '<div class="convoy-notes">'+ic('alert',12)+' '+esc(t.convoyNotes)+'</div>';
  if (miss.length) h += '<div class="rule-hint warn" style="margin-bottom:0;">ناقص: '+miss.join('، ')+'</div>';
  return h + '</div>';
}
function convoyFields(d, act, kp){
  return '<div class="convoy-head" style="margin-bottom:8px;">'+pathIc(CONVOY_ICON_PATH,15,'#7c3aed')+' بيانات القافلة للكول سنتر</div>'+
    '<div class="cap-inputs">'+
    '<div><label>ميعاد الحضور</label><input class="text-input" type="time" value="'+esc(d.meetingTime)+'" data-k="'+kp+'-time" data-input="'+act+'" data-a="meetingTime"/></div>'+
    '<div><label>مكان الحضور</label><input class="text-input" placeholder="مثال: مستشفى المحافظة – البوابة الرئيسية" value="'+esc(d.meetingPoint)+'" data-k="'+kp+'-place" data-input="'+act+'" data-a="meetingPoint"/></div></div>'+
    '<div class="field"><label class="field-label" style="font-size:11.5px;color:var(--text-muted);">اللوكيشن (لينك خرائط جوجل)</label><input class="text-input" dir="ltr" placeholder="https://maps.google.com/..." value="'+esc(d.mapUrl)+'" data-k="'+kp+'-map" data-input="'+act+'" data-a="mapUrl"/>'+
    (d.mapUrl && !safeUrl(d.mapUrl) ? '<div class="field-hint" style="color:var(--danger);">اللينك لازم يبدأ بـ https://</div>' : '')+'</div>'+
    '<div class="field"><label class="field-label" style="font-size:11.5px;color:var(--text-muted);">ملاحظات للكول سنتر (اختياري)</label><textarea class="note-input" placeholder="مثال: الحالات تحضر معاها البطاقة..." data-k="'+kp+'-notes" data-input="'+act+'" data-a="convoyNotes">'+esc(d.convoyNotes)+'</textarea></div>';
}
function renderCallModal(){
  var co = S.callOpen; if (!co) return '';
  var t = findTask(co.tid), cid = co.cid, c = caseById(cid), d = S.callDraft, m = TASK_TYPES[t.type], o = d.outcome;
  var incoming = d.callType==='وارد';
  var h = '<div class="scrim scrim-top"'+A('closeCall')+'></div><div class="cms-modal">';
  h += '<div class="cms-head"><div class="cms-title">'+ic('phone',15,'#535252')+' '+esc(m.label)+' – حجز لحالة '+esc(c.name)+'</div>'+
    '<button class="cms-close" title="إغلاق"'+A('closeCall')+'>'+ic('x',15,'#535252',2.4)+'</button></div>';
  h += '<div class="cms-body" data-scroll="callmodal">';
  h += '<div class="cms-case"><span><b>'+esc(c.name)+'</b> <span class="case-code" dir="ltr">'+c.code+'</span>'+profBtn(cid)+'</span>'+phoneChip(c)+sendInfoBtns(t, cid)+
    '<span class="cms-muted">'+esc(c.gov)+' · '+esc(c.level)+' · '+c.age+' سنة</span></div>';
  h += renderConvoyBox(t);
  var nxt = nextCallFor(t, cid);
  if (nxt && !incoming) h += '<div class="rule-hint warn">مجدولة لمعاد اتصال '+fmtWhen(nxt)+'</div>';

  // form
  h += '<div class="cms-form">';
  h += '<div class="cms-row"><label class="cms-label">نوع المكالمة <span class="req">*</span></label><div class="cms-field"><select class="cms-input" data-change="setCallField" data-a="callType">'+
    ['صادر','وارد'].map(function(v){ return '<option'+(d.callType===v?' selected':'')+'>'+v+'</option>'; }).join('')+'</select></div>'+
    '<label class="cms-label">استجابة المكالمة <span class="req">*</span></label><div class="cms-field"><select class="cms-input" data-change="setCallField" data-a="outcome"><option value="">اختر</option>'+
    OUTCOME_DEFS.filter(function(x){ return !incoming || FAILED_OUTCOMES.indexOf(x.key)===-1; }).map(function(x){ return '<option value="'+x.key+'"'+(o===x.key?' selected':'')+'>'+x.label+'</option>'; }).join('')+
    (taskBookedCount(t) >= bookingGoal(t) ? '<option value="standby"'+(o==='standby'?' selected':'')+'>وافق – قائمة احتياطي</option>' : '')+'</select></div></div>';
  var booking = o==='booked';
  var opts = [{task:t, remaining:bookingGoal(t)-taskBookedCount(t)}].concat(alternativeTasksFor(t, cid));
  h += '<div class="cms-row"><label class="cms-label">تاريخ الحجز'+(booking?' <span class="req">*</span>':'')+'</label><div class="cms-field"><select class="cms-input" data-change="setCallField" data-a="bookTid"'+(booking?'':' disabled')+'>'+
    opts.map(function(a){ return '<option value="'+a.task.id+'"'+(d.bookTid===a.task.id?' selected':'')+'>'+isoDate(a.task.dateOffset)+' – '+dayLabel(a.task.dateOffset)+' – '+esc(locLabelFor(a.task))+' (متبقي '+Math.max(0,a.remaining)+')</option>'; }).join('')+'</select></div>'+
    '<label class="cms-label">وقت الحجز</label><div class="cms-field"><input class="cms-input" type="time" value="'+esc(d.bookTime)+'" data-k="call-time" data-input="setCallField" data-a="bookTime"'+(booking?'':' disabled')+'/></div></div>';
  h += '<div class="cms-row"><label class="cms-label">نتيجة التواصل <span class="req">*</span></label><div class="cms-field wide"><textarea class="cms-input" rows="3" placeholder="نتيجة التواصل" data-k="call-note" data-input="setCallField" data-a="note">'+esc(d.note)+'</textarea></div></div>';

  // rule hints
  if (FAILED_OUTCOMES.indexOf(o)!==-1){
    var ftAfter = failedToday(cid) + 1;
    var willHTR = !isHardToReach(cid) && (failedTotal(cid) + 1 - (S.htrBase[cid]||0)) >= S.settings.hardToReachAfter;
    if (willHTR) h += '<div class="rule-hint danger">هتتعلم صعب الوصول</div>';
    else if (ftAfter >= S.settings.maxPerDay) h += '<div class="rule-hint warn">آخر محاولة اليوم · إعادة الاتصال بكرة '+fmtTime(tomorrowNine())+'</div>';
    else h += '<div class="rule-hint">إعادة الاتصال '+fmtTime(now()+S.settings.retryMinutes*60000)+' · محاولة '+ftAfter+'/'+S.settings.maxPerDay+'</div>';
  }
  if (o==='standby') h += '<div class="rule-hint">هتتسجل احتياطي #'+((t.standby||[]).length+1)+' – لو حد من المحجوزين اعتذر، الحالة هتظهر للاتصال على طول</div>';
  if (booking && S.settings.msgOn){
    var pt = findTask(d.bookTid) || t, saveBT = S.bookTimes[nextCallKey(pt.id, cid)];
    S.bookTimes[nextCallKey(pt.id, cid)] = d.bookTime || saveBT;
    h += '<div class="msg-preview"><div class="msg-meta">'+ic('send',12)+' هتتبعت للحالة على '+CHANNELS[S.settings.msgChannel]+' بعد الحفظ:</div><div class="msg-text">'+esc(msgText('booking', pt, cid))+'</div></div>';
    if (saveBT) S.bookTimes[nextCallKey(pt.id, cid)] = saveBT; else delete S.bookTimes[nextCallKey(pt.id, cid)];
  }
  if (booking){
    var bt = findTask(d.bookTid) || t, b = taskBookedCount(bt);
    if (b >= bookingGoal(bt)) h += '<div class="rule-hint warn">الموعد اكتمل ('+b+' من '+bookingGoal(bt)+')</div>';
  }
  h += '<div class="cms-actions"><button class="cms-btn cms-add"'+A('saveCall')+'>'+pathIc('M12 5v14M5 12h14',13,'#fff',3)+' أضف</button><button class="cms-btn cms-cancel"'+A('closeCall')+'>'+ic('x',12,'#fff',3)+' إلغاء</button></div>';
  h += '</div>';

  // history table
  var logs = logsFor(cid).slice().sort(function(a,b){ return b.at-a.at; });
  h += '<table class="cms-table"><thead><tr><th>نوع المكالمة</th><th>استجابة المكالمة</th><th>تاريخ الحجز</th><th>وقت الحجز</th><th>تم الاتصال فى</th><th>تم الاتصال بواسطة</th><th>نتيجة التواصل</th><th>تأكيد الحجز</th></tr></thead><tbody>';
  if (!logs.length) h += '<tr><td colspan="8" class="cms-empty">لم يتم العثور علي أي نتائج</td></tr>';
  logs.forEach(function(l){
    var od = outcomeDef(l.outcome), bt = l.bookTid ? findTask(l.bookTid) : null;
    // a booking that still holds -> send the confirmation with the appointment info
    var live = bt && (l.outcome==='booked' || l.outcome==='bookedAlt') && (S.bookings[bt.type]||{})[cid]===bt.id;
    var sentB = live ? S.messages.filter(function(m){ return m.caseId===cid && m.tid===bt.id && m.kind==='booking' && m.by && !m.auto; }) : [];
    var confirmCell = live ? '<div class="rec-send"><button class="send-btn wa"'+A('sendInfo', bt.id+'|'+cid+'|booking', 'whatsapp')+'>'+pathIc(WA_ICON_PATH,13,'#fff',2)+' إرسال واتساب</button>'+
      '<button class="send-btn sms"'+A('sendInfo', bt.id+'|'+cid+'|booking', 'sms')+'>'+ic('send',12,'#fff')+' إرسال SMS</button></div>'+
      (sentB.length ? '<div class="rec-sent">'+ic('check',11,'#15803d',2.4)+' اتبعت '+sentB.map(function(m){ return CHANNELS[m.channel]+' '+fmtTime(m.at); }).join('، ')+'</div>' : '') : '-';
    h += '<tr'+(l.id===S.callJustBooked ? ' class="rec-new"' : '')+'><td>'+esc(l.callType||'صادر')+'</td><td><span style="color:'+od.color+';font-weight:700;">'+od.label+'</span></td>'+
      '<td dir="ltr" style="text-align:right;">'+(bt ? isoDate(bt.dateOffset) : '-')+'</td><td>'+(l.bookTime ? fmtClock(l.bookTime) : '-')+'</td>'+
      '<td>'+fmtWhen(l.at)+'</td><td>'+esc(agentName(l.agentId))+'</td><td>'+(l.note ? esc(l.note) : '-')+'</td><td>'+confirmCell+'</td></tr>';
  });
  h += '</tbody></table>';
  if (seedFailed(cid)) h += '<div class="log-legacy">+ '+seedFailed(cid)+' محاولات سابقة قبل تفعيل سجل المكالمات</div>';
  return h + '</div></div>';
}
function renderLog(cid){
  var logs = logsFor(cid).slice().sort(function(a,b){ return b.at-a.at; });
  var h = '<div class="log-list">';
  if (!logs.length && !seedFailed(cid)) h += '<div class="log-legacy">لا توجد مكالمات مسجلة.</div>';
  logs.forEach(function(l){
    var d = outcomeDef(l.outcome), t = findTask(l.taskId);
    h += '<div class="log-item"><div class="log-time">'+fmtWhen(l.at)+'</div><div class="log-body">'+
      '<span class="status-tag" style="background:#f4f5f7;color:'+d.color+';"><span class="dot" style="background:'+d.color+';"></span>'+d.label+'</span> '+
      '<span class="log-who">· '+esc(agentName(l.agentId))+(t ? ' · ' + TASK_TYPES[t.type].short + ' ' + dayLabel(l.bookTid && findTask(l.bookTid) ? findTask(l.bookTid).dateOffset : t.dateOffset) : '')+(l.callType==='وارد' ? ' · وارد' : '')+'</span>'+
      (l.note ? '<div class="log-note">'+esc(l.note)+'</div>' : '')+'</div></div>';
  });
  if (seedFailed(cid)) h += '<div class="log-legacy">+ '+seedFailed(cid)+' محاولات سابقة قبل تفعيل سجل المكالمات</div>';
  return h + renderMsgs(cid) + '</div>';
}

// Overlays

function renderOverlays(){
  switch (S.overlay){
    case 'create': return S.createDraft ? renderCreate() : '';
    case 'addCases': return S.addCasesMode ? renderAddCases() : '';
    case 'detail': return renderDetail();
    case 'confirm':
      var under = S.confirm && S.confirm.returnTo;
      return (under==='detail' ? renderDetail() : under==='addCases' && S.addCasesMode ? renderAddCases() : under==='create' && S.createDraft ? renderCreate() : under==='capacity' ? renderCapacity() : '') + renderConfirm();
    case 'capacity': return renderCapacity();
    case 'settings': return renderSettings();
    case 'risk': return renderRisk();
    case 'audit': return renderAudit();
    case 'holds': return renderHolds();
    case 'fundNotes': return renderFundNotes();
  }
  return '';
}
function drawerHead(m, title, sub, extra, closeAct){
  return '<div class="drawer-head"><div class="drawer-head-left"><div class="card-ic" style="background:'+m.tint+';width:32px;height:32px;">'+pathIc(m.iconPath,16,m.color)+'</div>'+
    '<div><div class="drawer-title">'+title+'</div><div class="drawer-sub">'+sub+'</div></div></div><div style="display:flex;gap:6px;">'+(extra||'')+
    '<button class="icon-btn"'+A(closeAct)+'>'+ic('x',15,null,2)+'</button></div></div>';
}

function renderCreate(){
  var d = S.createDraft, m = TASK_TYPES[d.type];
  var edit = !!d.editId, t = edit ? findTask(d.editId) : null, ro = edit && !isAdmin();
  var target = draftTarget(d), attMode = d.targetMode==='attendance';
  var canCreate = target>0 && (d.loc==='org' || !!d.gov);
  var closeAct = edit ? 'closeDetail' : 'closeCreate';
  var head = edit
    ? drawerHead(m, m.label, dayLabel(t.dateOffset) + ' · ' + (t.status==='draft' ? '<span class="draft-badge">مسودة</span>' : '<span class="pub-badge">منشورة</span>') +
        (t.seriesId ? ' · <span class="rep-txt">'+ic('history',11)+' تتكرر '+esc(taskSeriesText(t))+'</span>' : ''),
        isAdmin() ? (t.status==='draft'
            ? '<button class="btn btn-primary btn-sm"'+A('publishTask', t.id)+'>'+ic('send',12,'#fff')+' نشر</button>'
            : '<button class="icon-btn" title="إرجاع لمسودة"'+A('unpublishTask', t.id)+'>'+ic('undo',15)+'</button>')+
          '<button class="icon-btn danger" title="حذف المهمة"'+A('deleteTask')+'>'+ic('trash',15)+'</button>' : '', closeAct)
    : drawerHead(m, 'إنشاء مهمة جديدة', m.label + ' · ' + dayLabel(d.dateOffset), '', closeAct);
  var h = '<div class="scrim"'+A(closeAct)+'></div><aside class="drawer">' + head;
  h += '<div class="drawer-body" data-scroll="'+(edit ? 'detail' : 'create')+'">';
  var bk = edit ? taskBookedCount(t) : 0;
  h += '<div class="'+(ro ? 'ro-form' : '')+'">';
  if (d.fundCompany) h += '<div class="fund-note">'+ic('send',13,'#0093e9')+' حالات ممولة من <b>'+esc(d.fundCompany)+'</b> ('+d.candidateIds.length+' حالة) – اختار اليوم والمكان</div>';
  h += '<div class="field"><label class="field-label">مكان الزيارة</label><div class="seg">'+
    '<button class="seg-btn'+(d.loc==='org'?' on':'')+'"'+A('setCreateLoc','org')+'>داخل المؤسسة</button>'+
    '<button class="seg-btn'+(d.loc==='convoy'?' on':'')+'"'+A('setCreateLoc','convoy')+'>قافلة</button></div></div>';
  if (d.loc==='convoy'){
    var q = (S.govSearch||'').trim();
    var opts = GOVERNORATES.filter(function(g){ return !q || g.indexOf(q)!==-1; }).slice(0,8);
    h += '<div class="field"><label class="field-label">المحافظة</label><div class="combo-wrap">'+
      '<input class="text-input" placeholder="ابحث عن محافظة..." value="'+esc(S.govSearch)+'" data-k="gov" data-input="govSearch"'+A('govFocus')+'/>';
    if (S.govDropdownOpen){
      h += '<div class="combo-list">'+opts.map(function(g){ return '<div class="combo-item"'+A('pickGov', g)+'>'+g+'</div>'; }).join('')+
        (opts.length ? '' : '<div class="combo-empty">لا توجد محافظات مطابقة</div>')+'</div>';
    }
    h += '</div></div>';
    h += convoyFields(d, 'setConvoyField', 'c');
  }
  // ---- one box: the count, the day's capacity after it, and the historical rate
  var fake = {id:'__new', type:d.type, dateOffset:d.dateOffset, loc:d.loc, gov:d.gov || '—', target:target, mode:d.targetMode, attendTarget: attMode ? draftAttend(d) : null};
  var loads = dayLoad(d.dateOffset, S.tasks.filter(function(x){ return x.id!==d.editId; }).concat([fake]));
  var anyOver = loads.some(function(x){ return x.load > x.cap; });
  h += '<div class="count-box'+(anyOver?' over':'')+'"><label class="field-label">'+(attMode ? 'عدد الحالات المطلوب حضورها' : 'عدد الحجوزات')+'</label><div class="target-mode-row">'+
    (attMode
      ? '<input class="num-input" type="text" inputmode="numeric" value="'+esc(d.attend)+'" data-k="attend" data-input="setCreateAttend"/>'
      : '<input class="num-input" type="text" inputmode="numeric" value="'+esc(d.target)+'" data-k="target" data-input="setCreateTarget"/>')+
    '<div class="seg mode-seg"><button class="seg-btn'+(attMode?' on':'')+'"'+A('setCreateMode','attendance')+'>الحضور</button>'+
    '<button class="seg-btn'+(!attMode?' on':'')+'"'+A('setCreateMode','booking')+'>الحجز</button></div></div>';
  if (target>0){
    // the arrow goes from the number you typed to the one worked out from the historical attendance rate
    var r = rateFor(d.type), attN = attMode ? draftAttend(d) : expectedAttend(d.type, target);
    var arrow = attMode ? pathIc('M5 12h14M13 6l6 6-6 6',15,'#2563eb',2.2) : pathIc('M19 12H5M11 6l-6 6 6 6',15,'#2563eb',2.2);
    h += '<div class="hist-line"><span class="hist-lbl">النسب التاريخية:</span>'+
      '<span class="hist-val'+(attMode?' calc':'')+'">حجز <b>'+target+'</b></span>'+arrow+'<span class="hist-val'+(attMode?'':' calc')+'">حضور <b>'+attN+'</b></span></div>';
  }
  h += '<div class="cap-line"><div class="cap-box-title">'+ic('gauge',13)+' الطاقة الاستيعابية لليوم'+(edit ? '' : ' بعد إضافة المهمة')+
    (anyOver ? ' <span class="cap-over">– يوجد تجاوز</span>' : '')+'</div>'+capTable(loads)+'</div>';
  h += '</div>';
  h += '</div>';   // end of the (read-only for non admins) part

  // ---- cases (shown), then repeat and day-before confirmation under «المزيد»
  var hMain = h, moreSum = [], casesHtml = '';
  h = '';
  if (edit){
    var nOpen = t.candidateIds.filter(function(cid){ return isOpenStatus(caseStatus(t,cid).key); }).length;
    casesHtml += '<div class="field"><label class="field-label">الحالات</label><button class="btn btn-outline-dashed btn-block"'+A('openTaskCases', t.id)+'>'+ic('users',13)+' الحالات'+
      ' <span class="field-hint" style="margin:0;">('+t.candidateIds.length+' · مفتوحة '+nOpen+')</span></button></div>';
    var cst = confirmStats(t);
    if (cst.confirmed + cst.cancelled + cst.pending){
      h += '<div class="confirm-stats">'+ic('check',13,'#15803d',2.2)+'<b>تأكيد الحضور:</b><span class="cap-ok">أكد '+cst.confirmed+'</span><span class="cap-over">اعتذر '+cst.cancelled+'</span><span>لسه '+cst.pending+'</span></div>';
      moreSum.push('أكد ' + cst.confirmed + ' من ' + (cst.confirmed + cst.cancelled + cst.pending));
    }
  }
  var ownerRow = '';
  if (edit){
    if (isSupervisor()){
      ownerRow = '<div class="owner-row"><label>'+ic('user',13)+' إسناد الحجز</label><select class="filter-select" data-change="setTaskOwner">'+
        '<option value="">توزيع على كل الموظفين</option>'+AGENTS.map(function(a){ return '<option value="'+a.id+'"'+(t.owner===a.id?' selected':'')+'>'+esc(a.name)+' – المهمة كلها</option>'; }).join('')+'</select></div>';
    }
  } else {
    var n = d.candidateIds.length;
    casesHtml += '<div class="field"><label class="field-label">الحالات</label>';
    if (n) casesHtml += '<div class="addcases-summary"><span>تمت إضافة <b style="color:var(--text)">'+n+'</b> حالة'+' · <span class="prio-txt">★ أولوية اتصال: '+Object.keys(d.priority||{}).length+'</span></span><button class="link-btn"'+A('openAddCasesDraft')+'>الحالات</button></div>';
    if (!n) casesHtml += '<button class="btn btn-outline-dashed btn-block"'+A('openAddCasesDraft')+((d.loc==='convoy' && !d.gov) ? ' disabled' : '')+'>'+ic('users',13)+' الحالات</button>';
    casesHtml += (d.loc==='convoy' && !d.gov ? '<div class="field-hint">اختار المحافظة الأول</div>' : '')+'</div>';
  }

  // ---- repeat (new tasks, and existing tasks that aren't in a series yet) + day-before confirmation
  h += '<div class="'+(ro ? 'ro-form' : '')+'">';
  var rp = d.repeat, offs = repeatOffsets(d);
  if (!edit || !t.seriesId){
  h += '<div class="field"><label class="field-label">التكرار</label><div class="seg">'+

function draftFromTask(t){

function addCasesCtx(){
  var m = S.addCasesMode;
  if (m.kind==='create'){
    var d = S.createDraft;
    return {id:'__draft', type:d.type, loc:d.loc, gov:d.gov, dateOffset:d.dateOffset, target:draftTarget(d)};
  }
  var t = findTask(m.taskId);
  return {id:t.id, type:t.type, loc:t.loc, gov:t.gov, dateOffset:t.dateOffset, target:t.target};
}
function filteredCases(){
  var f = S.addCasesFilters, ctx = addCasesCtx(), sel = S.addCasesSelected, pctx = poolCtx(ctx);
  var ab = AGE_BUCKETS.filter(function(b){ return b.key===f.age; })[0];
  var tb = ATTEMPTS_BUCKETS.filter(function(b){ return b.key===f.attempts; })[0];
  var list = CASES.filter(function(c){
    // only the cases of this type's pool (bookable and reachable), plus the ones already picked
    if (sel.indexOf(c.id)===-1 && !priorityOf(pctx, c).eligible) return false;
    if (f.gov && c.gov!==f.gov) return false;
    if (f.funding && c.funding!==f.funding) return false;
    if (f.level && c.level!==f.level) return false;
    if (f.pref && (c.pref || 'غير محدد')!==f.pref) return false;
    if (ab && ab.test && !ab.test(c.age)) return false;
    if (tb && tb.test && !tb.test(attemptsTotal(c.id))) return false;
    var q = (f.q||'').trim();
    if (q && c.name.indexOf(q)===-1 && c.code.toUpperCase().indexOf(q.toUpperCase())===-1 && c.phone.indexOf(q)===-1) return false;
    return true;
  });
  var srt = S.addCasesSort || 'waitDesc';
  return list.sort(function(a,b){
    if (srt==='waitAsc') return a.waitingDays - b.waitingDays;
    if (srt==='ageAsc') return a.age - b.age || b.waitingDays - a.waitingDays;
    if (srt==='ageDesc') return b.age - a.age || b.waitingDays - a.waitingDays;
    return b.waitingDays - a.waitingDays;
  });
}
// pool of a booking type: every governorate, availability checked for the task's date
function poolCtx(ctx){ return {id:ctx.id, type:ctx.type, loc:'org', gov:null, dateOffset:ctx.dateOffset}; }
function selectableCase(ctx, c){ return priorityOf(poolCtx(ctx), c).eligible || S.addCasesSelected.indexOf(c.id)!==-1; }
function currentAddCasesIds(){
  var ctx = addCasesCtx();

}

// =====================================================================
// Funding page link (صفحة التمويل) – shared through localStorage
//   hih_funding_v1     : written by the funding page  {companies, alloc:{caseId:{company,at,by,batch}}, batches}
//   hih_funding_ops_v1 : written here                 {caseId:{status, day, tid, type}}
// =====================================================================
var FUND_KEY = 'hih_funding_v1', FUND_OPS_KEY = 'hih_funding_ops_v1';
var FUND = {companies:[], alloc:{}, batches:[]}, fundOpsLast = '';
function readStore(k, def){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function writeStore(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function loadFunding(){
  FUND = readStore(FUND_KEY, null) || {companies:[], alloc:{}, batches:[]};
  releasePostponed(FUND.released);
  FUND.alloc = FUND.alloc || {}; FUND.holds = FUND.holds || {}; FUND.plans = FUND.plans || [];
  CASES.forEach(function(c){
    if (c.baseFunding===undefined) c.baseFunding = c.funding;
    var a = FUND.alloc[c.id]; c.funding = a ? a.company : c.baseFunding;
  });
  (FUND.companies||[]).forEach(function(n){ if (FUNDING_OPTIONS.indexOf(n)===-1) FUNDING_OPTIONS.push(n); });
}
function fundOf(cid){ return FUND.alloc[cid] || null; }
// the funding page can hold a case (open-ended or until a date): operations can't put it in a task
// and the call center doesn't see it. Returns a short label, '' when not held.
function fundHoldOf(cid){
  if (typeof FUND==='undefined' || !FUND || !FUND.holds) return null;
  var h = FUND.holds[cid]; if (!h) return null;
  if (h.until && h.until < Date.now()) return null;    // hold period over
  return h;
}
function fundHold(cid){
  var h = fundHoldOf(cid); if (!h) return '';
  return h.until ? 'لحد ' + isoDateMs(h.until) : 'من صفحة التمويل';
}
function isoDateMs(ms){ var d = new Date(ms); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
// a held case (from the funding page): the call center can't work on it
function caseHoldLabel(cid){ var f = fundHold(cid); return f ? 'موقوفة ' + f : ''; }
function heldCases(type){
  return CASES.filter(function(c){ return (!type || c.stage===type) && fundHold(c.id); });
}
// where a funded case stands in the operations room
function fundOpsStatus(c){
  var tOff = todayOffset(), tid = (S.bookings[c.stage]||{})[c.id];
  if (tid){
    var bt = findTask(tid), att = S.attendance[nextCallKey(tid, c.id)];
    if (bt) return {status: att ? att.status : 'booked', day:isoDate(bt.dateOffset), tid:tid, type:bt.type};
  }
  var in_ = S.tasks.filter(function(t){ return t.type===c.stage && t.dateOffset>=tOff && t.candidateIds.indexOf(c.id)!==-1; })
    .sort(function(a,b){ return a.dateOffset-b.dateOffset; })[0];
  if (in_) return {status:'scheduled', day:isoDate(in_.dateOffset), tid:in_.id, type:in_.type, draft: in_.status==='draft'};
  return {status:'new'};
}
function syncFundingOps(){
  var out = {};
  Object.keys(FUND.alloc).forEach(function(cid){ var c = caseById(cid); if (c) out[cid] = fundOpsStatus(c); });
  CASES.forEach(function(c){
    if (out[c.id]) return;
    var st = fundOpsStatus(c); if (st.status!=='new') out[c.id] = st;
  });
  var str = JSON.stringify(out);
  if (str !== fundOpsLast){ fundOpsLast = str; writeStore(FUND_OPS_KEY, out); }
}
window.addEventListener('storage', function(e){
  if (e.key!==FUND_KEY) return;

function isoToOffset(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m ? daysBetween(BASE_SUNDAY, new Date(+m[1], +m[2]-1, +m[3])) : null; }

      '<div class="fn-acts">'+Object.keys(byType).map(function(k){
        return '<button class="btn btn-primary btn-sm"'+A('noteToTask', n.id, k)+'>'+ic('calendar',12,'#fff')+' إنشاء مهمة '+TASK_TYPES[k].short+' ('+byType[k].length+')'+(n.day ? ' يوم '+(dayOff!=null ? shortDate(dayOff) : n.day) : '')+'</button>';

// =====================================================================
// SMS / WhatsApp to the case: after booking, and a reminder the day before
// (simulated here – the real system sends through the SMS / WhatsApp gateway)
// =====================================================================
var CHANNELS = {whatsapp:'واتساب', sms:'SMS'};
function msgFields(t, cid){
  var c = caseById(cid), key = nextCallKey(t.id, cid), time = S.bookTimes[key] || (t.loc==='convoy' ? t.meetingTime : '');
  var map = t.loc==='convoy' ? safeUrl(t.mapUrl) : safeUrl(S.settings.orgMapUrl);
  return {'الاسم':c.name.split(' ')[0], 'النوع':TASK_TYPES[t.type].label, 'الميعاد':'يوم ' + dayLabel(t.dateOffset) + (time ? ' الساعة ' + fmtClock(time) : ''),
    'المكان': t.loc==='convoy' ? ((t.meetingPoint ? t.meetingPoint + ' – ' : '') + 'قافلة ' + (t.gov||'')) : 'مقر مؤسسة هاند إن هاند',
    'الخريطة': map || 'هيتبعت لحضرتك قبل الميعاد',
    'ملاحظات': t.loc==='convoy' && t.convoyNotes ? 'ملاحظات: ' + t.convoyNotes : ''};
}
// lines that end up empty (e.g. no notes) are dropped
function fillTpl(tpl, f){
  return String(tpl||'').replace(/\{([^}]+)\}/g, function(m, k){ return f[k]!=null ? f[k] : m; })
    .split('\n').filter(function(l){ return l.trim(); }).join('\n');
}
var MSG_TPL = {booking:'msgBookTpl', reminder:'msgRemindTpl', info:'msgInfoTpl'};
var MSG_KIND = {booking:'رسالة الحجز', reminder:'تذكير', info:'بيانات الموعد'};
function msgText(kind, t, cid){ return fillTpl(S.settings[MSG_TPL[kind]], msgFields(t, cid)); }
function sendMsg(kind, t, cid, channel){
  var m = {id:'M'+Date.now()+Math.random().toString(36).slice(2,6), caseId:cid, tid:t.id, kind:kind, channel:channel || S.settings.msgChannel, at:now(), text:msgText(kind, t, cid), status:'sent', by: isCC() ? S.agentId : null};
  S.messages.push(m); return m;
}
// Egyptian mobile -> international format for wa.me / sms:
function intlPhone(p){ return '20' + String(p).replace(/^0/, ''); }
var WA_ICON_PATH = 'M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z';
// buttons next to the phone: open WhatsApp / SMS on the agent's device with the appointment info ready
function sendInfoBtns(t, cid){
  return '<span class="send-btns"><button class="send-btn wa" title="ابعت بيانات الموعد واللوكيشن على واتساب"'+A('sendInfo', t.id+'|'+cid, 'whatsapp')+'>'+pathIc(WA_ICON_PATH,14,'#fff',2)+' واتساب</button>'+
    '<button class="send-btn sms" title="ابعت بيانات الموعد واللوكيشن SMS"'+A('sendInfo', t.id+'|'+cid, 'sms')+'>'+ic('send',13,'#fff')+' SMS</button></span>';
}
function msgsFor(cid){ return S.messages.filter(function(m){ return m.caseId===cid; }); }
function lastMsg(t, cid, kind){ var l = S.messages.filter(function(m){ return m.caseId===cid && m.tid===t.id && m.kind===kind; }); return l[l.length-1] || null; }
// reminders go out on the day before, from the configured time
function sendDueReminders(){
  if (!S.settings.msgOn || !S.settings.reminderOn) return 0;
  var n = nowDate(), p = (S.settings.reminderTime||'10:00').split(':');
  if (n.getHours()*60 + n.getMinutes() < (+p[0])*60 + (+p[1]||0)) return 0;
  var tOff = todayOffset(), sent = 0;
  S.tasks.forEach(function(t){
    if (t.status!=='published' || !inConfirmWindow(t, tOff)) return;   // same number of days as the confirmation call
    t.candidateIds.forEach(function(cid){
      if ((S.bookings[t.type]||{})[cid]!==t.id || lastMsg(t, cid, 'reminder')) return;
      sendMsg('reminder', t, cid); sent++;
    });
  });
  return sent;
}
function msgChips(t, cid){

  if (b) h += '<span class="msg-chip" title="'+esc(b.text)+'">'+ic('send',11)+' رسالة الحجز · '+CHANNELS[b.channel]+'</span>';
  if (r) h += '<span class="msg-chip" title="'+esc(r.text)+'">'+ic('clock',11)+' التذكير اتبعت</span>';
  return h;
}
function renderMsgs(cid){

  }).join('')+'</div>';
}


// =====================================================================
// Call-center supervisor: assign calls / tasks, route call types
// =====================================================================
function assignRows(){
  var rows = [], tOff = todayOffset();
  S.tasks.forEach(function(t){
    if (t.status!=='published' || t.dateOffset < tOff) return;
    t.candidateIds.forEach(function(cid){
      var st = caseStatus(t, cid); if (!isOpenStatus(st.key)) return;
      var c = caseById(cid); if (!c) return;
      rows.push({key:'b|'+t.id+'|'+cid, cat:catOfType(t.type), type:TASK_TYPES[t.type].short, day:t.dateOffset, place:locLabelFor(t), status:st.label, agent:t.assignee[cid]||'', name:c.name, code:c.code, gov:c.gov, level:c.level, age:c.age, task:t});
    });
  });
  confirmItems('').forEach(function(x){

function pfStatus(id, d){
  var bb = PF_HOOKS.base(id), c = bb.c, past = !!bb.d || (c && c.stage!=='measurement' && c.stage!=='postponed');
  if (past) return {status:'مقبول', reasons:[], locked:true};
  var res = ncResult({level:d.level, lastSurgery:d.lastSurgery, dob:d.dob, weight:d.weight});
  if (res.ok===false) return {status:'مؤجل', reasons:res.list.map(function(x){ return x.t; }), until:res.list.map(function(x){ return x.until; }).filter(Boolean).sort().pop() || '', locked:false};
  return {status:'مقبول', reasons:[], locked:false};
}

  if (['measurement','delivery','maintEval','confirm'].some(function(k){ return canDo(me, k); })) tabs.push(['calls','الحجز', bookingCount(me)]);
  if (canDo(me, 'inbound')) tabs.push(['inbound','مكالمة واردة', DELIVERED.reduce(function(n, d){ return n + d.requests.filter(function(r){ return r.date===today && r.by===agentName(me); }).length; }, 0)]);
  if (canDo(me, 'newCase')) tabs.push(['newCase','إضافة حالة جديدة', S.newCases.filter(function(x){ return x.by===me; }).length]);
  if (canDo(me, 'committee')) tabs.push(['committee','تبليغ اللجنة', committeeFor(me).filter(function(k){ return k.status!=='notified'; }).length]);
  if (canDo(me, 'survey')) tabs.push(['survey','متابعة جودة الخدمة (Survey)', surveyItems(me).filter(function(x){ return !x.later; }).length]);
  return tabs;
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || !root || !root.contains(el)) return;
  if (el.disabled) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el.getAttribute('data-a'), el.getAttribute('data-b'), el.getAttribute('data-c'), e);
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (!el.getAttribute || !el.getAttribute('data-input')) return;
  if (el.getAttribute('inputmode')==='numeric'){
    // digits only (Arabic-Indic digits are accepted and converted)
    var pos = el.selectionStart, v = el.value.replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0) - 0x0660); });
    var clean = v.replace(/[^0-9]/g, '');
    if (clean !== el.value){ pos = Math.max(0, pos - (v.length - clean.length)); el.value = clean; try { el.setSelectionRange(pos, pos); } catch(err){} }
  }
  var fn = ACT[el.getAttribute('data-input')];
  if (fn) fn(el.value, el.getAttribute('data-a'));
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (!el.getAttribute || !el.getAttribute('data-change')) return;
  var fn = ACT[el.getAttribute('data-change')];
  if (fn) fn(el.value, el.getAttribute('data-a'));
});
document.addEventListener('keydown', function(e){
  if (e.key==='Escape' && S.callOpen){ ACT.closeCall(); return; }
  if (e.key==='Escape' && S.poolOpen){ ACT.closePool(); return; }
  if (e.key==='Escape' && S.dashOpen && !S.overlay){ ACT.closeDash(); return; }
  if (e.key==='Escape' && S.overlay){
    if (PROFILES.open) ACT.closeProfile();
    else if (S.overlay==='confirm') ACT.cancelConfirm();
    else if (S.overlay==='addCases') ACT.closeAddCases();
    else { closeAllOverlays(); render(); }
  }
});

// ---------- drag & drop (DOM-only hover state, no re-render while dragging) ----------
var drag = null;
document.addEventListener('dragstart', function(e){
  if (!isAdmin()) return;
  var tEl = e.target.closest && e.target.closest('[data-drag-type],[data-drag-task]');
  if (!tEl) return;
  drag = tEl.hasAttribute('data-drag-type') ? {type:tEl.getAttribute('data-drag-type')} : {task:tEl.getAttribute('data-drag-task')};
  try { e.dataTransfer.setData('text/plain', 'x'); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
});
document.addEventListener('dragover', function(e){
  if (!drag) return;
  var col = e.target.closest && e.target.closest('[data-drop-day]');
  if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ if (x!==col) x.classList.remove('drop-hot'); });
  col.classList.add('drop-hot');
});
document.addEventListener('drop', function(e){
  if (!drag) return;
  var col = e.target.closest && e.target.closest('[data-drop-day]');
  e.preventDefault();
  var d = drag; drag = null;
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ x.classList.remove('drop-hot'); });
  if (!col) return;
  var off = parseInt(col.getAttribute('data-drop-day'),10);
  if (d.type) openCreate(d.type, off); else if (d.task) moveTask(d.task, off);
});
document.addEventListener('dragend', function(){
  drag = null;
  document.querySelectorAll('.day-col.drop-hot').forEach(function(x){ x.classList.remove('drop-hot'); });
});

// Call-center statistics drawer (same visual system as the visits page)
// =====================================================================
var DASH_TYPE_COLORS = {measurement:'#2f6fed', newDelivery:'#15803d', maintEval:'#f96a74', maintDelivery:'#ff6a00'};
var DASH_OUTCOME_COLORS = {booked:'#15803d', notInterested:'#97a0ad', noAnswer:'#dc2626', unavailable:'#f97316'};
var DASH_PERIODS = [['today','اليوم'],['week','الأسبوع'],['month','الشهر'],['quarter','ربع سنوي'],['year','سنوية']];
var DASH_HOURS = [9,10,11,12,13,14,15,16];

// mock history of earlier calls (stands in for the server) — per agent profile, answer rate by hour
var CALL_HISTORY = (function(){
  var out = [], s = 11;
  function r(){ s = (s*9301 + 49297) % 233280; return s/233280; }
  var prof = {a1:{calls:38, book:.62, show:.84}, a2:{calls:44, book:.52, show:.78}, a3:{calls:31, book:.45, show:.72}};
  var types = ['measurement','measurement','measurement','measurement','newDelivery','newDelivery','newDelivery','maintEval','maintEval','maintDelivery'];
  var ans = {9:.48, 10:.6, 11:.72, 12:.74, 13:.66, 14:.58, 15:.52, 16:.42};
  var T = daysBetween(BASE_SUNDAY, REAL_TODAY);
  var nowH = new Date().getHours();
  for (var d = T-400; d <= T; d++){
    var wd = dateOf(d).getDay(); if (wd===5) continue;
    AGENTS.forEach(function(a){
      var p = prof[a.id], n = Math.round(p.calls*(0.75 + r()*0.5)*(wd===6 ? 0.6 : 1));
      for (var i=0;i<n;i++){
        var h = 9 + Math.floor(r()*8), type = types[Math.floor(r()*types.length)];
        if (d===T && h >= nowH) continue;
        var incoming = r() < 0.07, outcome;
        if (!incoming && r() > ans[h]) outcome = r() < 0.72 ? 'noAnswer' : 'unavailable';
        else { var x = r(); outcome = x < p.book + 0.1 ? 'booked' : 'notInterested'; }
        var e = {d:d, h:h, agentId:a.id, type:type, outcome:outcome, incoming:incoming, att:null};
        if (outcome==='booked'){ var vd = d + 2 + Math.floor(r()*6); if (vd < T){ e.vd = vd; e.att = r() < p.show ? 'attended' : 'noShow'; } }
        out.push(e);
      }
    });
  }
  return out;
})();
function liveCallEvents(){
  return S.callLog.map(function(l){
    var t = findTask(l.taskId), dt = new Date(l.at), bt = l.bookTid ? findTask(l.bookTid) : t;
    var o = l.outcome==='bookedAlt' ? 'booked' : l.outcome;
    var e = {d:daysBetween(BASE_SUNDAY, dt), h:dt.getHours(), agentId:l.agentId, type:t ? t.type : 'measurement', outcome:o, incoming:l.callType==='وارد', att:null};
    if (o==='booked' && bt){ var a = S.attendance[nextCallKey(bt.id, l.caseId)]; e.att = a ? a.status : null; e.vd = bt.dateOffset; }
    return e;
  });
}
function dashRange(kind, step){
  var today = startOfDay(nowDate()), from, to;
  if (kind==='today'){ from = new Date(today.getTime()); from.setDate(from.getDate()+step); to = new Date(from.getTime()); }
  else if (kind==='week'){ from = new Date(today.getTime()); from.setDate(from.getDate()-from.getDay()+7*step); to = new Date(from.getTime()); to.setDate(to.getDate()+6); }
  else if (kind==='month'){ from = new Date(today.getFullYear(), today.getMonth()+step, 1); to = new Date(from.getFullYear(), from.getMonth()+1, 0); }
  else if (kind==='quarter'){ var q = Math.floor(today.getMonth()/3) + step; from = new Date(today.getFullYear(), q*3, 1); to = new Date(from.getFullYear(), from.getMonth()+3, 0); }
  else { from = new Date(today.getFullYear()+step, 0, 1); to = new Date(from.getFullYear(), 11, 31); }
  var f = daysBetween(BASE_SUNDAY, from), tt = Math.min(daysBetween(BASE_SUNDAY, to), daysBetween(BASE_SUNDAY, today));
  return {from:f, to:tt, label: f===tt ? isoDate(f) : isoDate(f) + ' - ' + isoDate(tt)};
}
// buckets for the trend chart
function dashBuckets(kind, R){
  var out = [];
  if (kind==='today') return DASH_HOURS.map(function(h){ return {label:h+':00', test:function(e){ return e.h===h; }}; });
  if (kind==='week' || kind==='month'){
    for (var d = R.from; d <= R.to; d++) (function(d){ var dd = dateOf(d); out.push({label: kind==='week' ? WEEKDAYS_AR[dd.getDay()] : String(dd.getDate()), test:function(e){ return e.d===d; }}); })(d);
    return out;
  }
  if (kind==='quarter'){
    for (var w = R.from; w <= R.to; w += 7) (function(w){ out.push({label:shortDate(w), test:function(e){ return e.d>=w && e.d<w+7; }}); })(w);
    return out;
  }
  var y = dateOf(R.from).getFullYear();
  for (var m = 0; m < 12; m++) (function(m){
    var a = daysBetween(BASE_SUNDAY, new Date(y, m, 1)), b = daysBetween(BASE_SUNDAY, new Date(y, m+1, 0));
    if (a <= R.to) out.push({label:MONTHS_AR[m], test:function(e){ return e.d>=a && e.d<=b; }});
  })(m);
  return out;
}
function pct(a, b){ return b ? Math.round(a/b*1000)/10 : 0; }
function nfmt(n){ return Number(n).toLocaleString('en-US'); }
function summarize(ev){
  var s = {calls:ev.length, answered:0, booked:0, incoming:0, attended:0, noShow:0, byOutcome:{}, byType:{}};
  Object.keys(DASH_OUTCOME_COLORS).forEach(function(k){ s.byOutcome[k] = 0; });
  Object.keys(TASK_TYPES).forEach(function(k){ s.byType[k] = {calls:0, booked:0}; });
  ev.forEach(function(e){
    if (NOT_ANSWERED.indexOf(e.outcome)===-1) s.answered++;
    if (e.incoming) s.incoming++;
    s.byOutcome[e.outcome] = (s.byOutcome[e.outcome]||0) + 1;
    if (s.byType[e.type]) s.byType[e.type].calls++;
    if (e.outcome==='booked'){ s.booked++; if (s.byType[e.type]) s.byType[e.type].booked++; if (e.att==='attended') s.attended++; else if (e.att==='noShow') s.noShow++; }
  });
  return s;
}
function dashData(){
  var R = dashRange(S.dashPeriod, S.dashStep);
  var all = CALL_HISTORY.concat(liveCallEvents()).filter(function(e){ return e.d>=R.from && e.d<=R.to; });
  var ev = S.dashAgent ? all.filter(function(e){ return e.agentId===S.dashAgent; }) : all;
  var sum = summarize(ev);
  var agents = AGENTS.map(function(a){
    var ae = all.filter(function(e){ return e.agentId===a.id; });
    var days = {}; ae.forEach(function(e){ days[e.d] = 1; });
    var s = summarize(ae); s.agent = a; s.days = Object.keys(days).length; return s;
  });
  var buckets = dashBuckets(S.dashPeriod, R).map(function(b){
    var be = ev.filter(b.test);
    return {label:b.label, calls:be.length, booked:be.filter(function(e){ return e.outcome==='booked'; }).length};
  });
  var hours = DASH_HOURS.map(function(h){
    var he = ev.filter(function(e){ return e.h===h && !e.incoming; });
    var ans = he.filter(function(e){ return FAILED_OUTCOMES.indexOf(e.outcome)===-1; }).length;
    return {label:h+':00', calls:he.length, rate:pct(ans, he.length)};
  });
  return {R:R, sum:sum, agents:agents, buckets:buckets, hours:hours};
}

// ---------- tiny SVG charts (Recharts look) ----------
function niceMax(v){ if (v<=0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function tipHtml(label, rows){
  return '<div class="t-label">'+esc(label)+'</div>' + rows.map(function(r){ return '<div class="t-row"><span class="t-dot" style="background:'+r[2]+'"></span><span>'+esc(r[0])+': <b>'+esc(r[1])+'</b></span></div>'; }).join('');
}
function svgFrame(W, H, pl, pb, pt, max, unit){
  var h = '', n = 4;
  for (var i=0;i<=n;i++){
    var y = pt + (H-pt-pb) * (1 - i/n), v = max*i/n;
    h += '<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="#e2e5ea" stroke-dasharray="3 3"/>';
    h += '<text x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+(Math.round(v*10)/10)+(unit||'')+'</text>';
  }
  h += '<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="#d6d9df"/>';
  return h;
}
function xLabels(cats, W, H, pl, pb){
  var step = (W-pl-6)/cats.length, every = Math.ceil(cats.length/12), h = '';
  cats.forEach(function(c, i){ if (i % every===0) h += '<text x="'+(pl+step*(i+0.5))+'" y="'+(H-pb+15)+'" text-anchor="middle">'+esc(c)+'</text>'; });
  return h;
}
function svgBars(cats, series, opts){
  opts = opts || {};
  var W = opts.w || 560, H = opts.h || 200, pl = 38, pb = 24, pt = 8;
  var max = opts.max || niceMax(Math.max.apply(null, [0].concat(series.map(function(s){ return Math.max.apply(null, s.values); }))));
  var h = '<svg class="vs-svg" viewBox="0 0 '+W+' '+H+'">' + svgFrame(W, H, pl, pb, pt, max, opts.unit);
  var gw = (W-pl-6)/cats.length, bw = Math.min(30, gw*0.72/series.length);
  cats.forEach(function(c, i){
    var x0 = pl + gw*i + (gw - bw*series.length)/2;
    var tip = esc(tipHtml(c, series.map(function(s){ return [s.name, (opts.fmt ? opts.fmt(s.values[i], i) : nfmt(s.values[i])), s.color]; })));
    h += '<rect x="'+(pl+gw*i)+'" y="'+pt+'" width="'+gw+'" height="'+(H-pt-pb)+'" fill="transparent" data-tip="'+tip+'"/>';
    series.forEach(function(s, k){
      var v = s.values[i], bh = (H-pt-pb) * v/max;
      h += '<rect x="'+(x0+bw*k)+'" y="'+(H-pb-bh)+'" width="'+(bw-2)+'" height="'+Math.max(0,bh)+'" rx="3" fill="'+s.color+'" data-tip="'+tip+'"/>';
    });
  });
  return h + xLabels(cats, W, H, pl, pb) + '</svg>' + legend(series);
}
function svgLine(cats, series, opts){
  opts = opts || {};
  var W = 560, H = opts.h || 220, pl = 38, pb = 24, pt = 8;
  var max = niceMax(Math.max.apply(null, [0].concat(series.map(function(s){ return Math.max.apply(null, s.values); }))));
  var h = '<svg class="vs-svg" viewBox="0 0 '+W+' '+H+'">' + svgFrame(W, H, pl, pb, pt, max);
  var step = (W-pl-6)/cats.length;
  function X(i){ return pl + step*(i+0.5); }
  function Y(v){ return H-pb - (H-pt-pb)*v/max; }
  series.forEach(function(s){
    h += '<polyline fill="none" stroke="'+s.color+'" stroke-width="2.2" points="'+s.values.map(function(v,i){ return X(i)+','+Y(v); }).join(' ')+'"/>';
    if (cats.length <= 31) s.values.forEach(function(v,i){ h += '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>'; });
  });
  cats.forEach(function(c, i){
    var tip = esc(tipHtml(c, series.map(function(s){ return [s.name, nfmt(s.values[i]), s.color]; })));
    h += '<rect x="'+(pl+step*i)+'" y="'+pt+'" width="'+step+'" height="'+(H-pt-pb)+'" fill="transparent" data-tip="'+tip+'"/>';
  });
  return h + xLabels(cats, W, H, pl, pb) + '</svg>' + legend(series);
}
function legend(series){
  if (series.length < 2) return '';

  var h = '<div class="focus-card"><div class="bar" style="background:'+(al.length ? '#c81e3a' : '#15803d')+';"></div><div class="focus-name">'+esc(c.name)+'</div>'+
    '<div style="margin:8px 0 12px;">'+(al.length ? '<b style="color:var(--danger);">'+ic('alert',14,'#c81e3a',2)+' الاستبيان اتسجل ووصل تنبيه للمشرف:</b><ul class="sv-alerts">'+al.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>' : '<b style="color:#15803d;">'+ic('check',14,'#15803d',2.4)+' الاستبيان اتسجل – شكرًا للحالة</b>')+'</div>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+(sv.answers.limb_problem==='نعم' ? '<button class="btn btn-emg"'+A('svMaint', cid)+'>'+ic('alert',13,'#fff',2)+' حجز صيانة طوارئ</button>' : '')+
    '<button class="btn btn-primary"'+A('svNext')+'>المكالمة اللي بعدها</button></div></div>';
  return h;
}
function renderSurveyReport(){
  var done = [], closed = 0;
  Object.keys(S.surveys).forEach(function(k){ var sv = S.surveys[k], t = findTask(k.split('|')[0]); if (!t) return; if (sv.status==='done') done.push({k:k, t:t, sv:sv}); else if (sv.status==='closed') closed++; });
  var pending = surveyItems('').length, alerts = done.filter(function(x){ return svAlertText(x.t, x.sv).length; });
  var h = '<div class="q-title" style="margin-bottom:4px;">متابعة جودة الخدمة (Survey)</div><div class="q-sub" style="margin-bottom:12px;">تقييم الحالات لكل إدارة بعد زيارات المقاسات والاستلام</div>';
  h += '<div class="kpi-row">'+[[done.length,'استبيان اتعمل'],[pending,'مستني مكالمة'],[closed,'اتقفل – لم يرد'],[alerts.length,'تنبيهات']].map(function(x, i){ return '<div class="kpi sv-kpi'+(i===3 && x[0] ? ' kpi-alert' : '')+'"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'; }).join('')+'</div>';
  h += '<div class="sv-avg">'+SURVEY_Q.filter(function(sec){ return sec.qs.some(function(q){ return q.type==='rate'; }); }).map(function(sec){
    var vals = [];
    done.forEach(function(x){ sec.qs.forEach(function(q){ var v = x.sv.answers[q.k]; if (q.type==='rate' && v) vals.push(v); }); });
    var avg = vals.length ? vals.reduce(function(a,b){ return a+b; }, 0) / vals.length : 0;
    return '<div class="sv-avg-card"><span>'+sec.t+'</span><b class="'+(!vals.length ? '' : avg >= 4 ? 'cap-ok' : avg >= 3 ? 'cap-warn' : 'cap-over')+'">'+(vals.length ? avg.toFixed(1) : '–')+'</b><div class="cap-track"><div class="cap-fill" style="width:'+(avg/5*100)+'%;background:#0093e9;"></div></div><em>'+vals.length+' تقييم</em></div>';
  }).join('')+'</div>';
  h += '<div class="section-title" style="margin:14px 0 8px;">التنبيهات</div>';
  if (!alerts.length) h += '<div class="field-hint">مفيش تنبيهات</div>';
  else h += '<table class="cases-table"><thead><tr><th>الحالة</th><th>الزيارة</th><th>التنبيه</th><th>الموظف</th><th>التاريخ</th></tr></thead><tbody>'+alerts.map(function(x){
    var cid = x.k.split('|')[1], c = caseById(cid), m = TASK_TYPES[x.t.type];
    return '<tr><td style="font-weight:700;">'+esc(c.name)+profBtn(cid)+'</td><td><span class="task-chip" style="background:'+m.tint+';color:'+m.color+';">'+m.short+'</span></td><td>'+svAlertText(x.t, x.sv).map(esc).join('<br>')+'</td><td>'+esc(agentName(x.sv.by))+'</td><td>'+fmtWhen(x.sv.at)+'</td></tr>';
  }).join('')+'</tbody></table>';
  return h;
}
Object.assign(ACT, {
  svStart: function(k){ S.surveyOpen = k; S.surveyDraft = {answers:{}, notes:{}}; render(); },
  svClose: function(){ S.surveyOpen = null; S.surveyDraft = null; render(); },
  svAns: function(qk, v){ var n = parseInt(v,10); S.surveyDraft.answers[qk] = String(n)===v ? n : v; render(); },
  svText: function(v, qk){ S.surveyDraft.answers[qk] = v; },
  svNote: function(v, sec){ S.surveyDraft.notes[sec] = v; },
  svSave: function(){
    var k = S.surveyOpen, t = findTask(k.split('|')[0]), d = S.surveyDraft;
    var miss = svQuestions(t, d.answers).filter(function(q){ return !q.optional && (d.answers[q.k]==null || d.answers[q.k]===''); });
    if (miss.length){ toast('فاضل ' + miss.length + ' سؤال: ' + miss[0].t); return render(); }
    var prev = S.surveys[k] || {};
    var sv = {status:'done', answers:d.answers, notes:d.notes, at:now(), by:S.agentId, tries:(prev.tries||0)};
    sv.alert = svAlertText(t, sv).length > 0;
    S.surveys[k] = sv;
    S.audit.unshift({at:now(), who:actorName(), action:'متابعة جودة الخدمة', tid:t.id, label:caseById(k.split('|')[1]).name, detail:'التقييم العام ' + d.answers.overall + (sv.alert ? ' · تنبيه' : '')});
    S.surveyOpen = null; S.surveyDraft = null; S.surveyDone = k; publishSurveys(); render();
  },
  svNoAnswer: function(k){
    var sv = S.surveys[k] || {status:'open', tries:0};
    sv.tries = (sv.tries||0) + 1;
    if (sv.tries >= S.settings.surveyTries){ sv.status = 'closed'; toast('اتقفلت – لم يرد ' + sv.tries + ' مرات'); }
    else { sv.status = 'open'; sv.nextAt = now() + S.settings.retryMinutes*60000; toast('لم يرد – هترجع في قايمتك ' + fmtWhen(sv.nextAt)); }
    S.surveys[k] = sv; S.surveyOpen = null; S.surveyDraft = null; publishSurveys(); render();
  },
  svNext: function(){ S.surveyDone = null; render(); },
  svMaint: function(cid){ S.surveyDone = null; ACT.openEmg(cid); S.emg.kind = 'الطرف مش مظبوط ومش قادر يمشي'; render(); },
});
function renderEmgDay(){
  var off = S.emgDay; if (off==null) return '';
  var list = (S.emergencies||[]).filter(function(e){ return e.dateOffset===off; });
  var canEdit = isCC() || isSupervisor();
  var h = '<div class="scrim"'+A('closeEmgDay')+'></div><div class="modal" style="width:820px;max-width:95vw;">'+
    panelHead(ic('alert',16,'#c81e3a',2)+' حجز الطوارئ – '+dayLabel(off), emgFor(off).length+' حالة'+(S.settings.emergencyMax ? ' · الحد '+S.settings.emergencyMax : '')+' · زيادة عن مهام الأوبريشن')+'<div class="modal-body">';
  if (!list.length) return h + '<div class="table-empty">مفيش حجز طوارئ في اليوم ده</div></div></div>';
  h += '<table class="cases-table"><thead><tr><th>الحالة</th><th>الطوارئ</th><th>الزيارة</th><th>الساعة</th><th>حجزها</th><th></th></tr></thead><tbody>';
  list.forEach(function(e){
    var p = emgPerson(e.cid), v = EMG_VISITS.filter(function(x){ return x[0]===e.visit; })[0], off2 = e.status!=='booked';
    h += '<tr'+(off2 ? ' style="opacity:.5;"' : '')+'><td style="font-weight:700;">'+esc(p.name)+'<div class="field-hint" style="margin:0;" dir="ltr">'+fmtPhone(p.phone)+'</div></td>'+
      '<td>'+esc(e.kind)+(e.details ? '<div class="field-hint" style="margin:0;">'+esc(e.details)+'</div>' : '')+(e.note ? '<div class="field-hint" style="margin:0;">ملاحظة: '+esc(e.note)+'</div>' : '')+'</td>'+
      '<td>'+(v ? v[1] : '')+'</td><td>'+(e.time ? fmtClock(e.time) : '—')+'</td><td>'+esc(e.byName)+'<div class="field-hint" style="margin:0;">'+fmtWhen(e.at)+'</div></td>'+
      '<td>'+(off2 ? '<span class="cap-over">اتلغى</span>' : canEdit ? '<button class="ghost-btn"'+A('emgCancel', e.id)+'>'+ic('x',12)+' إلغاء</button>' : '')+'</td></tr>';
  });
  return h + '</tbody></table></div></div>';
}
Object.assign(ACT, {
  openEmg: function(cid){ S.emg = {q:'', cid:cid||null, fixed:!!cid, kind:'', details:'', visit:'maintDelivery', dateOffset:todayOffset(), time:'', note:''}; render(); },
  closeEmg: function(){ S.emg = null; render(); },
  emgQ: function(v){ S.emg.q = v; render(); },
  emgPick: function(id){ S.emg.cid = id; render(); },
  emgUnpick: function(){ S.emg.cid = null; render(); },
  emgSet: function(k, v){ S.emg[k] = v; render(); },
  emgDetails: function(v){ S.emg.details = v; },
  emgNote: function(v){ S.emg.note = v; },
  emgDate: function(v){ var d = new Date(v + 'T00:00:00'); if (!isNaN(d)) S.emg.dateOffset = Math.max(todayOffset(), daysBetween(BASE_SUNDAY, d)); render(); },
  emgTime: function(v){ S.emg.time = v; render(); },
  emgBook: function(){
    var e = S.emg; if (!e || !e.cid || !e.kind || (e.kind==='أخرى' && !e.details.trim())) return;
    var p = emgPerson(e.cid);
    var rec = {id:'E'+Date.now(), cid:e.cid, kind:e.kind, details:e.details.trim(), visit:e.visit, dateOffset:e.dateOffset, time:e.time, note:e.note.trim(),
      by:S.agentId, byName:actorName(), at:now(), status:'booked'};
    if (S.settings.msgOn) rec.msg = {channel:S.settings.msgChannel, text:emgText(rec), at:now()};
    S.emergencies.push(rec);
    S.audit.unshift({at:now(), who:actorName(), action:'حجز طوارئ', tid:null, label:p.name, detail:e.kind + ' · ' + dayLabel(e.dateOffset)});
    S.emg = null;
    toast('اتحجز طوارئ لـ ' + p.name + ' ' + dayLabel(rec.dateOffset) + (rec.msg ? ' · اتبعتت رسالة ' + CHANNELS[rec.msg.channel] : ''));
    render();
  },
  openEmgDay: function(off){ S.emgDay = parseInt(off,10); render(); },
  closeEmgDay: function(){ S.emgDay = null; render(); },
  emgCancel: function(id){
    var e = (S.emergencies||[]).filter(function(x){ return x.id===id; })[0]; if (!e) return;
    e.status = 'cancelled';
    S.audit.unshift({at:now(), who:actorName(), action:'إلغاء حجز طوارئ', tid:null, label:emgPerson(e.cid).name, detail:e.kind});
    toast('اتلغى حجز الطوارئ'); render();
  },
});
Object.assign(ACT, {
  inboundSearch: function(v){ S.inbound.q = v; S.inbound.pick = null; render(); },
  inboundPick: function(id){ S.inbound.pick = id; S.inbound.form = emptyInboundForm(); render(); },
  inboundClose: function(){ S.inbound = {q:'', pick:null, form:emptyInboundForm()}; render(); },
  inboundField: function(v, field){ S.inbound.form[field] = v; render(); },
  inboundHist: function(){ S.inbound.form.showHist = !S.inbound.form.showHist; render(); },
  inboundAdd: function(){
    var d = DELIVERED_MAP[S.inbound.pick], f = S.inbound.form; if (!d || openMaintenance(d.id)) return;
    var miss = [['date','تاريخ تقديم الطلب'],['callType','نوع المكالمة'],['place','مكان الصيانة'],['notes','الملاحظات'],['responsible','هل يوجد مسئول عن الحالة'],['reason','سبب الصيانة']]
      .filter(function(x){ return !String(f[x[0]]||'').trim(); });
    if (miss.length){ toast('اكمل: ' + miss.map(function(x){ return x[1]; }).join('، ')); return render(); }
    var convoy = f.place.indexOf('قافلة')===0;
    // the case becomes a maintenance request waiting for "تقييم الصيانة"
    var c = CASE_MAP[d.id];
    if (!c){
      c = mk(d.id, d.name, d.gov, d.funding, d.level, d.age, 0, convoy ? 'قافلة' : 'داخل المؤسسة', 'maintEval', 0, 0);
      c.phone = d.phone; c.code = d.code;
      CASES.push(c); CASE_MAP[c.id] = c;
    } else { if (S.bookings.maintDelivery) delete S.bookings.maintDelivery[c.id]; if (S.bookings.maintEval) delete S.bookings.maintEval[c.id]; c.stage = 'maintEval'; c.order = 'maintenance'; c.waitingDays = 0; c.ready = null; c.pref = convoy ? 'قافلة' : 'داخل المؤسسة'; }
    d.requests.push({date:f.date, callType:f.callType, place:f.place, reason:f.reason, notes:f.notes.trim(), responsible:f.responsible, by:agentName(S.agentId)});
    // nearest published "تقييم الصيانة" day with room, in the requested place
    var tOff = todayOffset();
    var target = S.tasks.filter(function(t){
      return t.type==='maintEval' && t.status==='published' && t.dateOffset>=tOff && taskBookedCount(t) < bookingGoal(t) &&
        (convoy ? (t.loc==='convoy' && t.gov===d.gov) : t.loc==='org');
    }).sort(function(a,b){ return a.dateOffset - b.dateOffset; })[0];
    S.callLog.push({id:'L'+Date.now(), taskId: target ? target.id : null, caseId:c.id, agentId:S.agentId, at:now(), outcome:'maintRequest',
      callType:f.callType, note:f.reason + ' – ' + f.notes.trim()});
    S.inbound = {q:'', pick:null, form:emptyInboundForm()};
    if (!target){
      toast('اتسجل طلب الصيانة ونزل في حصالة تقييم صيانة – مفيش موعد تقييم صيانة متاح');
      return render();
    }
    if (target.candidateIds.indexOf(c.id)===-1) target.candidateIds.push(c.id);
    target.assignee[c.id] = S.agentId;
    target.priority = target.priority || {}; target.priority[c.id] = true;
    S.callOpen = {tid:target.id, cid:c.id};
    S.callDraft = {callType:f.callType, outcome:'booked', bookTid:target.id, bookTime:'', note:''};
    toast('اتسجل طلب الصيانة – حدد الحجز');
    render();
  },
});

function openFundingPage(e){
  if (!FUNDING_PAGE_B64) return;                   // not bundled -> follow the link to funding.html
  var w = window.open('', '_blank'); if (!w) return;
  if (e) e.preventDefault();
  var bytes = Uint8Array.from(atob(FUNDING_PAGE_B64), function(ch){ return ch.charCodeAt(0); });
  w.document.open(); w.document.write(new TextDecoder('utf-8').decode(bytes)); w.document.close();
}

// case profile hooks (the profile itself is the shared block above)
var PF_HOOKS = {
  base: function(id){ return {d:DELIVERED_MAP[id] || null, c:caseById(id)}; },
  who: function(){ return actorName(); },
  visits: function(id){ return {meas:profVisit(id, 'measurement'), deliv:profVisit(id, 'newDelivery')}; },
  afterSave: function(id, d, ch){ applyProfiles(); if (ch.length) S.audit.unshift({at:now(), who:actorName(), action:'تعديل بروفيل الحالة', tid:null, label:d.name, detail:ch.map(function(x){ return x.field; }).join('، ')}); },
};
function profVisit(id, type){
  var tid = (S.bookings[type]||{})[id], t = tid && findTask(tid); if (!t) return {day:'-', att:'-'};
  var a = S.attendance[nextCallKey(tid, id)];
  return {day: isoDate(t.dateOffset), att: a ? (a.status==='attended' ? 'حضر' : a.status==='noShow' ? 'لم يحضر' : '-') : '-'};
}

// =====================================================================
// Init
// =====================================================================
root = document.getElementById('root');
loadFunding();
loadProfiles(); applyProfiles();
// surveys saved earlier in this browser come back; then publish for the funding page
(function(){ var saved = readSurveys(); Object.keys(saved).forEach(function(k){ var r = saved[k]; if (findTask(k.split('|')[0]) && r.status) S.surveys[k] = {status:r.status, answers:r.answers, notes:r.notes, at:r.at, tries:r.tries, by:(AGENTS.filter(function(a){ return a.name===r.by; })[0]||{}).id}; }); })();
publishSurveys();
render();
// keep clocks / countdowns fresh without disturbing typing
setInterval(function(){
  var ae = document.activeElement;
  if (ae && (ae.tagName==='TEXTAREA' || ae.tagName==='INPUT') && ae.type!=='checkbox') return;
  render();
}, 30000);
